# Self-hosted Marfa: Postgres + the Marfa server, one command.
#
# 1. Create a `.env` next to this file with two secrets:
#      API_KEY_SALT=$(openssl rand -hex 32)
#      MARFA_AUTH_SECRET=$(openssl rand -hex 32)
#    (optionally POSTGRES_PASSWORD; defaults to "marfa" for local use).
# 2. Fetch the integrations the image installs. They are a separate
#    repository, and the build stages them from a checkout it expects here:
#      ref="$(node packages/server/scripts/read-integrations-ref.mjs \
#             packages/server/integrations-ref.txt)" &&
#        git clone https://github.com/withmarfa/integrations integrations-src &&
#        git -C integrations-src checkout "$ref"
#    That reader is the only thing that parses the pin, and it refuses
#    anything that is not one full commit, so a checkout never lands on a
#    moving branch. Skip the step and the build stops at the first name it
#    cannot find. To run with no integrations at all, put `none` in
#    packages/server/installed-integrations.txt instead.
# 3. docker compose up --build
# 4. Mint the first admin key:
#      marfa bootstrap http://localhost:8600
#    (or, without the CLI:
#      curl -X POST http://localhost:8600/keys -H 'content-type: application/json' \
#        -d '{"label":"admin","source":"bootstrap","role":"admin"}')
#
# Runs Postgres (so the local integration runtime works), migrates the database,
# then starts the server. See the self-hosting docs for email, S3 blobs, TLS,
# and hosted (multi-user) mode.

name: marfa

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marfa
      POSTGRES_USER: marfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marfa}
    volumes:
      - marfa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marfa -d marfa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply pending migrations, then exit. The server waits for this to
  # complete (the server never migrates on boot).
  migrate:
    image: marfa-server:selfhost
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    command: ["node", "dist/migrate.js"]
    environment:
      DB_DIALECT: pg
      DATABASE_URL: postgres://marfa:${POSTGRES_PASSWORD:-marfa}@postgres:5432/marfa
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    image: marfa-server:selfhost
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "8600:8600"
    environment:
      PORT: 8600
      DB_DIALECT: pg
      DATABASE_URL: postgres://marfa:${POSTGRES_PASSWORD:-marfa}@postgres:5432/marfa
      API_KEY_SALT: ${API_KEY_SALT:?set API_KEY_SALT in .env — openssl rand -hex 32}
      MARFA_AUTH_SECRET: ${MARFA_AUTH_SECRET:?set MARFA_AUTH_SECRET in .env — openssl rand -hex 32}
      # No email by default; sign-up verification is skipped so the first admin
      # is never locked out. Wire MARFA_SMTP_* (see docs) for password resets.
      MARFA_EMAIL_BACKEND: none
      BLOB_PATH: /app/data/blobs
    volumes:
      - marfa-blobs:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  marfa-pgdata:
  marfa-blobs:
