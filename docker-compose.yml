services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: myme
      POSTGRES_PASSWORD: myme
      POSTGRES_DB: myme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myme"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/myme-blobs
      "

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8600:8600"
    environment:
      PORT: "8600"
      NODE_ENV: production
      STORAGE_DIALECT: pg
      DATABASE_URL: postgres://myme:myme@postgres:5432/myme
      BLOB_BACKEND: s3
      S3_BUCKET: myme-blobs
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      API_KEY_SALT: ${API_KEY_SALT:-docker-dev-salt-do-not-use-in-production-abcdef}
      AUTH_MODE: keys
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8600/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
  miniodata:
