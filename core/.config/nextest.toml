# Every test here finishes in seconds, so one still running after two
# minutes is stuck, and a stuck test is killed rather than left to run. A
# query that never finishes spills into an unlinked SQLite temporary file,
# which no listing of the disk shows and which grows until the disk is full.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# The live tests share one server, and `live` asserts that a catch-up at the
# head of the log applies nothing. Another test's write in its slice would
# fail it, so the binaries that name a live server run one test at a time.
[test-groups.live-server]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(~live)'
test-group = 'live-server'

# CI only (`NEXTEST_PROFILE=ci` in the workflow), so nothing retries on a
# developer's machine. A failing test is run once more; a pass on the retry is
# a flaky test, which the report names, and a second failure fails the run. The
# JUnit file is what `scripts/report-flaky.py` reads for the job summary.
[profile.ci]
retries = 1
status-level = "retry"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"
