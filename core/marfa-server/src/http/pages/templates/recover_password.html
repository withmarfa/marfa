<h1>Choose a new password</h1>
<p class="lede">Setting it signs the owner out of every browser. Keys and connected apps keep working.</p>
{% if let Some(message) = view.notice %}
<p class="notice error" role="alert">{{ message }}</p>
{% endif %}
<form id="recover-form" method="post" action="/setup/recover" class="stack">
<div class="field">
<label for="password">New password</label>
<input id="password" type="password" name="password" autocomplete="new-password" required autofocus aria-describedby="password-hint{% if view.error.is_some() %} password-error{% endif %}"{% if view.error.is_some() %} aria-invalid="true"{% endif %}>
<p class="hint" id="password-hint">Choose a password you don't use anywhere else.</p>
{% if let Some(message) = view.error %}<p class="error" id="password-error">{{ message }}</p>{% endif %}
</div>
<div class="field">
<label for="confirm-password">Confirm new password</label>
<input id="confirm-password" type="password" name="confirm_password" autocomplete="new-password" required>
</div>
<button type="submit" class="button primary wide">Set password</button>
</form>
