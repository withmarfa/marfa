<h1>Sign in</h1>
{% if let Some(app) = view.app %}
<p class="lede">Sign in to continue to <bdi class="app-name">{{ app }}</bdi>.</p>
{% include "partials/app_caution.html" %}
{% endif %}
{% if let Some(message) = problem_message %}
<p class="notice error" id="sign-in-problem" role="alert">{{ message }}</p>
{% endif %}
<form method="post" action="/auth/sign-in" class="stack">
<input type="hidden" name="return_to" value="{{ view.return_to }}">
<div class="field">
<label for="email">Email</label>
<input id="email" type="email" name="email" value="{{ view.email }}" autocomplete="username webauthn" autocapitalize="none" spellcheck="false" required{% if view.email.is_empty() %} autofocus{% endif %}{% if has_problem %} aria-describedby="sign-in-problem"{% endif %}>
</div>
<div class="field">
<label for="password">Password</label>
<input id="password" type="password" name="password" autocomplete="current-password" required{% if !view.email.is_empty() %} autofocus{% endif %}{% if has_problem %} aria-describedby="sign-in-problem"{% endif %}>
</div>
<button type="submit" class="button primary wide">Sign in</button>
</form>
<p class="or">or</p>
<button type="button" class="button wide" data-passkey="sign-in" hidden>Sign in with a passkey</button>
