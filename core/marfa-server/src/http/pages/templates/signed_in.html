<div class="head">
<h1>You’re signed in</h1>
<p class="lede">Signed in as <bdi>{{ view.username }}</bdi>.</p>
</div>
<form method="post" action="/auth/sign-out" data-change data-then="/auth/sign-in">
<p class="err" role="alert" data-form-error data-fallback="Something went wrong. Try again." hidden></p>
{% import "partials/parts.html" as parts %}{% call parts::actions() %}<button type="submit" class="btn">Sign out</button>
<a class="btn primary" href="{{ view.continue_to }}">Continue</a>{% endcall %}
</form>
