[package]
name = "marfa-server"
description = "The Marfa server."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "marfa-server"
path = "src/main.rs"

[dependencies]
arc-swap = "1"
backtrace = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "matched-path", "query"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap.workspace = true
getrandom = "0.4"
hex.workspace = true
hmac = "0.13"
http-body = "1"
http-body-util = "0.1"
libc = "0.2"
marfa-rules.workspace = true
marfa-telemetry.workspace = true
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "logs"] }
opentelemetry-appender-tracing = { version = "0.33", default-features = false }
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-json", "trace", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
ureq.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
