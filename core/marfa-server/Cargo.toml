[package]
name = "marfa-server"
description = "The Marfa server."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "marfa-server"
path = "src/main.rs"

[features]
# Test hooks: the fault registry, the clock offset and the control socket's test routes.
test-hooks = []
# Reads PDFs and the text in pictures, with the libraries a release build links in (see `core/marfa-enrichment/README.md`).
native = ["marfa-enrichment/native"]

[dependencies]
arc-swap = "1"
argon2 = "0.6"
askama = { version = "0.16", default-features = false, features = ["config", "derive", "std"] }
backtrace = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "matched-path", "query"] }
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap.workspace = true
flate2 = "1"
form_urlencoded = "1"
getrandom = "0.4"
hex.workspace = true
hmac = "0.13"
http-body = "1"
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
httpdate = "1"
hyper = { version = "1", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
ipnet = "2"
libc = "0.2"
marfa-acl.workspace = true
marfa-allocator.workspace = true
marfa-enrichment.workspace = true
marfa-rules.workspace = true
marfa-telemetry.workspace = true
object_store = { version = "0.14", default-features = false, features = ["aws"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "logs"] }
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-json", "trace", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs"] }
rusqlite.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6"
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
ureq.workspace = true
url = "2"
uuid.workspace = true
webauthn-rs = { version = "0.6.2", default-features = false, features = ["conditional-ui", "danger-allow-state-serialisation"] }

[dev-dependencies]
marfa-server = { path = ".", features = ["test-hooks"] }
marfa-acl = { workspace = true, features = ["testing"] }
libtest-mimic = "0.8"
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs", "testing"] }
p256 = "0.14"
proptest = "1"
rcgen = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["io-util"] }

# The reader starts the program it runs in, so this test serves the reader first.
[[test]]
name = "enrichment"
harness = false
