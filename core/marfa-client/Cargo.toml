[package]
name = "marfa-client"
description = "The Rust client for a Marfa instance, generated from its openapi.json."
version.workspace = true
edition.workspace = true
license.workspace = true
# Unlike the rest of the workspace this crate is published, by the release
# workflow's publish job from a tag, so it does not inherit `publish = false`.

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_with = { version = "3.8", default-features = false, features = ["std", "macros"] }
serde_repr = "0.1"
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "query", "rustls"] }
