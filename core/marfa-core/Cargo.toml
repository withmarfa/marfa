[package]
name = "marfa-core"
description = "Marfa's engine: a local working copy of a declared slice of one server."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Off by default: without it no tracing code or dependency is compiled in.
[features]
telemetry = ["dep:tracing"]

[dependencies]
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
globset = "0.4"
regex = "1"
notify.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite.workspace = true
libsqlite3-sys = "=0.38.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
unicode-normalization = "0.1"
ureq.workspace = true
url = "2"
uuid.workspace = true
yaml-rust2.workspace = true
tree-sitter = "0.27"
tree-sitter-yaml = "0.7"
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }

[build-dependencies]
cc = "1"
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
rusqlite = { workspace = true, features = ["hooks"] }
tempfile = "3"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# `mac_os_10_8_features` declares `kCFURLIsExcludedFromBackupKey`.
core-foundation = { version = "0.10", features = ["mac_os_10_8_features"] }

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["process", "fs"] }
