[package]
name = "marfa-rules"
description = "Marfa's pure rules: what a client and a server both judge, with no storage, network or runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
jiff = { version = "1.0.1", default-features = false, features = ["std", "tz-system", "tz-fat", "perf-inline", "tzdb-bundle-always"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
unicode-normalization = "0.1"
icu_casemap = "2"
url = "2"
ryu = "1"

[dev-dependencies]
chrono-tz = "0.10"
uuid.workspace = true
