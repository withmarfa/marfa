[package]
name = "marfa-enrichment"
description = "Reads the text and the size out of a file's bytes, for search."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The same feature set `calamine` asks for, so no second build of `zip`.
zip = { version = "9.4", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
calamine = "0.38"
html5ever = "0.40"
encoding_rs = "0.8"
# Only the decoders whose headers give a size.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# Reads an Office file's compound container, to tell an encrypted one.
cfb = "0.16"
thiserror.workspace = true

# Only the native feature uses these. pdfium-render links nothing itself here:
# build.rs links the static libraries from the prefix.
pdfium-render = { version = "0.9.5", optional = true, default-features = false, features = ["static", "pdfium_8125", "thread_safe"] }

[build-dependencies]
cc = { version = "1", optional = true }

[features]
default = []
# OCR and PDF: Tesseract, Leptonica and PDFium linked in from the prefix named by
# MARFA_NATIVE_PREFIX (see the README, "Building the native readers"). Without it nothing native is built,
# images give their size only and a PDF is refused as unsupported.
native = ["dep:pdfium-render", "dep:cc"]
