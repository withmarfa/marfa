[package]
name = "marfa-core-ffi"
description = "UniFFI surface of marfa-core for Swift."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "marfa_core_ffi"

[dependencies]
marfa-core = { path = "../../marfa-core" }
serde_json = "1"
uniffi = "0.32"

[dev-dependencies]
tempfile = "3"

# Its own workspace: cargo-swift will not name a package inside a multi-crate one.
[workspace]
