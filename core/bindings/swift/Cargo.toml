[package]
name = "marfa-core-ffi"
description = "UniFFI surface of marfa-core for Swift."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "marfa_core_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
marfa-core = { path = "../../marfa-core" }
# Named rather than inherited: this crate is **excluded** from the `core/`
# workspace — `cargo-swift` refuses to name a package inside a multi-crate
# one — so there is no root to inherit from and `workspace = true` does not
# parse. The feature is spelled out because the folder depends on it: without
# it a person's frontmatter comes back alphabetized.
serde_json = { version = "1", features = ["preserve_order"] }
uniffi = { version = "0.31", features = ["cli"] }

[dev-dependencies]
tempfile = "3"

# Its own workspace: cargo-swift will not name a package inside a multi-crate one.
[workspace]
