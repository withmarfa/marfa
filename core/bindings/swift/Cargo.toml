[package]
name = "marfa-core-ffi"
description = "UniFFI surface of marfa-core for Swift."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "marfa_core_ffi"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
marfa-core = { path = "../../marfa-core" }
serde_json = "1"
uniffi = "0.31"

[dev-dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"

# Its own workspace: cargo-swift will not name a package inside a multi-crate one.
[workspace]

# The device core ends a caught panic with `fault`, which needs unwinding. This
# workspace is separate from `core/`, so it states the profile itself.
[profile.release]
panic = "unwind"
