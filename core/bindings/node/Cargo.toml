[package]
name = "marfa-core-node"
description = "marfa-core as a Node module."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
marfa-core.workspace = true
# `napi8` verifies native class identity before converting class values.
# It includes `napi5`, which the follow's closure-backed queue needs.
napi = { version = "3", features = ["serde-json", "napi8"] }
napi-derive = "3"
serde_json.workspace = true

[build-dependencies]
napi-build = "2"
