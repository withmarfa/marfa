[package]
name = "marfa-core-node"
description = "marfa-core as a Node module."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
marfa-core.workspace = true
# `napi5` for a function made from a closure, which the follow's one queue
# is built on.
napi = { version = "3", features = ["serde-json", "napi5"] }
napi-derive = "3"
serde_json.workspace = true

[build-dependencies]
napi-build = "2"
