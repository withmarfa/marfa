[package]
name = "marfa-cli"
description = "The marfa binary: every operation of one instance, and a working copy of a slice of it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "marfa"
path = "src/main.rs"

[dependencies]
clap.workspace = true
# The keychain on macOS and the secret service on Linux, which 4 carries by default.
keyring = "4"
marfa-client = { path = "../marfa-client" }
marfa-core.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The refresh lock: two processes refreshing one token in the same second
# would replay a rotated refresh token and sign each other out.
fd-lock = "4"
# The password prompt on a terminal, never an argument.
rpassword = "7"
# The user id the refresh lock's directory is named by and checked against.
libc = "0.2"
url = "2"
# The generated client's HTTP stack, which every call the binary makes rides on.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
