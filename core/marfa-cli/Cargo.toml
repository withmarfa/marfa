[package]
name = "marfa-cli"
description = "The marfa binary: every operation of one instance, and a working copy of a slice of it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "marfa"
path = "src/main.rs"

[dependencies]
clap.workspace = true
keyring = "4"
marfa-client = { path = "../marfa-client" }
marfa-core.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
fd-lock = "4"
rpassword = "7"
libc = "0.2"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }

# keyring reaches only the login keychain; a keychain file by path needs this.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

