[workspace]
resolver = "2"
members = ["marfa-core", "marfa-cli", "bindings/node"]
# The Swift FFI crate is its own workspace: cargo-swift refuses to name a
# package inside a multi-crate workspace.
exclude = ["bindings/swift"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
marfa-core = { path = "marfa-core" }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
