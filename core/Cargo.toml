[workspace]
resolver = "2"
members = ["marfa-core", "marfa-cli", "bindings/node"]
exclude = ["bindings/swift"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
marfa-core = { path = "marfa-core" }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: without it a folder writes a person's frontmatter back
# in alphabetical order.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
thiserror = "2"
yaml-rust2 = "0.13"
ureq = { version = "3", features = ["json", "platform-verifier"] }
# v7: the server orders ids as time.
uuid = { version = "1", features = ["v7"] }
