[workspace]
resolver = "2"
members = ["marfa-acl", "marfa-allocator", "marfa-rules", "marfa-core", "marfa-telemetry", "marfa-cli", "marfa-server", "marfa-enrichment", "bindings/node"]
exclude = ["bindings/swift"]

# Every crate inherits these with `[lints] workspace = true`. `unsafe_code` in
# marfa-rules and `unwrap_used`, `expect_used` and `disallowed_methods` in
# marfa-server are set in those crates' own roots, because a crate that inherits
# cannot add lints of its own. `clippy.toml` lists the methods the server may
# not call.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
disallowed_methods = "allow"

# Unwinding is relied on: marfa reports a panic and goes on unwinding, the
# device core ends a caught panic with `fault`, and marfa-enrichment turns a
# parser panic into `Malformed`. `panic = "abort"` would break all three.
# A shipped program resolves its own crash frames, so it keeps its symbols and
# line tables: `strip = "none"` and `debug = "line-tables-only"`. Stripping
# either, including `strip = "debuginfo"`, leaves a report naming no function,
# file or line. On macOS the linker leaves the line tables in the object files,
# so a program names its functions there and names a line only beside its `.dSYM`.
[profile.release]
panic = "unwind"
debug = "line-tables-only"
strip = "none"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
marfa-core = { path = "marfa-core" }
marfa-acl = { path = "marfa-acl" }
marfa-allocator = { path = "marfa-allocator" }
marfa-enrichment = { path = "marfa-enrichment" }
marfa-rules = { path = "marfa-rules" }
marfa-telemetry = { path = "marfa-telemetry" }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: without it a folder writes a person's frontmatter back
# in alphabetical order. `float_roundtrip`: the default parse of a long number
# can land one place from the nearest float, so a number would differ between
# readers. With it, every reader parses it to the nearest float.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
thiserror = "2"
yaml-rust2 = "0.13"
ureq = { version = "3", features = ["json", "platform-verifier"] }
# v7: the server orders ids as time.
uuid = { version = "1", features = ["v7"] }
