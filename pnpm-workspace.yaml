packages:
  - "packages/*"
  # An integration directory is `<handle>/<name>`, mirroring the manifest
  # identifier, so the glob spans both levels.
  - "integrations/*/*"
  # The scaffold is deliberately not `<handle>/<name>`. It stays flat and
  # underscore-prefixed so the runtime's discovery skips it, which also puts
  # it outside the glob above — hence the explicit entry. Without it the
  # scaffold silently leaves the workspace and stops building, and the first
  # thing to notice would be the image verification losing its fixture.
  - "integrations/_template"
  # The marfa/inbox integration ships an adjacent Cloudflare Email
  # Worker (`integrations/marfa/inbox/email-worker`) as a nested
  # workspace package. Different deployable (CF Email Worker vs
  # per-Integration Worker), distinct dependency set (postal-mime).
  - "integrations/*/*/email-worker"

# Catch the worktree-staleness gotcha: when a long-lived worktree
# rebases `main` and picks up new workspace packages (e.g. a fresh
# `packages/foo` or `integrations/bar`), `pnpm install --frozen-lockfile`
# is a near-instant no-op because the lockfile hash is unchanged. The
# per-package `node_modules/.bin/` symlinks for the new packages are
# never linked, and the first `pnpm run build` fails with
# `sh: tsup: command not found`. `verifyDepsBeforeRun` compares the
# `workspacePackagePatterns` recorded in `node_modules/.modules.yaml`
# against the current set and fast-fails before any script runs.
# `error` rather than `install` so the state change is surfaced
# explicitly — the operator sees the message and runs `pnpm install`,
# rather than the install happening silently mid-build.
verifyDepsBeforeRun: error

overrides:
  # `officeparser` pins `pdfjs-dist` to an exact version, and the version it
  # pins carries an advisory for arbitrary JavaScript execution on opening a
  # malicious document. The extraction sweeper parses any uploaded PDF with
  # it, on input a caller controls, so the exposure is real rather than
  # theoretical. No published `officeparser` release admits the patched
  # reader — its newest is the one carrying the pin — so the version is
  # forced here instead.
  #
  # Remove this the moment `officeparser` widens its pin past 6.1.200.
  # `src/enrichment/pdf-reader-version.test.ts` is what notices if this line
  # is lost, since an override that stops applying breaks nothing visible.
  pdfjs-dist: "6.2.108"
