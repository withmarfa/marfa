<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' data: blob:; connect-src *" />
    <title>@mymehq/sync-client demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; }
      header { padding: 12px 16px; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 16px; }
      main { padding: 16px; }
      .indicator { font-size: 12px; padding: 2px 8px; border-radius: 4px; }
      .indicator.idle { background: #e6f4ea; color: #1b5e20; }
      .indicator.syncing { background: #e3f2fd; color: #0d47a1; }
      .indicator.offline { background: #fce8e6; color: #b71c1c; }
      .indicator.error { background: #fce8e6; color: #b71c1c; }
      .item { padding: 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; }
      button { padding: 6px 14px; border: 0; border-radius: 4px; background: #1a73e8; color: white; cursor: pointer; }
      .toast { position: fixed; bottom: 16px; right: 16px; padding: 12px 16px; background: #fce8e6; color: #b71c1c; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
