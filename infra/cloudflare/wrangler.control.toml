#:schema node_modules/wrangler/config-schema.json
# Control-plane Worker for the Connections runtime.
# See ../infra/cloudflare/README.md for provisioning + deploy steps.

name = "myme-runtime-control"
main = "../../packages/runtime-control/src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
# `account_id` is intentionally omitted — Wrangler reads it from the
# CLOUDFLARE_ACCOUNT_ID environment variable at deploy time, so no
# operator's account is baked into the committed config. See
# infra/cloudflare/README.md.

# Default (dev) environment — bound to the cloudflared-tunnel hostname
# the developer brings up with `cloudflared tunnel --url …`.
# Production routes live under [env.prod].

[vars]
ENVIRONMENT = "dev"
# Worker runtime var (the DLQ HTTP-pull client reads it). Wrangler does not
# expand env vars in [vars], so the operator fills this in before deploy.
CLOUDFLARE_ACCOUNT_ID = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"

# ---- Staging --------------------------------------------------------------
# `routes` and `zone_name` below are operator-specific — replace the
# example hostnames with the domain/zone you deploy under, or remove the
# `routes` block and bind the Worker to a *.workers.dev subdomain.
[env.staging]
name = "myme-runtime-control-staging"
routes = [
  { pattern = "runtime-staging.example.com/*", zone_name = "example.com" },
]

[env.staging.vars]
ENVIRONMENT = "staging"
CLOUDFLARE_ACCOUNT_ID = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"

# ---- Production -----------------------------------------------------------
[env.prod]
name = "myme-runtime-control-prod"
routes = [
  { pattern = "runtime.example.com/*", zone_name = "example.com" },
]

[env.prod.vars]
ENVIRONMENT = "prod"
CLOUDFLARE_ACCOUNT_ID = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"

# ---------------------------------------------------------------------------
# Queue producers — wired in PR 3 of Layer 1; scheduled-poll added by T-084.
# webhook-receipt   — produced by control plane on verified inbound;
#                     consumed by per-Integration Workers
# reactive-run      — produced by the server-side reactive-run-bridge;
#                     consumed by per-Integration Workers
# scheduled-poll    — bound for DLQ replay (T-084). When an operator
#                     replays a `myme-scheduled-poll-<env>-dlq` message,
#                     it gets re-enqueued onto this main queue. Not used
#                     on hot paths today.
# ---------------------------------------------------------------------------

[[env.staging.queues.producers]]
binding = "WEBHOOK_RECEIPT_QUEUE"
queue = "myme-webhook-receipt-staging"

[[env.staging.queues.producers]]
binding = "REACTIVE_RUN_QUEUE"
queue = "myme-reactive-run-staging"

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "myme-scheduled-poll-staging"

# T-247 — per-integration webhook-receipt queue producers. The route
# in `webhooks.ts` resolves the binding by `integration_name`. Each
# integration that ships a `webhook` trigger lands a binding here
# AND a `[[env.<env>.queues.consumers]]` block in its own wrangler.toml
# pointing at the same queue.
#
# The shared `WEBHOOK_RECEIPT_QUEUE` above stays as the fallback for
# `mymehq.github-webhooks` until it migrates onto its own queue.

[[env.staging.queues.producers]]
binding = "WEBHOOK_RECEIPT_QUEUE_MYMEHQ_INBOX"
queue = "myme-webhook-receipt-mymehq-inbox-staging"

[[env.staging.queues.producers]]
binding = "WEBHOOK_RECEIPT_QUEUE_GOOGLE_CALENDAR"
queue = "myme-webhook-receipt-google-calendar-staging"

[[env.prod.queues.producers]]
binding = "WEBHOOK_RECEIPT_QUEUE"
queue = "myme-webhook-receipt-prod"

[[env.prod.queues.producers]]
binding = "REACTIVE_RUN_QUEUE"
queue = "myme-reactive-run-prod"

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "myme-scheduled-poll-prod"

# T-247 — prod mirror of the per-integration webhook-receipt producers.
[[env.prod.queues.producers]]
binding = "WEBHOOK_RECEIPT_QUEUE_MYMEHQ_INBOX"
queue = "myme-webhook-receipt-mymehq-inbox-prod"

[[env.prod.queues.producers]]
binding = "WEBHOOK_RECEIPT_QUEUE_GOOGLE_CALENDAR"
queue = "myme-webhook-receipt-google-calendar-prod"

# ---------------------------------------------------------------------------
# KV — short-lived idempotency cache used by the control plane to
# dedupe webhook deliveries within the verification → enqueue window.
# Namespace IDs (per env) come from provision.ts; paste below.
# ---------------------------------------------------------------------------

[[env.staging.kv_namespaces]]
binding = "IDEMPOTENCY_KV"
id = "REPLACE_WITH_STAGING_KV_ID"

[[env.prod.kv_namespaces]]
binding = "IDEMPOTENCY_KV"
id = "REPLACE_WITH_PROD_KV_ID"

# ---------------------------------------------------------------------------
# Service bindings — control plane → per-Integration Workers.
# Used by:
#   - POST /connections/:id/arm-schedule (T-085) → /arm-schedule
#   - POST /connections/:id/verify       (T-082) → /verify
# Each in-tree integration that ships as a deployed Worker gets a
# binding here AND a corresponding entry in the routes'
# `resolveServiceBinding` switch (`arm-schedule.ts`, `verify.ts`).
#
# In-tree integrations without a deployed Worker today
# (`_template`, `mymehq.sync`) intentionally have NO service binding.
# The verify route surfaces `no_service_binding` (503) for those —
# wiring them up requires the integration to first ship its own
# `wrangler.toml` and pass `wrangler deploy`.
#
# **Bounded-set assumption.** This per-integration binding pattern works
# for the in-tree set — small, stable, low maintenance cost. It does
# NOT scale to community-published integrations from a future
# marketplace where runtime-control can't pre-declare bindings for
# arbitrary third-party Workers. When marketplace integrations land,
# the verify dispatch path will need to revisit (probably HTTP fetch
# via Workers Platform service URLs, or queue-mediated sync polling).
# Out of scope today; documented so future readers see the hidden
# assumption (mirrored in `env.ts`).
# ---------------------------------------------------------------------------

[[env.staging.services]]
binding = "INTEGRATION_RSS_WATCHER"
service = "myme-integration-rss-watcher-staging"

[[env.staging.services]]
binding = "INTEGRATION_GITHUB_WEBHOOKS"
service = "myme-integration-github-webhooks-staging"

[[env.staging.services]]
binding = "INTEGRATION_TASK_AUTO_ARCHIVE"
service = "myme-integration-task-auto-archive-staging"

[[env.staging.services]]
binding = "INTEGRATION_GOOGLE_CALENDAR"
service = "myme-integration-google-calendar-staging"

[[env.staging.services]]
binding = "INTEGRATION_GOOGLE_TASKS"
service = "myme-integration-google-tasks-staging"

[[env.staging.services]]
binding = "INTEGRATION_GOOGLE_DRIVE"
service = "myme-integration-google-drive-staging"

[[env.staging.services]]
binding = "INTEGRATION_GOOGLE_CONTACTS"
service = "myme-integration-google-contacts-staging"

[[env.staging.services]]
binding = "INTEGRATION_TODOIST_TASKS"
service = "myme-integration-todoist-tasks-staging"

[[env.staging.services]]
binding = "INTEGRATION_READWISE"
service = "myme-integration-readwise-staging"

[[env.staging.services]]
binding = "INTEGRATION_RAINDROP"
service = "myme-integration-raindrop-staging"

[[env.staging.services]]
binding = "INTEGRATION_MYMEHQ_INBOX"
service = "myme-integration-mymehq-inbox-staging"

# ---- Prod service bindings -----------------------------------------------
# Mirror the staging block above. Every entry in the dispatch switches
# (`packages/runtime-control/src/routes/arm-schedule.ts`, `verify.ts`)
# MUST have a corresponding binding here. The freshness test in
# `packages/runtime-control/src/wrangler-control-config.test.ts`
# parses this file with a strict TOML parser and asserts both invariants
# (every dispatch entry → a binding in both envs; no duplicate `binding`
# keys inside one `[[env.X.services]]` block — the failure mode that
# silently dropped google.drive's staging binding pre-T-245).

[[env.prod.services]]
binding = "INTEGRATION_RSS_WATCHER"
service = "myme-integration-rss-watcher-prod"

[[env.prod.services]]
binding = "INTEGRATION_GITHUB_WEBHOOKS"
service = "myme-integration-github-webhooks-prod"

[[env.prod.services]]
binding = "INTEGRATION_TASK_AUTO_ARCHIVE"
service = "myme-integration-task-auto-archive-prod"

[[env.prod.services]]
binding = "INTEGRATION_GOOGLE_CALENDAR"
service = "myme-integration-google-calendar-prod"

[[env.prod.services]]
binding = "INTEGRATION_GOOGLE_TASKS"
service = "myme-integration-google-tasks-prod"

[[env.prod.services]]
binding = "INTEGRATION_GOOGLE_DRIVE"
service = "myme-integration-google-drive-prod"

[[env.prod.services]]
binding = "INTEGRATION_GOOGLE_CONTACTS"
service = "myme-integration-google-contacts-prod"

[[env.prod.services]]
binding = "INTEGRATION_TODOIST_TASKS"
service = "myme-integration-todoist-tasks-prod"

[[env.prod.services]]
binding = "INTEGRATION_READWISE"
service = "myme-integration-readwise-prod"

[[env.prod.services]]
binding = "INTEGRATION_RAINDROP"
service = "myme-integration-raindrop-prod"

[[env.prod.services]]
binding = "INTEGRATION_MYMEHQ_INBOX"
service = "myme-integration-mymehq-inbox-prod"

# ---------------------------------------------------------------------------
# R2 — Layer 2 wires this for large inbound webhook bodies (>256KB).
#
# Secrets (set via `wrangler secret put` per env):
#   - MYME_API_URL              (every env)
#   - MYME_RUNTIME_BROKER_KEY   (PR 4 — server-issued long-lived key the
#                                control plane uses to mint per-Connection
#                                runtime credentials)
#   - CLOUDFLARE_QUEUES_API_TOKEN (T-084 — account-scoped CF API token
#                                  with `queues_read` + `queues_write`
#                                  permissions. Used by the DLQ
#                                  peek/replay routes' HTTP-pull client.
#                                  Per-Worker-instance secret; the token
#                                  itself can be the same one the staging
#                                  server's plist already carries —
#                                  reuse the value, separate `wrangler
#                                  secret put` per env.)
#
# Vars (set in [env.<env>.vars] above):
#   - ENVIRONMENT
#   - CLOUDFLARE_ACCOUNT_ID  (T-084 — same account_id hardcoded at the
#                             top of this file. The DLQ HTTP-pull client
#                             reads it via env so tests can swap it.)
# ---------------------------------------------------------------------------
