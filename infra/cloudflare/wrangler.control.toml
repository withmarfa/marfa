#:schema node_modules/wrangler/config-schema.json
# Control-plane Worker for the Connections runtime.
# See ../infra/cloudflare/README.md for provisioning + deploy steps.

name = "myme-runtime-control"
main = "../../packages/runtime-control/src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "${CLOUDFLARE_ACCOUNT_ID}"

# Default (dev) environment — bound to the cloudflared-tunnel hostname
# the developer brings up with `cloudflared tunnel --url …`.
# Production routes live under [env.prod].

[vars]
ENVIRONMENT = "dev"

# ---- Staging --------------------------------------------------------------
[env.staging]
name = "myme-runtime-control-staging"
routes = [
  { pattern = "runtime-staging.myme.so/*", zone_name = "myme.so" },
]

[env.staging.vars]
ENVIRONMENT = "staging"

# ---- Production -----------------------------------------------------------
[env.prod]
name = "myme-runtime-control-prod"
routes = [
  { pattern = "runtime.myme.so/*", zone_name = "myme.so" },
]

[env.prod.vars]
ENVIRONMENT = "prod"

# ---------------------------------------------------------------------------
# Bindings — added in later PRs:
#   PR 3: [[queues.producers]] for webhook-receipt + reactive-run, plus
#         [[kv_namespaces]] for the idempotency cache.
#   Layer 2: [[r2_buckets]] for large-payload handoff.
#
# Secrets (set via `wrangler secret put`):
#   - MYME_API_URL           (every env)
#   - MYME_RUNTIME_BROKER_KEY (PR 4)
# ---------------------------------------------------------------------------
