#:schema node_modules/wrangler/config-schema.json
# Control-plane Worker for the Connections runtime.
# See ../infra/cloudflare/README.md for provisioning + deploy steps.

name = "marfa-runtime-control"
main = "../../packages/runtime-control/src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
# `account_id` is intentionally omitted — Wrangler reads it from the
# CLOUDFLARE_ACCOUNT_ID environment variable at deploy time, so no
# operator's account is baked into the committed config. See
# infra/cloudflare/README.md.
#
# This file carries `$<VAR>`-style template tokens for operator-specific
# values — never edit them inline. Deploy via
# `infra/cloudflare/scripts/deploy-control.sh <env>`, which reads the
# values from environment variables and renders a temp file before
# invoking `wrangler deploy`. Required vars:
#   - CLOUDFLARE_ACCOUNT_ID            (account that hosts the Worker)
#   - CONTROL_PLANE_STAGING_KV_ID      (idempotency KV namespace id, staging)
#   - CONTROL_PLANE_PROD_KV_ID         (idempotency KV namespace id, prod)
#   - CONTROL_PLANE_STAGING_HOSTNAME   (e.g. runtime-staging.marfa.so)
#   - CONTROL_PLANE_PROD_HOSTNAME      (e.g. runtime.marfa.so)
#   - CONTROL_PLANE_ZONE               (zone hosting both hostnames, e.g. marfa.so)

# Default (dev) environment — bound to the cloudflared-tunnel hostname
# the developer brings up with `cloudflared tunnel --url …`.
# Production routes live under [env.prod].

[vars]
ENVIRONMENT = "dev"
# Worker runtime var (the DLQ HTTP-pull client reads it). Wrangler does not
# expand env vars in [vars], so the operator fills this in before deploy.
CLOUDFLARE_ACCOUNT_ID = "${CLOUDFLARE_ACCOUNT_ID}"

# ---- Staging --------------------------------------------------------------
# `routes` and `zone_name` below are operator-specific — replace the
# example hostnames with the domain/zone you deploy under, or remove the
# `routes` block and bind the Worker to a *.workers.dev subdomain.
[env.staging]
name = "marfa-runtime-control-staging"
routes = [
  { pattern = "${CONTROL_PLANE_STAGING_HOSTNAME}/*", zone_name = "${CONTROL_PLANE_ZONE}" },
]

[env.staging.vars]
ENVIRONMENT = "staging"
CLOUDFLARE_ACCOUNT_ID = "${CLOUDFLARE_ACCOUNT_ID}"

# ---- Production -----------------------------------------------------------
[env.prod]
name = "marfa-runtime-control-prod"
routes = [
  { pattern = "${CONTROL_PLANE_PROD_HOSTNAME}/*", zone_name = "${CONTROL_PLANE_ZONE}" },
]

[env.prod.vars]
ENVIRONMENT = "prod"
CLOUDFLARE_ACCOUNT_ID = "${CLOUDFLARE_ACCOUNT_ID}"

# ---------------------------------------------------------------------------
# Queue producers.
# webhook-receipt   — produced by control plane on verified inbound;
#                     consumed by per-Integration Workers
# reactive-run      — produced by the server-side reactive-run-bridge;
#                     consumed by per-Integration Workers
# scheduled-poll    — bound for DLQ replay. When an operator replays a
#                     `marfa-scheduled-poll-<env>-dlq` message, it gets
#                     re-enqueued onto this main queue. Not used on hot
#                     paths today.
# ---------------------------------------------------------------------------

[[env.staging.queues.producers]]
binding = "WEBHOOK_RECEIPT_QUEUE"
queue = "marfa-webhook-receipt-staging"

[[env.staging.queues.producers]]
binding = "REACTIVE_RUN_QUEUE"
queue = "marfa-reactive-run-staging"

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-staging"

# Per-integration webhook-receipt queue producers. The route in
# `webhooks.ts` resolves the binding by `integration_name`. Each
# integration that ships a `webhook` trigger lands a binding here AND
# a `[[env.<env>.queues.consumers]]` block in its own wrangler.toml
# pointing at the same queue.
#
# The shared `WEBHOOK_RECEIPT_QUEUE` above stays as the fallback for
# `withmarfa.github-webhooks` until it migrates onto its own queue.

[[env.staging.queues.producers]]
binding = "WEBHOOK_RECEIPT_QUEUE_WITHMARFA_INBOX"
queue = "marfa-webhook-receipt-withmarfa-inbox-staging"

[[env.staging.queues.producers]]
binding = "WEBHOOK_RECEIPT_QUEUE_GOOGLE_CALENDAR"
queue = "marfa-webhook-receipt-google-calendar-staging"

[[env.staging.queues.producers]]
binding = "WEBHOOK_RECEIPT_QUEUE_GOOGLE_DRIVE"
queue = "marfa-webhook-receipt-google-drive-staging"

[[env.prod.queues.producers]]
binding = "WEBHOOK_RECEIPT_QUEUE"
queue = "marfa-webhook-receipt-prod"

[[env.prod.queues.producers]]
binding = "REACTIVE_RUN_QUEUE"
queue = "marfa-reactive-run-prod"

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-prod"

# Prod mirror of the per-integration webhook-receipt producers.
[[env.prod.queues.producers]]
binding = "WEBHOOK_RECEIPT_QUEUE_WITHMARFA_INBOX"
queue = "marfa-webhook-receipt-withmarfa-inbox-prod"

[[env.prod.queues.producers]]
binding = "WEBHOOK_RECEIPT_QUEUE_GOOGLE_CALENDAR"
queue = "marfa-webhook-receipt-google-calendar-prod"

[[env.prod.queues.producers]]
binding = "WEBHOOK_RECEIPT_QUEUE_GOOGLE_DRIVE"
queue = "marfa-webhook-receipt-google-drive-prod"

# ---------------------------------------------------------------------------
# KV — short-lived idempotency cache used by the control plane to
# dedupe webhook deliveries within the verification → enqueue window.
# Namespace IDs (per env) come from provision.ts; paste below.
# ---------------------------------------------------------------------------

[[env.staging.kv_namespaces]]
binding = "IDEMPOTENCY_KV"
id = "${CONTROL_PLANE_STAGING_KV_ID}"

[[env.prod.kv_namespaces]]
binding = "IDEMPOTENCY_KV"
id = "${CONTROL_PLANE_PROD_KV_ID}"

# ---------------------------------------------------------------------------
# Service bindings — control plane → per-Integration Workers.
# Used by:
#   - POST /connections/:id/arm-schedule → /arm-schedule
#   - POST /connections/:id/verify       → /verify
# Each in-tree integration that ships as a deployed Worker gets a
# binding here AND a corresponding entry in the routes'
# `resolveServiceBinding` switch (`arm-schedule.ts`, `verify.ts`).
#
# In-tree integrations without a deployed Worker today
# (`_template`, `withmarfa.sync`) intentionally have NO service binding.
# The verify route surfaces `no_service_binding` (503) for those —
# wiring them up requires the integration to first ship its own
# `wrangler.toml` and pass `wrangler deploy`.
#
# **Bounded-set assumption.** This per-integration binding pattern works
# for the in-tree set — small, stable, low maintenance cost. It does
# NOT scale to community-published integrations from a future
# marketplace where runtime-control can't pre-declare bindings for
# arbitrary third-party Workers. When marketplace integrations land,
# the verify dispatch path will need to revisit (probably HTTP fetch
# via Workers Platform service URLs, or queue-mediated sync polling).
# Out of scope today; documented so future readers see the hidden
# assumption (mirrored in `env.ts`).
# ---------------------------------------------------------------------------

[[env.staging.services]]
binding = "INTEGRATION_RSS_WATCHER"
service = "marfa-integration-rss-watcher-staging"

[[env.staging.services]]
binding = "INTEGRATION_GITHUB_WEBHOOKS"
service = "marfa-integration-github-webhooks-staging"

[[env.staging.services]]
binding = "INTEGRATION_TASK_AUTO_ARCHIVE"
service = "marfa-integration-task-auto-archive-staging"

[[env.staging.services]]
binding = "INTEGRATION_GOOGLE_CALENDAR"
service = "marfa-integration-google-calendar-staging"

[[env.staging.services]]
binding = "INTEGRATION_GOOGLE_TASKS"
service = "marfa-integration-google-tasks-staging"

[[env.staging.services]]
binding = "INTEGRATION_GOOGLE_DRIVE"
service = "marfa-integration-google-drive-staging"

[[env.staging.services]]
binding = "INTEGRATION_GOOGLE_CONTACTS"
service = "marfa-integration-google-contacts-staging"

[[env.staging.services]]
binding = "INTEGRATION_GOOGLE_YOUTUBE"
service = "marfa-integration-google-youtube-staging"

[[env.staging.services]]
binding = "INTEGRATION_TODOIST_TASKS"
service = "marfa-integration-todoist-tasks-staging"

[[env.staging.services]]
binding = "INTEGRATION_READWISE"
service = "marfa-integration-readwise-staging"

[[env.staging.services]]
binding = "INTEGRATION_RAINDROP"
service = "marfa-integration-raindrop-staging"

[[env.staging.services]]
binding = "INTEGRATION_WITHMARFA_INBOX"
service = "marfa-integration-withmarfa-inbox-staging"

# ---- Prod service bindings -----------------------------------------------
# Mirror the staging block above. Every entry in the dispatch switches
# (`packages/runtime-control/src/routes/arm-schedule.ts`, `verify.ts`)
# MUST have a corresponding binding here. The freshness test in
# `packages/runtime-control/src/wrangler-control-config.test.ts`
# parses this file with a strict TOML parser and asserts both invariants
# (every dispatch entry → a binding in both envs; no duplicate `binding`
# keys inside one `[[env.X.services]]` block).

[[env.prod.services]]
binding = "INTEGRATION_RSS_WATCHER"
service = "marfa-integration-rss-watcher-prod"

[[env.prod.services]]
binding = "INTEGRATION_GITHUB_WEBHOOKS"
service = "marfa-integration-github-webhooks-prod"

[[env.prod.services]]
binding = "INTEGRATION_TASK_AUTO_ARCHIVE"
service = "marfa-integration-task-auto-archive-prod"

[[env.prod.services]]
binding = "INTEGRATION_GOOGLE_CALENDAR"
service = "marfa-integration-google-calendar-prod"

[[env.prod.services]]
binding = "INTEGRATION_GOOGLE_TASKS"
service = "marfa-integration-google-tasks-prod"

[[env.prod.services]]
binding = "INTEGRATION_GOOGLE_DRIVE"
service = "marfa-integration-google-drive-prod"

[[env.prod.services]]
binding = "INTEGRATION_GOOGLE_CONTACTS"
service = "marfa-integration-google-contacts-prod"

[[env.prod.services]]
binding = "INTEGRATION_GOOGLE_YOUTUBE"
service = "marfa-integration-google-youtube-prod"

[[env.prod.services]]
binding = "INTEGRATION_TODOIST_TASKS"
service = "marfa-integration-todoist-tasks-prod"

[[env.prod.services]]
binding = "INTEGRATION_READWISE"
service = "marfa-integration-readwise-prod"

[[env.prod.services]]
binding = "INTEGRATION_RAINDROP"
service = "marfa-integration-raindrop-prod"

[[env.prod.services]]
binding = "INTEGRATION_WITHMARFA_INBOX"
service = "marfa-integration-withmarfa-inbox-prod"

# ---------------------------------------------------------------------------
# R2 — large inbound webhook bodies (>256KB) spill here.
#
# Secrets (set via `wrangler secret put` per env):
#   - MARFA_API_URL              (every env)
#   - MARFA_RUNTIME_BROKER_KEY   (server-issued long-lived `is_platform`
#                                key the control plane uses to mint
#                                per-Connection runtime credentials, and
#                                that the server presents on the schedule
#                                routes. Stays between the server and this
#                                Worker; never sent to an integration
#                                Worker and never accepted from one.)
#   - MARFA_WORKER_IDENTITY_SECRET  (root every integration Worker's
#                                identity key derives from, as
#                                HMAC-SHA256(root, integration_name).
#                                Held only here. Per-env: sharing a root
#                                across environments lets a staging
#                                Worker authenticate to production.)
#   - CLOUDFLARE_QUEUES_API_TOKEN  account-scoped CF API token with
#                                  `queues_read` + `queues_write`
#                                  permissions. Used by the DLQ
#                                  peek/replay routes' HTTP-pull client.
#
# Vars (set in [env.<env>.vars] above):
#   - ENVIRONMENT
#   - CLOUDFLARE_ACCOUNT_ID  (same account_id used throughout; the DLQ
#                             HTTP-pull client reads it via env so tests
#                             can swap it)
# ---------------------------------------------------------------------------
