# Local-dev cloudflared tunnel config.
#
# Use case: developer running `wrangler dev` against the control-plane
# Worker on localhost:8787 needs a public HTTPS URL so the Marfa server
# (on its configured port) can deliver inbound webhooks to it.
#
# Two options:
#
# 1. EPHEMERAL (no auth, no DNS):
#      cloudflared tunnel --url http://localhost:8787
#    cloudflared prints a `*.trycloudflare.com` URL each time. Easy
#    iteration; URL changes each invocation. Use for one-off testing.
#
# 2. NAMED (stable hostname):
#      cloudflared tunnel login
#      cloudflared tunnel create marfa-runtime-dev-<your-handle>
#      cloudflared tunnel route dns marfa-runtime-dev-<your-handle> \
#        runtime-dev.<your-handle>.<your-domain>
#      cloudflared tunnel --config ./tunnel.config.yml run
#
# This file is the template for option 2 — copy to tunnel.config.yml,
# fill the placeholders, do NOT commit the result (it embeds your
# tunnel UUID + credentials path).

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: ${HOME}/.cloudflared/REPLACE_WITH_TUNNEL_UUID.json

ingress:
  - hostname: runtime-dev.REPLACE_WITH_HANDLE.REPLACE_WITH_DOMAIN
    service: http://localhost:8787
  - service: http_status:404
