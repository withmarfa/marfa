#:schema node_modules/wrangler/config-schema.json
# Per-Integration Worker template. Each integration under
# `integrations/<name>/` copies this file and customises:
#   - name (matches the integration name from its manifest)
#   - main (path into the integration's own src/)
#   - durable_objects.bindings (DO class shipped from
#     @withmarfa/runtime-sdk, namespaced per Worker)
#   - queues.consumers (subscribe to the slice of webhook-receipt /
#     scheduled-poll / reactive-run that envelope-routes by integration
#     name)
#
# The control plane (wrangler.control.toml) and per-Integration Workers
# share the same Cloudflare account but no other state — every call
# between them goes through the public HTTPS surface.

name = "marfa-integration-EXAMPLE"
main = "../../integrations/EXAMPLE/src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "${CLOUDFLARE_ACCOUNT_ID}"

[vars]
INTEGRATION_NAME = "EXAMPLE"
ENVIRONMENT = "dev"

# ---- Durable Object: per-Connection state --------------------------------
# The DO class lives in @withmarfa/runtime-sdk; each integration namespaces
# it locally. The class_name must match the export from the SDK.
#
# [[durable_objects.bindings]]
# name = "PER_CONNECTION_STATE"
# class_name = "PerConnectionState"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["PerConnectionState"]

# ---- Queues: consumers ---------------------------------------------------
# Each integration consumes its slice of the queue; the producer envelopes
# messages with `integration_name`.
#
# Per-Integration Workers do NOT need a consumer binding for the
# `*-dlq` queues. DLQ inspection and replay happen via Cloudflare's
# account-scoped HTTP-pull API, used by the runtime-control Worker's
# `POST /dlq/peek` + `POST /dlq/replay` routes. Consumer bindings are
# reserved for the main queues; DLQ messages re-enter the main queue
# via replay, where the existing consumer picks them up normally.
#
# [[queues.consumers]]
# queue = "marfa-webhook-receipt"
# max_batch_size = 10
# max_batch_timeout = 5
# max_retries = 6
# dead_letter_queue = "marfa-webhook-receipt-dlq"
#
# [[queues.consumers]]
# queue = "marfa-scheduled-poll"
# max_batch_size = 5
# max_batch_timeout = 30
#
# [[queues.consumers]]
# queue = "marfa-reactive-run"
# max_batch_size = 10
# max_batch_timeout = 5

# ---- Staging / Prod ------------------------------------------------------
[env.staging]
name = "marfa-integration-EXAMPLE-staging"
[env.staging.vars]
ENVIRONMENT = "staging"

[env.prod]
name = "marfa-integration-EXAMPLE-prod"
[env.prod.vars]
ENVIRONMENT = "prod"

# Secrets (set via `wrangler secret put` per env):
#   - MARFA_API_URL           (every env; the runtime credential is
#                              fetched per-message from the control
#                              plane's lease broker, never bound here)
