#:schema node_modules/wrangler/config-schema.json
# Per-Integration Worker template. Each integration under
# `integrations/<name>/` copies this file and customizes:
#   - name (matches the integration name from its manifest)
#   - main (path into the integration's own src/)
#   - durable_objects.bindings (DO class shipped from
#     @withmarfa/runtime-sdk, namespaced per Worker)
#   - queues.consumers (subscribe to the slice of webhook-receipt /
#     scheduled-poll / reactive-run that envelope-routes by integration
#     name)
#
# The control plane (wrangler.control.toml) and per-Integration Workers
# share the same Cloudflare account but no other state. Calls from the
# control plane into a Worker go over a Service Binding declared in
# wrangler.control.toml, and carry the runtime broker key — the Worker
# gates its whole fetch surface on it.

name = "marfa-integration-EXAMPLE"
main = "../../integrations/EXAMPLE/src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
# `account_id` omitted — Wrangler reads CLOUDFLARE_ACCOUNT_ID from the
# env, which is what every shipping integration config does. The
# `${CLOUDFLARE_ACCOUNT_ID}` placeholder that used to sit here would
# have been copied verbatim: nothing renders this file, so it reaches
# Wrangler as those literal characters rather than an account.
# `deploy-integrations.sh` names the resolved account back before it
# deploys, since the config pins none.

# No public HTTP surface. The control plane reaches this Worker over a
# Service Binding; queue delivery and Durable Object alarms never touch
# a hostname. A `workers.dev` name would therefore only ever serve
# unsolicited traffic.
#
# Both keys are stated because `preview_urls` has no dependable
# default. Wrangler's deploy path resolves none locally: an unset
# value is dropped from the request body and the API decides. Its
# config schema documents a default of `false`, and the helper it
# mocks that API with computes a third answer. Left unset, per-version
# `<version>-<name>.<subdomain>.workers.dev` hostnames can keep
# serving the Worker.
workers_dev = false
preview_urls = false

[vars]
INTEGRATION_NAME = "EXAMPLE"
ENVIRONMENT = "dev"

# ---- Durable Object: per-Connection state --------------------------------
# The DO class lives in @withmarfa/runtime-sdk; each integration namespaces
# it locally. The class_name must match the export from the SDK.
#
# [[durable_objects.bindings]]
# name = "PER_CONNECTION_STATE"
# class_name = "PerConnectionState"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["PerConnectionState"]

# ---- Queues: consumers ---------------------------------------------------
# Each integration consumes its slice of the queue; the producer envelopes
# messages with `integration_name`.
#
# Per-Integration Workers do NOT need a consumer binding for the
# `*-dlq` queues. DLQ inspection and replay happen via Cloudflare's
# account-scoped HTTP-pull API, used by the runtime-control Worker's
# `POST /dlq/peek` + `POST /dlq/replay` routes. Consumer bindings are
# reserved for the main queues; DLQ messages re-enter the main queue
# via replay, where the existing consumer picks them up normally.
#
# [[queues.consumers]]
# queue = "marfa-webhook-receipt"
# max_batch_size = 10
# max_batch_timeout = 5
# max_retries = 6
# dead_letter_queue = "marfa-webhook-receipt-dlq"
#
# [[queues.consumers]]
# queue = "marfa-scheduled-poll"
# max_batch_size = 5
# max_batch_timeout = 30
#
# [[queues.consumers]]
# queue = "marfa-reactive-run"
# max_batch_size = 10
# max_batch_timeout = 5

# ---- Staging / Prod ------------------------------------------------------
[env.staging]
name = "marfa-integration-EXAMPLE-staging"
workers_dev = false
preview_urls = false
[env.staging.vars]
ENVIRONMENT = "staging"

[env.prod]
name = "marfa-integration-EXAMPLE-prod"
workers_dev = false
preview_urls = false
[env.prod.vars]
ENVIRONMENT = "prod"

# Secrets (set via `wrangler secret put` per env):
#   - MARFA_API_URL           (every env; the runtime credential is
#                              fetched per-message from the control
#                              plane's lease broker, never bound here)
