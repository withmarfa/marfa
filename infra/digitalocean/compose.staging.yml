# Hosted Marfa, staging: the production shape plus a Postgres container,
# which makes staging an exact copy of the self-host deployment — the path
# most users run is exercised on every staging deploy. Staging data is
# disposable by policy; the volume exists so restarts are not resets.

name: marfa-staging

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MARFA_API_HOSTNAME: ${MARFA_API_HOSTNAME:?set MARFA_API_HOSTNAME in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # Healthy, not merely started; see compose.production.yml.
    depends_on:
      server:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marfa
      POSTGRES_USER: marfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marfa -d marfa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply pending migrations, then exit. The server never
  # migrates on boot.
  migrate:
    image: ${MARFA_SERVER_IMAGE:?set MARFA_SERVER_IMAGE in .env}
    command: ["node", "dist/migrate.js"]
    env_file: server.env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: ${MARFA_SERVER_IMAGE:?set MARFA_SERVER_IMAGE in .env}
    restart: unless-stopped
    env_file: server.env
    environment:
      MARFA_PROCESS_ROLE: web
      # Staging's Postgres is the compose-internal container with the
      # stock connection ceiling, so the budget is looser than
      # production's; matched anyway so the two environments exercise
      # the same shape.
      MARFA_DB_POOL_SIZE: "3"
    # Loopback-only publish for the deploy gate and on-box debugging; see
    # compose.production.yml.
    ports:
      - "127.0.0.1:8600:8600"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - server-data:/app/data

  # Same image, worker role; see compose.production.yml.
  worker:
    image: ${MARFA_SERVER_IMAGE:?set MARFA_SERVER_IMAGE in .env}
    restart: unless-stopped
    env_file: server.env
    environment:
      MARFA_PROCESS_ROLE: worker
      MARFA_API_URL: http://server:8600
      MARFA_DB_POOL_SIZE: "2"
      # Off for the same reason as production: the shared heartbeat is
      # the web tier's dead-man's switch.
      MARFA_HEARTBEAT_URL: ""
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      server:
        condition: service_healthy
    volumes:
      - server-data:/app/data

# Pinned so TRUSTED_PROXY_CIDRS can trust exactly this network; see
# compose.production.yml. A different subnet from production, so a config
# accidentally applied to the wrong box fails visibly rather than blending.
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  caddy-data:
  caddy-config:
  pgdata:
  server-data:
