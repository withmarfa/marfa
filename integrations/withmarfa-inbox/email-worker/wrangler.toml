#:schema node_modules/wrangler/config-schema.json
# Cloudflare Email Worker — companion to the withmarfa.inbox integration.
#
# Email Routing on `inbox.marfa.so` is configured to forward
# `capture@inbox.marfa.so` → this Worker. The Worker:
#   1. Parses MIME via postal-mime.
#   2. Builds a JSON envelope matching the type schema of
#      `withmarfa.captured_email`.
#   3. HMAC-SHA256 signs the body with `WEBHOOK_SECRET` (= the
#      per-connection subscription secret on the Marfa server).
#   4. Dispatches via a Cloudflare Worker Service Binding
#      (`env.RUNTIME_CONTROL.fetch(...)`) at path
#      `/webhooks/inbound/:connection_id`. No edge / HTTP fetch — the
#      bound runtime-control Worker's fetch handler receives the
#      request directly.
#
# Secrets (set via `wrangler secret put --env <env>`):
#   - CONNECTION_ID   the system.connection id baked into the
#                     Service-Binding path (one Email Worker per
#                     Connection in the v1 single-space shape).
#   - WEBHOOK_SECRET  matches the subscription's encrypted secret on
#                     the Marfa server.
#
# Service Bindings (configured per-env below):
#   - RUNTIME_CONTROL → marfa-runtime-control-<env>. No DNS, no TLS,
#                       no edge involved.
#
# This Worker has NO durable state — it's a stateless edge translator
# from "email envelope" to "signed JSON webhook". Reliability comes
# from CF Email Routing's at-least-once delivery + the receiver-side
# Message-ID idempotency.

name = "marfa-withmarfa-inbox-email-worker"
main = "src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

# No public HTTP surface. This Worker exports only an `email` handler,
# invoked by Cloudflare Email Routing — it has no `fetch` handler at
# all, so a `workers.dev` name would only ever serve unsolicited
# traffic.
#
# Both keys are stated because `preview_urls` has no dependable
# default. Wrangler's deploy path resolves none locally: an unset
# value is dropped from the request body and the API decides. Its
# config schema documents a default of `false`, and the helper it
# mocks that API with computes a third answer. Left unset, per-version
# `<version>-<name>.<subdomain>.workers.dev` hostnames can keep
# serving the Worker.
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "dev"

# ---- Staging --------------------------------------------------------------
[env.staging]
name = "marfa-withmarfa-inbox-email-worker-staging"
workers_dev = false
preview_urls = false

[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.services]]
binding = "RUNTIME_CONTROL"
service = "marfa-runtime-control-staging"

# ---- Production -----------------------------------------------------------
[env.prod]
name = "marfa-withmarfa-inbox-email-worker-prod"
workers_dev = false
preview_urls = false

[env.prod.vars]
ENVIRONMENT = "prod"

[[env.prod.services]]
binding = "RUNTIME_CONTROL"
service = "marfa-runtime-control-prod"
