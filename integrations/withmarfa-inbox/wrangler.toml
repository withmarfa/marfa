#:schema node_modules/wrangler/config-schema.json
# Per-Integration Worker for withmarfa.inbox.
# Webhook-only integration — consumes the shared webhook-receipt
# queue. The companion Cloudflare Email Worker that converts inbound
# email → signed JSON webhook lives at `email-worker/` and ships its
# own `wrangler.toml`; the two are deployed independently.

name = "marfa-integration-withmarfa-inbox"
main = "src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
# `account_id` omitted — Wrangler reads CLOUDFLARE_ACCOUNT_ID from the env.

[vars]
INTEGRATION_NAME = "withmarfa.inbox"
ENVIRONMENT = "dev"

[[durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# ---- Staging --------------------------------------------------------------
[env.staging]
name = "marfa-integration-withmarfa-inbox-staging"

[env.staging.vars]
INTEGRATION_NAME = "withmarfa.inbox"
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# DLQ producer binding so the consumer wrapper can stamp
# `_failure_reason` on permanent failures before they leave the
# operator's peekable surface.
#
# Consumes from a per-integration webhook-receipt queue. CF Queues
# allow only one consumer per queue; a shared queue would collide with
# other webhook integrations. The control plane routes by
# `integration_name` to the matching producer binding
# (`WEBHOOK_RECEIPT_QUEUE_WITHMARFA_INBOX` in wrangler.control.toml).
[[env.staging.queues.producers]]
binding = "WEBHOOK_RECEIPT_DLQ_QUEUE"
queue = "marfa-webhook-receipt-withmarfa-inbox-staging-dlq"

[[env.staging.queues.consumers]]
queue = "marfa-webhook-receipt-withmarfa-inbox-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "marfa-webhook-receipt-withmarfa-inbox-staging-dlq"

# Secrets (`wrangler secret put --env staging`):
#   - MARFA_API_URL
#   - MARFA_RUNTIME_CONTROL_URL
#   - MARFA_RUNTIME_BROKER_KEY

# ---- Production -----------------------------------------------------------
[env.prod]
name = "marfa-integration-withmarfa-inbox-prod"

[env.prod.vars]
INTEGRATION_NAME = "withmarfa.inbox"
ENVIRONMENT = "prod"

[[env.prod.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.prod.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.prod.queues.producers]]
binding = "WEBHOOK_RECEIPT_DLQ_QUEUE"
queue = "marfa-webhook-receipt-withmarfa-inbox-prod-dlq"

[[env.prod.queues.consumers]]
queue = "marfa-webhook-receipt-withmarfa-inbox-prod"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "marfa-webhook-receipt-withmarfa-inbox-prod-dlq"
