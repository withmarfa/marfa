#:schema node_modules/wrangler/config-schema.json
# Per-Integration Worker for mymehq.rss-watcher.
# Schedule-trigger only — consumes its own scheduled-poll queue.
# (Cloudflare Queues are single-consumer; per-integration queues are
# necessary for multi-integration coexistence on staging.)

name = "myme-integration-rss-watcher"
main = "src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "fb81b3c1ad68ef6dbd689897e8897b10"

[vars]
INTEGRATION_NAME = "mymehq.rss-watcher"
MANIFEST_CRON = "0 * * * *"
ENVIRONMENT = "dev"

[[durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# ---- Staging --------------------------------------------------------------
[env.staging]
name = "myme-integration-rss-watcher-staging"
account_id = "fb81b3c1ad68ef6dbd689897e8897b10"

[env.staging.vars]
INTEGRATION_NAME = "mymehq.rss-watcher"
MANIFEST_CRON = "0 * * * *"
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "myme-scheduled-poll-rss-watcher-staging"

[[env.staging.queues.consumers]]
queue = "myme-scheduled-poll-rss-watcher-staging"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "myme-scheduled-poll-rss-watcher-staging-dlq"

# Secrets (`wrangler secret put --env staging`):
#   - MYME_API_URL
#   - MYME_RUNTIME_CONTROL_URL
#   - MYME_RUNTIME_BROKER_KEY
