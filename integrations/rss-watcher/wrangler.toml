#:schema node_modules/wrangler/config-schema.json
# Per-Integration Worker for withmarfa.rss-watcher.
# Schedule-trigger only — consumes its own scheduled-poll queue.
# (Cloudflare Queues are single-consumer; per-integration queues are
# necessary for multi-integration coexistence on staging.)

name = "marfa-integration-rss-watcher"
main = "src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
# `account_id` omitted — Wrangler reads CLOUDFLARE_ACCOUNT_ID from the env.

[vars]
INTEGRATION_NAME = "withmarfa.rss-watcher"
MANIFEST_CRON = "0 * * * *"
ENVIRONMENT = "dev"

[[durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# ---- Staging --------------------------------------------------------------
[env.staging]
name = "marfa-integration-rss-watcher-staging"

[env.staging.vars]
INTEGRATION_NAME = "withmarfa.rss-watcher"
MANIFEST_CRON = "0 0 * * *"
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-rss-watcher-staging"

# DLQ producer binding so the consumer wrapper can stamp
# `_failure_reason` on permanent failures before they leave the
# operator's peekable surface.
[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-rss-watcher-staging-dlq"

[[env.staging.queues.consumers]]
queue = "marfa-scheduled-poll-rss-watcher-staging"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-rss-watcher-staging-dlq"

# ---- Production -----------------------------------------------------------
# Mirrors staging. Keep in sync if you change queue topology.
[env.prod]
name = "marfa-integration-rss-watcher-prod"

[env.prod.vars]
INTEGRATION_NAME = "withmarfa.rss-watcher"
MANIFEST_CRON = "0 * * * *"
ENVIRONMENT = "prod"

[[env.prod.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.prod.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-rss-watcher-prod"

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-rss-watcher-prod-dlq"

[[env.prod.queues.consumers]]
queue = "marfa-scheduled-poll-rss-watcher-prod"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-rss-watcher-prod-dlq"

# Secrets (`wrangler secret put --env <env>`):
#   - MARFA_API_URL
#   - MARFA_RUNTIME_CONTROL_URL
#   - MARFA_RUNTIME_BROKER_KEY
