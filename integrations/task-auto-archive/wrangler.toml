#:schema node_modules/wrangler/config-schema.json
# Per-Integration Worker for withmarfa.task-auto-archive.
# Item-event + schedule fallback (daily 03:00 UTC).
#
# Each integration that consumes reactive item-event envelopes has its
# own queue (`marfa-reactive-run-<slug>-<env>`); the server's bridge
# routes envelopes per `integration_name` via the
# `CLOUDFLARE_QUEUES_REACTIVE_RUN_URLS` env var. Mirrors the existing
# per-integration shape for scheduled-poll + webhook-receipt families.

name = "marfa-integration-task-auto-archive"
main = "src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
# `account_id` omitted — Wrangler reads CLOUDFLARE_ACCOUNT_ID from the env.

[vars]
INTEGRATION_NAME = "withmarfa.task-auto-archive"
MANIFEST_CRON = "0 3 * * *"
ENVIRONMENT = "dev"

[[durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# ---- Staging --------------------------------------------------------------
[env.staging]
name = "marfa-integration-task-auto-archive-staging"

[env.staging.vars]
INTEGRATION_NAME = "withmarfa.task-auto-archive"
MANIFEST_CRON = "0 3 * * *"
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-task-auto-archive-staging"

# DLQ producer bindings so the consumer wrapper can stamp
# `_failure_reason` on permanent failures before they leave the
# operator's peekable surface. One binding per consumer queue family
# this Worker consumes (schedule + item-event).
[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-task-auto-archive-staging-dlq"

[[env.staging.queues.producers]]
binding = "REACTIVE_RUN_DLQ_QUEUE"
queue = "marfa-reactive-run-withmarfa-task-auto-archive-staging-dlq"

[[env.staging.queues.consumers]]
queue = "marfa-scheduled-poll-task-auto-archive-staging"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-task-auto-archive-staging-dlq"

# Per-integration reactive-run queue — no consumer collision with
# other integrations. Cloudflare Queues allow only one consumer per
# queue; a shared queue would mean only one Worker could consume
# reactive-run envelopes across the whole hosted substrate.
[[env.staging.queues.consumers]]
queue = "marfa-reactive-run-withmarfa-task-auto-archive-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "marfa-reactive-run-withmarfa-task-auto-archive-staging-dlq"

# ---- Production -----------------------------------------------------------
# Mirrors staging. Keep in sync if you change queue topology.
[env.prod]
name = "marfa-integration-task-auto-archive-prod"

[env.prod.vars]
INTEGRATION_NAME = "withmarfa.task-auto-archive"
MANIFEST_CRON = "0 3 * * *"
ENVIRONMENT = "prod"

[[env.prod.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.prod.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-task-auto-archive-prod"

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-task-auto-archive-prod-dlq"

[[env.prod.queues.producers]]
binding = "REACTIVE_RUN_DLQ_QUEUE"
queue = "marfa-reactive-run-withmarfa-task-auto-archive-prod-dlq"

[[env.prod.queues.consumers]]
queue = "marfa-scheduled-poll-task-auto-archive-prod"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-task-auto-archive-prod-dlq"

# Per-integration reactive-run queue — see the staging block above for
# the rationale.
[[env.prod.queues.consumers]]
queue = "marfa-reactive-run-withmarfa-task-auto-archive-prod"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "marfa-reactive-run-withmarfa-task-auto-archive-prod-dlq"

# Secrets (`wrangler secret put --env <env>`):
#   - MARFA_API_URL
#   - MARFA_RUNTIME_CONTROL_URL
#   - MARFA_RUNTIME_BROKER_KEY
