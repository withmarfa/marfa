#:schema node_modules/wrangler/config-schema.json
# Per-Integration Worker for google.drive.
#
# Three queue families:
#   - scheduled-poll: cron tick (every 10 min) drives the incremental
#     sweep AND the channels.watch renewal.
#   - reactive-run: defensive — direction is inbound, so we shouldn't
#     receive item-events, but the SDK helper expects the queue.
#   - webhook-receipt: Google push notifications arrive here after the
#     google-channel adapter verifies X-Goog-Channel-Token.

name = "myme-integration-google-drive"
main = "src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
INTEGRATION_NAME = "google.drive"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "dev"

[[durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# ---- Staging --------------------------------------------------------------
[env.staging]
name = "myme-integration-google-drive-staging"

[env.staging.vars]
INTEGRATION_NAME = "google.drive"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "myme-scheduled-poll-google-drive-staging"

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "myme-scheduled-poll-google-drive-staging-dlq"

[[env.staging.queues.producers]]
binding = "REACTIVE_RUN_DLQ_QUEUE"
queue = "myme-reactive-run-google-drive-staging-dlq"

[[env.staging.queues.producers]]
binding = "WEBHOOK_RECEIPT_DLQ_QUEUE"
queue = "myme-webhook-receipt-google-drive-staging-dlq"

[[env.staging.queues.consumers]]
queue = "myme-scheduled-poll-google-drive-staging"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "myme-scheduled-poll-google-drive-staging-dlq"

[[env.staging.queues.consumers]]
queue = "myme-reactive-run-google-drive-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "myme-reactive-run-google-drive-staging-dlq"

[[env.staging.queues.consumers]]
queue = "myme-webhook-receipt-google-drive-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "myme-webhook-receipt-google-drive-staging-dlq"

# ---- Prod -----------------------------------------------------------------
[env.prod]
name = "myme-integration-google-drive-prod"

[env.prod.vars]
INTEGRATION_NAME = "google.drive"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "prod"

[[env.prod.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.prod.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "myme-scheduled-poll-google-drive-prod"

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "myme-scheduled-poll-google-drive-prod-dlq"

[[env.prod.queues.producers]]
binding = "REACTIVE_RUN_DLQ_QUEUE"
queue = "myme-reactive-run-google-drive-prod-dlq"

[[env.prod.queues.producers]]
binding = "WEBHOOK_RECEIPT_DLQ_QUEUE"
queue = "myme-webhook-receipt-google-drive-prod-dlq"

[[env.prod.queues.consumers]]
queue = "myme-scheduled-poll-google-drive-prod"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "myme-scheduled-poll-google-drive-prod-dlq"

[[env.prod.queues.consumers]]
queue = "myme-reactive-run-google-drive-prod"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "myme-reactive-run-google-drive-prod-dlq"

[[env.prod.queues.consumers]]
queue = "myme-webhook-receipt-google-drive-prod"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "myme-webhook-receipt-google-drive-prod-dlq"
