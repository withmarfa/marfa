#:schema node_modules/wrangler/config-schema.json
# Per-Integration Worker for todoist.tasks.
#
# Two trigger types — schedule (10-minute incremental Sync API sweep)
# and item-event (outbound reactive via REST + Sync commands). The
# Worker consumes:
#
#   - a per-integration scheduled-poll queue
#   - a per-integration reactive-run queue (Cloudflare Queues allow only
#     one consumer per queue; per-integration queues prevent
#     silently-dropped messages addressed to non-consumer integrations)
#
# Deliberately NO webhook-receipt queue — Todoist supports webhooks
# but they require a publicly-reachable URL and are out of scope for
# this round (the manifest exposes schedule + item-event only).

name = "marfa-integration-todoist-tasks"
main = "src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
# `account_id` omitted — Wrangler reads CLOUDFLARE_ACCOUNT_ID from env.

# No public HTTP surface. The control plane reaches this Worker over a
# Service Binding; queue delivery and Durable Object alarms never touch
# a hostname. A `workers.dev` name would therefore only ever serve
# unsolicited traffic.
#
# Both keys are stated because `preview_urls` has no dependable
# default. Wrangler's deploy path resolves none locally: an unset
# value is dropped from the request body and the API decides. Its
# config schema documents a default of `false`, and the helper it
# mocks that API with computes a third answer. Left unset, per-version
# `<version>-<name>.<subdomain>.workers.dev` hostnames can keep
# serving the Worker.
workers_dev = false
preview_urls = false

[vars]
INTEGRATION_NAME = "todoist.tasks"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "dev"

[[durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# ---- Staging --------------------------------------------------------------
[env.staging]
name = "marfa-integration-todoist-tasks-staging"
workers_dev = false
preview_urls = false

[env.staging.vars]
INTEGRATION_NAME = "todoist.tasks"
MANIFEST_CRON = "0 0 * * *"
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-todoist-tasks-staging"

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-todoist-tasks-staging-dlq"

[[env.staging.queues.producers]]
binding = "REACTIVE_RUN_DLQ_QUEUE"
queue = "marfa-reactive-run-todoist-tasks-staging-dlq"

[[env.staging.queues.consumers]]
queue = "marfa-scheduled-poll-todoist-tasks-staging"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-todoist-tasks-staging-dlq"

# Per-integration reactive-run queue.
[[env.staging.queues.consumers]]
queue = "marfa-reactive-run-todoist-tasks-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "marfa-reactive-run-todoist-tasks-staging-dlq"

# ---- Prod -----------------------------------------------------------------
[env.prod]
name = "marfa-integration-todoist-tasks-prod"
workers_dev = false
preview_urls = false

[env.prod.vars]
INTEGRATION_NAME = "todoist.tasks"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "prod"

[[env.prod.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.prod.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-todoist-tasks-prod"

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-todoist-tasks-prod-dlq"

[[env.prod.queues.producers]]
binding = "REACTIVE_RUN_DLQ_QUEUE"
queue = "marfa-reactive-run-todoist-tasks-prod-dlq"

[[env.prod.queues.consumers]]
queue = "marfa-scheduled-poll-todoist-tasks-prod"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-todoist-tasks-prod-dlq"

[[env.prod.queues.consumers]]
queue = "marfa-reactive-run-todoist-tasks-prod"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "marfa-reactive-run-todoist-tasks-prod-dlq"

# Secrets (`wrangler secret put --env <env>`):
#   - MARFA_API_URL
#   - MARFA_RUNTIME_CONTROL_URL
#   - MARFA_WORKER_IDENTITY_KEY
#         This Worker's own identity, derived by the operator as
#         HMAC-SHA256(MARFA_WORKER_IDENTITY_SECRET, INTEGRATION_NAME).
#         Presented to the control plane's lease broker, and required on
#         every inbound call to this Worker's fetch surface.
#         Set it with infra/cloudflare/scripts/init-integration-worker-secrets.sh,
#         which derives it from the config's INTEGRATION_NAME.
#         NOT the platform broker key this replaced: that key mints
#         against any Connection in any space and never reaches a Worker.
