#:schema node_modules/wrangler/config-schema.json
# Per-Integration Worker for google.tasks.
#
# Two trigger types — schedule (10-minute incremental sweep via
# updatedMin per task list) and item-event (outbound reactive). The
# Worker consumes:
#
#   - a per-integration scheduled-poll queue (so google.tasks's cron
#     schedule doesn't contend with google.calendar's,
#     task-auto-archive's, or rss-watcher's)
#   - a per-integration reactive-run queue (Cloudflare Queues only
#     allow one consumer per queue; per-integration queues prevent the
#     silently-dropped-message failure mode of a shared queue)
#
# Deliberately NO webhook-receipt queue — Tasks API has no
# channels.watch surface, no Pub/Sub, no inbound push notifications.
# The schedule trigger is the only inbound rail.

name = "marfa-integration-google-tasks"
main = "src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
# `account_id` omitted — Wrangler reads CLOUDFLARE_ACCOUNT_ID from env.

# No public HTTP surface. The control plane reaches this Worker over a
# Service Binding; queue delivery and Durable Object alarms never touch
# a hostname. A `workers.dev` name would therefore only ever serve
# unsolicited traffic.
#
# Both keys are stated because `preview_urls` has no dependable
# default. Wrangler's deploy path resolves none locally: an unset
# value is dropped from the request body and the API decides. Its
# config schema documents a default of `false`, and the helper it
# mocks that API with computes a third answer. Left unset, per-version
# `<version>-<name>.<subdomain>.workers.dev` hostnames can keep
# serving the Worker.
workers_dev = false
preview_urls = false

[vars]
INTEGRATION_NAME = "google.tasks"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "dev"

[[durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# ---- Staging --------------------------------------------------------------
[env.staging]
name = "marfa-integration-google-tasks-staging"
workers_dev = false
preview_urls = false

[env.staging.vars]
INTEGRATION_NAME = "google.tasks"
MANIFEST_CRON = "0 0 * * *"
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# DLQ producer bindings — one per consumer queue family. The Worker
# stamps `_failure_reason` on permanent failures before they leave
# the operator's peekable surface.
[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-google-tasks-staging"

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-google-tasks-staging-dlq"

[[env.staging.queues.producers]]
binding = "REACTIVE_RUN_DLQ_QUEUE"
queue = "marfa-reactive-run-google-tasks-staging-dlq"

[[env.staging.queues.consumers]]
queue = "marfa-scheduled-poll-google-tasks-staging"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-google-tasks-staging-dlq"

# Per-integration reactive-run queue. Server routes envelopes
# by `integration_name` to the matching queue URL via
# `CLOUDFLARE_QUEUES_REACTIVE_RUN_URLS`.
[[env.staging.queues.consumers]]
queue = "marfa-reactive-run-google-tasks-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "marfa-reactive-run-google-tasks-staging-dlq"

# ---- Prod -----------------------------------------------------------------
# Mirrors staging for the eventual production rollout. Keep in sync
# with staging if you change queue topology.
[env.prod]
name = "marfa-integration-google-tasks-prod"
workers_dev = false
preview_urls = false

[env.prod.vars]
INTEGRATION_NAME = "google.tasks"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "prod"

[[env.prod.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.prod.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-google-tasks-prod"

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-google-tasks-prod-dlq"

[[env.prod.queues.producers]]
binding = "REACTIVE_RUN_DLQ_QUEUE"
queue = "marfa-reactive-run-google-tasks-prod-dlq"

[[env.prod.queues.consumers]]
queue = "marfa-scheduled-poll-google-tasks-prod"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-google-tasks-prod-dlq"

[[env.prod.queues.consumers]]
queue = "marfa-reactive-run-google-tasks-prod"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "marfa-reactive-run-google-tasks-prod-dlq"

# Secrets (`wrangler secret put --env <env>`):
#   - MARFA_API_URL
#   - MARFA_RUNTIME_CONTROL_URL
#   - MARFA_WORKER_IDENTITY_KEY
#         This Worker's own identity, derived by the operator as
#         HMAC-SHA256(MARFA_WORKER_IDENTITY_SECRET, INTEGRATION_NAME).
#         Presented to the control plane's lease broker, and required on
#         every inbound call to this Worker's fetch surface.
#         Set it with infra/cloudflare/scripts/init-integration-worker-secrets.sh,
#         which derives it from the config's INTEGRATION_NAME.
#         NOT the platform broker key this replaced: that key mints
#         against any Connection in any tenant and never reaches a Worker.
