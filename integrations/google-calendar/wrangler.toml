#:schema node_modules/wrangler/config-schema.json
# Per-Integration Worker for google.calendar.
#
# Three trigger types — schedule (10-minute incremental + channel
# renewal cron), item-event (outbound reactive), webhook (Google
# push notifications via channels.watch). The Worker consumes:
#
#   - a per-integration scheduled-poll queue (so google.calendar's
#     cron schedule doesn't contend with task-auto-archive's or
#     rss-watcher's)
#   - the shared reactive-run queue (envelope-routed by integration_name)
#   - a per-integration webhook-receipt queue (Google's push
#     notifications carry only headers — verified via the
#     `google-channel` adapter in `@withmarfa/webhooks`)
#
# Per-integration webhook queue (not the shared `marfa-webhook-receipt`
# that github-webhooks owns) because Cloudflare Queues only permit a
# single consumer per queue — github-webhooks already owns the shared
# one. The control plane's webhook receipt route routes by integration
# name and produces onto the per-integration queue.

name = "marfa-integration-google-calendar"
main = "src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
# `account_id` omitted — Wrangler reads CLOUDFLARE_ACCOUNT_ID from env.

[vars]
INTEGRATION_NAME = "google.calendar"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "dev"

[[durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# ---- Staging --------------------------------------------------------------
[env.staging]
name = "marfa-integration-google-calendar-staging"

[env.staging.vars]
INTEGRATION_NAME = "google.calendar"
MANIFEST_CRON = "0 0 * * *"
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# DLQ producer bindings — one per consumer queue family. The Worker
# stamps `_failure_reason` on permanent failures before they leave
# the operator's peekable surface.
[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-google-calendar-staging"

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-google-calendar-staging-dlq"

[[env.staging.queues.producers]]
binding = "REACTIVE_RUN_DLQ_QUEUE"
queue = "marfa-reactive-run-google-calendar-staging-dlq"

[[env.staging.queues.producers]]
binding = "WEBHOOK_RECEIPT_DLQ_QUEUE"
queue = "marfa-webhook-receipt-google-calendar-staging-dlq"

[[env.staging.queues.consumers]]
queue = "marfa-scheduled-poll-google-calendar-staging"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-google-calendar-staging-dlq"

# Per-integration reactive-run queue. Each integration with an
# item-event trigger gets its own queue (Cloudflare Queues only allow
# one consumer per queue); the server's bridge routes envelopes by
# `integration_name` to the matching queue URL via
# `CLOUDFLARE_QUEUES_REACTIVE_RUN_URLS`.
[[env.staging.queues.consumers]]
queue = "marfa-reactive-run-google-calendar-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "marfa-reactive-run-google-calendar-staging-dlq"

[[env.staging.queues.consumers]]
queue = "marfa-webhook-receipt-google-calendar-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "marfa-webhook-receipt-google-calendar-staging-dlq"

# ---- Prod -----------------------------------------------------------------
# Mirrors staging for the eventual production rollout. Keep in sync
# with staging if you change queue topology.
[env.prod]
name = "marfa-integration-google-calendar-prod"

[env.prod.vars]
INTEGRATION_NAME = "google.calendar"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "prod"

[[env.prod.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.prod.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-google-calendar-prod"

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-google-calendar-prod-dlq"

[[env.prod.queues.producers]]
binding = "REACTIVE_RUN_DLQ_QUEUE"
queue = "marfa-reactive-run-google-calendar-prod-dlq"

[[env.prod.queues.producers]]
binding = "WEBHOOK_RECEIPT_DLQ_QUEUE"
queue = "marfa-webhook-receipt-google-calendar-prod-dlq"

[[env.prod.queues.consumers]]
queue = "marfa-scheduled-poll-google-calendar-prod"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-google-calendar-prod-dlq"

# Per-integration reactive-run queue — see staging block above for
# the rationale. Prod queues are provisioned by `pnpm provision prod`.
[[env.prod.queues.consumers]]
queue = "marfa-reactive-run-google-calendar-prod"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "marfa-reactive-run-google-calendar-prod-dlq"

[[env.prod.queues.consumers]]
queue = "marfa-webhook-receipt-google-calendar-prod"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "marfa-webhook-receipt-google-calendar-prod-dlq"

# Secrets (`wrangler secret put --env <env>`):
#   - MARFA_API_URL
#   - MARFA_RUNTIME_CONTROL_URL
#   - MARFA_RUNTIME_BROKER_KEY
