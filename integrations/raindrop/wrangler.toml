#:schema node_modules/wrangler/config-schema.json
# Per-Integration Worker for raindrop.

name = "marfa-integration-raindrop"
main = "src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

# No public HTTP surface. The control plane reaches this Worker over a
# Service Binding; queue delivery and Durable Object alarms never touch
# a hostname. A `workers.dev` name would therefore only ever serve
# unsolicited traffic.
#
# Both keys are stated because `preview_urls` has no dependable
# default. Wrangler's deploy path resolves none locally: an unset
# value is dropped from the request body and the API decides. Its
# config schema documents a default of `false`, and the helper it
# mocks that API with computes a third answer. Left unset, per-version
# `<version>-<name>.<subdomain>.workers.dev` hostnames can keep
# serving the Worker.
workers_dev = false
preview_urls = false

[vars]
INTEGRATION_NAME = "raindrop.bookmarks"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "dev"

[[durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# ---- Staging --------------------------------------------------------------
[env.staging]
name = "marfa-integration-raindrop-staging"
workers_dev = false
preview_urls = false

[env.staging.vars]
INTEGRATION_NAME = "raindrop.bookmarks"
MANIFEST_CRON = "0 0 * * *"
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-raindrop-staging"

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-raindrop-staging-dlq"

[[env.staging.queues.consumers]]
queue = "marfa-scheduled-poll-raindrop-staging"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-raindrop-staging-dlq"

# ---- Prod -----------------------------------------------------------------
[env.prod]
name = "marfa-integration-raindrop-prod"
workers_dev = false
preview_urls = false

[env.prod.vars]
INTEGRATION_NAME = "raindrop.bookmarks"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "prod"

[[env.prod.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.prod.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-raindrop-prod"

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-raindrop-prod-dlq"

[[env.prod.queues.consumers]]
queue = "marfa-scheduled-poll-raindrop-prod"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-raindrop-prod-dlq"

# Secrets: MARFA_API_URL, MARFA_RUNTIME_CONTROL_URL, MARFA_RUNTIME_BROKER_KEY
