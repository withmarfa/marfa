#:schema node_modules/wrangler/config-schema.json
# Per-Integration Worker for google.contacts (People API).
#
# Two trigger types — schedule (10-minute incremental sweep via
# syncToken with 410 recovery) and item-event (outbound reactive).
# Two queues — scheduled-poll + reactive-run + their DLQs.
# No webhook-receipt queue — People API has no push-notification
# surface for the connections collection.

name = "marfa-integration-google-contacts"
main = "src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

# No public HTTP surface. The control plane reaches this Worker over a
# Service Binding; queue delivery and Durable Object alarms never touch
# a hostname. A `workers.dev` name would therefore only ever serve
# unsolicited traffic.
#
# Both keys are required. Wrangler defaults `preview_urls` from the
# same "are there routes?" test `workers_dev` defaults from, not from
# `workers_dev` itself, so setting only the first leaves per-version
# `<version>-<name>.<subdomain>.workers.dev` hostnames serving the Worker.
workers_dev = false
preview_urls = false

[vars]
INTEGRATION_NAME = "google.contacts"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "dev"

[[durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# ---- Staging --------------------------------------------------------------
[env.staging]
name = "marfa-integration-google-contacts-staging"
workers_dev = false
preview_urls = false

[env.staging.vars]
INTEGRATION_NAME = "google.contacts"
MANIFEST_CRON = "0 0 * * *"
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-google-contacts-staging"

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-google-contacts-staging-dlq"

[[env.staging.queues.producers]]
binding = "REACTIVE_RUN_DLQ_QUEUE"
queue = "marfa-reactive-run-google-contacts-staging-dlq"

[[env.staging.queues.consumers]]
queue = "marfa-scheduled-poll-google-contacts-staging"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-google-contacts-staging-dlq"

[[env.staging.queues.consumers]]
queue = "marfa-reactive-run-google-contacts-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "marfa-reactive-run-google-contacts-staging-dlq"

# ---- Prod -----------------------------------------------------------------
[env.prod]
name = "marfa-integration-google-contacts-prod"
workers_dev = false
preview_urls = false

[env.prod.vars]
INTEGRATION_NAME = "google.contacts"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "prod"

[[env.prod.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.prod.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-google-contacts-prod"

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-google-contacts-prod-dlq"

[[env.prod.queues.producers]]
binding = "REACTIVE_RUN_DLQ_QUEUE"
queue = "marfa-reactive-run-google-contacts-prod-dlq"

[[env.prod.queues.consumers]]
queue = "marfa-scheduled-poll-google-contacts-prod"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-google-contacts-prod-dlq"

[[env.prod.queues.consumers]]
queue = "marfa-reactive-run-google-contacts-prod"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "marfa-reactive-run-google-contacts-prod-dlq"

# Secrets (`wrangler secret put --env <env>`):
#   - MARFA_API_URL
#   - MARFA_RUNTIME_CONTROL_URL
#   - MARFA_RUNTIME_BROKER_KEY
#
# Required for the queue consumer to mint per-Connection runtime
# credentials via the control plane's `/lease/:connection_id/runtime`
# broker. Without them the consumer throws on first dispatch and the
# error surfaces only via console.error. Use the helper at
# `infra/cloudflare/scripts/init-integration-worker-secrets.sh` to
# set all three from your local secrets.env on first deploy.
