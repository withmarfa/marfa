#:schema node_modules/wrangler/config-schema.json
# Per-Integration Worker for google.contacts (People API).
#
# Two trigger types — schedule (10-minute incremental sweep via
# syncToken with 410 recovery) and item-event (outbound reactive).
# Two queues — scheduled-poll + reactive-run + their DLQs.
# No webhook-receipt queue — People API has no push-notification
# surface for the connections collection.

name = "myme-integration-google-contacts"
main = "src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
INTEGRATION_NAME = "google.contacts"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "dev"

[[durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# ---- Staging --------------------------------------------------------------
[env.staging]
name = "myme-integration-google-contacts-staging"

[env.staging.vars]
INTEGRATION_NAME = "google.contacts"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "myme-scheduled-poll-google-contacts-staging"

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "myme-scheduled-poll-google-contacts-staging-dlq"

[[env.staging.queues.producers]]
binding = "REACTIVE_RUN_DLQ_QUEUE"
queue = "myme-reactive-run-google-contacts-staging-dlq"

[[env.staging.queues.consumers]]
queue = "myme-scheduled-poll-google-contacts-staging"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "myme-scheduled-poll-google-contacts-staging-dlq"

[[env.staging.queues.consumers]]
queue = "myme-reactive-run-google-contacts-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "myme-reactive-run-google-contacts-staging-dlq"

# ---- Prod -----------------------------------------------------------------
[env.prod]
name = "myme-integration-google-contacts-prod"

[env.prod.vars]
INTEGRATION_NAME = "google.contacts"
MANIFEST_CRON = "*/10 * * * *"
ENVIRONMENT = "prod"

[[env.prod.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.prod.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "myme-scheduled-poll-google-contacts-prod"

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "myme-scheduled-poll-google-contacts-prod-dlq"

[[env.prod.queues.producers]]
binding = "REACTIVE_RUN_DLQ_QUEUE"
queue = "myme-reactive-run-google-contacts-prod-dlq"

[[env.prod.queues.consumers]]
queue = "myme-scheduled-poll-google-contacts-prod"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "myme-scheduled-poll-google-contacts-prod-dlq"

[[env.prod.queues.consumers]]
queue = "myme-reactive-run-google-contacts-prod"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "myme-reactive-run-google-contacts-prod-dlq"
