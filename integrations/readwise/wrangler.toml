#:schema node_modules/wrangler/config-schema.json
# Per-Integration Worker for readwise.
#
# Single trigger type — schedule (hourly Export API sweep; highlights
# aren't time-critical, the slower cadence saves Readwise rate-limit
# budget). The Worker consumes:
#
#   - a per-integration scheduled-poll queue
#
# Deliberately NO reactive-run queue (no `item-event` trigger; the
# integration is inbound-only) and NO webhook-receipt queue (Readwise
# offers no webhook surface).

name = "marfa-integration-readwise"
main = "src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
# `account_id` omitted — Wrangler reads CLOUDFLARE_ACCOUNT_ID from env.

# No public HTTP surface. The control plane reaches this Worker over a
# Service Binding; queue delivery and Durable Object alarms never touch
# a hostname. A `workers.dev` name would therefore only ever serve
# unsolicited traffic.
#
# Both keys are required. Wrangler defaults `preview_urls` from the
# same "are there routes?" test `workers_dev` defaults from, not from
# `workers_dev` itself, so setting only the first leaves per-version
# `<version>-<name>.<subdomain>.workers.dev` hostnames serving the Worker.
workers_dev = false
preview_urls = false

[vars]
INTEGRATION_NAME = "readwise"
MANIFEST_CRON = "0 * * * *"
ENVIRONMENT = "dev"

[[durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# ---- Staging --------------------------------------------------------------
[env.staging]
name = "marfa-integration-readwise-staging"
workers_dev = false
preview_urls = false

[env.staging.vars]
INTEGRATION_NAME = "readwise"
MANIFEST_CRON = "0 0 * * *"
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-readwise-staging"

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-readwise-staging-dlq"

[[env.staging.queues.consumers]]
queue = "marfa-scheduled-poll-readwise-staging"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-readwise-staging-dlq"

# ---- Prod -----------------------------------------------------------------
[env.prod]
name = "marfa-integration-readwise-prod"
workers_dev = false
preview_urls = false

[env.prod.vars]
INTEGRATION_NAME = "readwise"
MANIFEST_CRON = "0 * * * *"
ENVIRONMENT = "prod"

[[env.prod.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.prod.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-readwise-prod"

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-readwise-prod-dlq"

[[env.prod.queues.consumers]]
queue = "marfa-scheduled-poll-readwise-prod"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-readwise-prod-dlq"

# Secrets (`wrangler secret put --env <env>`):
#   - MARFA_API_URL
#   - MARFA_RUNTIME_CONTROL_URL
#   - MARFA_RUNTIME_BROKER_KEY
