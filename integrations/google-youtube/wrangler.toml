#:schema node_modules/wrangler/config-schema.json
# Per-Integration Worker for google.youtube (YouTube Data API v3).
#
# Single trigger type — schedule (hourly sweep across likes,
# subscriptions, and user-created playlists). One queue family —
# scheduled-poll + DLQ. NO reactive-run queue (no item-event
# trigger; this integration is inbound-only). NO webhook-receipt
# queue (YouTube Data API has no push-notification surface for the
# liked-videos / subscriptions / playlists collections used here).

name = "marfa-integration-google-youtube"
main = "src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

# No public HTTP surface. The control plane reaches this Worker over a
# Service Binding; queue delivery and Durable Object alarms never touch
# a hostname. A `workers.dev` name would therefore only ever serve
# unsolicited traffic.
#
# Both keys are stated because `preview_urls` has no dependable
# default. Wrangler's deploy path resolves none locally: an unset
# value is dropped from the request body and the API decides. Its
# config schema documents a default of `false`, and the helper it
# mocks that API with computes a third answer. Left unset, per-version
# `<version>-<name>.<subdomain>.workers.dev` hostnames can keep
# serving the Worker.
workers_dev = false
preview_urls = false

[vars]
INTEGRATION_NAME = "google.youtube"
MANIFEST_CRON = "0 * * * *"
ENVIRONMENT = "dev"

[[durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

# ---- Staging --------------------------------------------------------------
[env.staging]
name = "marfa-integration-google-youtube-staging"
workers_dev = false
preview_urls = false

[env.staging.vars]
INTEGRATION_NAME = "google.youtube"
MANIFEST_CRON = "0 0 * * *"
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-google-youtube-staging"

[[env.staging.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-google-youtube-staging-dlq"

[[env.staging.queues.consumers]]
queue = "marfa-scheduled-poll-google-youtube-staging"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-google-youtube-staging-dlq"

# ---- Prod -----------------------------------------------------------------
[env.prod]
name = "marfa-integration-google-youtube-prod"
workers_dev = false
preview_urls = false

[env.prod.vars]
INTEGRATION_NAME = "google.youtube"
MANIFEST_CRON = "0 * * * *"
ENVIRONMENT = "prod"

[[env.prod.durable_objects.bindings]]
name = "PER_CONNECTION_STATE"
class_name = "PerConnectionState"

[[env.prod.migrations]]
tag = "v1"
new_sqlite_classes = ["PerConnectionState"]

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_QUEUE"
queue = "marfa-scheduled-poll-google-youtube-prod"

[[env.prod.queues.producers]]
binding = "SCHEDULED_POLL_DLQ_QUEUE"
queue = "marfa-scheduled-poll-google-youtube-prod-dlq"

[[env.prod.queues.consumers]]
queue = "marfa-scheduled-poll-google-youtube-prod"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 6
dead_letter_queue = "marfa-scheduled-poll-google-youtube-prod-dlq"

# Secrets (`wrangler secret put --env <env>`):
#   - MARFA_API_URL
#   - MARFA_RUNTIME_CONTROL_URL
#   - MARFA_WORKER_IDENTITY_KEY
#         This Worker's own identity, derived by the operator as
#         HMAC-SHA256(MARFA_WORKER_IDENTITY_SECRET, INTEGRATION_NAME).
#         Presented to the control plane's lease broker, and required on
#         every inbound call to this Worker's fetch surface.
#         Set it with infra/cloudflare/scripts/init-integration-worker-secrets.sh,
#         which derives it from the config's INTEGRATION_NAME.
#         NOT the platform broker key this replaced: that key mints
#         against any Connection in any tenant and never reaches a Worker.
#
# Required for the queue consumer to mint per-Connection runtime
# credentials via the control plane's `/lease/:connection_id/runtime`
# broker. Without them the consumer throws on first dispatch and the
# error surfaces only via console.error. Use the helper at
# `infra/cloudflare/scripts/init-integration-worker-secrets.sh` to
# set all three from your local secrets.env on first deploy.
