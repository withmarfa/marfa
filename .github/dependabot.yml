version: 2
updates:
  # One npm entry at the workspace root, not one per package.
  #
  # This repository is a single pnpm workspace with one lockfile at the root.
  # A job that runs at `/` reads `pnpm-workspace.yaml`, expands the globs in
  # it, and pulls in every member manifest, so the root already covers every
  # package. Naming the members separately buys no coverage. It makes one job
  # walk the same workspace once per directory.
  #
  # Naming members is not a way to widen coverage, and it costs. Each named
  # directory is another pass over the same workspace, and enough of them
  # kill the run at Dependabot's time limit, which is fixed on GitHub's side
  # and cannot be raised. The only lever is how much work the job does, so
  # it walks the workspace once.
  #
  # The root entry is also the one that cannot go stale: a package added to
  # `pnpm-workspace.yaml` is covered with no change here. Its one gap is an
  # npm manifest placed outside the workspace, which would need an entry of
  # its own. There is none today.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Two groups rather than one bucket of everything. A single `*` group
    # puts every bump behind one review, majors included, and such a pull
    # request does not get merged. Minor and patch updates usually land
    # together on a green run; majors have to be read one at a time and
    # should not hold the rest hostage.
    #
    # Order is load-bearing. A dependency joins the first group it matches, so
    # the minor and patch group has to come first for the major group to
    # receive anything.
    #
    # This split is about mergeability, not about the time limit. It adds one
    # more pass to the job rather than removing any; the single directory
    # above is what pays for it.
    groups:
      npm-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"
    # Two groups can hold two pull requests open at once, and the limit counts
    # every open version-update pull request from this entry rather than one
    # per group. A limit of one lets whichever group runs first starve the
    # other for as long as its pull request stays open.
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # Two esbuild advisories that no published version can satisfy, both
      # reached only through a parent that pins the vulnerable line.
      #
      # GHSA-g7r4-m6w7-qqqr, arbitrary file read from the development server
      # on Windows, patched in 0.28.1. It arrives through `tsup`, whose
      # current release declares `esbuild: ^0.27.0` and therefore cannot
      # admit the fix. Revisit when tsup widens that range.
      #
      # GHSA-67mh-4wv8-2f99, the development server answering requests from
      # any website, patched in 0.25.0. It arrives through `drizzle-kit` ->
      # `@esbuild-kit/esm-loader` -> `@esbuild-kit/core-utils`, which pins
      # `esbuild: ~0.18.20`. Both `@esbuild-kit` packages are deprecated
      # ("Merged into tsx") and drizzle-kit's current release still depends
      # on them, so there is nothing to upgrade to. Revisit when drizzle-kit
      # drops them.
      #
      # Neither is an exposure here. Both require running esbuild's
      # development server, and neither parent starts one: tsup uses esbuild
      # to bundle, and the esbuild-kit chain is a module loader for a
      # migration CLI. Nothing ships either to a browser or serves from
      # them. Forcing a patched version through an override would put tsup
      # outside its own declared range, which trades a non-exposure for a
      # real build risk.
      #
      # Scoped to the one package deliberately. A broader ignore would hide
      # esbuild advisories that do matter, including any that reach a
      # version we can actually move.
      - dependency-name: "esbuild"
      # TypeScript majors, because `typescript-eslint` declares
      # `typescript: >=4.8.4 <6.1.0`. Taking TypeScript 7 trades the compiler
      # upgrade for losing lint entirely, which is the wrong way round.
      #
      # Grouping does not cover this. A major nothing can accept sits in the
      # major group and takes every other major down with it, so the block
      # belongs where the update is proposed rather than being rediscovered
      # on each pull request. Minor and patch releases of the current major
      # still flow.
      #
      # Lift it when `npm view typescript-eslint peerDependencies` shows a
      # range admitting 7.x, and only once lint passes on the new compiler.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
