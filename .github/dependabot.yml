version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/server"
      - "/packages/sdk"
      - "/packages/shared"
      - "/packages/types"
    schedule:
      interval: "monthly"
    groups:
      all-npm:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
