name: Sync openapi.json to docs

# Copies the canonical openapi.json from withmarfa/marfa to withmarfa/docs whenever
# it changes on main. Opens (or updates) a pull request on a stable branch
# `sync/openapi-spec` in the docs repo — never commits directly. Re-runs with
# no spec change are a no-op: peter-evans/create-pull-request does not open
# empty PRs and does not push an empty commit.
#
# Auth: requires a fine-grained PAT stored as the `DOCS_SYNC_TOKEN` repo
# secret. Scope: repository `withmarfa/docs`, permissions `Contents: write` and
# `Pull requests: write`.

on:
  push:
    branches: [main]
    paths:
      - openapi.json
  workflow_dispatch:

concurrency:
  group: sync-openapi-to-docs
  cancel-in-progress: false

env:
  # Named once rather than at each use. The drift guard beside this one
  # already reads the target repository from a variable of this name, and
  # the two workflows are a pair: one writes the published spec and the
  # other checks it.
  SPEC_TARGET_REPO: withmarfa/docs

jobs:
  sync:
    name: Sync openapi.json to withmarfa/docs
    timeout-minutes: 10
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout marfa (source of truth)
        uses: actions/checkout@v7

      - name: Checkout the docs repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SPEC_TARGET_REPO }}
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          path: docs-repo
          ref: main

      - name: Copy openapi.json into docs checkout
        run: cp openapi.json docs-repo/openapi.json

      - name: Open / update docs PR
        id: docs_pr
        uses: peter-evans/create-pull-request@v8
        with:
          path: docs-repo
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          branch: sync/openapi-spec
          delete-branch: true
          commit-message: "chore: sync openapi.json from marfa"
          title: "chore: sync openapi.json from marfa"
          body: |
            Automated sync of `openapi.json` from withmarfa/marfa.

            Source commit: `${{ github.sha }}`
            Triggered by workflow run ${{ github.run_id }}.

      # Nothing merged the pull request this workflow opens, so the published
      # reference sat behind whatever landed here until somebody noticed. The
      # daily drift guard then failed most mornings, correctly, which is the
      # worse half: a check that is red as its normal state has stopped being
      # a signal, and the day the difference is something other than an
      # unmerged sync it looks identical to the days before it.
      #
      # Nothing here wants a human. The docs ruleset requires a pull request,
      # so this cannot commit to `main` directly, but it requires zero
      # approvals and one status check, which this pull request runs itself.
      # The gap was only that nobody asked for the merge.
      #
      # Auto-merge rather than a merge: it waits for the required check, so a
      # spec that fails validation in the docs repository stays open for a
      # person instead of being forced in.
      - name: Let the sync merge itself once its check passes
        # A run where the spec has not changed opens nothing, and
        # create-pull-request then reports an empty number. Skipping is the
        # whole handling: a sync that went red on "nothing to do" would be a
        # new false alarm in place of the one this removes.
        if: steps.docs_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
          PR: ${{ steps.docs_pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail

          if gh pr merge "$PR" --repo "${SPEC_TARGET_REPO}" --squash --auto; then
            echo "Auto-merge requested on ${SPEC_TARGET_REPO}#$PR."
            exit 0
          fi

          # Already enabled is the ordinary case on a re-run against a pull
          # request this workflow opened earlier, and it is the outcome we
          # wanted rather than something to repair. Asked of the pull request
          # itself rather than inferred from the command's exit code, because
          # the two failures worth separating look identical from outside:
          # nothing to do, and a token that cannot do it.
          if gh pr view "$PR" --repo "${SPEC_TARGET_REPO}" \
               --json autoMergeRequest -q '.autoMergeRequest.enabledAt' \
             | grep -q .; then
            echo "Auto-merge was already enabled on ${SPEC_TARGET_REPO}#$PR."
            exit 0
          fi

          echo "::error title=The sync opened a pull request nobody will merge::Could not enable auto-merge on ${SPEC_TARGET_REPO}#$PR. The published reference drifts from this spec until somebody merges it by hand, and the daily drift guard will say so tomorrow morning."
          exit 1
