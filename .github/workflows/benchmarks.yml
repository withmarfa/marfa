name: Benchmarks

# The conformance suite's performance, load and hydration projects, and the
# scale benchmark, against the Rust server, off the gate: their budgets measure a shared runner as much as the server, so a
# slow night should not block a merge, but a failure still has to land
# somewhere it is seen. A scheduled run that fails opens an issue, or
# comments on the one that is open.
on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      send_report:
        description: Send the figures to PostHog, as the schedule does.
        type: boolean
        default: false

# A run is never cancelled for a newer one: a dispatch on `main` while the
# night is running would otherwise end it halfway, and the night's figures,
# which the next night is compared with, would be lost. A newer run waits for
# the running one (GitHub keeps only the latest waiting).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The program a person runs: the release build with the file readers linked
  # in and no test hooks, built the way `Rust server (release build)` builds
  # it in `ci.yml`. The figures are those of a program with no clock shim or
  # fault routes, and the suites below set what the hooks would have
  # (`CONFORMANCE_SERVER_HOOK_FREE=true`: the boot turns the limiter and file reading
  # off through `PATCH /config`).
  server:
    name: Rust server (release build)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Choose the folder for downloads and results
        run: echo "MARFA_NATIVE_ROOT=$RUNNER_TEMP/marfa-native" >> "$GITHUB_ENV"
      - name: Key the cache on the pins, the patches and the build scripts
        id: key
        run: echo "key=marfa-native-$RUNNER_OS-${{ hashFiles('core/marfa-enrichment/native/manifest.txt', 'core/marfa-enrichment/native/patches/**', 'core/marfa-enrichment/native/build.sh', 'core/marfa-enrichment/native/pdfium.sh', 'core/marfa-enrichment/native/tesseract.sh', 'core/marfa-enrichment/native/models.sh', 'core/marfa-enrichment/native/lib.sh', 'core/marfa-enrichment/native/linux/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the downloads and the PDFium library
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/marfa-native/downloads
            ${{ runner.temp }}/marfa-native/archives
          key: ${{ steps.key.outputs.key }}
      - name: Make the build image
        uses: ./.github/actions/native-build-image
      - name: Build the Rust server
        run: core/marfa-enrichment/native/release.sh "$TARGET" --server
      # An input of the jobs below, so it is kept on success.
      - name: Keep the server
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-server
          path: ${{ runner.temp }}/marfa-native/out/${{ env.TARGET }}/marfa-server
          if-no-files-found: error
          retention-days: 1

  benchmarks:
    name: Performance, load and hydration
    needs: server
    timeout-minutes: 100
    runs-on: ubuntu-latest
    env:
      CONFORMANCE_SERVER_HOOK_FREE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-server
          path: ${{ runner.temp }}/benchmark-server
      - name: Name the server under test
        run: |
          chmod +x "$RUNNER_TEMP/benchmark-server/marfa-server"
          echo "MARFA_SERVER_BIN=$RUNNER_TEMP/benchmark-server/marfa-server" >> "$GITHUB_ENV"

      # One server for the whole job, which a long suite can leave quiet for
      # longer than the harness's idle limit.
      - name: Boot the server
        working-directory: conformance
        env:
          CONFORMANCE_SERVER_IDLE_MS: "0"
        run: |
          pnpm marfa:up --state "$RUNNER_TEMP/marfa"
          cat "$RUNNER_TEMP/marfa/env" >> "$GITHUB_ENV"

      - name: Performance
        working-directory: conformance
        run: pnpm test:performance

      # Runs after a failed performance step too, so one night reports both.
      - name: Load
        if: ${{ !cancelled() }}
        working-directory: conformance
        run: pnpm test:load

      # After the load suites, which share the server, and apart from the
      # build above: the binary is a release build, since a debug build would
      # measure the build, and a failed compile must not keep the server's
      # own benchmarks from reporting.
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !cancelled() }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !cancelled() }}
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the device
        if: ${{ !cancelled() }}
        working-directory: core
        run: cargo build --locked --release -p marfa-cli

      # A device filling a large image library, not a gate: it fails only
      # when a hydration fails. Its report, `hydration.json`, lands beside
      # the load reports. Each set is 100,000 rows; the set with thumbnails
      # takes most of the time, which the job's timeout allows for.
      - name: Hydration
        if: ${{ !cancelled() }}
        working-directory: conformance
        env:
          MARFA_DEVICE_BIN: ${{ github.workspace }}/core/target/release/marfa
          MARFA_HYDRATION_ROWS: "100000"
        run: pnpm test:hydration

      - name: Keep the load reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: load-reports
          path: conformance/reports/load/
          if-no-files-found: ignore

      # Before the stop, because `marfa:down` clears the state directory and
      # the log is in it.
      - name: Keep the server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: marfa-server-log
          path: |
            ${{ runner.temp }}/marfa/server.log
            ${{ runner.temp }}/marfa/server.stderr
          if-no-files-found: ignore

      - name: Stop the server
        if: always()
        working-directory: conformance
        run: pnpm marfa:down --state "$RUNNER_TEMP/marfa"

  # What a person feels on a large instance, and the figures kept so a trend
  # can be read. Size and shape of the instance:
  #   - 250,000 items, the size the budgets were set at in the 2 November 2026
  #     scale test. MARFA_SCALE_ITEMS overrides it (1,000 or more).
  #   - 60% notes, 25% tasks and 15% bookmarks; about 40% carry one to three
  #     tags; 10% sit in the feed tier; at least 100,000 parent-of edges and
  #     about edges besides. A seeded generator makes every night the same.
  #   - Seeded in pages of 1,000 through /items/bulk and /edges/bulk.
  # After the server figures, the release `marfa` binary measures what a
  # person's machine does against that instance:
  #   - `device`: a copy of the whole instance, and a server change reaching a
  #     device that follows the event stream.
  #   - `folder`: the first sync of 10,000 generated, linked notes into the
  #     instance, with a key and a folder query of the folder's own. The first
  #     sync is stopped and counted as an error after 20 minutes.
  #   - `watch`: 30 edits timed from the file write to the new version on the
  #     server, then 10 quiet minutes of the watch's CPU and memory. It is
  #     inotify here, where a Mac uses FSEvents.
  # Each of these stops only the processes it started, by process ID, and keeps
  # what it measured if one hangs. Every measuring step has a limit of its own,
  # and they add up, with room for the report, the upload and the verdict, to
  # no more than the job's. On the Rust server the seed took 5 minutes and the
  # whole run about 12 on a Mac; a hosted runner is slower, and the first
  # night's own figures set the limits down further; the device and folder steps stay above their
  # own 20-minute stops.
  # Each step writes a fragment under conformance/reports/scale/, so a step
  # that crashes or times out keeps the figures of the others. The `finish`
  # step merges them, compares them with the previous night's artifact and
  # writes the table to the job summary. A figure over its ceiling fails the
  # night unless it is listed in KNOWN_OVER (conformance/src/utils/scale/
  # figures.ts) against an open issue.
  # Hosted runners vary by more than the ceilings allow, so the night's own
  # `seed_rate` says how slow the host was. When a whole seed ran well under a
  # fast night's rate, a figure over a time ceiling is shown as not judged, up
  # to a bound, and does not fail the night. Errors, a missing measurement,
  # memory and size still fail it, and a partial seed excuses nothing.
  scale:
    name: Scale
    needs: server
    timeout-minutes: 180
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      # The memory and restart figures are of the release server a person runs,
      # built by the `server` job. It has no test hooks (clock shim, fault
      # routes), which nothing here uses.
      CONFORMANCE_SERVER_HOOK_FREE: "true"
      MARFA_DEVICE_BIN: ${{ github.workspace }}/core/target/release/marfa
    steps:
      # A step, since a job's `env` cannot read the `runner` context. No `..`
      # in it: `upload-artifact` refuses such a path.
      - name: Name the state directory
        run: echo "MARFA_SCALE_STATE=$RUNNER_TEMP/marfa-scale" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-server
          path: ${{ runner.temp }}/benchmark-server
      - name: Name the server under test
        run: |
          chmod +x "$RUNNER_TEMP/benchmark-server/marfa-server"
          echo "MARFA_SERVER_BIN=$RUNNER_TEMP/benchmark-server/marfa-server" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the device
        timeout-minutes: 10
        working-directory: core
        run: cargo build --locked --release -p marfa-cli

      - name: Boot the server
        timeout-minutes: 2
        working-directory: conformance
        run: pnpm marfa:up --state "$MARFA_SCALE_STATE"

      - name: Seed
        timeout-minutes: 30
        working-directory: conformance
        run: pnpm scale seed
      - name: Restart
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        working-directory: conformance
        run: pnpm scale restart
      - name: Reads
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        working-directory: conformance
        run: pnpm scale reads
      - name: Reads during bulk writes
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        working-directory: conformance
        run: pnpm scale bulk
      - name: Parent-of writes
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        working-directory: conformance
        run: pnpm scale edges
      - name: Archive export
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: conformance
        run: pnpm scale export
      - name: Storage
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        working-directory: conformance
        run: pnpm scale storage
      # Each of these has a limit of its own inside the script; the step limit
      # is only a backstop that ends the step if the script itself hangs.
      - name: Device copy and follow
        if: ${{ !cancelled() }}
        timeout-minutes: 23
        working-directory: conformance
        run: pnpm scale device
      - name: Folder first sync
        if: ${{ !cancelled() }}
        timeout-minutes: 23
        working-directory: conformance
        run: pnpm scale folder
      - name: Folder watch
        if: ${{ !cancelled() }}
        timeout-minutes: 17
        working-directory: conformance
        run: pnpm scale watch

      # Last, so the object store's settings (written to GITHUB_ENV) reach
      # only this step, and the figures above are of a server without one.
      - name: Put an object store beside a second server
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        working-directory: conformance
        run: |
          curl --fail --location --retry 3 https://garagehq.deuxfleurs.fr/_releases/v2.4.1/x86_64-unknown-linux-musl/garage -o "$RUNNER_TEMP/garage-bin"
          sudo install -m 755 "$RUNNER_TEMP/garage-bin" /usr/local/bin/garage
          pnpm garage:up --state "$RUNNER_TEMP/garage"
      - name: Memory with an object store
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        working-directory: conformance
        run: pnpm scale store
      - name: Stop the object store
        if: always()
        working-directory: conformance
        run: pnpm garage:down --state "$RUNNER_TEMP/garage"

      - name: Merge, compare and report
        if: ${{ !cancelled() }}
        working-directory: conformance
        env:
          GH_TOKEN: ${{ github.token }}
          MARFA_POSTHOG_HOST: ${{ secrets.MARFA_POSTHOG_HOST }}
          MARFA_POSTHOG_PROJECT_TOKEN: ${{ secrets.MARFA_POSTHOG_PROJECT_TOKEN }}
          MARFA_SCALE_SEND_REPORT: ${{ inputs.send_report }}
        run: pnpm scale finish

      # Kept whatever the verdict: the next night reads it to show a change.
      - name: Keep the scale figures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: scale-figures
          path: conformance/reports/scale/figures.json
          retention-days: 90
          if-no-files-found: ignore

      # Before the log and the stop: a night that fails only on its figures
      # keeps the log too, and `marfa:down` clears the state directory.
      - name: Judge the night
        if: ${{ !cancelled() }}
        working-directory: conformance
        run: pnpm scale judge

      - name: Keep the server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: marfa-scale-server-log
          path: |
            ${{ env.MARFA_SCALE_STATE }}/server.log
            ${{ env.MARFA_SCALE_STATE }}/server.stderr
          if-no-files-found: ignore

      - name: Stop the server
        if: always()
        working-directory: conformance
        run: pnpm marfa:down --state "$MARFA_SCALE_STATE"

  report-failure:
    name: Report a failed scheduled run
    needs: [server, benchmarks, scale]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/report-nightly-failure.sh
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/report-nightly-failure.sh
