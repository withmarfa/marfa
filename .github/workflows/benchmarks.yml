name: Benchmarks

# The conformance suite's performance, load and hydration projects, off the
# gate: their budgets measure a shared runner as much as the server, so a
# slow night should not block a merge, but a failure still has to land
# somewhere it is seen. A scheduled run that fails opens an issue, or
# comments on the one that is open.
on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmarks:
    name: Performance, load and hydration
    timeout-minutes: 100
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@withmarfa/server..." build

      - name: Witness concurrent HTTP reads
        run: pnpm exec vitest run packages/server/src/read-concurrency.test.ts

      - name: Boot the server from this checkout
        working-directory: conformance
        run: |
          pnpm marfa:up --state "$RUNNER_TEMP/marfa"
          cat "$RUNNER_TEMP/marfa/env" >> "$GITHUB_ENV"

      - name: Performance
        working-directory: conformance
        run: pnpm test:performance

      # Runs after a failed performance step too, so one night reports both.
      - name: Load
        if: ${{ !cancelled() }}
        working-directory: conformance
        run: pnpm test:load

      # After the load suites, which share the server, and apart from the
      # build above: the binary is a release build, since a debug build would
      # measure the build, and a failed compile must not keep the server's
      # own benchmarks from reporting.
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !cancelled() }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !cancelled() }}
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the device
        if: ${{ !cancelled() }}
        working-directory: core
        run: cargo build --locked --release -p marfa-cli

      # A device filling a large image library, not a gate: it fails only
      # when a hydration fails. Its report, `hydration.json`, lands beside
      # the load reports. Each set is 100,000 rows; the set with thumbnails
      # takes most of the time, which the job's timeout allows for.
      - name: Hydration
        if: ${{ !cancelled() }}
        working-directory: conformance
        env:
          MARFA_DEVICE_BIN: ${{ github.workspace }}/core/target/release/marfa
          MARFA_HYDRATION_ROWS: "100000"
        run: pnpm test:hydration

      - name: Keep the load reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: load-reports
          path: conformance/reports/load/
          if-no-files-found: ignore

      # Before the stop, because `marfa:down` clears the state directory and
      # the log is in it.
      - name: Keep the server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: marfa-server-log
          path: |
            ${{ runner.temp }}/marfa/server.log
            ${{ runner.temp }}/marfa/server.stderr
          if-no-files-found: ignore

      - name: Stop the server
        if: always()
        working-directory: conformance
        run: pnpm marfa:down --state "$RUNNER_TEMP/marfa"

  report-failure:
    name: Report a failed scheduled run
    needs: [benchmarks]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/report-nightly-failure.sh
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/report-nightly-failure.sh
