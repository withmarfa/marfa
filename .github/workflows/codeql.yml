name: CodeQL

# A pull request or a push to `main` that changes only documentation, the
# license or agent instructions, settings and hooks starts no run. CodeQL is
# not a required check, so a run that never starts leaves no check pending.
# A draft pull request is analyzed once it is marked ready for review, and on
# every push after that. The weekly run analyzes the whole tree.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".githooks/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".githooks/**"
      - ".github/ISSUE_TEMPLATE/**"
  schedule:
    - cron: "41 4 * * 1"

# Even with cancellation disabled, a shared group replaces older pending
# runs; non-PR runs need their own groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
