name: Release

# A release is a tag, and tags are the maintainer's. Pushing `v<version>`
# builds Marfa's Rust server from that commit, runs what it built, and
# publishes it: a GitHub release carrying three archives, `marfa-<version>-`
# `darwin-arm64`, `-linux-x86_64` and `-linux-aarch64`, each holding `marfa`,
# `marfa-server` and `NOTICES.txt`, with one checksum file for them and the two
# npm packages `@withmarfa/core` and `@withmarfa/client`; and the server image
# `ghcr.io/withmarfa/marfa-server` for linux/amd64 and linux/arm64, made from
# the Linux archives' own programs. The macOS programs are signed with the
# maintainer's Developer ID and notarized, and the signed server is made to
# read a text file, a PDF and a picture; the Linux programs are static, so
# they run on any distribution, and each runs on its own architecture before a
# release is made. There is no Intel Mac build. A release is not published
# unless every archive and the image built and ran, and the install proof held:
# on a clean runner of each platform the collected archives go through
# `scripts/install.sh` and `marfa server install` (the image too, on Linux)
# behind HTTPS, in a dry run as in a release, and nothing is published by it.
#
# The Homebrew formula is written every run and held with the release's files.
# It is pushed to `withmarfa/homebrew-tap` only when the repository variable
# `HOMEBREW_TAP` is `publish`; otherwise the tap job says so and pushes nothing.
#
# A dispatch with a `version` is a dry run: it runs the same builds and checks
# a tag would, the image's included, and skips only the publish job, the
# tap job and the image's push. It is how the workflow is exercised without a
# tag, which only the maintainer makes; the tag path reads the version off the
# tag and never off an input.
#
# The version is the tag's, and nowhere else: `scripts/release/stamp-version.sh`
# writes it into every manifest in this checkout, which is why no manifest in
# the repository holds one (`ci/version-fields.test.ts`). Each version is the
# one before it plus 0.0.1, from 0.0.70, the first Rust release, which may
# follow any released version below it; the last TypeScript release is 0.0.66,
# and this workflow releases nothing below 0.0.70.
#
# The TypeScript server's emergency path: a fix to it is released from a branch
# made at `v0.0.66`, whose own `release.yml` builds and publishes it, because
# GitHub runs the workflow of the tagged commit. Dispatch `ci.yml` on that
# branch first, so that the release's CI check passes.
#
# The image is built and booted on a runner of each platform, and for a tag
# each runner pushes it untagged, by digest, and boots the pushed digest. The
# publish job then tags one manifest for both, `<version>` and `latest`, and
# boots the tag as a stranger pulls it, signed out, after the draft release
# and before npm. The registry is written with the job's own token,
# `packages: write`.
#
# npm publishes by trusting this workflow's OIDC identity, with no stored
# token; the GitHub release uses the job's own token. Trusted publishing is
# configured per package at npmjs.com for `@withmarfa/core` and
# `@withmarfa/client`, and only on a package that already exists. Each
# package's first version is published by hand from a run's artifacts, its
# trusted publisher configured, and only then does this workflow publish
# it. A tag before that stops at the publish job's preflight, which names
# the package it cannot publish, with nothing sent.
#
# Each trusted publisher names the owner `withmarfa`, the repository
# `marfa`, the workflow `release.yml` and no environment, and must allow
# `npm publish`. The registry does not check the ref: this file's condition
# on the publish job keeps publication to tags. A branch that edits it can
# publish, so only the maintainer's tags reach it and it is reviewed like code.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "The version a tag would carry, for a dry run that publishes nothing"
        required: true

# Never cancel a release in flight. The key is per ref, so a second push of
# the same tag queues behind the first; two different tags run side by side.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 2

permissions:
  contents: read

jobs:
  require-green-ci:
    name: Require green CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # A tag has to point at a commit that went through `ci.yml` on `main`.
      # A pull request's head passes `ci.yml` too, and under squash merges it
      # never reaches `main`, so the run asked for is a push to `main`, not
      # any green run on the SHA. Verifying that run is stronger than
      # recomputing it here: the steps below would pass against the tag's
      # own tree either way. A dispatch on the tag also counts: like a push to
      # `main`, it runs the tree as it is, which a pull request's head did not.
      #
      # A dry run publishes nothing, so it asks only that `ci.yml` passed at
      # the commit by any event, which lets a branch that changes this
      # workflow dry-run it before it merges.
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          query="head_sha=$GITHUB_SHA&status=success"
          filter='.workflow_runs | length'
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            filter='[.workflow_runs[] | select((.event == "push" and .head_branch == "main") or .event == "workflow_dispatch")] | length'
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?$query&per_page=100" --jq "$filter")
          if [ "${runs:-0}" -lt 1 ]; then
            echo "::error::No successful ci.yml run for $GITHUB_SHA ($query). A release refuses a commit that has not passed CI."
            exit 1
          fi
          echo "ci.yml is green for $GITHUB_SHA ($query)"

  version:
    name: Read the version
    needs: require-green-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Read through the environment and held to the version grammar before
      # anything uses it: a ref name or an input may carry characters a shell
      # would act on if it were substituted into a script.
      - name: Read the version off the tag
        id: version
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$DRY_RUN_VERSION"
            echo "a dry run: the version is the input's, and nothing is published"
          else
            ref="${GITHUB_REF#refs/tags/}"
            if [ "$ref" = "$GITHUB_REF" ]; then
              echo "::error::A release runs at a tag ref; $GITHUB_REF is not one."
              exit 1
            fi
            version="${ref#v}"
          fi
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The tag names no major.minor.patch version."
            exit 1
          fi
          # Each version is the one before it plus 0.0.1, and the first is
          # 0.0.1, so every version is 0.0.N, follows the highest 0.0.M below
          # it, and has none released above it: a tag re-made in a gap is not
          # the next version. The tag being released is on the remote already,
          # so it is set aside. Read off the remote, which needs no history,
          # and never through a pipe whose empty answer would fail the step
          # unexplained.
          IFS=. read -r major minor patch <<< "$version"
          if [ "$major.$minor" != "0.0" ]; then
            echo "::error::$version is not 0.0.N; every version steps by 0.0.1."
            exit 1
          fi
          # The first Rust release, the one version that may leave a gap; main
          # releases nothing below it.
          first_rust=70
          if [ "$patch" -lt "$first_rust" ]; then
            echo "::error::$version is below 0.0.$first_rust, the first Rust release; this workflow releases only the Rust server."
            exit 1
          fi
          # Whether a version has a public release: "true", "false", or the
          # step fails, so a lookup that errs is never read as either.
          released() {
            local answer
            if answer=$(gh release view "v0.0.$1" --json isDraft --jq .isDraft 2>&1); then
              [ "$answer" = "false" ] && echo true || echo false
            elif grep -q "release not found" <<< "$answer"; then
              echo false
            else
              echo "::error::Could not ask whether 0.0.$1 is released: $answer" >&2
              return 1
            fi
          }
          remote_tags=$(git ls-remote --tags --refs origin 'refs/tags/v0.0.*')
          previous=-1
          above=()
          while read -r _ tag; do
            [ -n "$tag" ] || continue
            n="${tag#refs/tags/v0.0.}"
            [[ "$n" =~ ^(0|[1-9][0-9]*)$ ]] || continue
            if [ "$n" -lt "$patch" ] && [ "$n" -gt "$previous" ]; then previous="$n"; fi
            if [ "$n" -gt "$patch" ]; then above+=("$n"); fi
          done <<< "$remote_tags"
          # A version above this one that is only tagged is waiting on this
          # one, as two tags pushed together are; one that is released means
          # this tag was made in a gap.
          for n in "${above[@]}"; do
            state=$(released "$n")
            if [ "$state" = "true" ]; then
              echo "::error::0.0.$n is already released, so $version is not the next version."
              exit 1
            fi
          done
          expected=$((previous < 0 ? 1 : previous + 1))
          if [ "$patch" = "$first_rust" ] && [ "$previous" -ge 0 ]; then
            echo "$version is the first Rust release, so it may follow any released version below it."
          elif [ "$patch" != "$expected" ]; then
            echo "::error::$version does not follow the tags before it; the next version is 0.0.$expected."
            exit 1
          fi
          # The version before it has to be released, and this commit has to
          # come after that one's. Two tags pushed together would otherwise
          # run side by side, and a tag on an older commit of main would
          # release less than the version it follows. Asked of the API, which
          # needs no history in this shallow checkout. A compare that fails
          # fails the step rather than reading as either answer.
          if [ "$previous" -ge 0 ]; then
            state=$(released "$previous")
            if [ "$state" != "true" ]; then
              echo "::error::0.0.$previous is tagged but not released; release it before $version."
              exit 1
            fi
            relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/v0.0.$previous...$GITHUB_SHA" --jq .status)
            if [ "$relation" != "ahead" ]; then
              echo "::error::$GITHUB_SHA is $relation of v0.0.$previous; a release's commit comes after the one before it."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version from $GITHUB_SHA"

  # The programs for macOS, with the two npm packages, built unsigned. The
  # native readers are built from pinned sources by `build-programs.sh`, which
  # needs cmake and ninja on the Mac and the Rust version the pins name. A
  # cold PDFium build is the long part. Only `ci.yml` on `main` saves the
  # native cache, and only for x86_64 Linux, so this build is cold.
  programs-macos:
    name: Build the programs (macOS)
    needs: version
    runs-on: macos-26
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install cmake and ninja if the runner lacks them
        run: |
          missing=()
          for tool in cmake ninja; do
            command -v "$tool" > /dev/null || missing+=("$tool")
          done
          if [ "${#missing[@]}" -gt 0 ]; then brew install "${missing[@]}"; fi
          cmake --version | head -1
          echo "ninja $(ninja --version)"

      - name: Install the Rust version the native pins name
        run: |
          rust=$(awk '$1 == "toolchain" && $2 == "rust" { print $3 }' core/marfa-enrichment/native/manifest.txt)
          if [ -z "$rust" ]; then
            echo "::error::native/manifest.txt pins no Rust toolchain."
            exit 1
          fi
          rustup toolchain install "$rust" --profile minimal
          rustup default "$rust"
          rustc --version

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Choose the folder for downloads and results
        run: echo "MARFA_NATIVE_ROOT=$RUNNER_TEMP/marfa-native" >> "$GITHUB_ENV"
      - name: Key the cache on the pins, the patches and the build scripts
        id: key
        run: echo "key=marfa-native-$RUNNER_OS-${{ hashFiles('core/marfa-enrichment/native/manifest.txt', 'core/marfa-enrichment/native/patches/**', 'core/marfa-enrichment/native/build.sh', 'core/marfa-enrichment/native/pdfium.sh', 'core/marfa-enrichment/native/tesseract.sh', 'core/marfa-enrichment/native/models.sh', 'core/marfa-enrichment/native/lib.sh', 'core/marfa-enrichment/native/linux/**') }}" >> "$GITHUB_OUTPUT"
      # Restored from `main`, and saved only from `main`: a tag's own cache
      # could never be restored by another ref, and would only crowd out the
      # one that can.
      - name: Restore the downloads and the PDFium library
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/marfa-native/downloads
            ${{ runner.temp }}/marfa-native/archives
          key: ${{ steps.key.outputs.key }}

      # The stamp's `cargo update` runs offline, so it needs every crate the
      # lockfiles name already in the cargo cache. `--locked` refuses rather
      # than resolving anew.
      - name: Fetch the crates the lockfiles name
        run: |
          cargo fetch --locked --manifest-path core/Cargo.toml
          cargo fetch --locked --manifest-path core/bindings/swift/Cargo.toml

      # Before the install, because the install records every package's
      # version and the workspace refuses a script once one differs from
      # that record (`verifyDepsBeforeRun`). The lockfile holds no workspace
      # version, so a frozen install passes over the stamped manifests.
      - name: Stamp the version into every manifest
        run: bash scripts/release/stamp-version.sh "$VERSION"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Build and pack @withmarfa/core
        working-directory: core/bindings/node
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          pnpm --ignore-workspace install --frozen-lockfile
          pnpm --ignore-workspace run build
          pnpm --ignore-workspace pack --pack-destination "$RUNNER_TEMP/artifacts"
          bash "$GITHUB_WORKSPACE/scripts/release/hold-tarball.sh" "$RUNNER_TEMP/artifacts/withmarfa-core-$VERSION.tgz" \
            index.js index.d.ts marfa-core.darwin-arm64.node
          bash "$GITHUB_WORKSPACE/scripts/release/hold-platform.sh" "$RUNNER_TEMP/artifacts/withmarfa-core-$VERSION.tgz" \
            darwin arm64

      - name: Pack @withmarfa/client
        run: |
          pnpm --filter @withmarfa/client pack --pack-destination "$RUNNER_TEMP/artifacts"
          bash scripts/release/hold-tarball.sh "$RUNNER_TEMP/artifacts/withmarfa-client-$VERSION.tgz" \
            dist/index.js dist/index.d.ts

      # Each program is asked its version before it goes to be signed.
      - name: Build the programs
        run: |
          target=aarch64-apple-darwin
          bash scripts/release/build-programs.sh "$target"
          out="$MARFA_NATIVE_ROOT/out/$target"
          for program in marfa marfa-server; do
            reported=$("$out/$program" --version)
            if [ "$reported" != "$program $VERSION" ]; then
              echo "::error::$program reports '$reported', not '$program $VERSION'."
              exit 1
            fi
          done
          cp "$out/marfa" "$out/marfa-server" "$out/NOTICES.txt" "$RUNNER_TEMP/artifacts/"

      # The programs go to the sign job unsigned, beside the two packages.
      - name: Hold the build to the programs and the two packages
        working-directory: ${{ runner.temp }}/artifacts
        run: |
          bash "$GITHUB_WORKSPACE/scripts/release/hold-artifacts.sh" \
            NOTICES.txt marfa marfa-server \
            "withmarfa-client-$VERSION.tgz" "withmarfa-core-$VERSION.tgz"

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          retention-days: 1

  # Signing runs in a job of its own, which installs and builds nothing, so the
  # signing identity never shares a machine with the build's dependencies. A
  # dry run signs and notarizes too, so a change here is proved before a tag
  # depends on it.
  #
  # After notarizing, the programs are asked their version from the archive a
  # person unpacks, and the server unpacked from it reads a text file, a PDF
  # and a picture (`prove-reading.sh`). The server does not report how far its
  # reader was sandboxed, so the same script also runs the signed server as its
  # own reading child and requires the full sandbox in the child's first frame.
  sign:
    name: Sign the programs
    needs: [version, programs-macos]
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: build-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/build

      - name: Sign and notarize the programs
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for program in marfa marfa-server; do
            # An artifact keeps no file modes.
            chmod +x "$RUNNER_TEMP/build/$program"
            bash scripts/release/sign-binary.sh "$RUNNER_TEMP/build/$program"
          done

      - name: Pack the programs and run them from the archive
        run: |
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/artifacts"
          cp "$RUNNER_TEMP/build/marfa" "$RUNNER_TEMP/build/marfa-server" "$RUNNER_TEMP/build/NOTICES.txt" "$RUNNER_TEMP/pack/"
          bash scripts/release/pack-programs.sh "$RUNNER_TEMP/pack" "$RUNNER_TEMP/artifacts/marfa-$VERSION-darwin-arm64.tar.gz"
          bash scripts/release/check-archive.sh "$RUNNER_TEMP/artifacts/marfa-$VERSION-darwin-arm64.tar.gz" "$VERSION" --boot
          bash scripts/release/prove-reading.sh "$RUNNER_TEMP/artifacts/marfa-$VERSION-darwin-arm64.tar.gz" \
            core/marfa-enrichment/fixtures
          cp "$RUNNER_TEMP/build/withmarfa-client-$VERSION.tgz" "$RUNNER_TEMP/build/withmarfa-core-$VERSION.tgz" "$RUNNER_TEMP/artifacts/"

      # Exactly the three the collect job reads, by name: an upload that only
      # refuses an empty folder would carry a run missing one.
      - name: Hold the artifacts to the three this job makes
        working-directory: ${{ runner.temp }}/artifacts
        run: |
          bash "$GITHUB_WORKSPACE/scripts/release/hold-artifacts.sh" \
            "marfa-$VERSION-darwin-arm64.tar.gz" \
            "withmarfa-client-$VERSION.tgz" "withmarfa-core-$VERSION.tgz"

      - uses: actions/upload-artifact@v7
        with:
          name: signed-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          retention-days: 1

  # The programs for Linux, built in Docker on a runner of the architecture
  # `build-programs.sh` needs (x86_64) for each target, in a job of its own
  # apiece, because a cold PDFium build is the long part. Both targets are
  # linked statically against musl, which needs no particular glibc of the
  # machine they land on. Nothing is signed, so no secret is read. Each
  # archive is run on its own architecture by the `run-linux` job.
  programs-linux:
    name: Build the programs (${{ matrix.arch }} Linux)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            cache: marfa-native
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            cache: marfa-native-aarch64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      # The first build of a target asks for 40 GB of free disk, and the
      # runner starts with less. These are the toolchains it does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The host only fetches crates and stamps the version; the programs are
      # built in the pinned image.
      - name: Install the Rust version the native pins name
        run: |
          rust=$(awk '$1 == "toolchain" && $2 == "rust" { print $3 }' core/marfa-enrichment/native/manifest.txt)
          if [ -z "$rust" ]; then
            echo "::error::native/manifest.txt pins no Rust toolchain."
            exit 1
          fi
          rustup toolchain install "$rust" --profile minimal
          rustup default "$rust"
          rustc --version

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Stamp the version into every manifest
        run: |
          cargo fetch --locked --manifest-path core/Cargo.toml
          cargo fetch --locked --manifest-path core/bindings/swift/Cargo.toml
          bash scripts/release/stamp-version.sh "$VERSION"

      - name: Choose the folder for downloads and results
        run: echo "MARFA_NATIVE_ROOT=$RUNNER_TEMP/marfa-native" >> "$GITHUB_ENV"
      # The x86_64 key is the one `ci.yml`'s `Core native (x86_64 Linux)` job
      # saves from `main`, so that target restores its cache. Restored from
      # `main`, and saved only from `main`.
      - name: Key the cache on the pins, the patches and the build scripts
        id: key
        run: echo "key=${{ matrix.cache }}-$RUNNER_OS-${{ hashFiles('core/marfa-enrichment/native/manifest.txt', 'core/marfa-enrichment/native/patches/**', 'core/marfa-enrichment/native/build.sh', 'core/marfa-enrichment/native/pdfium.sh', 'core/marfa-enrichment/native/tesseract.sh', 'core/marfa-enrichment/native/models.sh', 'core/marfa-enrichment/native/lib.sh', 'core/marfa-enrichment/native/linux/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the downloads and the PDFium library
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/marfa-native/downloads
            ${{ runner.temp }}/marfa-native/archives
          key: ${{ steps.key.outputs.key }}

      # The arm64 programs are built here on x86_64 and read a sample under emulation.
      - name: Set up emulation for arm64
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build the programs
        run: bash scripts/release/build-programs.sh "$TARGET"

      - name: Pack the programs
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          bash scripts/release/pack-programs.sh "$MARFA_NATIVE_ROOT/out/$TARGET" \
            "$RUNNER_TEMP/artifacts/marfa-$VERSION-linux-${{ matrix.arch }}.tar.gz"

      - name: Hold the artifacts to the archive
        working-directory: ${{ runner.temp }}/artifacts
        run: |
          bash "$GITHUB_WORKSPACE/scripts/release/hold-artifacts.sh" \
            "marfa-$VERSION-linux-${{ matrix.arch }}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ needs.version.outputs.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          retention-days: 1

  # Each Linux archive on a runner of its own architecture, unpacked as a
  # person would: both programs report the version, and the server boots with
  # throwaway secrets and answers `/health`.
  run-linux:
    name: Run the programs (${{ matrix.arch }} Linux)
    needs: [version, programs-linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ needs.version.outputs.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/archive

      - name: Unpack the archive, ask the programs their version and boot the server
        run: bash scripts/release/check-archive.sh "$RUNNER_TEMP/archive/marfa-$VERSION-linux-${{ matrix.arch }}.tar.gz" "$VERSION" --boot

  # Everything a release carries, in one folder, with the checksum file for
  # the three archives, and the Homebrew formula the release would give the
  # tap, kept apart because it is not part of the release. Publishing waits for
  # this job, so a release with an archive missing is never made.
  collect:
    name: Collect the release
    needs: [version, sign, programs-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: signed-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/artifacts

      - uses: actions/download-artifact@v8
        with:
          pattern: linux-${{ needs.version.outputs.version }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts

      - name: Write the checksums
        working-directory: ${{ runner.temp }}/artifacts
        run: |
          bash "$GITHUB_WORKSPACE/scripts/release/write-checksums.sh" "marfa-$VERSION-checksums.txt" \
            "marfa-$VERSION-darwin-arm64.tar.gz" \
            "marfa-$VERSION-linux-aarch64.tar.gz" "marfa-$VERSION-linux-x86_64.tar.gz"

      - name: Write the Homebrew formula
        run: |
          mkdir -p "$RUNNER_TEMP/formula"
          bash scripts/release/write-formula.sh "$VERSION" "$RUNNER_TEMP/artifacts/marfa-$VERSION-checksums.txt" > "$RUNNER_TEMP/formula/marfa.rb"
          cat "$RUNNER_TEMP/formula/marfa.rb"

      # Exactly the six the publish job reads, by name.
      - name: Hold the artifacts to the six a release carries
        working-directory: ${{ runner.temp }}/artifacts
        run: |
          bash "$GITHUB_WORKSPACE/scripts/release/hold-artifacts.sh" \
            "marfa-$VERSION-checksums.txt" \
            "marfa-$VERSION-darwin-arm64.tar.gz" \
            "marfa-$VERSION-linux-aarch64.tar.gz" "marfa-$VERSION-linux-x86_64.tar.gz" \
            "withmarfa-client-$VERSION.tgz" "withmarfa-core-$VERSION.tgz"

      - name: Hold the formula
        working-directory: ${{ runner.temp }}/formula
        run: bash "$GITHUB_WORKSPACE/scripts/release/hold-artifacts.sh" marfa.rb

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: formula-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/formula/marfa.rb
          if-no-files-found: error

  # The server image, built from `deploy/Dockerfile` out of the release's own
  # Linux archives and booted on a runner of its own platform, so the arm64
  # image is the one that ran on arm64. Never pushed by a dry run. A tag pushes
  # each platform's image untagged, by digest, which names nothing a person
  # could pull: the tags come in the publish job, once everything else has
  # held. The push is the same build again, answered from the builder's cache,
  # so what was booted is what is pushed.
  image:
    name: Build the server image (${{ matrix.platform }})
    needs: [version, programs-linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/withmarfa/marfa-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: linux-${{ needs.version.outputs.version }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/archives

      - name: Lay out the build context from the release's archives
        run: bash scripts/release/image-context.sh "$RUNNER_TEMP/archives" "$VERSION" "$RUNNER_TEMP/image-context"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image-context
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: marfa-server:check
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Marfa server
            org.opencontainers.image.description=The Marfa server.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Boot it, ask it, stop it
        run: scripts/check-image.sh marfa-server:check "$VERSION"

      - name: Log in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image by digest
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image-context
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Marfa server
            org.opencontainers.image.description=The Marfa server.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}

      # The bytes the registry holds, by the digest it answered, booted on the
      # platform they were built for.
      - name: Boot the pushed image
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          scripts/check-image.sh "$IMAGE@$DIGEST" "$VERSION"

      - name: Hold the digest for the publish job
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The push of the $ARCH image answered no digest: '$DIGEST'."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - name: Upload the digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ needs.version.outputs.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error

  # What a person does with a release, on a clean runner of each platform and
  # with the files this run collected, not the ones a tag would publish:
  # `scripts/install.sh` installs them, `marfa server install` runs the server
  # as a service of the machine, Caddy puts HTTPS in front with a certificate
  # authority of its own, and the owner claims the instance on the private
  # socket. The Linux x86_64 runner does the install as root, with the system
  # unit and the `marfa` account, and again with Docker on an image built here
  # from the same archives. The arm64 runner runs a systemd user unit. A Mac
  # with Docker cannot run on GitHub, so Docker on a Mac is proved by hand.
  # It publishes nothing, and a release waits for it: an archive that does not
  # install is not a release.
  install-proof:
    name: Prove the install (${{ matrix.platform }})
    needs: [version, collect]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-26
            modes: native-user
          - platform: linux-x86_64
            runner: ubuntu-latest
            modes: native-root docker
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            modes: native-user
            # The runner's /home carries an access control list, which the server
            # refuses above its private socket.
            root: /var/tmp/marfa-proof
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MODES: ${{ matrix.modes }}
      MARFA_PROOF_ROOT: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/release

      - name: Install, claim and reach the server behind HTTPS
        run: |
          read -ra modes <<< "$MODES"
          bash scripts/release/install-proof.sh "$RUNNER_TEMP/release" "$VERSION" "${modes[@]}"

  # Never reached by a dry run. Ordered so a failure part way leaves what a
  # re-run of the same tag can finish, and never a version half out: the
  # preflight asks every registry what it holds, and every registry that
  # will be published to is shown to trust this run, before anything is
  # made; the draft release, which can be undone, comes next, and the image's
  # tags with their check; the npm registry, which never takes a version
  # back, comes after them; and the
  # release is made public only once everything is out. Every step asks
  # whether its version is already there and skips if it is, so a re-run
  # repeats nothing.
  #
  # Publishing needs the GitHub-hosted OIDC identity trusted by npm.
  #
  # The image's tags come right after the draft release and before npm, and
  # are checked signed out, so a private package or an image that will not
  # boot stops the release before any registry that never takes a version
  # back. The images themselves were pushed by the `image` jobs, which this
  # job waits for, so a push that failed has already stopped the release
  # before it was drafted. A package the first push created is private until
  # its visibility is set once in GitHub's package settings; the check fails
  # there, and re-running this job tags again, finds the tag made, and carries
  # on.
  publish:
    name: Publish
    needs: [version, collect, run-linux, image, install-proof]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/withmarfa/marfa-server
    steps:
      # Node 24's npm, rather than a newer one installed into a job that can
      # mint publishing identities. 11.5.1 is the first npm that publishes by
      # trusted publishing, so an older one stops the job here.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require an npm that publishes by OIDC
        run: |
          version=$(npm --version)
          if ! node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1);
          ' "$version"; then
            echo "::error::npm $version cannot publish by trusted publishing; 11.5.1 is the first that can."
            exit 1
          fi
          echo "npm $version"

      # Trusted publishing is configured per package, and only on a package
      # that exists, so a package this workflow has never published stops
      # the job here, before anything is sent, until its first version is
      # published by hand and its trusted publisher configured. Said plainly:
      # what will be published, what is already there, and what cannot be.
      - name: Say what will be published
        id: plan
        run: |
          publish=()
          present=()
          missing=()
          npm_packages=()
          # `npm view` answers a version it has, nothing for a version it has
          # not of a package it has, and E404 for a package it has not. Each
          # answer is assigned before it is read, so a lookup that errs fails
          # the step rather than reading as either answer.
          npm_state() {
            local found err
            err=$(mktemp)
            if found=$(npm view "$1" version 2> "$err"); then
              [ -n "$found" ] && echo present || echo absent
            elif grep -q E404 "$err"; then
              echo absent
            else
              echo "::error::npm could not be asked about $1:" >&2
              cat "$err" >&2
              return 1
            fi
          }
          for name in @withmarfa/core @withmarfa/client; do
            version_state=$(npm_state "$name@$VERSION")
            package_state=$(npm_state "$name")
            if [ "$version_state" = present ]; then
              present+=("$name@$VERSION on npm")
            elif [ "$package_state" = present ]; then
              publish+=("$name@$VERSION to npm")
              npm_packages+=("$name")
            else
              missing+=("$name, which npm has never published")
            fi
          done
          for line in "${publish[@]}"; do echo "will publish $line"; done
          for line in "${present[@]}"; do echo "already there: $line"; done
          if [ "${#missing[@]}" -gt 0 ]; then
            for line in "${missing[@]}"; do
              echo "::error::Nothing was published: $line. Publish its first version by hand from this run's artifacts, configure trusted publishing for it, then re-run this job."
            done
            exit 1
          fi
          echo "npm=${npm_packages[*]}" >> "$GITHUB_OUTPUT"

      # npm checks a trusted publisher only when a publish asks for one, so a
      # package whose publisher is missing or misspelled would otherwise be
      # found only after another package had gone out. This asks npm for the same
      # exchange `npm publish` makes, for each package about to be
      # published, and publishes nothing: the token it answers with expires
      # unused.
      - name: Require npm to trust this run
        if: steps.plan.outputs.npm != ''
        env:
          PACKAGES: ${{ steps.plan.outputs.npm }}
        run: |
          for name in $PACKAGES; do
            # A fresh identity for each exchange, as `npm publish` mints one.
            if ! identity=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value) \
              || [ -z "$identity" ] || [ "$identity" = null ]; then
              echo "::error::GitHub minted no OIDC identity for npm. Nothing was published."
              exit 1
            fi
            escaped=${name/\//%2f}
            if ! status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $identity" -H "Content-Length: 0" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$escaped"); then
              echo "::error::npm could not be reached to ask whether it trusts this run for $name. Nothing was published."
              exit 1
            fi
            case "$status" in
              2??) echo "npm trusts this run for $name" ;;
              5??)
                echo "::error::npm answered $status when asked whether it trusts this run for $name. Nothing was published."
                exit 1
                ;;
              *)
                echo "::error::npm answered $status to this run's identity for $name: its trusted publisher is not this repository and release.yml. Nothing was published."
                exit 1
                ;;
            esac
          done

      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.version.outputs.version }}
          path: artifacts

      # The notes open with what a build does to a database an earlier or
      # later build wrote (`scripts/release/upgrade-note.md`), and the
      # generated notes follow.
      #
      # A draft, so it can be removed, and seen by nobody until it is made
      # public at the end. A release already there keeps every file it holds,
      # which are the ones a registry may already have: re-running the failed
      # job reads this run's artifacts, but a full re-run builds them again.
      # A draft is given only the files it lacks; a public one is left alone.
      # A lookup that errs fails the step rather than reading as no release,
      # which would make a second draft for the same tag.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/release-view.err"); then
            if [ "$draft" = "false" ]; then
              echo "v$VERSION is already released"
              exit 0
            fi
            held=$(gh release view "v$VERSION" --json assets --jq '.assets[].name')
            for file in artifacts/*; do
              if ! grep -qx "$(basename "$file")" <<< "$held"; then
                gh release upload "v$VERSION" "$file"
              fi
            done
          elif grep -q "release not found" "$RUNNER_TEMP/release-view.err"; then
            gh release create "v$VERSION" artifacts/* \
              --draft \
              --title "v$VERSION" \
              --notes-file scripts/release/upgrade-note.md \
              --generate-notes \
              --verify-tag
          else
            echo "::error::Could not ask whether v$VERSION has a release:"
            cat "$RUNNER_TEMP/release-view.err"
            exit 1
          fi

      # What the release holds, not what this run built: a re-run after a
      # partial upload rebuilds the archives, and a draft keeps the files it
      # already has, so the checksum file could describe other archives than
      # the ones a person downloads.
      - name: Check the release's archives against its checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/held"
          gh release download "v$VERSION" --dir "$RUNNER_TEMP/held" --pattern 'marfa-*'
          cd "$RUNNER_TEMP/held"
          sha256sum -c "marfa-$VERSION-checksums.txt"

      - uses: actions/download-artifact@v8
        with:
          pattern: image-digest-${{ needs.version.outputs.version }}-*
          merge-multiple: true
          path: digests

      - name: Log in to the registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One manifest for both platforms, under the version and `latest`. A
      # version already tagged is left as it is, since a tag is not moved once
      # made, and `latest` follows the version tag either way, so a re-run that
      # stopped between the two finishes. The lookup answers "not found" for a
      # tag that is not there, and any other answer fails the step rather than
      # reading as either.
      - name: Tag the server image
        run: |
          for arch in amd64 arm64; do
            if ! [[ "$(cat "digests/$arch" 2>/dev/null)" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::No digest was pushed for $arch."
              exit 1
            fi
          done
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2> "$RUNNER_TEMP/image-view.err"; then
            echo "$IMAGE:$VERSION is already tagged"
          elif grep -qi "not found" "$RUNNER_TEMP/image-view.err"; then
            docker buildx imagetools create -t "$IMAGE:$VERSION" \
              "$IMAGE@$(cat digests/amd64)" "$IMAGE@$(cat digests/arm64)"
          else
            echo "::error::Could not ask whether $IMAGE:$VERSION exists:"
            cat "$RUNNER_TEMP/image-view.err"
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"

      # As a person pulls it: signed out, so a package that is private
      # fails here, with what to change, and the draft release stays a draft.
      # It names both platforms, `latest` is the version's own manifest, and
      # the image boots and reports this release.
      - name: Check the published server image
        run: |
          docker logout ghcr.io
          if ! docker pull "$IMAGE:$VERSION" 2> "$RUNNER_TEMP/image-pull.err"; then
            cat "$RUNNER_TEMP/image-pull.err"
            echo "::error::$IMAGE:$VERSION cannot be pulled signed out. If the package is private, set it public: GitHub, the withmarfa organization, Packages, marfa-server, Package settings, Danger Zone, Change package visibility, Public. Then re-run this job."
            exit 1
          fi
          platforms=$(docker buildx imagetools inspect "$IMAGE:$VERSION" | sed -n 's/^ *Platform: *//p' | sort | tr '\n' ' ')
          if [ "$platforms" != "linux/amd64 linux/arm64 " ]; then
            echo "::error::$IMAGE:$VERSION names '$platforms', not linux/amd64 and linux/arm64."
            exit 1
          fi
          tagged=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          latest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')
          if [ "$tagged" != "$latest" ]; then
            echo "::error::$IMAGE:latest is $latest, not the version's $tagged."
            exit 1
          fi
          scripts/check-image.sh "$IMAGE:$VERSION" "$VERSION"

      # By trusted publishing: npm exchanges the job's OIDC identity itself,
      # so no token is set anywhere.
      - name: Publish @withmarfa/core and @withmarfa/client to npm
        run: |
          for package in core client; do
            name="@withmarfa/$package"
            if found=$(npm view "$name@$VERSION" version 2> "$RUNNER_TEMP/npm-view.err"); then
              if [ "$found" = "$VERSION" ]; then
                echo "$name@$VERSION is already on npm"
                continue
              fi
            elif ! grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
              cat "$RUNNER_TEMP/npm-view.err"
              exit 1
            fi
            # A path, not `artifacts/…`, which npm reads as GitHub shorthand
            # for a repository and tries to clone.
            npm publish "./artifacts/withmarfa-$package-$VERSION.tgz" --access public
          done

      - name: Make the GitHub release public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --draft=false

  # The Homebrew formula follows the public release: `brew install
  # withmarfa/tap/marfa` installs the archive of this version for the machine,
  # by the checksum file the release carries. It runs after the release is
  # public, so a formula never names an archive a person cannot download, and
  # a failure here leaves the release as it is; run the job again.
  #
  # The formula is always written and shown. It is pushed only when the
  # repository variable `HOMEBREW_TAP` is `publish`, because a push makes
  # `brew upgrade` install this version, and a machine whose folder watch runs
  # Homebrew's `marfa` against another server would break.
  tap:
    name: Update the Homebrew tap
    needs: [version, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Say whether the formula is pushed
        id: gate
        env:
          HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP }}
        run: |
          if [ "$HOMEBREW_TAP" = publish ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP is publish: the formula is pushed to the tap."
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The formula is written below and not pushed: the repository variable HOMEBREW_TAP is not 'publish'."
          fi
      - name: Get the release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$VERSION" --pattern "marfa-$VERSION-checksums.txt"
      - name: Write the formula
        run: |
          bash scripts/release/write-formula.sh "$VERSION" "marfa-$VERSION-checksums.txt" > "$RUNNER_TEMP/marfa.rb"
          cat "$RUNNER_TEMP/marfa.rb"
      # A fine-grained token with Contents read and write on withmarfa/homebrew-tap
      # only, kept as an Actions secret of this repository.
      - name: Require the tap token
        if: steps.gate.outputs.push == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::The secret HOMEBREW_TAP_TOKEN is not set. Add a fine-grained token with Contents read and write on withmarfa/homebrew-tap as an Actions secret of this repository, then run this job again."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.push == 'true'
        with:
          repository: withmarfa/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit and push the formula
        if: steps.gate.outputs.push == 'true'
        working-directory: tap
        run: |
          mkdir -p Formula
          cp "$RUNNER_TEMP/marfa.rb" Formula/marfa.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/marfa.rb
          if git diff --cached --quiet; then
            echo "The tap already has marfa $VERSION."
            exit 0
          fi
          git commit -m "marfa $VERSION"
          git push origin HEAD:main
