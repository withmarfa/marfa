name: Release

# A release is a tag, and tags are the maintainer's. Each is the one before
# it plus 0.0.1, starting at 0.0.1. Pushing `v<version>` builds the artifacts
# from that commit, uploads them to the run, and publishes them: the npm
# packages `@withmarfa/core` and `@withmarfa/client`, the `marfa-client`
# crate, the Swift types as a pull request to marfa-swift-sdk, and a GitHub
# release carrying every artifact.
#
# A dispatch with a `version` is a dry run: it runs the same build a tag
# would, and skips only the publish job. It is how the workflow is exercised
# without a tag, which only the maintainer makes; the tag path reads the
# version off the tag and never off an input.
#
# The version is the tag's, and nowhere else: `scripts/release/stamp-version.sh`
# writes it into every manifest in this checkout, which is why no manifest in
# the repository holds one (`ci/version-fields.test.ts`).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "The version a tag would carry, for a dry run that publishes nothing"
        required: true

# Never cancel a release in flight. The key is per ref, so a second push of
# the same tag queues behind the first; two different tags run side by side.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  require-green-ci:
    name: Require green CI
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # A tag has to point at a commit that went through `ci.yml` on `main`.
      # A pull request's head passes `ci.yml` too, and under squash merges it
      # never reaches `main`, so the run asked for is a push to `main`, not
      # any green run on the SHA. Verifying that run is stronger than
      # recomputing it here: the steps below would pass against the tag's
      # own tree either way. This is why `ci.yml` does not cancel a
      # superseded run on `main`: a canceled run is not a successful one.
      #
      # A dry run publishes nothing, so it asks only that `ci.yml` passed at
      # the commit by any event, which lets a branch that changes this
      # workflow dry-run it before it merges.
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          query="head_sha=$GITHUB_SHA&status=success"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            query="$query&event=push&branch=main"
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?$query" --jq '.total_count')
          if [ "${runs:-0}" -lt 1 ]; then
            echo "::error::No successful ci.yml run for $GITHUB_SHA ($query). A release refuses a commit that has not passed CI."
            exit 1
          fi
          echo "ci.yml is green for $GITHUB_SHA ($query)"

  build:
    name: Build the artifacts
    needs: require-green-ci
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Read through the environment and held to the version grammar before
      # anything uses it: a ref name or an input may carry characters a shell
      # would act on if it were substituted into a script.
      - name: Read the version off the tag
        id: version
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$DRY_RUN_VERSION"
            echo "a dry run: the version is the input's, and nothing is published"
          else
            ref="${GITHUB_REF#refs/tags/}"
            if [ "$ref" = "$GITHUB_REF" ]; then
              echo "::error::A release runs at a tag ref; $GITHUB_REF is not one."
              exit 1
            fi
            version="${ref#v}"
          fi
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The tag names no major.minor.patch version."
            exit 1
          fi
          # Each version is the one before it plus 0.0.1, and the first is
          # 0.0.1, so every version is 0.0.N, follows the highest 0.0.M below
          # it, and has none released above it: a tag re-made in a gap is not
          # the next version. The tag being released is on the remote already,
          # so it is set aside. Read off the remote, which needs no history,
          # and never through a pipe whose empty answer would fail the step
          # unexplained.
          IFS=. read -r major minor patch <<< "$version"
          if [ "$major.$minor" != "0.0" ]; then
            echo "::error::$version is not 0.0.N; every version steps by 0.0.1."
            exit 1
          fi
          # Whether a version has a public release: "true", "false", or the
          # step fails, so a lookup that errs is never read as either.
          released() {
            local answer
            if answer=$(gh release view "v0.0.$1" --json isDraft --jq .isDraft 2>&1); then
              [ "$answer" = "false" ] && echo true || echo false
            elif grep -q "release not found" <<< "$answer"; then
              echo false
            else
              echo "::error::Could not ask whether 0.0.$1 is released: $answer" >&2
              return 1
            fi
          }
          remote_tags=$(git ls-remote --tags --refs origin 'refs/tags/v0.0.*')
          previous=-1
          above=()
          while read -r _ tag; do
            [ -n "$tag" ] || continue
            n="${tag#refs/tags/v0.0.}"
            [[ "$n" =~ ^(0|[1-9][0-9]*)$ ]] || continue
            if [ "$n" -lt "$patch" ] && [ "$n" -gt "$previous" ]; then previous="$n"; fi
            if [ "$n" -gt "$patch" ]; then above+=("$n"); fi
          done <<< "$remote_tags"
          # A version above this one that is only tagged is waiting on this
          # one, as two tags pushed together are; one that is released means
          # this tag was made in a gap.
          for n in "${above[@]}"; do
            state=$(released "$n")
            if [ "$state" = "true" ]; then
              echo "::error::0.0.$n is already released, so $version is not the next version."
              exit 1
            fi
          done
          expected=$((previous < 0 ? 1 : previous + 1))
          if [ "$patch" != "$expected" ]; then
            echo "::error::$version does not follow the tags before it; the next version is 0.0.$expected."
            exit 1
          fi
          # The version before it has to be released, and this commit has to
          # come after that one's. Two tags pushed together would otherwise
          # run side by side, and a tag on an older commit of main would
          # release less than the version it follows. Asked of the API, which
          # needs no history in this shallow checkout. A compare that fails
          # fails the step rather than reading as either answer.
          if [ "$previous" -ge 0 ]; then
            state=$(released "$previous")
            if [ "$state" != "true" ]; then
              echo "::error::0.0.$previous is tagged but not released; release it before $version."
              exit 1
            fi
            relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/v0.0.$previous...$GITHUB_SHA" --jq .status)
            if [ "$relation" != "ahead" ]; then
              echo "::error::$GITHUB_SHA is $relation of v0.0.$previous; a release's commit comes after the one before it."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "building $version from $GITHUB_SHA"

      # Homebrew's rustup is keg-only, so nothing it installs is on the
      # default PATH.
      - name: Put the Rust toolchain on PATH
        run: |
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The stamp's `cargo update` runs offline, so it needs every crate the
      # lockfiles name already in the cargo cache, which a runner new to the
      # pool does not have. `--locked` refuses rather than resolving anew.
      - name: Fetch the crates the lockfiles name
        run: |
          cargo fetch --locked --manifest-path core/Cargo.toml
          cargo fetch --locked --manifest-path core/bindings/swift/Cargo.toml

      # Before the install, because the install records every package's
      # version and the workspace refuses a script once one differs from
      # that record (`verifyDepsBeforeRun`). The lockfile holds no workspace
      # version, so a frozen install passes over the stamped manifests.
      - name: Stamp the version into every manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/release/stamp-version.sh "$VERSION"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Build and pack @withmarfa/core
        working-directory: core/bindings/node
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          pnpm --ignore-workspace install --frozen-lockfile
          pnpm --ignore-workspace run build
          pnpm --ignore-workspace pack --pack-destination "$RUNNER_TEMP/artifacts"
          bash "$GITHUB_WORKSPACE/scripts/release/hold-tarball.sh" "$RUNNER_TEMP/artifacts/withmarfa-core-$VERSION.tgz" \
            index.js index.d.ts marfa-core.darwin-arm64.node

      - name: Build the binary for macOS
        working-directory: core
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo build --release -p marfa-cli
          reported=$(target/release/marfa --version)
          if [ "$reported" != "marfa $VERSION" ]; then
            echo "::error::The binary reports '$reported', not 'marfa $VERSION'."
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/artifacts/marfa-$VERSION-darwin-arm64.tar.gz" -C target/release marfa

      - name: Pack @withmarfa/client
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm --filter @withmarfa/client pack --pack-destination "$RUNNER_TEMP/artifacts"
          bash scripts/release/hold-tarball.sh "$RUNNER_TEMP/artifacts/withmarfa-client-$VERSION.tgz" \
            dist/index.js dist/index.d.ts

      # `--allow-dirty` because the stamp just wrote the version into the
      # manifests of this checkout, which is the only place it lives.
      - name: Package the marfa-client crate
        working-directory: core
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo package -p marfa-client --allow-dirty
          cp "target/package/marfa-client-$VERSION.crate" "$RUNNER_TEMP/artifacts/"

      # The Swift types as the source package a consumer depends on: the
      # manifest, its resolution, the generated sources, and the tests the
      # manifest declares, without which SwiftPM refuses the package.
      - name: Zip the Swift types
        working-directory: swift
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          swift build
          # zip names a missing path in a warning and zips the rest, so each
          # is asked for first.
          for path in Package.swift Package.resolved README.md Sources/MarfaTypes Tests; do
            if [ ! -e "$path" ]; then
              echo "::error::The Swift package has no $path to zip."
              exit 1
            fi
          done
          zip -qr "$RUNNER_TEMP/artifacts/MarfaTypes-$VERSION.zip" Package.swift Package.resolved README.md Sources Tests

      # What the release moved on the published surface, against the lock
      # at the release before it. The first release has none to compare.
      - name: Write the published surface's delta
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          out="$RUNNER_TEMP/artifacts/surface-delta-$VERSION.md"
          if [ "$PREVIOUS" -lt 0 ]; then
            pnpm exec tsx scripts/release/surface-delta.ts packages/server/published-surface-lock.json > "$out"
          else
            git fetch --depth 1 origin "refs/tags/v0.0.$PREVIOUS:refs/tags/v0.0.$PREVIOUS"
            git show "v0.0.$PREVIOUS:packages/server/published-surface-lock.json" > "$RUNNER_TEMP/previous-lock.json"
            pnpm exec tsx scripts/release/surface-delta.ts packages/server/published-surface-lock.json "$RUNNER_TEMP/previous-lock.json" > "$out"
          fi
          cat "$out"

      # Exactly the six the publish job reads, by name: an upload that only
      # refuses an empty folder would carry a run missing one.
      - name: Hold the artifacts to the six a release carries
        working-directory: ${{ runner.temp }}/artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected=$(printf '%s\n' \
            "MarfaTypes-$VERSION.zip" \
            "marfa-$VERSION-darwin-arm64.tar.gz" \
            "marfa-client-$VERSION.crate" \
            "surface-delta-$VERSION.md" \
            "withmarfa-client-$VERSION.tgz" \
            "withmarfa-core-$VERSION.tgz" | LC_ALL=C sort)
          found=$(for file in *; do printf '%s\n' "$file"; done | LC_ALL=C sort)
          if [ "$found" != "$expected" ]; then
            echo "::error::The artifacts are not the six a release carries."
            diff <(echo "$expected") <(echo "$found") || true
            exit 1
          fi
          for file in $found; do
            if [ ! -s "$file" ]; then
              echo "::error::$file is empty."
              exit 1
            fi
          done
          echo "$found"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error

  # Never reached by a dry run. Ordered so a failure part way leaves what a
  # re-run of the same tag can finish, and never a version half out: every
  # credential is checked before anything is sent; the steps that can be
  # undone, the Swift pull request and the draft release, come first; the
  # registries, which never take a version back, come last; and the release
  # is made public only once everything is out. Every step asks whether its
  # version is already there and skips if it is, so a re-run repeats nothing.
  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push'
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SWIFT_SDK: withmarfa/marfa-swift-sdk
    steps:
      # Named one by one, so the message says which is missing. Before the
      # checkout, so a tag without them costs nothing.
      - name: Require every publishing credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          SWIFT_SDK_TOKEN: ${{ secrets.SWIFT_SDK_TOKEN }}
        run: |
          missing=()
          for name in NPM_TOKEN CARGO_REGISTRY_TOKEN SWIFT_SDK_TOKEN; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Nothing was published: the repository has no secret ${missing[*]}."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.build.outputs.version }}
          path: artifacts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Put the Rust toolchain on PATH
        run: |
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # A set secret can still be the wrong one. npm names the account a
      # token signs in as, though whether it may publish under the scope is
      # known only at the publish; the Swift SDK's token has to reach the
      # repository with push. crates.io has no read that proves a publish
      # token, so that one is known only by its publish, which is why the
      # crate goes before the npm packages.
      - name: Check the credentials reach what they publish to
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.SWIFT_SDK_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$RUNNER_TEMP/.npmrc"
          if ! npm whoami --userconfig "$RUNNER_TEMP/.npmrc" > /dev/null; then
            echo "::error::NPM_TOKEN does not sign in to npm."
            exit 1
          fi
          if [ "$(gh api "repos/$SWIFT_SDK" --jq .permissions.push)" != "true" ]; then
            echo "::error::SWIFT_SDK_TOKEN cannot push to $SWIFT_SDK."
            exit 1
          fi

      # The Swift types land in marfa-swift-sdk as a pull request that puts
      # this release's generated sources at `Sources/MarfaTypes/`, on the
      # branch `release/v<version>`. Nothing lands until the SDK merges it:
      # the SDK owns its manifest, its target list and its own versions, so
      # the release proposes the sources and leaves the rest to the SDK. The
      # zip on the GitHub release carries the same sources as a package of
      # their own.
      - name: Propose the Swift types to marfa-swift-sdk
        env:
          GH_TOKEN: ${{ secrets.SWIFT_SDK_TOKEN }}
        run: |
          branch="release/v$VERSION"
          # Assigned, so a failed lookup fails the step rather than reading
          # as a pull request that exists.
          proposed=$(gh pr list -R "$SWIFT_SDK" --head "$branch" --state all --json number --jq length)
          if [ "$proposed" != "0" ]; then
            echo "$SWIFT_SDK already has a pull request from $branch"
            exit 0
          fi
          sdk="$RUNNER_TEMP/swift-sdk"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$auth" clone --quiet --depth 1 "https://github.com/$SWIFT_SDK.git" "$sdk"
          if git -C "$sdk" -c http.extraheader="$auth" ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch is on $SWIFT_SDK from an earlier run; opening its pull request"
          else
            unzip -q "artifacts/MarfaTypes-$VERSION.zip" 'Sources/MarfaTypes/*' -d "$RUNNER_TEMP/types"
            git -C "$sdk" checkout --quiet -b "$branch"
            rm -rf "$sdk/Sources/MarfaTypes"
            mkdir -p "$sdk/Sources"
            cp -R "$RUNNER_TEMP/types/Sources/MarfaTypes" "$sdk/Sources/MarfaTypes"
            git -C "$sdk" add Sources/MarfaTypes
            # A release that changed nothing the types describe has nothing
            # to propose.
            if git -C "$sdk" diff --cached --quiet; then
              echo "$SWIFT_SDK already holds these types"
              exit 0
            fi
            git -C "$sdk" \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "feat(types): MarfaTypes from marfa v$VERSION"
            git -C "$sdk" -c http.extraheader="$auth" push --quiet origin "$branch"
          fi
          gh pr create -R "$SWIFT_SDK" --base main --head "$branch" \
            --title "feat(types): MarfaTypes from marfa v$VERSION" \
            --body "The Swift types generated from the API document at marfa v$VERSION, as the monorepo's release built them, at \`Sources/MarfaTypes/\`. They need \`swift-openapi-runtime\`, as the zip on the monorepo's v$VERSION release declares."

      # A draft, so it can be removed, and seen by nobody until it is made
      # public at the end. A release already there keeps every file it holds,
      # which are the ones a registry may already have: re-running the failed
      # job reads this run's artifacts, but a full re-run builds them again.
      # A draft is given only the files it lacks; a public one is left alone.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" = "false" ]; then
              echo "v$VERSION is already released"
              exit 0
            fi
            held=$(gh release view "v$VERSION" --json assets --jq '.assets[].name')
            for file in artifacts/*; do
              if ! grep -qx "$(basename "$file")" <<< "$held"; then
                gh release upload "v$VERSION" "$file"
              fi
            done
          else
            gh release create "v$VERSION" artifacts/* \
              --draft \
              --title "v$VERSION" \
              --notes-file "artifacts/surface-delta-$VERSION.md" \
              --verify-tag
          fi

      - name: Publish marfa-client to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "withmarfa-release" \
            "https://crates.io/api/v1/crates/marfa-client/$VERSION")
          case "$status" in
            200)
              echo "marfa-client $VERSION is already on crates.io"
              exit 0
              ;;
            404) ;;
            *)
              echo "::error::crates.io answered $status for marfa-client $VERSION."
              exit 1
              ;;
          esac
          mkdir -p "$RUNNER_TEMP/crate"
          tar -xzf "artifacts/marfa-client-$VERSION.crate" -C "$RUNNER_TEMP/crate"
          # The package is the one the build job made and checked, published
          # from where it was unpacked rather than from the checkout, which
          # would need the version stamped again. Its manifest is the
          # normalized one cargo wrote; the original beside it is a name
          # cargo reserves for itself and refuses to package.
          rm "$RUNNER_TEMP/crate/marfa-client-$VERSION/Cargo.toml.orig"
          cargo publish --manifest-path "$RUNNER_TEMP/crate/marfa-client-$VERSION/Cargo.toml"

      # No `--provenance`: npm attests provenance only from a GitHub-hosted
      # runner's OIDC identity, and every job here runs on the self-hosted
      # pool. `npm view` answers a version it has, and E404 for a package or
      # version it has not; anything else fails the step rather than being
      # read as either.
      - name: Publish @withmarfa/core and @withmarfa/client to npm
        run: |
          for package in core client; do
            name="@withmarfa/$package"
            if found=$(npm view "$name@$VERSION" version --userconfig "$RUNNER_TEMP/.npmrc" 2> "$RUNNER_TEMP/npm-view.err"); then
              if [ "$found" = "$VERSION" ]; then
                echo "$name@$VERSION is already on npm"
                continue
              fi
            elif ! grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
              cat "$RUNNER_TEMP/npm-view.err"
              exit 1
            fi
            npm publish "artifacts/withmarfa-$package-$VERSION.tgz" --access public --userconfig "$RUNNER_TEMP/.npmrc"
          done

      - name: Make the GitHub release public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --draft=false
