name: Release

# Builds, verifies, and publishes release artifacts.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "The version a tag would carry, for a dry run that publishes nothing"
        required: true

# Never cancel a release in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 2

permissions:
  contents: read

jobs:
  require-green-ci:
    name: Require green CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # A pull request's head never reaches `main` under squash merges, so a tag
      # needs a push or dispatch run; a dry run accepts any event.
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          query="head_sha=$GITHUB_SHA&status=success"
          filter='.workflow_runs | length'
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            filter='[.workflow_runs[] | select((.event == "push" and .head_branch == "main") or .event == "workflow_dispatch")] | length'
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?$query&per_page=100" --jq "$filter")
          if [ "${runs:-0}" -lt 1 ]; then
            echo "::error::No successful ci.yml run for $GITHUB_SHA ($query). A release refuses a commit that has not passed CI."
            exit 1
          fi
          echo "ci.yml is green for $GITHUB_SHA ($query)"

  version:
    name: Read the version
    needs: require-green-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Read through the environment: a ref name or input may carry shell characters.
      - name: Read the version off the tag
        id: version
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$DRY_RUN_VERSION"
            echo "a dry run: the version is the input's, and nothing is published"
          else
            ref="${GITHUB_REF#refs/tags/}"
            if [ "$ref" = "$GITHUB_REF" ]; then
              echo "::error::A release runs at a tag ref; $GITHUB_REF is not one."
              exit 1
            fi
            version="${ref#v}"
          fi
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The tag names no major.minor.patch version."
            exit 1
          fi
          # Each version is the previous plus 0.0.1. The remote is read without
          # a pipe, whose empty answer would fail the step unexplained.
          IFS=. read -r major minor patch <<< "$version"
          if [ "$major.$minor" != "0.0" ]; then
            echo "::error::$version is not 0.0.N; every version steps by 0.0.1."
            exit 1
          fi
          first_rust=70
          if [ "$patch" -lt "$first_rust" ]; then
            echo "::error::$version is below 0.0.$first_rust, the first Rust release; this workflow releases only the Rust server."
            exit 1
          fi
          # A lookup that errs fails the step; it is never read as true or false.
          released() {
            local answer
            if answer=$(gh release view "v0.0.$1" --json isDraft --jq .isDraft 2>&1); then
              [ "$answer" = "false" ] && echo true || echo false
            elif grep -q "release not found" <<< "$answer"; then
              echo false
            else
              echo "::error::Could not ask whether 0.0.$1 is released: $answer" >&2
              return 1
            fi
          }
          remote_tags=$(git ls-remote --tags --refs origin 'refs/tags/v0.0.*')
          previous=-1
          above=()
          while read -r _ tag; do
            [ -n "$tag" ] || continue
            n="${tag#refs/tags/v0.0.}"
            [[ "$n" =~ ^(0|[1-9][0-9]*)$ ]] || continue
            if [ "$n" -lt "$patch" ] && [ "$n" -gt "$previous" ]; then previous="$n"; fi
            if [ "$n" -gt "$patch" ]; then above+=("$n"); fi
          done <<< "$remote_tags"
          # A higher version that is only tagged is waiting on this one.
          for n in "${above[@]}"; do
            state=$(released "$n")
            if [ "$state" = "true" ]; then
              echo "::error::0.0.$n is already released, so $version is not the next version."
              exit 1
            fi
          done
          expected=$((previous < 0 ? 1 : previous + 1))
          if [ "$patch" = "$first_rust" ] && [ "$previous" -ge 0 ]; then
            echo "$version is the first Rust release, so it may follow any released version below it."
          elif [ "$patch" != "$expected" ]; then
            echo "::error::$version does not follow the tags before it; the next version is 0.0.$expected."
            exit 1
          fi
          # The API answers where this shallow checkout has no history.
          if [ "$previous" -ge 0 ]; then
            state=$(released "$previous")
            if [ "$state" != "true" ]; then
              echo "::error::0.0.$previous is tagged but not released; release it before $version."
              exit 1
            fi
            relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/v0.0.$previous...$GITHUB_SHA" --jq .status)
            if [ "$relation" != "ahead" ]; then
              echo "::error::$GITHUB_SHA is $relation of v0.0.$previous; a release's commit comes after the one before it."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version from $GITHUB_SHA"

  # Only `ci.yml` on `main` saves the native cache, and only for x86_64 Linux,
  # so this build starts with a cold PDFium.
  programs-macos:
    name: Build the programs (macOS)
    needs: version
    runs-on: macos-26
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install cmake and ninja if the runner lacks them
        run: |
          missing=()
          for tool in cmake ninja; do
            command -v "$tool" > /dev/null || missing+=("$tool")
          done
          if [ "${#missing[@]}" -gt 0 ]; then brew install "${missing[@]}"; fi
          cmake --version | head -1
          echo "ninja $(ninja --version)"

      - name: Install the Rust version the native pins name
        run: |
          rust=$(awk '$1 == "toolchain" && $2 == "rust" { print $3 }' core/marfa-enrichment/native/manifest.txt)
          if [ -z "$rust" ]; then
            echo "::error::native/manifest.txt pins no Rust toolchain."
            exit 1
          fi
          rustup toolchain install "$rust" --profile minimal
          rustup default "$rust"
          rustc --version

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Choose the folder for downloads and results
        run: echo "MARFA_NATIVE_ROOT=$RUNNER_TEMP/marfa-native" >> "$GITHUB_ENV"
      - name: Key the cache on the pins, the patches and the build scripts
        id: key
        run: echo "key=marfa-native-$RUNNER_OS-${{ hashFiles('core/marfa-enrichment/native/manifest.txt', 'core/marfa-enrichment/native/patches/**', 'core/marfa-enrichment/native/build.sh', 'core/marfa-enrichment/native/pdfium.sh', 'core/marfa-enrichment/native/tesseract.sh', 'core/marfa-enrichment/native/models.sh', 'core/marfa-enrichment/native/lib.sh', 'core/marfa-enrichment/native/linux/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the downloads and the PDFium library
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/marfa-native/downloads
            ${{ runner.temp }}/marfa-native/archives
          key: ${{ steps.key.outputs.key }}

      # The stamp's `cargo update` runs offline, so the crates must be fetched first.
      - name: Fetch the crates the lockfiles name
        run: |
          cargo fetch --locked --manifest-path core/Cargo.toml
          cargo fetch --locked --manifest-path core/bindings/swift/Cargo.toml

      # Before the install: pnpm refuses a script once a manifest's version
      # differs from the install's record (`verifyDepsBeforeRun`).
      - name: Stamp the version into every manifest
        run: bash scripts/release/stamp-version.sh "$VERSION"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Build and pack @withmarfa/core
        working-directory: core/bindings/node
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          pnpm --ignore-workspace install --frozen-lockfile
          pnpm --ignore-workspace run build
          pnpm --ignore-workspace pack --pack-destination "$RUNNER_TEMP/artifacts"
          bash "$GITHUB_WORKSPACE/scripts/release/hold-tarball.sh" "$RUNNER_TEMP/artifacts/withmarfa-core-$VERSION.tgz" \
            index.js index.d.ts marfa-core.darwin-arm64.node
          bash "$GITHUB_WORKSPACE/scripts/release/hold-platform.sh" "$RUNNER_TEMP/artifacts/withmarfa-core-$VERSION.tgz" \
            darwin arm64

      - name: Pack @withmarfa/client
        run: |
          pnpm --filter @withmarfa/client pack --pack-destination "$RUNNER_TEMP/artifacts"
          bash scripts/release/hold-tarball.sh "$RUNNER_TEMP/artifacts/withmarfa-client-$VERSION.tgz" \
            dist/index.js dist/index.d.ts

      - name: Build the programs
        run: |
          target=aarch64-apple-darwin
          bash scripts/release/build-programs.sh "$target"
          out="$MARFA_NATIVE_ROOT/out/$target"
          for program in marfa marfa-server; do
            reported=$("$out/$program" --version)
            if [ "$reported" != "$program $VERSION" ]; then
              echo "::error::$program reports '$reported', not '$program $VERSION'."
              exit 1
            fi
          done
          cp "$out/marfa" "$out/marfa-server" "$out/NOTICES.txt" "$RUNNER_TEMP/artifacts/"

      - name: Hold the build to the programs and the two packages
        working-directory: ${{ runner.temp }}/artifacts
        run: |
          bash "$GITHUB_WORKSPACE/scripts/release/hold-artifacts.sh" \
            NOTICES.txt marfa marfa-server \
            "withmarfa-client-$VERSION.tgz" "withmarfa-core-$VERSION.tgz"

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          retention-days: 1

  # Signing stays in its own job so the identity never shares a machine with
  # the build's dependencies. A dry run signs too.
  sign:
    name: Sign the programs
    needs: [version, programs-macos]
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: build-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/build

      - name: Sign and notarize the programs
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for program in marfa marfa-server; do
            # An artifact keeps no file modes.
            chmod +x "$RUNNER_TEMP/build/$program"
            bash scripts/release/sign-binary.sh "$RUNNER_TEMP/build/$program"
          done

      - name: Pack the programs and run them from the archive
        run: |
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/artifacts"
          cp "$RUNNER_TEMP/build/marfa" "$RUNNER_TEMP/build/marfa-server" "$RUNNER_TEMP/build/NOTICES.txt" "$RUNNER_TEMP/pack/"
          bash scripts/release/pack-programs.sh "$RUNNER_TEMP/pack" "$RUNNER_TEMP/artifacts/marfa-$VERSION-darwin-arm64.tar.gz"
          bash scripts/release/check-archive.sh "$RUNNER_TEMP/artifacts/marfa-$VERSION-darwin-arm64.tar.gz" "$VERSION" --boot
          bash scripts/release/prove-reading.sh "$RUNNER_TEMP/artifacts/marfa-$VERSION-darwin-arm64.tar.gz" \
            core/marfa-enrichment/fixtures
          cp "$RUNNER_TEMP/build/withmarfa-client-$VERSION.tgz" "$RUNNER_TEMP/build/withmarfa-core-$VERSION.tgz" "$RUNNER_TEMP/artifacts/"

      - name: Hold the artifacts to the three this job makes
        working-directory: ${{ runner.temp }}/artifacts
        run: |
          bash "$GITHUB_WORKSPACE/scripts/release/hold-artifacts.sh" \
            "marfa-$VERSION-darwin-arm64.tar.gz" \
            "withmarfa-client-$VERSION.tgz" "withmarfa-core-$VERSION.tgz"

      - uses: actions/upload-artifact@v7
        with:
          name: signed-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          retention-days: 1

  # Both targets build on x86_64 in Docker, statically linked against musl.
  programs-linux:
    name: Build the programs (${{ matrix.arch }} Linux)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            cache: marfa-native
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            cache: marfa-native-aarch64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      # The first build of a target needs 40 GB of free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the Rust version the native pins name
        run: |
          rust=$(awk '$1 == "toolchain" && $2 == "rust" { print $3 }' core/marfa-enrichment/native/manifest.txt)
          if [ -z "$rust" ]; then
            echo "::error::native/manifest.txt pins no Rust toolchain."
            exit 1
          fi
          rustup toolchain install "$rust" --profile minimal
          rustup default "$rust"
          rustc --version

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Stamp the version into every manifest
        run: |
          cargo fetch --locked --manifest-path core/Cargo.toml
          cargo fetch --locked --manifest-path core/bindings/swift/Cargo.toml
          bash scripts/release/stamp-version.sh "$VERSION"

      - name: Choose the folder for downloads and results
        run: echo "MARFA_NATIVE_ROOT=$RUNNER_TEMP/marfa-native" >> "$GITHUB_ENV"
      # The x86_64 key is the one `ci.yml`'s `Core native (x86_64 Linux)` job saves.
      - name: Key the cache on the pins, the patches and the build scripts
        id: key
        run: echo "key=${{ matrix.cache }}-$RUNNER_OS-${{ hashFiles('core/marfa-enrichment/native/manifest.txt', 'core/marfa-enrichment/native/patches/**', 'core/marfa-enrichment/native/build.sh', 'core/marfa-enrichment/native/pdfium.sh', 'core/marfa-enrichment/native/tesseract.sh', 'core/marfa-enrichment/native/models.sh', 'core/marfa-enrichment/native/lib.sh', 'core/marfa-enrichment/native/linux/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the downloads and the PDFium library
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/marfa-native/downloads
            ${{ runner.temp }}/marfa-native/archives
          key: ${{ steps.key.outputs.key }}

      # The image is restored from the cache, never built from the package
      # archive when the cache holds it; `main` saves it.
      - name: Make the build image
        uses: ./.github/actions/native-build-image

      # The arm64 programs are built here on x86_64 and read a sample under emulation.
      - name: Set up emulation for arm64
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build the programs
        run: bash scripts/release/build-programs.sh "$TARGET"

      - name: Pack the programs
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          bash scripts/release/pack-programs.sh "$MARFA_NATIVE_ROOT/out/$TARGET" \
            "$RUNNER_TEMP/artifacts/marfa-$VERSION-linux-${{ matrix.arch }}.tar.gz"

      - name: Hold the artifacts to the archive
        working-directory: ${{ runner.temp }}/artifacts
        run: |
          bash "$GITHUB_WORKSPACE/scripts/release/hold-artifacts.sh" \
            "marfa-$VERSION-linux-${{ matrix.arch }}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ needs.version.outputs.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          retention-days: 1

  # The only job that runs the arm64 programs on arm64: the build runs them
  # under QEMU, which cannot install the reader's seccomp filter.
  run-linux:
    name: Run the programs (${{ matrix.arch }} Linux)
    needs: [version, programs-linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ needs.version.outputs.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/archive

      - name: Unpack the archive, ask the programs their version and boot the server
        run: bash scripts/release/check-archive.sh "$RUNNER_TEMP/archive/marfa-$VERSION-linux-${{ matrix.arch }}.tar.gz" "$VERSION" --boot

      - name: Read a text file, a PDF and a picture with the server unpacked from the archive
        run: bash scripts/release/prove-reading.sh "$RUNNER_TEMP/archive/marfa-$VERSION-linux-${{ matrix.arch }}.tar.gz" core/marfa-enrichment/fixtures

  # The formula is kept apart from the release's files because it is not part of the release.
  collect:
    name: Collect the release
    needs: [version, sign, programs-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: signed-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/artifacts

      - uses: actions/download-artifact@v8
        with:
          pattern: linux-${{ needs.version.outputs.version }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts

      - name: Write the checksums
        working-directory: ${{ runner.temp }}/artifacts
        run: |
          bash "$GITHUB_WORKSPACE/scripts/release/write-checksums.sh" "marfa-$VERSION-checksums.txt" \
            "marfa-$VERSION-darwin-arm64.tar.gz" \
            "marfa-$VERSION-linux-aarch64.tar.gz" "marfa-$VERSION-linux-x86_64.tar.gz"

      - name: Write the Homebrew formula
        run: |
          mkdir -p "$RUNNER_TEMP/formula"
          bash scripts/release/write-formula.sh "$VERSION" "$RUNNER_TEMP/artifacts/marfa-$VERSION-checksums.txt" > "$RUNNER_TEMP/formula/marfa.rb"
          cat "$RUNNER_TEMP/formula/marfa.rb"

      # Exactly the six the publish job reads, by name.
      - name: Hold the artifacts to the six a release carries
        working-directory: ${{ runner.temp }}/artifacts
        run: |
          bash "$GITHUB_WORKSPACE/scripts/release/hold-artifacts.sh" \
            "marfa-$VERSION-checksums.txt" \
            "marfa-$VERSION-darwin-arm64.tar.gz" \
            "marfa-$VERSION-linux-aarch64.tar.gz" "marfa-$VERSION-linux-x86_64.tar.gz" \
            "withmarfa-client-$VERSION.tgz" "withmarfa-core-$VERSION.tgz"

      - name: Hold the formula
        working-directory: ${{ runner.temp }}/formula
        run: bash "$GITHUB_WORKSPACE/scripts/release/hold-artifacts.sh" marfa.rb

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: formula-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/formula/marfa.rb
          if-no-files-found: error

  # A tag pushes each image untagged, by digest; the publish job adds the tags.
  # The push repeats the build from the builder's cache, so what booted is what is pushed.
  image:
    name: Build the server image (${{ matrix.platform }})
    needs: [version, programs-linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/withmarfa/marfa-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: linux-${{ needs.version.outputs.version }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/archives

      - name: Lay out the build context from the release's archives
        run: bash scripts/release/image-context.sh "$RUNNER_TEMP/archives" "$VERSION" "$RUNNER_TEMP/image-context"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image-context
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: marfa-server:check
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Marfa server
            org.opencontainers.image.description=The Marfa server.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Boot it, ask it, stop it
        run: scripts/check-image.sh marfa-server:check "$VERSION"

      - name: Log in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image by digest
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image-context
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Marfa server
            org.opencontainers.image.description=The Marfa server.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Boot the pushed image
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          scripts/check-image.sh "$IMAGE@$DIGEST" "$VERSION"

      - name: Hold the digest for the publish job
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The push of the $ARCH image answered no digest: '$DIGEST'."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - name: Upload the digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ needs.version.outputs.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error

  # A Mac with Docker cannot run on GitHub, so Docker on a Mac is proved by hand.
  install-proof:
    name: Prove the install (${{ matrix.platform }})
    needs: [version, collect]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-26
            modes: native-user
          - platform: linux-x86_64
            runner: ubuntu-latest
            modes: native-root docker
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            modes: native-user
            # The runner's /home carries an access control list, which the server
            # refuses above its private socket.
            root: /var/tmp/marfa-proof
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MODES: ${{ matrix.modes }}
      MARFA_PROOF_ROOT: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/release

      - name: Install, claim and reach the server behind HTTPS
        run: |
          read -ra modes <<< "$MODES"
          bash scripts/release/install-proof.sh "$RUNNER_TEMP/release" "$VERSION" "${modes[@]}"

  # Ordered so a failure part way leaves what a re-run can finish: preflight,
  # the draft release, the image tags, npm (which never takes a version back),
  # then public. Every step skips what is already there.
  #
  # A package the first push created is private until its visibility is set once
  # in GitHub's package settings; the signed-out check fails there until then.
  publish:
    name: Publish
    needs: [version, collect, run-linux, image, install-proof]
    # npm's trusted publishing does not check the ref: only this condition keeps publication to tags.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/withmarfa/marfa-server
    steps:
      # 11.5.1 is the first npm that publishes by trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require an npm that publishes by OIDC
        run: |
          version=$(npm --version)
          if ! node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1);
          ' "$version"; then
            echo "::error::npm $version cannot publish by trusted publishing; 11.5.1 is the first that can."
            exit 1
          fi
          echo "npm $version"

      # Trusted publishing needs an existing package, so a never-published one
      # stops here until its first version is published by hand.
      - name: Say what will be published
        id: plan
        run: |
          publish=()
          present=()
          missing=()
          npm_packages=()
          # `npm view` answers E404 for a missing package and nothing for a
          # missing version.
          npm_state() {
            local found err
            err=$(mktemp)
            if found=$(npm view "$1" version 2> "$err"); then
              [ -n "$found" ] && echo present || echo absent
            elif grep -q E404 "$err"; then
              echo absent
            else
              echo "::error::npm could not be asked about $1:" >&2
              cat "$err" >&2
              return 1
            fi
          }
          for name in @withmarfa/core @withmarfa/client; do
            version_state=$(npm_state "$name@$VERSION")
            package_state=$(npm_state "$name")
            if [ "$version_state" = present ]; then
              present+=("$name@$VERSION on npm")
            elif [ "$package_state" = present ]; then
              publish+=("$name@$VERSION to npm")
              npm_packages+=("$name")
            else
              missing+=("$name, which npm has never published")
            fi
          done
          for line in "${publish[@]}"; do echo "will publish $line"; done
          for line in "${present[@]}"; do echo "already there: $line"; done
          if [ "${#missing[@]}" -gt 0 ]; then
            for line in "${missing[@]}"; do
              echo "::error::Nothing was published: $line. Publish its first version by hand from this run's artifacts, configure trusted publishing for it, then re-run this job."
            done
            exit 1
          fi
          echo "npm=${npm_packages[*]}" >> "$GITHUB_OUTPUT"

      # npm checks a trusted publisher only on publish, so this makes the same
      # exchange first and publishes nothing; the token expires unused.
      - name: Require npm to trust this run
        if: steps.plan.outputs.npm != ''
        env:
          PACKAGES: ${{ steps.plan.outputs.npm }}
        run: |
          for name in $PACKAGES; do
            # A fresh identity for each exchange, as `npm publish` mints one.
            if ! identity=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value) \
              || [ -z "$identity" ] || [ "$identity" = null ]; then
              echo "::error::GitHub minted no OIDC identity for npm. Nothing was published."
              exit 1
            fi
            escaped=${name/\//%2f}
            if ! status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $identity" -H "Content-Length: 0" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$escaped"); then
              echo "::error::npm could not be reached to ask whether it trusts this run for $name. Nothing was published."
              exit 1
            fi
            case "$status" in
              2??) echo "npm trusts this run for $name" ;;
              5??)
                echo "::error::npm answered $status when asked whether it trusts this run for $name. Nothing was published."
                exit 1
                ;;
              *)
                echo "::error::npm answered $status to this run's identity for $name: its trusted publisher is not this repository and release.yml. Nothing was published."
                exit 1
                ;;
            esac
          done

      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.version.outputs.version }}
          path: artifacts

      # A release already there keeps the files it holds, which a registry may
      # already have: a full re-run rebuilds them. A draft is given only the
      # files it lacks; a public one is left alone.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/release-view.err"); then
            if [ "$draft" = "false" ]; then
              echo "v$VERSION is already released"
              exit 0
            fi
            held=$(gh release view "v$VERSION" --json assets --jq '.assets[].name')
            for file in artifacts/*; do
              if ! grep -qx "$(basename "$file")" <<< "$held"; then
                gh release upload "v$VERSION" "$file"
              fi
            done
          elif grep -q "release not found" "$RUNNER_TEMP/release-view.err"; then
            gh release create "v$VERSION" artifacts/* \
              --draft \
              --title "v$VERSION" \
              --notes-file scripts/release/upgrade-note.md \
              --generate-notes \
              --verify-tag
          else
            echo "::error::Could not ask whether v$VERSION has a release:"
            cat "$RUNNER_TEMP/release-view.err"
            exit 1
          fi

      # Read from the release, not this run: a draft keeps files from an earlier run's build.
      - name: Check the release's archives against its checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/held"
          gh release download "v$VERSION" --dir "$RUNNER_TEMP/held" --pattern 'marfa-*'
          cd "$RUNNER_TEMP/held"
          sha256sum -c "marfa-$VERSION-checksums.txt"

      - uses: actions/download-artifact@v8
        with:
          pattern: image-digest-${{ needs.version.outputs.version }}-*
          merge-multiple: true
          path: digests

      - name: Log in to the registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version tag is never moved once made; `latest` follows it either way.
      - name: Tag the server image
        run: |
          for arch in amd64 arm64; do
            if ! [[ "$(cat "digests/$arch" 2>/dev/null)" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::No digest was pushed for $arch."
              exit 1
            fi
          done
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2> "$RUNNER_TEMP/image-view.err"; then
            echo "$IMAGE:$VERSION is already tagged"
          elif grep -qi "not found" "$RUNNER_TEMP/image-view.err"; then
            docker buildx imagetools create -t "$IMAGE:$VERSION" \
              "$IMAGE@$(cat digests/amd64)" "$IMAGE@$(cat digests/arm64)"
          else
            echo "::error::Could not ask whether $IMAGE:$VERSION exists:"
            cat "$RUNNER_TEMP/image-view.err"
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"

      # Signed out, as a person pulls it, so a private package fails here.
      - name: Check the published server image
        run: |
          docker logout ghcr.io
          if ! docker pull "$IMAGE:$VERSION" 2> "$RUNNER_TEMP/image-pull.err"; then
            cat "$RUNNER_TEMP/image-pull.err"
            echo "::error::$IMAGE:$VERSION cannot be pulled signed out. If the package is private, set it public: GitHub, the withmarfa organization, Packages, marfa-server, Package settings, Danger Zone, Change package visibility, Public. Then re-run this job."
            exit 1
          fi
          platforms=$(docker buildx imagetools inspect "$IMAGE:$VERSION" | sed -n 's/^ *Platform: *//p' | sort | tr '\n' ' ')
          if [ "$platforms" != "linux/amd64 linux/arm64 " ]; then
            echo "::error::$IMAGE:$VERSION names '$platforms', not linux/amd64 and linux/arm64."
            exit 1
          fi
          tagged=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          latest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')
          if [ "$tagged" != "$latest" ]; then
            echo "::error::$IMAGE:latest is $latest, not the version's $tagged."
            exit 1
          fi
          scripts/check-image.sh "$IMAGE:$VERSION" "$VERSION"

      - name: Publish @withmarfa/core and @withmarfa/client to npm
        run: |
          for package in core client; do
            name="@withmarfa/$package"
            if found=$(npm view "$name@$VERSION" version 2> "$RUNNER_TEMP/npm-view.err"); then
              if [ "$found" = "$VERSION" ]; then
                echo "$name@$VERSION is already on npm"
                continue
              fi
            elif ! grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
              cat "$RUNNER_TEMP/npm-view.err"
              exit 1
            fi
            # A path, not `artifacts/…`, which npm reads as GitHub shorthand
            # for a repository and tries to clone.
            npm publish "./artifacts/withmarfa-$package-$VERSION.tgz" --access public
          done

      - name: Make the GitHub release public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --draft=false

  # Pushed only when `HOMEBREW_TAP` is `publish`: a push makes `brew upgrade`
  # install this version, which would break a machine whose folder watch runs
  # Homebrew's `marfa` against another server.
  tap:
    name: Update the Homebrew tap
    needs: [version, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Say whether the formula is pushed
        id: gate
        env:
          HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP }}
        run: |
          if [ "$HOMEBREW_TAP" = publish ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP is publish: the formula is pushed to the tap."
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The formula is written below and not pushed: the repository variable HOMEBREW_TAP is not 'publish'."
          fi
      - name: Get the release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$VERSION" --pattern "marfa-$VERSION-checksums.txt"
      - name: Write the formula
        run: |
          bash scripts/release/write-formula.sh "$VERSION" "marfa-$VERSION-checksums.txt" > "$RUNNER_TEMP/marfa.rb"
          cat "$RUNNER_TEMP/marfa.rb"
      # Needs Contents read and write on withmarfa/homebrew-tap only.
      - name: Require the tap token
        if: steps.gate.outputs.push == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::The secret HOMEBREW_TAP_TOKEN is not set. Add a fine-grained token with Contents read and write on withmarfa/homebrew-tap as an Actions secret of this repository, then run this job again."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.push == 'true'
        with:
          repository: withmarfa/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit and push the formula
        if: steps.gate.outputs.push == 'true'
        working-directory: tap
        run: |
          mkdir -p Formula
          cp "$RUNNER_TEMP/marfa.rb" Formula/marfa.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/marfa.rb
          if git diff --cached --quiet; then
            echo "The tap already has marfa $VERSION."
            exit 0
          fi
          git commit -m "marfa $VERSION"
          git push origin HEAD:main
