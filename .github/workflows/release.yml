name: Release

# A release is a tag, and tags are the maintainer's. Each is the one before
# it plus 0.0.1, starting at 0.0.1. Pushing `v<version>` builds the artifacts
# from that commit, uploads them to the run, and publishes them: the npm
# packages `@withmarfa/core` and `@withmarfa/client`, the `marfa-client`
# crate, and a GitHub release carrying every artifact.
#
# A dispatch with a `version` is a dry run: it runs the same build a tag
# would, and skips only the publish job. It is how the workflow is exercised
# without a tag, which only the maintainer makes; the tag path reads the
# version off the tag and never off an input.
#
# The version is the tag's, and nowhere else: `scripts/release/stamp-version.sh`
# writes it into every manifest in this checkout, which is why no manifest in
# the repository holds one (`ci/version-fields.test.ts`).
#
# The registries are published to by trusted publishing, with no stored
# token: npm and crates.io each trust this workflow's OIDC identity, and the
# GitHub release is made with the job's own token. Trusted publishing is
# configured per package, at npmjs.com for `@withmarfa/core` and
# `@withmarfa/client` and at crates.io for `marfa-client`, and only on a
# package that already exists. So each package's first version is published
# by hand from a run's artifacts, its trusted publisher configured, and only
# then does this workflow publish it. A tag before that stops at the publish
# job's preflight, which names the package it cannot publish, with nothing
# sent.
#
# Each trusted publisher names the owner `withmarfa`, the repository
# `marfa`, the workflow `release.yml` and no environment; npm's must allow
# `npm publish`. crates.io records the repository's owner by id, so a
# transferred repository needs its publisher made again. Neither registry
# checks the ref, so what keeps a publish to a tag is this file's own
# condition on the publish job: a branch that edits it can publish, which is
# why only the maintainer's tags reach it and why it is reviewed like code.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "The version a tag would carry, for a dry run that publishes nothing"
        required: true

# Never cancel a release in flight. The key is per ref, so a second push of
# the same tag queues behind the first; two different tags run side by side.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  require-green-ci:
    name: Require green CI
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # A tag has to point at a commit that went through `ci.yml` on `main`.
      # A pull request's head passes `ci.yml` too, and under squash merges it
      # never reaches `main`, so the run asked for is a push to `main`, not
      # any green run on the SHA. Verifying that run is stronger than
      # recomputing it here: the steps below would pass against the tag's
      # own tree either way. This is why `ci.yml` does not cancel a
      # superseded run on `main`: a canceled run is not a successful one.
      #
      # A dry run publishes nothing, so it asks only that `ci.yml` passed at
      # the commit by any event, which lets a branch that changes this
      # workflow dry-run it before it merges.
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          query="head_sha=$GITHUB_SHA&status=success"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            query="$query&event=push&branch=main"
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?$query" --jq '.total_count')
          if [ "${runs:-0}" -lt 1 ]; then
            echo "::error::No successful ci.yml run for $GITHUB_SHA ($query). A release refuses a commit that has not passed CI."
            exit 1
          fi
          echo "ci.yml is green for $GITHUB_SHA ($query)"

  build:
    name: Build the artifacts
    needs: require-green-ci
    runs-on: [self-hosted, macOS, ARM64, withmarfa, aic-mbp]
    # Local jobs share machine resources and must not contend.
    concurrency:
      group: marfa-suite-shared-host
      cancel-in-progress: false
      queue: max
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Read through the environment and held to the version grammar before
      # anything uses it: a ref name or an input may carry characters a shell
      # would act on if it were substituted into a script.
      - name: Read the version off the tag
        id: version
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$DRY_RUN_VERSION"
            echo "a dry run: the version is the input's, and nothing is published"
          else
            ref="${GITHUB_REF#refs/tags/}"
            if [ "$ref" = "$GITHUB_REF" ]; then
              echo "::error::A release runs at a tag ref; $GITHUB_REF is not one."
              exit 1
            fi
            version="${ref#v}"
          fi
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The tag names no major.minor.patch version."
            exit 1
          fi
          # Each version is the one before it plus 0.0.1, and the first is
          # 0.0.1, so every version is 0.0.N, follows the highest 0.0.M below
          # it, and has none released above it: a tag re-made in a gap is not
          # the next version. The tag being released is on the remote already,
          # so it is set aside. Read off the remote, which needs no history,
          # and never through a pipe whose empty answer would fail the step
          # unexplained.
          IFS=. read -r major minor patch <<< "$version"
          if [ "$major.$minor" != "0.0" ]; then
            echo "::error::$version is not 0.0.N; every version steps by 0.0.1."
            exit 1
          fi
          # Whether a version has a public release: "true", "false", or the
          # step fails, so a lookup that errs is never read as either.
          released() {
            local answer
            if answer=$(gh release view "v0.0.$1" --json isDraft --jq .isDraft 2>&1); then
              [ "$answer" = "false" ] && echo true || echo false
            elif grep -q "release not found" <<< "$answer"; then
              echo false
            else
              echo "::error::Could not ask whether 0.0.$1 is released: $answer" >&2
              return 1
            fi
          }
          remote_tags=$(git ls-remote --tags --refs origin 'refs/tags/v0.0.*')
          previous=-1
          above=()
          while read -r _ tag; do
            [ -n "$tag" ] || continue
            n="${tag#refs/tags/v0.0.}"
            [[ "$n" =~ ^(0|[1-9][0-9]*)$ ]] || continue
            if [ "$n" -lt "$patch" ] && [ "$n" -gt "$previous" ]; then previous="$n"; fi
            if [ "$n" -gt "$patch" ]; then above+=("$n"); fi
          done <<< "$remote_tags"
          # A version above this one that is only tagged is waiting on this
          # one, as two tags pushed together are; one that is released means
          # this tag was made in a gap.
          for n in "${above[@]}"; do
            state=$(released "$n")
            if [ "$state" = "true" ]; then
              echo "::error::0.0.$n is already released, so $version is not the next version."
              exit 1
            fi
          done
          expected=$((previous < 0 ? 1 : previous + 1))
          if [ "$patch" != "$expected" ]; then
            echo "::error::$version does not follow the tags before it; the next version is 0.0.$expected."
            exit 1
          fi
          # The version before it has to be released, and this commit has to
          # come after that one's. Two tags pushed together would otherwise
          # run side by side, and a tag on an older commit of main would
          # release less than the version it follows. Asked of the API, which
          # needs no history in this shallow checkout. A compare that fails
          # fails the step rather than reading as either answer.
          if [ "$previous" -ge 0 ]; then
            state=$(released "$previous")
            if [ "$state" != "true" ]; then
              echo "::error::0.0.$previous is tagged but not released; release it before $version."
              exit 1
            fi
            relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/v0.0.$previous...$GITHUB_SHA" --jq .status)
            if [ "$relation" != "ahead" ]; then
              echo "::error::$GITHUB_SHA is $relation of v0.0.$previous; a release's commit comes after the one before it."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "building $version from $GITHUB_SHA"

      # Homebrew rustup can be on PATH while its compiler proxies are not.
      - name: Put Rust executables on PATH
        run: |
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The stamp's `cargo update` runs offline, so it needs every crate the
      # lockfiles name already in the cargo cache. `--locked` refuses rather
      # than resolving anew.
      - name: Fetch the crates the lockfiles name
        run: |
          cargo fetch --locked --manifest-path core/Cargo.toml
          cargo fetch --locked --manifest-path core/bindings/swift/Cargo.toml

      # Before the install, because the install records every package's
      # version and the workspace refuses a script once one differs from
      # that record (`verifyDepsBeforeRun`). The lockfile holds no workspace
      # version, so a frozen install passes over the stamped manifests.
      - name: Stamp the version into every manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/release/stamp-version.sh "$VERSION"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Build and pack @withmarfa/core
        working-directory: core/bindings/node
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          pnpm --ignore-workspace install --frozen-lockfile
          pnpm --ignore-workspace run build
          pnpm --ignore-workspace pack --pack-destination "$RUNNER_TEMP/artifacts"
          bash "$GITHUB_WORKSPACE/scripts/release/hold-tarball.sh" "$RUNNER_TEMP/artifacts/withmarfa-core-$VERSION.tgz" \
            index.js index.d.ts marfa-core.darwin-arm64.node

      - name: Build the binary for macOS
        working-directory: core
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo build --release -p marfa-cli
          reported=$(target/release/marfa --version)
          if [ "$reported" != "marfa $VERSION" ]; then
            echo "::error::The binary reports '$reported', not 'marfa $VERSION'."
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/artifacts/marfa-$VERSION-darwin-arm64.tar.gz" -C target/release marfa

      - name: Pack @withmarfa/client
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm --filter @withmarfa/client pack --pack-destination "$RUNNER_TEMP/artifacts"
          bash scripts/release/hold-tarball.sh "$RUNNER_TEMP/artifacts/withmarfa-client-$VERSION.tgz" \
            dist/index.js dist/index.d.ts

      # `--allow-dirty` because the stamp just wrote the version into the
      # manifests of this checkout, which is the only place it lives.
      - name: Package the marfa-client crate
        working-directory: core
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo package -p marfa-client --allow-dirty
          cp "target/package/marfa-client-$VERSION.crate" "$RUNNER_TEMP/artifacts/"

      # What the release moved on the published surface, against the lock
      # at the release before it. The first release has none to compare.
      - name: Write the published surface's delta
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          out="$RUNNER_TEMP/artifacts/surface-delta-$VERSION.md"
          if [ "$PREVIOUS" -lt 0 ]; then
            pnpm exec tsx scripts/release/surface-delta.ts packages/server/published-surface-lock.json > "$out"
          else
            git fetch --depth 1 origin "refs/tags/v0.0.$PREVIOUS:refs/tags/v0.0.$PREVIOUS"
            git show "v0.0.$PREVIOUS:packages/server/published-surface-lock.json" > "$RUNNER_TEMP/previous-lock.json"
            pnpm exec tsx scripts/release/surface-delta.ts packages/server/published-surface-lock.json "$RUNNER_TEMP/previous-lock.json" > "$out"
          fi
          cat "$out"

      # Exactly the five the publish job reads, by name: an upload that only
      # refuses an empty folder would carry a run missing one.
      - name: Hold the artifacts to the five a release carries
        working-directory: ${{ runner.temp }}/artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected=$(printf '%s\n' \
            "marfa-$VERSION-darwin-arm64.tar.gz" \
            "marfa-client-$VERSION.crate" \
            "surface-delta-$VERSION.md" \
            "withmarfa-client-$VERSION.tgz" \
            "withmarfa-core-$VERSION.tgz" | LC_ALL=C sort)
          found=$(for file in *; do printf '%s\n' "$file"; done | LC_ALL=C sort)
          if [ "$found" != "$expected" ]; then
            echo "::error::The artifacts are not the five a release carries."
            diff <(echo "$expected") <(echo "$found") || true
            exit 1
          fi
          for file in $found; do
            if [ ! -s "$file" ]; then
              echo "::error::$file is empty."
              exit 1
            fi
          done
          echo "$found"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error

  # Never reached by a dry run. Ordered so a failure part way leaves what a
  # re-run of the same tag can finish, and never a version half out: the
  # preflight asks every registry what it holds, and every registry that
  # will be published to is shown to trust this run, before anything is
  # made; the draft release, which can be undone, comes next; the
  # registries, which never take a version back, come after it; and the
  # release is made public only once everything is out. Every step asks
  # whether its version is already there and skips if it is, so a re-run
  # repeats nothing.
  #
  # Publishing needs the GitHub-hosted OIDC identity trusted by npm.
  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # Node 24's npm, rather than a newer one installed into a job that can
      # mint publishing identities. 11.5.1 is the first npm that publishes by
      # trusted publishing, so an older one stops the job here.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require an npm that publishes by OIDC
        run: |
          version=$(npm --version)
          if ! node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1);
          ' "$version"; then
            echo "::error::npm $version cannot publish by trusted publishing; 11.5.1 is the first that can."
            exit 1
          fi
          echo "npm $version"

      # Trusted publishing is configured per package, and only on a package
      # that exists, so a package this workflow has never published stops
      # the job here, before anything is sent, until its first version is
      # published by hand and its trusted publisher configured. Said plainly:
      # what will be published, what is already there, and what cannot be.
      - name: Say what will be published
        id: plan
        run: |
          publish=()
          present=()
          missing=()
          npm_packages=()
          crate=false
          # `npm view` answers a version it has, nothing for a version it has
          # not of a package it has, and E404 for a package it has not. Each
          # answer is assigned before it is read, so a lookup that errs fails
          # the step rather than reading as either answer.
          npm_state() {
            local found err
            err=$(mktemp)
            if found=$(npm view "$1" version 2> "$err"); then
              [ -n "$found" ] && echo present || echo absent
            elif grep -q E404 "$err"; then
              echo absent
            else
              echo "::error::npm could not be asked about $1:" >&2
              cat "$err" >&2
              return 1
            fi
          }
          for name in @withmarfa/core @withmarfa/client; do
            version_state=$(npm_state "$name@$VERSION")
            package_state=$(npm_state "$name")
            if [ "$version_state" = present ]; then
              present+=("$name@$VERSION on npm")
            elif [ "$package_state" = present ]; then
              publish+=("$name@$VERSION to npm")
              npm_packages+=("$name")
            else
              missing+=("$name, which npm has never published")
            fi
          done
          # crates.io answers 200 for a crate or version it has and 404 for
          # one it has not.
          crate_state() {
            local status
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "withmarfa-release" "https://crates.io/api/v1/crates/$1")
            case "$status" in
              200) echo present ;;
              404) echo absent ;;
              *) echo "::error::crates.io answered $status for $1." >&2; return 1 ;;
            esac
          }
          version_state=$(crate_state "marfa-client/$VERSION")
          package_state=$(crate_state marfa-client)
          if [ "$version_state" = present ]; then
            present+=("marfa-client $VERSION on crates.io")
          elif [ "$package_state" = present ]; then
            publish+=("marfa-client $VERSION to crates.io")
            crate=true
          else
            missing+=("marfa-client, which crates.io has never published")
          fi
          for line in "${publish[@]}"; do echo "will publish $line"; done
          for line in "${present[@]}"; do echo "already there: $line"; done
          if [ "${#missing[@]}" -gt 0 ]; then
            for line in "${missing[@]}"; do
              echo "::error::Nothing was published: $line. Publish its first version by hand from this run's artifacts (a .crate is unpacked and published from its directory), configure trusted publishing for it, then re-run this job."
            done
            exit 1
          fi
          echo "npm=${npm_packages[*]}" >> "$GITHUB_OUTPUT"
          echo "crate=$crate" >> "$GITHUB_OUTPUT"

      # npm checks a trusted publisher only when a publish asks for one, so a
      # package whose publisher is missing or misspelled would otherwise be
      # found only after the crate had gone out. This asks npm for the same
      # exchange `npm publish` makes, for each package about to be
      # published, and publishes nothing: the token it answers with expires
      # unused.
      - name: Require npm to trust this run
        if: steps.plan.outputs.npm != ''
        env:
          PACKAGES: ${{ steps.plan.outputs.npm }}
        run: |
          for name in $PACKAGES; do
            # A fresh identity for each exchange, as `npm publish` mints one.
            if ! identity=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value) \
              || [ -z "$identity" ] || [ "$identity" = null ]; then
              echo "::error::GitHub minted no OIDC identity for npm. Nothing was published."
              exit 1
            fi
            escaped=${name/\//%2f}
            if ! status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $identity" -H "Content-Length: 0" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$escaped"); then
              echo "::error::npm could not be reached to ask whether it trusts this run for $name. Nothing was published."
              exit 1
            fi
            case "$status" in
              2??) echo "npm trusts this run for $name" ;;
              5??)
                echo "::error::npm answered $status when asked whether it trusts this run for $name. Nothing was published."
                exit 1
                ;;
              *)
                echo "::error::npm answered $status to this run's identity for $name: its trusted publisher is not this repository and release.yml. Nothing was published."
                exit 1
                ;;
            esac
          done

      # A token crates.io mints for this run from the job's OIDC identity,
      # scoped to the crates that trust this workflow, and revoked when the
      # job ends; it would expire thirty minutes after minting in any case,
      # which is the job's own limit. Before anything is made, so a crate
      # that does not trust this workflow stops the job with nothing sent.
      - name: Authenticate to crates.io
        id: crates-io
        if: steps.plan.outputs.crate == 'true'
        uses: rust-lang/crates-io-auth-action@v1

      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.build.outputs.version }}
          path: artifacts

      # A draft, so it can be removed, and seen by nobody until it is made
      # public at the end. A release already there keeps every file it holds,
      # which are the ones a registry may already have: re-running the failed
      # job reads this run's artifacts, but a full re-run builds them again.
      # A draft is given only the files it lacks; a public one is left alone.
      # A lookup that errs fails the step rather than reading as no release,
      # which would make a second draft for the same tag.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/release-view.err"); then
            if [ "$draft" = "false" ]; then
              echo "v$VERSION is already released"
              exit 0
            fi
            held=$(gh release view "v$VERSION" --json assets --jq '.assets[].name')
            for file in artifacts/*; do
              if ! grep -qx "$(basename "$file")" <<< "$held"; then
                gh release upload "v$VERSION" "$file"
              fi
            done
          elif grep -q "release not found" "$RUNNER_TEMP/release-view.err"; then
            gh release create "v$VERSION" artifacts/* \
              --draft \
              --title "v$VERSION" \
              --notes-file "artifacts/surface-delta-$VERSION.md" \
              --verify-tag
          else
            echo "::error::Could not ask whether v$VERSION has a release:"
            cat "$RUNNER_TEMP/release-view.err"
            exit 1
          fi

      # `CARGO_REGISTRY_TOKEN` is the variable cargo reads, holding the
      # token the step above minted for this run, never a stored one.
      - name: Publish marfa-client to crates.io
        if: steps.plan.outputs.crate == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "withmarfa-release" \
            "https://crates.io/api/v1/crates/marfa-client/$VERSION")
          case "$status" in
            200)
              echo "marfa-client $VERSION is already on crates.io"
              exit 0
              ;;
            404) ;;
            *)
              echo "::error::crates.io answered $status for marfa-client $VERSION."
              exit 1
              ;;
          esac
          mkdir -p "$RUNNER_TEMP/crate"
          tar -xzf "artifacts/marfa-client-$VERSION.crate" -C "$RUNNER_TEMP/crate"
          # Published from the build job's archive, unpacked, rather than from
          # the checkout, which would need the version stamped again. Its
          # manifest is the normalized one cargo wrote; the original beside it
          # is a name cargo reserves for itself and refuses to package. cargo
          # packs these sources again to send them, outside git, so the
          # archive crates.io holds has the same manifest and sources as the
          # one the release carries but not its VCS record or the generator's
          # dotfiles, and its checksum differs. `--no-verify` because
          # `cargo package` in the build job already built these sources.
          rm "$RUNNER_TEMP/crate/marfa-client-$VERSION/Cargo.toml.orig"
          cargo publish --no-verify --manifest-path "$RUNNER_TEMP/crate/marfa-client-$VERSION/Cargo.toml"

      # By trusted publishing: npm exchanges the job's OIDC identity itself,
      # so no token is set anywhere. No `--provenance`: npm attests
      # provenance from a public repository only.
      - name: Publish @withmarfa/core and @withmarfa/client to npm
        run: |
          for package in core client; do
            name="@withmarfa/$package"
            if found=$(npm view "$name@$VERSION" version 2> "$RUNNER_TEMP/npm-view.err"); then
              if [ "$found" = "$VERSION" ]; then
                echo "$name@$VERSION is already on npm"
                continue
              fi
            elif ! grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
              cat "$RUNNER_TEMP/npm-view.err"
              exit 1
            fi
            # A path, not `artifacts/…`, which npm reads as GitHub shorthand
            # for a repository and tries to clone.
            npm publish "./artifacts/withmarfa-$package-$VERSION.tgz" --access public
          done

      - name: Make the GitHub release public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --draft=false
