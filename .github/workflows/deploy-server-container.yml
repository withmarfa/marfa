# Build + deploy the Marfa server to Cloudflare Containers.
#
# Three jobs, all on GitHub-hosted ubuntu-latest:
#   build-push  builds the linux/amd64 image NATIVELY (Cloudflare Containers
#               run linux/amd64, the runner is amd64 — no QEMU emulation), then
#               pushes it to Cloudflare's managed registry under the immutable
#               per-build tag <env>-<short-sha>.
#   migrate     applies pending DB migrations against the env's DIRECT Neon URL.
#   deploy      renders wrangler.jsonc and rolls the Worker + container,
#               referencing the SAME <env>-<short-sha> tag so wrangler actually
#               rolls the new image (a reused mutable tag would no-roll silently).
#
# Building natively on a hosted amd64 runner replaces the previous fragile path
# (local Docker / a self-hosted arm64 runner cross-compiling via QEMU). Hosted
# is also required because a public-repo self-hosted runner is an
# arbitrary-code-execution risk.
#
# Manual trigger only — this is the riskiest deploy. The Worker's runtime
# secrets (the pooled DATABASE_URL, MARFA_DATABASE_URL_DIRECT, MARFA_AUTH_SECRET,
# ...) are set out-of-band via infra/cloudflare/scripts/init-server-container-secrets.sh
# and persist on the Worker; this workflow does not set them.
#
# Nothing triggers this automatically, so a merge to main changes nothing until
# someone dispatches it. That matters most for the Worker's `envVars` map in
# infra/cloudflare/server-container/src/index.ts: the container reads those at
# launch, so a change there is inert until the WORKER rolls, whether or not the
# image changed. The two orders are not equally safe — old image plus new Worker
# is harmless (extra variables the image ignores), while new image plus old
# Worker is broken AND silent, because the image takes its "unset" branch for
# config the Worker never forwarded and reports nothing. Dispatch this workflow
# whenever `envVars` changes, even for an image-only or config-only commit.
#
# Migrate-then-deploy: the `migrate` job applies pending Drizzle migrations
# against the target env's DIRECT (unpooled) Neon URL BEFORE the container
# rolls. The server does not migrate on boot, so a schema-bearing image would
# otherwise crash-loop against the old schema (Cloudflare surfaces a generic
# "Failed to start container" 500 that masks the cause). `deploy` needs both
# `build-push` and `migrate`, so a failed migration blocks the rollout and the
# container is never started against an unmigrated DB. The deploy job passes
# SKIP_MIGRATE=1 because the gating `migrate` job has already applied them.
#
# Required GitHub config (org or repo):
#   secrets.CLOUDFLARE_API_TOKEN      marfa-account token (CLOUDFLARE_API_TOKEN_MARFA)
#   secrets.CLOUDFLARE_ACCOUNT_ID     marfa account id
#   secrets.NEON_DATABASE_URL_STAGING direct (unpooled) Neon URL, staging project
#   secrets.NEON_DATABASE_URL_PROD    direct (unpooled) Neon URL, production project
#   vars.STAGING_API_BASE_URL         branded public host (e.g. https://staging.marfa.so);
#                                     drives the auth base URL / OAuth issuer
#   vars.STAGING_CORS_ORIGINS         comma-separated browser origins that call the API
#   vars.PROD_CORS_ORIGINS            comma-separated browser origins for prod (e.g.
#                                     https://app.marfa.so); optional — the deploy script
#                                     defaults to https://api.marfa.so only when unset
#   vars.STAGING_WORKERS_SUBDOMAIN    optional — account workers.dev subdomain. Leave
#                                     UNSET so the auth base URL derives from
#                                     STAGING_API_BASE_URL (the branded host); setting it
#                                     points the OAuth issuer at *.workers.dev and breaks
#                                     a sign-in that starts on the branded host.

name: Deploy server container

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, prod]
        default: staging

concurrency:
  group: deploy-server-container-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  # Build the linux/amd64 image NATIVELY on a GitHub-hosted amd64 runner — no
  # QEMU emulation, no local-Docker dependency. Push it to Cloudflare's managed
  # registry under the immutable per-build tag <env>-<short-sha> so the deploy
  # job references the exact bits built here.
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: echo "tag=${ENVIRONMENT}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Build linux/amd64 image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f packages/server/Dockerfile \
            --build-arg VERSION_SHA="${GITHUB_SHA::7}" \
            -t "marfa-server:${IMAGE_TAG}" \
            --load .
      - name: Push to Cloudflare managed registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # wrangler is a dependency of the server-container workspace package,
          # not a root dep, so a root-level `pnpm exec wrangler` can't resolve
          # it. Put that package's node_modules/.bin on PATH (same approach as
          # the deploy job's bare `wrangler deploy`).
          export PATH="$PWD/infra/cloudflare/server-container/node_modules/.bin:$PWD/node_modules/.bin:$PATH"
          wrangler containers push "marfa-server:${IMAGE_TAG}"

  # Apply pending DB migrations BEFORE the container rolls. Gates `deploy`:
  # a failed migration here blocks the rollout, so the container never starts
  # against an unmigrated schema. Uses the DIRECT (unpooled) Neon URL — the
  # running app uses the pooled URL (a Worker secret set out-of-band).
  migrate:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations (direct Neon URL)
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          NEON_DATABASE_URL_STAGING: ${{ secrets.NEON_DATABASE_URL_STAGING }}
          NEON_DATABASE_URL_PROD: ${{ secrets.NEON_DATABASE_URL_PROD }}
        run: ./infra/cloudflare/scripts/migrate-server-db.sh "$ENVIRONMENT"
      # Seed the fixed first-party OAuth clients (idempotent) right after
      # migrations, on the same direct URL. The browser apps use stable
      # client_ids rather than per-browser DCR, so a DB reset would otherwise
      # orphan every cached client; running this each deploy self-heals it.
      # Lives in the migrate job (not deploy) because the deploy job passes
      # SKIP_MIGRATE=1 and carries no DB URL.
      - name: Seed first-party OAuth clients (direct Neon URL)
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          NEON_DATABASE_URL_STAGING: ${{ secrets.NEON_DATABASE_URL_STAGING }}
          NEON_DATABASE_URL_PROD: ${{ secrets.NEON_DATABASE_URL_PROD }}
        run: ./infra/cloudflare/scripts/seed-server-oauth-clients.sh "$ENVIRONMENT"

  deploy:
    needs: [build-push, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Deploy Worker + container
        env:
          # Migrations already applied by the gating `migrate` job — don't repeat
          # them in the deploy script (and the deploy job carries no DB URL).
          SKIP_MIGRATE: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # When STAGING_WORKERS_SUBDOMAIN is empty, the deploy script derives
          # the auth base URL (OAuth issuer, cookie domain, device + email
          # verification links) from STAGING_API_BASE_URL instead of the raw
          # `*.workers.dev` origin. Set the latter to the branded public host so
          # the issuer advertised on /.well-known/openid-configuration matches
          # where clients actually reach the server — otherwise a browser
          # sign-in redirect lands on a different origin and the session cookie
          # doesn't carry. STAGING_CORS_ORIGINS must list every browser origin
          # that calls the API with credentials.
          STAGING_WORKERS_SUBDOMAIN: ${{ vars.STAGING_WORKERS_SUBDOMAIN }}
          STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          STAGING_CORS_ORIGINS: ${{ vars.STAGING_CORS_ORIGINS }}
          # Prod CORS origins. The deploy script defaults to api.marfa.so only;
          # set this so the prod web app (app.marfa.so) can call the API with
          # credentials. An unset var renders empty and falls back to the default.
          PROD_CORS_ORIGINS: ${{ vars.PROD_CORS_ORIGINS }}
          # Durable blob storage on R2 (S3 API) for the hosted deploy — the
          # container's local filesystem is ephemeral (scale-to-zero wipes it).
          # The S3 credential secrets (S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY)
          # must already be on the Worker; the deploy script's guard aborts the
          # s3 deploy otherwise. Bucket (marfa-blobs-<env>) + endpoint are
          # derived per-env by the deploy script. Self-host deploys keep the
          # script's `fs` default — this is hosted-Marfa-specific.
          V_BLOB_BACKEND: "s3"
          SERVER_IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          # wrangler is a dependency of the server-container workspace package,
          # not a root dep — so it lives in that package's node_modules/.bin,
          # not the repo root. Put that on PATH so the deploy script's bare
          # `wrangler deploy` resolves on CI (a global wrangler may mask this
          # locally, hiding the gap).
          export PATH="$PWD/infra/cloudflare/server-container/node_modules/.bin:$PWD/node_modules/.bin:$PATH"
          ./infra/cloudflare/scripts/deploy-server-container.sh "$ENVIRONMENT"
