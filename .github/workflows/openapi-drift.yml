# Freshness guard for the published API reference.
#
# `openapi.json` is generated here and copied into withmarfa/docs by
# `sync-openapi-to-docs.yml`. Two things can leave the published reference
# wrong: a hand-edit in the docs repo, or a sync that silently stopped running.
# This compares the two copies and fails when they diverge.
#
# **It runs here rather than in the docs repo because the credential is here.**
# A workflow's built-in token reaches only its own repository, and both repos
# are private, so the comparison needs a cross-repo credential either way. The
# sync already holds one. Asking the question from this end reuses it; asking
# from the docs end would mean provisioning and rotating a second token to
# learn the same thing.
#
# **Scheduled rather than on push**, because the sync opens a pull request
# rather than committing directly. The sync now enables auto-merge on it, so
# that pull request closes itself once its check passes, but not instantly:
# for the window between a spec change landing here and that check finishing,
# the two copies legitimately differ, and a push trigger would fail on every
# spec change. A daily check ignores that window and still catches what is
# left, which is a sync that failed or a pull request whose check did not
# pass.
name: OpenAPI drift

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  SPEC_TARGET_REPO: withmarfa/docs
  # The repository the comparison is mandatory on. A fork or a self-hoster's
  # copy cannot hold the credential, so it skips rather than failing on
  # something it has no way to fix.
  SPEC_CANONICAL_REPO: withmarfa/marfa

jobs:
  drift:
    name: Published spec matches this one
    timeout-minutes: 10
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Compare the published copy against this one
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          # Every branch that ends this step writes its finding into
          # `finding/` before it exits. The `Publish the finding` step prints
          # it, and it runs on `if: always()` — which is what carries a
          # finding out of a failed job. Nothing here infers a verdict from
          # silence: a `run:` block
          # runs under `bash -e`, so a failing `gh api` kills this step where
          # it stands, and the absence of a verdict has to mean "nothing was
          # established" rather than "the two match".
          mkdir -p finding

          if [ -z "${GH_TOKEN:-}" ]; then
            # Neither branch compared anything, so neither can say the two
            # agree. A guard that reached no verdict reports inconclusive.
            echo inconclusive > finding/verdict
            if [ "${GITHUB_REPOSITORY}" = "${SPEC_CANONICAL_REPO}" ]; then
              echo "::error title=Drift guard cannot run::DOCS_SYNC_TOKEN is not set on ${GITHUB_REPOSITORY}, so openapi.json was never compared against ${SPEC_TARGET_REPO}. Failing rather than passing: a guard that cannot run must not report green."
              exit 1
            fi
            echo "::warning title=Cross-repo check skipped::DOCS_SYNC_TOKEN is not set on ${GITHUB_REPOSITORY}, which is not ${SPEC_CANONICAL_REPO}."
            exit 0
          fi

          gh api \
            -H "Accept: application/vnd.github.raw" \
            "repos/${SPEC_TARGET_REPO}/contents/openapi.json" > published-openapi.json

          # `cmp` is the whole of the pass/fail decision and stays that way.
          # The comparison below runs only after this has already said the
          # two differ, and it describes that difference rather than deciding
          # anything about it.
          if cmp -s published-openapi.json openapi.json; then
            echo "${SPEC_TARGET_REPO} matches this spec."
            echo current > finding/verdict
            exit 0
          fi
          echo drifted > finding/verdict

          # The repair changed when the sync started merging its own pull
          # request. Before that, a red guard usually meant a pull request
          # nobody had merged, and it said so. Now that is the case that
          # should not happen, so the message says what to look at rather
          # than what to do: the sync's own run, and whether its pull
          # request is open. This guard's expected state is green.
          echo "::error title=Published spec is stale::${SPEC_TARGET_REPO} differs from the spec generated here. The sync enables auto-merge on the pull request it opens, so this means either its last run failed, or that pull request is open with a failing check. Check the 'Sync openapi.json to docs' run for the spec change that landed here, and ${SPEC_TARGET_REPO} for an open sync pull request."
          python3 - <<'PY'
          import json, pathlib

          published = json.load(open('published-openapi.json'))
          current = json.load(open('openapi.json'))
          pub, cur = published.get('paths', {}), current.get('paths', {})

          # A changed operation body counts as a differing path. Comparing the
          # parsed documents rather than their bytes is what makes that
          # countable, and it is why the count can be zero on a file `cmp`
          # says differs: a reformat moves bytes without moving anything a
          # reader of the reference would notice.
          added = sorted(set(cur) - set(pub))
          removed = sorted(set(pub) - set(cur))
          changed = sorted(p for p in set(pub) & set(cur) if pub[p] != cur[p])
          sections = sorted(
              k for k in set(published) | set(current)
              if k != 'paths' and published.get(k) != current.get(k)
          )

          for label, paths in (('missing from docs', added),
                               ('no longer generated', removed),
                               ('operation differs', changed)):
              for path in paths:
                  print(f'{label}: {path}')
          for section in sections:
              print(f'section differs: {section}')

          total = len(added) + len(removed) + len(changed)
          if total:
              detail = f'{total} path differs from main' if total == 1 \
                  else f'{total} paths differ from main'
          elif sections:
              detail = 'differs from main outside its paths'
          else:
              print('no path and no section differs; the files differ in formatting alone')
              detail = 'differs from main in formatting only'

          def summarize(label, paths, cap=8):
              shown = ', '.join(paths[:cap])
              extra = len(paths) - cap
              return f'{label}: {shown}' + (f', and {extra} more' if extra > 0 else '')

          parts = [summarize(label, paths)
                   for label, paths in (('missing from docs', added),
                                        ('no longer generated', removed),
                                        ('operation differs', changed))
                   if paths]

          out = pathlib.Path('finding')
          out.joinpath('detail').write_text(detail + '\n')
          if parts:
              out.joinpath('paths').write_text('; '.join(parts) + '\n')
          if sections:
              out.joinpath('sections').write_text(', '.join(sections) + '\n')
          PY
          exit 1

      # Prints the finding to the job log, so a reader sees what the
      # difference was rather than only that there was one; `if: always()`
      # is what carries a finding out of a job that failed. The default
      # verdict is `inconclusive` rather than `current`, so a step that died
      # before reaching a verdict cannot report agreement.
      #
      # **`finding/` must not survive between runs, and on this job that is
      # not free.** The pool reuses the workspace rather than giving each run
      # a fresh container. A `finding/verdict` left saying `current` by
      # yesterday's clean run would then be read by a run whose comparison
      # died early, and would report agreement on evidence from a different
      # day. Nothing here clears it: `actions/checkout`
      # does, through its `clean` input, which defaults to true and removes
      # untracked files before fetching. That default is load-bearing, so do
      # not set `clean: false` on the checkout above without giving this
      # directory somewhere per-run to live.
      - id: finding
        if: always()
        name: Publish the finding
        env:
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          mkdir -p finding
          python3 - <<'PY'
          import json, os, pathlib

          finding = pathlib.Path("finding")

          def read(name: str) -> str:
              path = finding / name
              return path.read_text().strip() if path.exists() else ""

          server = os.environ["SERVER_URL"].rstrip("/")
          target = os.environ["SPEC_TARGET_REPO"]

          fields = {
              "Reference": f"[{target} openapi.json]"
                           f"({server}/{target}/blob/main/openapi.json)",
          }
          if read("paths"):
              fields["Paths"] = read("paths")
          if read("sections"):
              fields["Sections"] = read("sections")

          print("verdict=" + (read("verdict") or "inconclusive"))
          print("detail=" + " ".join(read("detail").split()))
          print("fields=" + json.dumps(fields, separators=(",", ":")))
          PY
