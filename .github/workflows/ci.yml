name: CI

on:
  push:
    branches: [main]
  # A draft runs only the quick jobs; marking it ready for review runs the
  # rest, and so does every push after that. `Full CI` is the required check.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Conformance and CLI scenarios run on Ubuntu, and on macOS every night and
  # when `macos` is set, so that what only macOS has stays tested: file
  # watching, name case, Finder packages and a real keychain.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      macos:
        description: Run Conformance and CLI scenarios on macOS
        type: boolean
        default: false

# Release gates need a verdict for each main commit. Even with cancellation
# disabled, a shared group replaces older pending runs; non-PR runs need
# their own groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  # Every job below runs only when `scripts/ci-required.ts` says the change
  # can affect it. A skipped job satisfies its required check, where a
  # `paths` filter on the workflow would leave the check pending. A draft
  # runs only the jobs `DRAFT_JOBS` names there, and `full` is `false` for it.
  # A push to `main` skips them only when it changes nothing but
  # documentation and this workflow passed on the commit before it, which
  # `actions: read` lets the classifier ask.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ci-sqlite: ${{ steps.classify.outputs.ci-sqlite }}
      workspace: ${{ steps.classify.outputs.workspace }}
      core-checks: ${{ steps.classify.outputs.core-checks }}
      swift-package: ${{ steps.classify.outputs.swift-package }}
      core-checks-linux: ${{ steps.classify.outputs.core-checks-linux }}
      conformance-offline: ${{ steps.classify.outputs.conformance-offline }}
      conformance-correctness-sync: ${{ steps.classify.outputs.conformance-correctness-sync }}
      conformance-compliance: ${{ steps.classify.outputs.conformance-compliance }}
      conformance-device: ${{ steps.classify.outputs.conformance-device }}
      conformance-statuses: ${{ steps.classify.outputs.conformance-statuses }}
      conformance-shards: ${{ steps.classify.outputs.conformance-shards }}
      cli-scenarios: ${{ steps.classify.outputs.cli-scenarios }}
      restore-drill: ${{ steps.classify.outputs.restore-drill }}
      image: ${{ steps.classify.outputs.image }}
      types-freshness: ${{ steps.classify.outputs.types-freshness }}
      openapi-freshness: ${{ steps.classify.outputs.openapi-freshness }}
      version-fields: ${{ steps.classify.outputs.version-fields }}
      clients-freshness: ${{ steps.classify.outputs.clients-freshness }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-required.ts

  ci-sqlite:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ci-sqlite != 'false') }}
    name: CI (SQLite)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install socket ACL inspection
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y acl
      - run: pnpm install --frozen-lockfile
      # Prettier reads Markdown as well as code, and the classifier's test
      # and the contract's reference check read the whole tree, so a
      # documentation change stops after these. A draft stops before the
      # tests.
      - run: pnpm format:check
      - run: pnpm vitest run ci/ci-required.test.ts
      - working-directory: conformance
        run: pnpm exec vitest run --project generators src/utils/spec-citations.test.ts
      - if: ${{ needs.changes.outputs.workspace != 'false' }}
        run: pnpm build
      - if: ${{ needs.changes.outputs.workspace != 'false' }}
        run: pnpm typecheck
      - if: ${{ needs.changes.outputs.workspace != 'false' }}
        run: pnpm lint
      # Cache the language model fetched by the real OCR test.
      - if: ${{ needs.changes.outputs.workspace != 'false' && needs.changes.outputs.full != 'false' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/marfa-tessdata
          key: tessdata-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The version check asks cargo how it reads the manifests, so it runs
      # in its own job and this one needs no Rust.
      - if: ${{ needs.changes.outputs.workspace != 'false' && needs.changes.outputs.full != 'false' }}
        run: MARFA_TEST_OCR=1 MARFA_ENRICHMENT_TESSDATA_DIR="$HOME/.cache/marfa-tessdata" pnpm test --exclude ci/version-fields.test.ts --exclude ci/ci-required.test.ts

  core-checks:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.core-checks != 'false') }}
    name: Core checks
    timeout-minutes: 30
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      # nextest kills a test past the budget in `core/.config/nextest.toml`.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            core/bindings/swift
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the core workspace
        working-directory: core
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings
          scripts/login-keychain-unchanged.sh cargo nextest run --locked --workspace
      - name: Check the Swift FFI crate
        working-directory: core/bindings/swift
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo nextest run --locked
      # The script marfa-swift runs at the commit it pins. cargo-swift embeds
      # one UniFFI bindgen and reads the metadata the crate's `uniffi` wrote,
      # so a bump of either alone fails here and not in marfa-swift.
      - name: Build the Swift package
        if: ${{ needs.changes.outputs.swift-package != 'false' }}
        working-directory: core/bindings/swift
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: ./build.sh

  # The core workspace on Linux, where the credential store that is not the
  # macOS keychain, and the in-memory test keychain it uses, are built, linted
  # and tested. `Core checks` keeps the macOS keychain and the Apple builds.
  # It leaves out the login keychain check, which needs macOS's `security`,
  # and the Swift crate, which ships only to Apple systems.
  core-checks-linux:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.core-checks-linux != 'false') }}
    name: Core checks (Linux)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # nextest kills a test past the budget in `core/.config/nextest.toml`.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install socket ACL inspection
        run: sudo apt-get update && sudo apt-get install -y acl
      - name: Check the core workspace
        working-directory: core
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings
          cargo nextest run --locked --workspace

  # The contract, run against the server in this same checkout.
  #
  # No pinned server commit and no second checkout: a suite gating a SHA
  # somebody had to remember to move would make a server change and the
  # contract change that admits it two pull requests, with the gate
  # answering about neither tree. Here the tree under test is the tree the
  # suite runs against.
  #
  # Jobs in this workflow rather than a workflow of their own, because
  # `release.yml` names `ci.yml` as the run a commit must be green on before
  # it can be released. A published package should not be able to come from
  # a commit the contract failed.
  #
  # The suite is one serial process per runner, so its time is its files'
  # time added up. It is run as shards, each on a runner that boots its own
  # object store and server: the fixtures isolate themselves by credential
  # and share nothing between files. `scripts/ci-required.ts` says which
  # groups of fixtures a change can affect and how many shards each group
  # has, and writes the matrix. A group of more than one shard splits its
  # files by the time they take (`conformance/src/utils/shard-sequencer.ts`).
  # `Conformance` below collects them into one verdict.
  conformance-shards:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.conformance-shards != '[]') }}
    name: Conformance shard (${{ matrix.name }})
    timeout-minutes: 30
    runs-on: ${{ (github.event_name == 'schedule' || inputs.macos) && 'macos-26' || 'ubuntu-latest' }}
    strategy:
      # Every shard reports, so one failure shows all the others there are.
      fail-fast: false
      matrix:
        # The whole layout, for a classifier that did not answer; the
        # classifier's test holds it to `conformanceShards`.
        include: ${{ fromJSON(needs.changes.outputs.conformance-shards || '[{"name":"correctness and sync","slug":"correctness-sync","args":"--project correctness --project sync","device":false},{"name":"compliance 1/4","slug":"compliance-1","args":"--project compliance --shard=1/4","device":false},{"name":"compliance 2/4","slug":"compliance-2","args":"--project compliance --shard=2/4","device":false},{"name":"compliance 3/4","slug":"compliance-3","args":"--project compliance --shard=3/4","device":false},{"name":"compliance 4/4","slug":"compliance-4","args":"--project compliance --shard=4/4","device":false},{"name":"device 1/4","slug":"device-1","args":"--project device --shard=1/4","device":true},{"name":"device 2/4","slug":"device-2","args":"--project device --shard=2/4","device":true},{"name":"device 3/4","slug":"device-3","args":"--project device --shard=3/4","device":true},{"name":"device 4/4","slug":"device-4","args":"--project device --shard=4/4","device":true}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install socket ACL inspection
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y acl
      - run: pnpm install --frozen-lockfile
      # `marfa:up` runs the server through tsx, which resolves
      # @withmarfa/shared through its dist.
      - run: pnpm --filter "@withmarfa/server..." build

      # Only the device fixtures drive the `marfa` binary. A pull request
      # that leaves the crates alone reuses the binary `main` built from the
      # same sources and runs no Rust. A push, the nightly and a dispatch
      # always build it, with the current compiler.
      - name: Key the device under test
        id: device-key
        if: ${{ matrix.device }}
        run: echo "key=marfa-$RUNNER_OS-${{ hashFiles('core/**', '!core/bindings/**', '!core/scripts/**', '!core/.config/**', '!core/target/**', '!core/*/tests/**', '!core/**/*.md', '.github/workflows/ci.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the device under test
        id: device
        if: ${{ matrix.device && github.event_name == 'pull_request' }}
        uses: actions/cache/restore@v6
        with:
          path: core/target/debug/marfa
          key: ${{ steps.device-key.outputs.key }}
      # Restored with the time it was built, which the device suite reads as
      # older than this checkout's sources; the key vouches that they match.
      - if: ${{ matrix.device && steps.device.outputs.cache-hit == 'true' }}
        run: touch core/target/debug/marfa
      - if: ${{ matrix.device && steps.device.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@stable
      - if: ${{ matrix.device && steps.device.outputs.cache-hit != 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the device under test
        if: ${{ matrix.device && steps.device.outputs.cache-hit != 'true' }}
        working-directory: core
        run: cargo build -p marfa-cli
      - if: ${{ matrix.device && steps.device.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: core/target/debug/marfa
          key: ${{ steps.device-key.outputs.key }}
      - if: ${{ matrix.device }}
        run: echo "MARFA_DEVICE_BIN=$PWD/core/target/debug/marfa" >> "$GITHUB_ENV"

      # The object store the server attaches beside its disk, so the
      # object-store half of the blob chapters is asserted rather than
      # skipped. `garage:up` writes S3 settings to GITHUB_ENV for the server.
      # Off macOS it is the release the restore drill installs.
      - name: Put an object store beside the server
        working-directory: conformance
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install garage
          else
            curl --fail --location --retry 3 https://garagehq.deuxfleurs.fr/_releases/v2.4.1/x86_64-unknown-linux-musl/garage -o "$RUNNER_TEMP/garage-bin"
            sudo install -m 755 "$RUNNER_TEMP/garage-bin" /usr/local/bin/garage
          fi
          pnpm garage:up --state "$RUNNER_TEMP/garage"

      - name: Boot the server from this checkout
        working-directory: conformance
        run: |
          pnpm marfa:up --state "$RUNNER_TEMP/marfa"
          cat "$RUNNER_TEMP/marfa/env" >> "$GITHUB_ENV"

      - name: Run the shard
        working-directory: conformance
        env:
          ARGS: ${{ matrix.args }}
        run: |
          read -r -a args <<< "$ARGS"
          if [ "$RUNNER_OS" = macOS ]; then
            ../core/scripts/login-keychain-unchanged.sh pnpm exec vitest run "${args[@]}"
          else
            pnpm exec vitest run "${args[@]}"
          fi

      # Reads the log of the server the shard just drove, so it runs here
      # rather than as a job of its own and before the stop, which clears
      # the state directory the log is in. It holds every status observed to
      # its declaration. That a declared status nothing drew fails unless the
      # checker lists why nothing can (`--complete`) is a fact about the
      # whole selection and not one shard, so `Conformance statuses` checks it
      # over every shard's log.
      - name: Hold every status observed to its declaration
        working-directory: conformance
        run: pnpm check:statuses --state "$RUNNER_TEMP/marfa"

      # What `Conformance statuses` needs besides the log: the document this
      # build serves, which the log is held to.
      - name: Keep the document the server served
        run: curl --fail --silent --show-error "$MARFA_API_URL/openapi.json" --output "$RUNNER_TEMP/marfa/openapi.json"

      # Before the stop, because `marfa:down` clears the state directory and
      # the log is in it. The server is still running here, which costs
      # nothing: the log is appended to and what a failure needs is already
      # written. Kept whether or not the shard passed, since the statuses job
      # reads every shard's.
      - name: Keep the server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marfa-server-log-${{ matrix.slug }}
          overwrite: true
          path: |
            ${{ runner.temp }}/marfa/server.log
            ${{ runner.temp }}/marfa/fresh-server-logs/
            ${{ runner.temp }}/marfa/openapi.json
          if-no-files-found: ignore
          retention-days: 3

      # The detached server must be reaped even when the selection fails.
      - name: Stop the server
        if: always()
        working-directory: conformance
        run: pnpm marfa:down --state "$RUNNER_TEMP/marfa"

      - name: Stop the object store
        if: always()
        working-directory: conformance
        run: pnpm garage:down --state "$RUNNER_TEMP/garage"

  # The lane that needs no server and no object store: the generators,
  # everything under `src/utils/`, the decision tests and the checks that the
  # contract cites only what exists. A change to the contract alone runs
  # this and nothing else of the conformance jobs, but for the two chapters
  # a fixture reads.
  conformance-offline:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.conformance-offline != 'false') }}
    name: Conformance offline lane
    timeout-minutes: 20
    runs-on: ${{ (github.event_name == 'schedule' || inputs.macos) && 'macos-26' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install socket ACL inspection
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y acl
      - run: pnpm install --frozen-lockfile
      # The lane reads the type registry through the dist of the packages
      # the server is built from.
      - run: pnpm --filter "@withmarfa/server..." build
      - name: Offline lane
        working-directory: conformance
        run: pnpm test:generators

  # A declared status that no request drew is a fixture someone removed or a
  # door nobody exercises, and only the whole selection can tell: each shard
  # draws a part of the statuses and holds those to their declaration
  # itself. So this reads every shard's server log, with the document the
  # servers served, and holds the declared statuses nothing drew to the
  # checker's list of the ones nothing can draw. It runs when the change
  # reaches every group of shards: a change that reaches fewer cannot say
  # which statuses the others would have drawn, and the push to `main`
  # after it runs them all.
  conformance-statuses:
    needs: [changes, conformance-shards]
    if: ${{ !cancelled() && needs.conformance-shards.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.conformance-statuses != 'false') }}
    name: Conformance statuses
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: marfa-server-log-*
          path: ${{ runner.temp }}/shard-logs
      - name: Hold every declared status to a request
        working-directory: conformance
        run: pnpm check:statuses --shards "$RUNNER_TEMP/shard-logs" --complete

  # The conformance jobs as one verdict, which `Full CI` collects with the
  # rest. It passes when every conformance job that ran passed and when the
  # classifier skipped them all; it fails when any of them failed or was
  # cancelled, or was owed a run and skipped.
  conformance:
    needs:
      [changes, conformance-offline, conformance-shards, conformance-statuses]
    if: ${{ !cancelled() }}
    name: Conformance
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every conformance job that ran to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          # A skipped job passes only when the classifier skipped it. One it
          # owes a run that was skipped anyway is a failure.
          SHARDS: ${{ needs.conformance-shards.result }}
          SHARDS_OWED: ${{ needs.changes.outputs.conformance-shards != '[]' }}
          OFFLINE: ${{ needs.conformance-offline.result }}
          OFFLINE_OWED: ${{ needs.changes.outputs.conformance-offline != 'false' }}
        run: |
          echo "Results: $RESULTS"
          if [ "$SHARDS_OWED" = true ] && [ "$SHARDS" = skipped ]; then
            echo "::error::The shards were owed a run and were skipped."
            exit 1
          fi
          if [ "$OFFLINE_OWED" = true ] && [ "$OFFLINE" = skipped ]; then
            echo "::error::The offline lane was owed a run and was skipped."
            exit 1
          fi
          for result in $RESULTS; do
            case "$result" in
              failure | cancelled)
                echo "::error::A conformance job ended as $result."
                exit 1
                ;;
            esac
          done

  # The scenario suite: the `marfa` binary driven as the reference client
  # against a server booted from this same checkout, end to end. A gate
  # beside the referee rather than a lane inside it, because the two answer
  # different questions: the referee asks whether the server keeps the
  # contract, this asks whether a person or an agent at a terminal can do
  # everything the server publishes.
  cli-scenarios:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cli-scenarios != 'false') }}
    name: CLI scenarios
    timeout-minutes: 60
    runs-on: ${{ (github.event_name == 'schedule' || inputs.macos) && 'macos-26' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install socket ACL inspection
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y acl
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@withmarfa/server..." build

      # A pull request that leaves the crates alone reuses the binary `main`
      # built from the same sources and runs no Rust. A push, the nightly and
      # a dispatch always build it, with the current compiler.
      - name: Key the binary under test
        id: device-key
        run: echo "key=marfa-$RUNNER_OS-${{ hashFiles('core/**', '!core/bindings/**', '!core/scripts/**', '!core/.config/**', '!core/target/**', '!core/*/tests/**', '!core/**/*.md', '.github/workflows/ci.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the binary under test
        id: device
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache/restore@v6
        with:
          path: core/target/debug/marfa
          key: ${{ steps.device-key.outputs.key }}
      # Restored with the time it was built, which the device suite reads as
      # older than this checkout's sources; the key vouches that they match.
      - if: ${{ steps.device.outputs.cache-hit == 'true' }}
        run: touch core/target/debug/marfa
      - if: ${{ steps.device.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@stable
      - if: ${{ steps.device.outputs.cache-hit != 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the binary under test
        if: ${{ steps.device.outputs.cache-hit != 'true' }}
        working-directory: core
        run: cargo build -p marfa-cli
      - if: ${{ steps.device.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: core/target/debug/marfa
          key: ${{ steps.device-key.outputs.key }}
      - run: echo "MARFA_DEVICE_BIN=$PWD/core/target/debug/marfa" >> "$GITHUB_ENV"

      - name: Boot the server from this checkout
        working-directory: conformance
        run: |
          pnpm marfa:up --state "$RUNNER_TEMP/marfa-cli"
          cat "$RUNNER_TEMP/marfa-cli/env" >> "$GITHUB_ENV"

      - name: Run the scenarios
        working-directory: conformance
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            ../core/scripts/login-keychain-unchanged.sh pnpm test:cli
          else
            pnpm test:cli
          fi

      - name: Hold every status observed to its declaration
        working-directory: conformance
        run: pnpm check:statuses --state "$RUNNER_TEMP/marfa-cli"

      # Before the stop, because `marfa:down` clears the state directory and
      # the log is in it.
      - name: Keep the server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: marfa-cli-server-log
          path: |
            ${{ runner.temp }}/marfa-cli/server.log
            ${{ runner.temp }}/marfa-cli/fresh-server-logs/
          if-no-files-found: ignore

      # Always, including when a scenario failed: the server was spawned
      # detached, so nothing else reaps it.
      - name: Stop the server
        if: always()
        working-directory: conformance
        run: pnpm marfa:down --state "$RUNNER_TEMP/marfa-cli"

  # The restore drill: a fresh instance rebuilt from the bucket alone, to
  # the byte, against the same local object store the conformance shards
  # attach. Litestream streams the database and the server's own
  # replication carries the blobs; `conformance/scripts/restore-drill.ts`
  # says what it proves and prints its report, which is kept as an
  # artifact whether or not it passed.
  restore-drill:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.restore-drill != 'false') }}
    name: Restore drill
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install socket ACL inspection
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y acl
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@withmarfa/server..." build

      # The drill uses the same Litestream version as the server image.
      - name: Install the object store and Litestream
        run: |
          curl --fail --location --retry 3 https://garagehq.deuxfleurs.fr/_releases/v2.4.1/x86_64-unknown-linux-musl/garage -o "$RUNNER_TEMP/garage-bin"
          sudo install -m 755 "$RUNNER_TEMP/garage-bin" /usr/local/bin/garage
          version=$(sed -n 's/^ARG LITESTREAM_VERSION=//p' deploy/Dockerfile)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          curl --fail --location --retry 3 "https://github.com/benbjohnson/litestream/releases/download/v$version/litestream-$version-linux-x86_64.tar.gz" -o "$RUNNER_TEMP/litestream.tar.gz"
          tar -xzf "$RUNNER_TEMP/litestream.tar.gz" -C "$RUNNER_TEMP" litestream
          sudo install -m 755 "$RUNNER_TEMP/litestream" /usr/local/bin/litestream
          sudo apt-get update
          sudo apt-get install -y sqlite3
          garage --version
          litestream version
      - name: Boot the object store
        working-directory: conformance
        run: pnpm garage:up --state "$RUNNER_TEMP/garage"

      - name: Run the drill
        working-directory: conformance
        run: pnpm drill:restore --state "$RUNNER_TEMP/drill/state"

      - name: Stop the object store
        if: always()
        working-directory: conformance
        run: pnpm garage:down --state "$RUNNER_TEMP/garage"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: restore-drill-report
          path: ${{ runner.temp }}/drill/reports/restore-drill.md
          if-no-files-found: ignore

  # The shipped image, built from `deploy/Dockerfile` and booted through its
  # entrypoint, which nothing else in CI runs. `scripts/check-image.sh` holds
  # it to the deploy guide: it becomes healthy, reports the commit it was
  # built from, stops with status 0 inside ten seconds, and on a database
  # another build wrote stays up and unhealthy rather than ending. No bucket,
  # so the Litestream half is the restore drill's.
  image:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.image != 'false') }}
    name: Server image
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -f deploy/Dockerfile --build-arg VERSION_SHA="$GITHUB_SHA" -t marfa-server .
      - name: Boot it, ask it, stop it
        run: scripts/check-image.sh marfa-server "$GITHUB_SHA"

  types-freshness:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.types-freshness != 'false') }}
    name: Types codegen freshness
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @withmarfa/types validate
      - name: Regenerate and check for drift
        run: |
          rm -rf packages/types/generated
          pnpm --filter @withmarfa/types generate
          if [ -n "$(git status --porcelain packages/types/generated)" ]; then
            git status --porcelain packages/types/generated
            echo "Generated type registry is out of date, or holds a file the generator did not write. Run 'pnpm --filter @withmarfa/types generate' and commit."
            exit 1
          fi

  openapi-freshness:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.openapi-freshness != 'false') }}
    name: OpenAPI spec freshness
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The generator script imports through @withmarfa/shared, which needs
      # its dist/ before tsx can resolve it.
      - run: pnpm --filter "@withmarfa/server..." build
      - name: Regenerate and check for drift
        run: |
          pnpm --filter @withmarfa/server run generate:openapi
          if ! git diff --exit-code openapi.json; then
            echo "openapi.json is out of date. Run 'pnpm generate' and commit."
            exit 1
          fi

  version-fields:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version-fields != 'false') }}
    name: No file holds a version
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      # No build step: the check reads manifests off the tree. A version
      # exists only when a tag is cut, and `release.yml` is the one writer;
      # a pull request that moves a manifest off the placeholder is refused
      # here, whatever else it does. cargo is on PATH because the check asks
      # cargo how it reads the manifests rather than parsing TOML itself.
      - name: Every manifest carries the placeholder
        run: pnpm vitest run ci/version-fields.test.ts

  # What is generated from `openapi.json` is committed, so a consumer reads
  # the types the document declares without generating anything. This
  # regenerates it from the committed document and refuses a difference: a
  # change to the document that did not regenerate, a hand edit to a
  # generated file, or a file under a generated directory the generator did
  # not write.
  #
  # Each step empties its client's generated directory before regenerating
  # it, so the generator's own output is the whole of what may be there: a
  # committed file it did not write shows as deleted, and one it writes that
  # is not committed shows as untracked. `git status` rather than `git diff`,
  # which does not see an untracked file.
  clients-freshness:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.clients-freshness != 'false') }}
    name: Generated clients are fresh
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate the TypeScript client and check for drift
        run: |
          rm -rf packages/client/src/generated
          pnpm --filter @withmarfa/client run generate
          if [ -n "$(git status --porcelain packages/client/src/generated)" ]; then
            git status --porcelain packages/client/src/generated
            echo "@withmarfa/client's generated sources are out of date with openapi.json, or hold a file the generator did not write. Run 'pnpm generate' and commit."
            exit 1
          fi
      # The core's catalog is written from the registry the server lists,
      # which is read from the built packages.
      - run: pnpm build
      - name: Regenerate what the core is built from and check for drift
        run: |
          rm -f core/marfa-core/src/contract.rs core/marfa-core/src/builtin_catalog.json
          pnpm run generate:core
          generated="core/marfa-core/src/contract.rs core/marfa-core/src/builtin_catalog.json"
          if [ -n "$(git status --porcelain $generated)" ]; then
            git status --porcelain $generated
            echo "What the core is built from is out of date with openapi.json or the shipped types, or was edited by hand. Run 'pnpm generate' and commit."
            exit 1
          fi

  # The one required check. A skipped job passes a required check, and a draft
  # skips most jobs, so on a draft this job is named `Draft CI`: the required
  # `Full CI` stays expected, which blocks a merge, until the run that marking
  # the pull request ready starts has finished every job.
  # It runs after a failed job and fails then. A cancelled run skips it, and a
  # skipped job never reports as `Full CI`, so a cancel cannot leave it green.
  # It waits for every job but `report-failure`, which only reports.
  gate:
    name: ${{ github.event.pull_request.draft && 'Draft CI' || 'Full CI' }}
    needs:
      [
        changes,
        ci-sqlite,
        core-checks,
        core-checks-linux,
        conformance-shards,
        conformance-offline,
        conformance-statuses,
        conformance,
        cli-scenarios,
        restore-drill,
        image,
        types-freshness,
        openapi-freshness,
        version-fields,
        clients-freshness,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "::error::A job failed or was cancelled: ${RESULTS}"
              exit 1
              ;;
          esac
