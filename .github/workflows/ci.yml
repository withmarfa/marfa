name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancels a superseded run on a branch, and deliberately does not on `main`.
#
# On a branch a second push means the first answer describes a tree nobody has
# any more, so cancelling is free. `main` is not a branch in that sense: every
# commit on it is a release candidate, and `publish.yml` refuses to tag a
# commit unless a *successful* `ci.yml` run exists at that exact SHA. A
# cancelled run is not a successful one, so a superseded main commit becomes
# permanently unpublishable — silently, because nothing errors and the commit
# looks fine. Six consecutive commits were in that state in one evening.
#
# Before adding `cancel-in-progress` to any group, ask what consumes the run's
# result at a specific SHA. Cancellation is safe where only the latest answer
# is wanted and unsafe wherever a per-commit answer is a gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job runs on the self-hosted pool and nothing falls back to a hosted
# runner: a job waiting for a pool that is down is the correct behavior, and
# a hosted macOS minute costs ten times a Linux one.
#
# No `actions/setup-node` cache anywhere in this file. The pool keeps its
# pnpm store between jobs, so the cache restores nothing, and its post step
# would tar the whole store — about 12 GB — on every job.
jobs:
  ci-sqlite:
    name: CI (SQLite)
    timeout-minutes: 60
    runs-on: self-hosted
    # One suite at a time across every ref in this repository.
    #
    # The resource is the machine. This job runs vitest's `forks` pool at its
    # default `cpus - 1`, which is one job short of the whole box that hosts
    # the pool, so two of these at once manufactures timeouts in files the
    # branch never touched. Two sessions hit exactly that within an hour and
    # both first read it as a defect in their own branch.
    #
    # `queue: max` rather than the default. The default keeps at most one
    # pending entry per group and CANCELS the previous one when a new job
    # arrives, which would trade a false red for a silently cancelled check —
    # strictly worse, because a cancelled required check blocks a merge with
    # nothing to read. `max` queues up to a hundred, FIFO.
    concurrency:
      group: marfa-suite-shared-host
      cancel-in-progress: false
      queue: max
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # MARFA_TEST_OCR runs the real tesseract engine (ocr.real.test.ts).
      # `MARFA_ENRICHMENT_TESSDATA_DIR` is a cache path the engine may write
      # to; the test resolves its model from the installed package, so
      # nothing here is load bearing.
      - run: MARFA_TEST_OCR=1 MARFA_ENRICHMENT_TESSDATA_DIR="$HOME/.cache/marfa-tessdata" pnpm test

  # Freshness jobs — catch generated-artifact drift, on every event. They
  # were once gated on the paths that could stale each artifact; on the pool
  # the work costs seconds, and a gate that skips is a gate that can be wrong.
  types-freshness:
    name: Types codegen freshness
    timeout-minutes: 15
    runs-on: self-hosted
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @withmarfa/types validate
      - name: Regenerate and check for drift
        run: |
          pnpm --filter @withmarfa/types generate
          if ! git diff --exit-code packages/types/generated/; then
            echo "Generated type registry is out of date. Run 'pnpm --filter @withmarfa/types generate' and commit."
            exit 1
          fi

  openapi-freshness:
    name: OpenAPI spec freshness
    timeout-minutes: 15
    runs-on: self-hosted
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      # Build first — the generator script imports through @withmarfa/shared,
      # which needs its dist/ before tsx can resolve it.
      - run: pnpm build
      - name: Regenerate and check for drift
        run: |
          pnpm --silent --filter @withmarfa/server generate:openapi > openapi.json
          if ! git diff --exit-code openapi.json; then
            echo "openapi.json is out of date. Run 'pnpm --silent --filter @withmarfa/server generate:openapi > openapi.json' and commit."
            exit 1
          fi

  surface-lock-drift:
    name: Published surface holds its version
    timeout-minutes: 10
    runs-on: self-hosted
    # Only where there is something to refuse. On a push to `main` the merge
    # has happened and the comparison has nothing left to say.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit is the whole comparison. A shallow clone leaves
          # the check unable to read its baseline, which it reports as a
          # failure rather than as agreement.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      # No build step: the comparison reads two committed JSON files and the
      # module it imports depends on nothing but `node:crypto`.
      # The base comes from the checkout rather than from the event payload,
      # and the two are not always the same commit. `actions/checkout` builds
      # `refs/pull/N/merge` against the base branch as it stands now, while
      # the payload replays the `base.sha` recorded when the run was created.
      # On a re-run of an older run those diverge, and every disagreement
      # between them lands on the version-moved branch, which is a silent
      # skip. `HEAD^1` is the base parent of the merge commit, which is the
      # commit the lock on disk was actually merged against.
      - name: Compare the lock against the base it merges into
        run: |
          base="$(git rev-parse HEAD^1)"
          echo "comparing against base $base"
          pnpm --filter @withmarfa/server run surface-lock:drift "$base"
