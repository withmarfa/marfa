name: CI

on:
  push:
    branches: [main]
  # A draft runs only the quick jobs; marking it ready for review runs the
  # rest, and so does every push after that. `Full CI` is the required check.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # The nightly runs only what needs a Mac, on macOS: the device and CLI
  # fixtures against the Rust server and the core's checks, for file
  # watching, name case, Finder packages and a real keychain.
  # Every push to `main` runs the rest on Linux. A dispatch runs everything,
  # and runs the device and CLI fixtures on macOS when `macos` is set.
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:
    inputs:
      macos:
        description: Run the device and CLI fixtures on macOS
        type: boolean
        default: false

# Every push to `main` shares one group and none is cancelled while it runs:
# GitHub lets the running run finish, keeps only the newest waiting one and
# cancels the older waiting ones, so a burst of merges costs one run in
# flight and one waiting. A release tags the newest commit whose run passed.
# The nightly and a dispatch each get their own group. A pull request's draft
# and ready runs have separate groups: a push to a draft and marking it ready
# start two runs at once, and in one group the later-queued run cancels the
# other. When the draft run won, only `Draft CI` reported and the required
# `Full CI` stayed expected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.event.pull_request.draft && 'draft' || 'ready') || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  # Every job below runs only when `scripts/ci-required.ts` says the change
  # can affect it. A skipped job satisfies its required check, where a
  # `paths` filter on the workflow would leave the check pending. A draft
  # runs only the jobs `DRAFT_JOBS` names there, and `full` is `false` for it.
  # A push to `main` skips them only when it changes nothing but
  # documentation and this workflow passed on the commit before it, which
  # `actions: read` lets the classifier ask.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      quick-checks: ${{ steps.classify.outputs.quick-checks }}
      workspace: ${{ steps.classify.outputs.workspace }}
      lint: ${{ steps.classify.outputs.lint }}
      core-checks: ${{ steps.classify.outputs.core-checks }}
      swift-package: ${{ steps.classify.outputs.swift-package }}
      core-checks-linux: ${{ steps.classify.outputs.core-checks-linux }}
      core-deny: ${{ steps.classify.outputs.core-deny }}
      core-native: ${{ steps.classify.outputs.core-native }}
      core-fault-injection: ${{ steps.classify.outputs.core-fault-injection }}
      conformance-offline: ${{ steps.classify.outputs.conformance-offline }}
      mcp-conformance: ${{ steps.classify.outputs.mcp-conformance }}
      rust-contract-server: ${{ steps.classify.outputs.rust-contract-server }}
      rust-contract-device: ${{ steps.classify.outputs.rust-contract-device }}
      rust-contract-release: ${{ steps.classify.outputs.rust-contract-release }}
      rust-contract-macos: ${{ steps.classify.outputs.rust-contract-macos }}
      restore-drill: ${{ steps.classify.outputs.restore-drill }}
      image: ${{ steps.classify.outputs.image }}
      types-freshness: ${{ steps.classify.outputs.types-freshness }}
      version-fields: ${{ steps.classify.outputs.version-fields }}
      clients-freshness: ${{ steps.classify.outputs.clients-freshness }}
      core: ${{ steps.classify.outputs.core }}
      full: ${{ steps.classify.outputs.full }}
      rust-shards: ${{ steps.classify.outputs.rust-shards }}
      rust-projects: ${{ steps.classify.outputs.rust-projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-required.ts

  quick-checks:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.quick-checks != 'false') }}
    name: Quick checks
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prettier reads Markdown as well as code, and the classifier's test
      # and the contract's reference check read the whole tree, so a
      # documentation change stops after these. The build, typecheck and lint
      # are jobs of their own, so that each one reports as soon as it can.
      # The vendor check runs here because a change to any product file can
      # breach it, and this job runs for every change, a draft's too.
      - run: pnpm format:check
      # A migration a release has shipped is never edited, so the check reads
      # the newest published tag's files. Only that tag is fetched, one commit
      # deep, because fetching every tag grows with each release. The remote
      # is asked once more after a failure, since a network hiccup here would
      # cancel the run of a ready pull request. The test reads the tag's name
      # from MARFA_RELEASE_TAG.
      - name: Fetch the newest release tag
        run: |
          for attempt in 1 2; do
            if tag=$(node scripts/release/newest-release.ts) &&
              git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"; then
              echo "MARFA_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Could not fetch the newest release tag."
          exit 1
      - run: pnpm vitest run ci/ci-required.test.ts ci/no-vendor-in-product.test.ts ci/released-migrations.test.ts
      - working-directory: conformance
        run: pnpm exec vitest run --project generators src/utils/spec-citations.test.ts

  typecheck:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.workspace != 'false') }}
    name: Typecheck
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No check reads the build; it shows the published client still builds.
      - run: pnpm build
      - run: pnpm typecheck

  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.lint != 'false') }}
    name: Lint
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # A format, typecheck or lint failure is certain and known within minutes,
  # and the slow jobs would run on for twenty more. On a pull request that is
  # ready for review, each of these stops the run the moment its quick job
  # fails. The run ends as cancelled, and `Full CI` still reports and fails,
  # because the gate runs after a cancel and fails for the failed job. A
  # draft runs no slow job, and a push to `main` is never stopped. A failed
  # classifier stops nothing: it is not a quick check, and `Full CI` fails
  # for it as a need of the gate.
  stop-after-format:
    name: Stop the run after a failed quick check
    needs: [changes, quick-checks]
    if: ${{ failure() && needs.changes.result == 'success' && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || echo "::warning::The run could not be cancelled; the slow jobs run on."

  stop-after-typecheck:
    name: Stop the run after a failed typecheck
    needs: [changes, typecheck]
    if: ${{ failure() && needs.changes.result == 'success' && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || echo "::warning::The run could not be cancelled; the slow jobs run on."

  stop-after-lint:
    name: Stop the run after a failed lint
    needs: [changes, lint]
    if: ${{ failure() && needs.changes.result == 'success' && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || echo "::warning::The run could not be cancelled; the slow jobs run on."

  # The workspace's tests: the client, the types package, the repository's
  # own checks under `ci/` and the root's scripts. A draft skips
  # them, like every job `full` guards.
  workspace-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.workspace != 'false' && needs.changes.outputs.full != 'false')) }}
    name: Workspace tests
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The version check asks cargo how it reads the manifests, so it runs
      # in its own job and this one needs no Rust. The release check needs the
      # tags, which Quick checks fetches.
      - run: pnpm test --exclude ci/version-fields.test.ts --exclude ci/ci-required.test.ts --exclude ci/released-migrations.test.ts

  core-checks:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.core-checks != 'false') }}
    name: Core checks
    timeout-minutes: 60
    runs-on: macos-26
    # A failing test is run once more, and one that then passes is named in
    # the job summary as flaky; see `[profile.ci]` in `core/.config/nextest.toml`.
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      # nextest kills a test past the budget in `core/.config/nextest.toml`.
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest@0.9
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            core
            core/bindings/swift
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the core workspace
        working-directory: core
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings
          # The tests above compile the server with its test hooks. A release
          # build leaves them out, so the server is linted without them too.
          cargo clippy --locked -p marfa-server --no-deps -- -D warnings
          scripts/login-keychain-unchanged.sh cargo nextest run --locked --workspace
          # The next run writes its report over this one's.
          scripts/report-flaky.py target/nextest/ci/junit.xml
          # The faults `marfa-enrichment` makes a reader suffer are proved here
          # too: macOS confines and measures a reader with other code than
          # Linux does (`sandbox_init`, the physical footprint).
          cargo clippy --locked -p marfa-enrichment --all-targets --features fault-injection --no-deps -- -D warnings
          scripts/login-keychain-unchanged.sh cargo nextest run --locked -p marfa-enrichment --features fault-injection
      - name: Check the Swift FFI crate
        working-directory: core/bindings/swift
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo nextest run --locked
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        working-directory: core
        run: scripts/report-flaky.py target/nextest/ci/junit.xml bindings/swift/target/nextest/ci/junit.xml
      # The script marfa-swift runs at the commit it pins. cargo-swift embeds
      # one UniFFI bindgen and reads the metadata the crate's `uniffi` wrote,
      # so a bump of either alone fails here and not in marfa-swift.
      - name: Build the Swift package
        if: ${{ needs.changes.outputs.swift-package != 'false' }}
        working-directory: core/bindings/swift
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: ./build.sh

  # The core workspace on Linux, where the credential store that is not the
  # macOS keychain, and the in-memory test keychain it uses, are built, linted
  # and tested. `Core checks` keeps the macOS keychain and the Apple builds,
  # and a pull request runs it only for what a Linux run cannot vouch for
  # (`scripts/ci-required.ts` names the paths). It leaves out the login
  # keychain check, which needs macOS's `security`, and the Swift crate's
  # tests and Apple builds.
  core-checks-linux:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.core-checks-linux != 'false') }}
    name: Core checks (Linux)
    timeout-minutes: 40
    runs-on: ubuntu-latest
    # A failing test is run once more, and one that then passes is named in
    # the job summary as flaky; see `[profile.ci]` in `core/.config/nextest.toml`.
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      # nextest kills a test past the budget in `core/.config/nextest.toml`.
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest@0.9
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            core
            core/bindings/swift
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the core workspace
        working-directory: core
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings
          cargo clippy --locked -p marfa-server --no-deps -- -D warnings
          cargo nextest run --locked --workspace
          # The next run writes its report over this one's.
          scripts/report-flaky.py target/nextest/ci/junit.xml
          # The `marfa` binary turns the core's `telemetry` feature on for the
          # workspace above, so the core alone is checked here with it off, as
          # the Swift and Node builds ship it.
          cargo clippy --locked -p marfa-core --all-targets --no-deps -- -D warnings
          cargo nextest run --locked -p marfa-core
          # Fault injection compiles only with debug assertions, so a test or
          # benchmark that names it must be gated the same way. A release
          # build of every target is the cheapest proof that it is. Clippy
          # runs on the core in release too: some lints fire only without
          # debug assertions.
          cargo check --locked --release --workspace --all-targets
          cargo clippy --locked --release -p marfa-core --all-targets --no-deps -- -D warnings
      # A pull request that leaves the bindings, keychain and file watching
      # alone skips the macOS job, so the Swift FFI crate's format, lints and
      # compile are checked here too. Its tests and the Apple builds stay on
      # macOS.
      - name: Check the Swift FFI crate
        working-directory: core/bindings/swift
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        working-directory: core
        run: scripts/report-flaky.py target/nextest/ci/junit.xml

  # `marfa-enrichment`'s tests with the `fault-injection` feature, which makes a
  # reader crash, hang, spin, run out of memory and say what a file that took it
  # over could say, to prove the process that called it survives each. Linux
  # builds and tests the crate without the feature in `Core checks (Linux)`;
  # `Core checks` runs these on macOS, where the sandbox is other code.
  core-fault-injection:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.core-fault-injection != 'false') }}
    name: Core fault injection (Linux)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # A failing test is run once more, and one that then passes is named in
    # the job summary as flaky; see `[profile.ci]` in `core/.config/nextest.toml`.
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      # nextest kills a test past the budget in `core/.config/nextest.toml`.
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest@0.9
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check and test the reader with faults injected
        working-directory: core
        run: |
          cargo clippy --locked -p marfa-enrichment --all-targets --features fault-injection --no-deps -- -D warnings
          cargo nextest run --locked -p marfa-enrichment --features fault-injection
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        working-directory: core
        run: scripts/report-flaky.py target/nextest/ci/junit.xml

  # The dependency graph against `core/deny.toml`: advisories, yanked crates,
  # licenses and duplicate major versions. The Swift crate has a lockfile of
  # its own, so it is checked apart from the workspace.
  core-deny:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.core-deny != 'false') }}
    name: Rust dependencies
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20
      - name: Check the dependencies
        working-directory: core
        run: |
          cargo deny --locked check
          cargo deny --locked --manifest-path bindings/swift/Cargo.toml --config deny.toml check

  # `marfa-enrichment`'s PDF and OCR readers, built on x86_64 from the sources
  # `native/manifest.txt` pins and checked on the machine they are built for.
  # `native/release.sh --full` builds PDFium, Leptonica and Tesseract, links
  # and checks the programs, gathers the licences into `NOTICES.txt`, and runs
  # `native/verify.sh`: every format, the refusals, the injected faults, a
  # reader that has been taken over, and the memory limit. The fuzz then reads
  # mutated files through the real reader. A hosted x86_64 Linux runner is what
  # the Landlock and seccomp of an x86_64 kernel can be proved on at all: an
  # Apple silicon Mac runs the program only under emulation, where it cannot
  # confine itself and reads nothing.
  #
  # PDFium's finished library (`archives/`) and the pinned downloads are cached
  # by what pins and builds them, saved only from `main` so that a pull request
  # restores but never fills the cache.
  core-native:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.core-native != 'false') }}
    name: Core native (x86_64 Linux)
    timeout-minutes: 50
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The first build of a target asks for 40 GB of free disk, and the
      # runner starts with less. These are the toolchains it does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # Pillow draws the scanned page and the large picture the checks read.
      - name: Install what the checks need beside Docker
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - name: Choose the folder for downloads and results
        run: echo "MARFA_NATIVE_ROOT=$RUNNER_TEMP/marfa-native" >> "$GITHUB_ENV"
      - name: Key the cache on the pins, the patches and the build scripts
        id: key
        run: echo "key=marfa-native-$RUNNER_OS-${{ hashFiles('core/marfa-enrichment/native/manifest.txt', 'core/marfa-enrichment/native/patches/**', 'core/marfa-enrichment/native/build.sh', 'core/marfa-enrichment/native/pdfium.sh', 'core/marfa-enrichment/native/tesseract.sh', 'core/marfa-enrichment/native/models.sh', 'core/marfa-enrichment/native/lib.sh', 'core/marfa-enrichment/native/linux/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the downloads and the PDFium library
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/marfa-native/downloads
            ${{ runner.temp }}/marfa-native/archives
          key: ${{ steps.key.outputs.key }}
      # The image is restored from the cache, never built from the package
      # archive when the cache holds it; `main` saves it.
      - name: Make the build image
        uses: ./.github/actions/native-build-image
      - name: Build and check the programs
        run: core/marfa-enrichment/native/release.sh "$TARGET" --full
      # A run whose cases did not run would pass `verify.sh` with nothing to fail;
      # counting the cases that passed makes it fail instead.
      - name: Check that the matrix ran
        run: |
          passed=$(grep -c '^PASS ' "$MARFA_NATIVE_ROOT/out/$TARGET/verify/report.txt" || true)
          echo "Cases that passed: $passed"
          if [ "$passed" -lt 20 ]; then
            echo "::error::Only $passed cases passed; the checks did not run as they should"
            exit 1
          fi
      # The licences ship beside the program, so the job says whether the build
      # made them, and leaves the file as it is.
      - name: Check that the build made the licences
        run: |
          notices="$MARFA_NATIVE_ROOT/out/$TARGET/NOTICES.txt"
          test -s "$notices" || { echo "::error::The build made no NOTICES.txt"; exit 1; }
          for part in PDFium Tesseract Leptonica; do
            grep -q "$part" "$notices" || { echo "::error::NOTICES.txt does not name $part"; exit 1; }
          done
          wc -c "$notices"
      # `release.sh --full` does not fuzz. Every run uses the same seed and job
      # count, so it reads the files of the run before it, up to where that run
      # stopped.
      - name: Fuzz the reader
        run: core/marfa-enrichment/native/fuzz.sh "$TARGET" 300 --jobs 2 --seed 1
      - name: Save the downloads and the PDFium library
        if: ${{ github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/marfa-native/downloads
            ${{ runner.temp }}/marfa-native/archives
          key: ${{ steps.key.outputs.key }}
      # The checks name what failed in their own report; this puts it where the
      # run's summary is read, and hands the report, the licences and anything
      # the fuzz found to whoever has to look further.
      - name: Say what failed
        if: ${{ failure() }}
        run: |
          out="$MARFA_NATIVE_ROOT/out/$TARGET"
          sudo chown -R "$(id -u):$(id -g)" "$MARFA_NATIVE_ROOT/out" || true
          {
            echo "### Core native (x86_64 Linux): what failed"
            echo
            if [ -f "$out/verify/report.txt" ]; then
              grep '^FAIL' "$out/verify/report.txt" || echo "No check failed in the report: the run stopped before or after the checks, so read the step that failed."
            else
              echo "The run stopped before the checks ran, so read the step that failed."
            fi
            if [ -f "$out/fuzz/run.log" ]; then
              echo
              echo "Fuzz, last lines:"
              tail -n 15 "$out/fuzz/run.log"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -f "$out/verify/report.txt" ]; then
            grep '^FAIL' "$out/verify/report.txt" | while read -r line; do echo "::error::$line"; done
          fi
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marfa-native-report
          path: |
            ${{ runner.temp }}/marfa-native/out/x86_64-unknown-linux-musl/verify/report.txt
            ${{ runner.temp }}/marfa-native/out/x86_64-unknown-linux-musl/verify/results/
            ${{ runner.temp }}/marfa-native/out/x86_64-unknown-linux-musl/fuzz/run.log
            ${{ runner.temp }}/marfa-native/out/x86_64-unknown-linux-musl/fuzz/findings/
            ${{ runner.temp }}/marfa-native/out/x86_64-unknown-linux-musl/NOTICES.txt
            ${{ runner.temp }}/marfa-native/out/x86_64-unknown-linux-musl/SHA256SUMS
          if-no-files-found: ignore

  # The lane that needs no server and no object store: the generators,
  # everything under `src/utils/`, the decision tests and the checks that the
  # contract cites only what exists. A change to the contract alone runs
  # this and nothing else of the conformance jobs, but for the two chapters
  # a fixture reads.
  conformance-offline:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.conformance-offline != 'false') }}
    name: Conformance offline lane
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Offline lane
        working-directory: conformance
        run: pnpm test:generators

  # The MCP project's own conformance tool, against `/mcp` on the Rust
  # server's release build from `Rust server (release build)`.
  # `conformance/scripts/mcp-conformance.ts` names the scenarios and the
  # checks pinned as known failures, with the reason for each.
  mcp-conformance:
    needs: [changes, rust-contract]
    if: ${{ !cancelled() && needs.rust-contract.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.mcp-conformance != 'false') }}
    name: MCP conformance
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Nothing in the workspace is built for the Rust server.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-contract-server
          path: ${{ runner.temp }}/rust-contract-server
      - name: Name the server under test
        run: |
          chmod +x "$RUNNER_TEMP/rust-contract-server/marfa-server"
          echo "MARFA_SERVER_BIN=$RUNNER_TEMP/rust-contract-server/marfa-server" >> "$GITHUB_ENV"

      - name: Boot the Rust server
        working-directory: conformance
        run: pnpm marfa:up --state "$RUNNER_TEMP/marfa-mcp"

      - name: Run the scenarios
        working-directory: conformance
        run: pnpm mcp:conformance --state "$RUNNER_TEMP/marfa-mcp"

      # Each test boots servers of its own from the same binary, so it runs
      # beside the one booted above.
      - name: Hold the harness to the target interface
        working-directory: conformance
        run: pnpm test:harness

      # Before the stop, because `marfa:down` clears the state directory and
      # the log is in it.
      - name: Stage the server log without its setup proof
        if: failure()
        working-directory: conformance
        run: pnpm marfa:stage-logs --state "$RUNNER_TEMP/marfa-mcp" --to "$RUNNER_TEMP/server-logs"

      - name: Keep the server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marfa-mcp-server-log
          path: |
            ${{ runner.temp }}/server-logs/
          if-no-files-found: ignore

      # The server was spawned detached, so nothing else reaps it.
      - name: Stop the server
        if: always()
        working-directory: conformance
        run: pnpm marfa:down --state "$RUNNER_TEMP/marfa-mcp"

  # The conformance jobs as one verdict, which `Full CI` collects with the
  # rest. It passes when every conformance job that ran passed and when the
  # classifier skipped them all; it fails when any of them ended in anything
  # but success or skipped, or was owed a run and skipped.
  conformance:
    needs: [changes, conformance-offline, mcp-conformance]
    if: ${{ !cancelled() }}
    name: Conformance
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Require every conformance job that ran to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          # A skipped job passes only when the classifier skipped it. One it
          # owes a run that was skipped anyway is a failure.
          OFFLINE: ${{ needs.conformance-offline.result }}
          OFFLINE_OWED: ${{ needs.changes.outputs.conformance-offline != 'false' }}
          MCP: ${{ needs.mcp-conformance.result }}
          MCP_OWED: ${{ needs.changes.outputs.mcp-conformance != 'false' }}
        run: |
          echo "Results: $RESULTS"
          if [ "$OFFLINE_OWED" = true ] && [ "$OFFLINE" = skipped ]; then
            echo "::error::The offline lane was owed a run and was skipped."
            exit 1
          fi
          if [ "$MCP_OWED" = true ] && [ "$MCP" = skipped ]; then
            echo "::error::MCP conformance was owed a run and was skipped."
            exit 1
          fi
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A conformance job ended as $result."
                exit 1
                ;;
            esac
          done

  # The contract, run against the Rust server (`core/marfa-server/`) and
  # scored. Three jobs: the build of the server, the shards that boot it
  # through the meter (`MARFA_SERVER_BIN`, `conformance/scripts/marfa-server.ts`),
  # and the score. MCP conformance and the restore drill boot the same build.
  #
  # The shards are two groups, which `scripts/ci-required.ts` runs apart. The
  # server's own (compliance, correctness and sync) read what the server is
  # built from. The device's (`cli` and `device`) drive the `marfa` binary and
  # the Node module against the same server, so they run for a change to either
  # and for a change to the server, but a change to the device alone leaves the
  # server's out. The classifier hands the matrix to the shards job and the
  # projects to the score, from one list, so the score judges exactly the
  # shards that ran.
  #
  # No pinned server commit and no second checkout: the tree under test is
  # the tree the suite runs against, so a server change and the contract
  # change that admits it are one pull request. The jobs are in this workflow
  # because `release.yml` names `ci.yml` as the run a commit must be green on
  # before it can be released.
  #
  # A shard does not fail because a test failed: it fails when it has no
  # report to give, and the score counts the tests. Every fixture file of the
  # projects whose shards ran must pass whole; the score job fails if one does
  # not, and `Full CI` waits for it. An object store sits beside the server, so
  # the stores chapter and the backups are asserted.
  #
  # The servers are built on `main` and saved by a hash of everything they are
  # built from, which a pull request restores instead of building them when it
  # changed none of it, as a change to the device or to a fixture does. The
  # `Key the servers` step lists what the hash reads, and
  # `ci/ci-required.test.ts` holds that list to the server's crates.
  rust-contract:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust-contract-server != 'false' || needs.changes.outputs.rust-contract-device != 'false' || needs.changes.outputs.mcp-conformance != 'false' || needs.changes.outputs.restore-drill != 'false') }}
    name: Rust server (release build)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Key the server on everything it is built from
        id: key
        run: echo "key=marfa-rust-server-hooks-$RUNNER_OS-${{ hashFiles('core/Cargo.toml', 'core/Cargo.lock', 'core/.cargo/**', 'core/marfa-server/**', 'core/marfa-rules/**', 'core/marfa-enrichment/**', 'core/marfa-acl/**', 'core/marfa-allocator/**', 'core/marfa-telemetry/**', 'openapi.json', '.github/actions/native-build-image/**', '.github/workflows/ci.yml') }}" >> "$GITHUB_OUTPUT"
      # Saved by `main` only, and restored for a pull request only, by the
      # exact key: a server a pull request gets was built from these files.
      - name: Restore the server
        id: server
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marfa-server
          key: ${{ steps.key.outputs.key }}
      # The runner starts with about 88 GB free, and this build uses about 6,
      # so nothing is removed to make room.
      - name: Show the free disk space
        if: ${{ steps.server.outputs.cache-hit != 'true' }}
        run: df -h /
      - name: Choose the folder for downloads and results
        run: echo "MARFA_NATIVE_ROOT=$RUNNER_TEMP/marfa-native" >> "$GITHUB_ENV"
      # The server is built with the file readers linked in, the way the
      # native job builds them: in the pinned image, for the static musl
      # target, from the sources `native/manifest.txt` pins. The same key as
      # the native job's, so that both restore what a push to `main` there
      # saved: PDFium's finished library and the pinned downloads.
      - name: Key the cache on the pins, the patches and the build scripts
        id: native
        if: ${{ steps.server.outputs.cache-hit != 'true' }}
        run: echo "key=marfa-native-$RUNNER_OS-${{ hashFiles('core/marfa-enrichment/native/manifest.txt', 'core/marfa-enrichment/native/patches/**', 'core/marfa-enrichment/native/build.sh', 'core/marfa-enrichment/native/pdfium.sh', 'core/marfa-enrichment/native/tesseract.sh', 'core/marfa-enrichment/native/models.sh', 'core/marfa-enrichment/native/lib.sh', 'core/marfa-enrichment/native/linux/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the downloads and the PDFium library
        if: ${{ steps.server.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/marfa-native/downloads
            ${{ runner.temp }}/marfa-native/archives
          key: ${{ steps.native.outputs.key }}
      # The image is restored from the cache, never built from the package
      # archive when the cache holds it; `main` saves it.
      - name: Make the build image
        if: ${{ steps.server.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/native-build-image
      - name: Build the Rust server
        id: build
        if: ${{ steps.server.outputs.cache-hit != 'true' }}
        env:
          MARFA_SERVER_FEATURES: test-hooks
        run: core/marfa-enrichment/native/release.sh "$TARGET" --server
      - name: Set the server aside
        id: aside
        if: ${{ steps.server.outputs.cache-hit != 'true' }}
        run: install -D "$RUNNER_TEMP/marfa-native/out/$TARGET/marfa-server" "$RUNNER_TEMP/marfa-server/marfa-server"
      - name: Save the server
        if: ${{ steps.aside.outcome == 'success' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marfa-server
          key: ${{ steps.key.outputs.key }}
      # Every shard downloads it, and a re-run of one shard does too, so it
      # is kept as long as the shards' reports. It is an input, not a
      # diagnostic, so it is kept on success like the reports.
      - name: Keep the server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-contract-server
          path: ${{ runner.temp }}/marfa-server/marfa-server
          if-no-files-found: error
          retention-days: 3

  # The program a release ships, built without test hooks, in a job of its
  # own so that the build the shards wait for is the one with the hooks. The
  # one compliance fixture that runs it, `Rust contract (server without test
  # hooks)`, is the only thing that waits for this.
  rust-contract-release:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust-contract-release != 'false') }}
    name: Rust server without test hooks
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Key the server on everything it is built from
        id: key
        run: echo "key=marfa-rust-server-release-$RUNNER_OS-${{ hashFiles('core/Cargo.toml', 'core/Cargo.lock', 'core/.cargo/**', 'core/marfa-server/**', 'core/marfa-rules/**', 'core/marfa-enrichment/**', 'core/marfa-acl/**', 'core/marfa-allocator/**', 'core/marfa-telemetry/**', 'openapi.json', '.github/actions/native-build-image/**', '.github/workflows/ci.yml') }}" >> "$GITHUB_OUTPUT"
      # Saved by `main` only, and restored for a pull request only, by the
      # exact key: a server a pull request gets was built from these files.
      - name: Restore the server
        id: server
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marfa-server
          key: ${{ steps.key.outputs.key }}
      # The runner starts with about 88 GB free, and this build uses about 6,
      # so nothing is removed to make room.
      - name: Show the free disk space
        if: ${{ steps.server.outputs.cache-hit != 'true' }}
        run: df -h /
      - name: Choose the folder for downloads and results
        run: echo "MARFA_NATIVE_ROOT=$RUNNER_TEMP/marfa-native" >> "$GITHUB_ENV"
      # The server is built with the file readers linked in, the way the
      # native job builds them: in the pinned image, for the static musl
      # target, from the sources `native/manifest.txt` pins. The same key as
      # the native job's, so that both restore what a push to `main` there
      # saved: PDFium's finished library and the pinned downloads.
      - name: Key the cache on the pins, the patches and the build scripts
        id: native
        if: ${{ steps.server.outputs.cache-hit != 'true' }}
        run: echo "key=marfa-native-$RUNNER_OS-${{ hashFiles('core/marfa-enrichment/native/manifest.txt', 'core/marfa-enrichment/native/patches/**', 'core/marfa-enrichment/native/build.sh', 'core/marfa-enrichment/native/pdfium.sh', 'core/marfa-enrichment/native/tesseract.sh', 'core/marfa-enrichment/native/models.sh', 'core/marfa-enrichment/native/lib.sh', 'core/marfa-enrichment/native/linux/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the downloads and the PDFium library
        if: ${{ steps.server.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/marfa-native/downloads
            ${{ runner.temp }}/marfa-native/archives
          key: ${{ steps.native.outputs.key }}
      # The image is restored from the cache, never built from the package
      # archive when the cache holds it; `main` saves it.
      - name: Make the build image
        if: ${{ steps.server.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/native-build-image
      - name: Build the Rust server without test hooks
        id: build
        if: ${{ steps.server.outputs.cache-hit != 'true' }}
        run: core/marfa-enrichment/native/release.sh "$TARGET" --server
      - name: Set the server aside
        id: aside
        if: ${{ steps.server.outputs.cache-hit != 'true' }}
        run: install -D "$RUNNER_TEMP/marfa-native/out/$TARGET/marfa-server" "$RUNNER_TEMP/marfa-server/marfa-server"
      - name: Save the server
        if: ${{ steps.aside.outcome == 'success' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marfa-server
          key: ${{ steps.key.outputs.key }}
      - name: Keep the server without test hooks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-contract-release-server
          path: ${{ runner.temp }}/marfa-server/marfa-server
          if-no-files-found: error
          retention-days: 3

  rust-contract-shards:
    needs: [changes, rust-contract]
    # The matrix is the classifier's, so it cannot be read when the
    # classifier did not run, and `Full CI` fails for that on its own.
    if: ${{ !cancelled() && needs.rust-contract.result == 'success' && needs.changes.result == 'success' && (needs.changes.outputs.rust-contract-server != 'false' || needs.changes.outputs.rust-contract-device != 'false') }}
    name: Rust contract shard (${{ matrix.name }})
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one failure shows all the others there are.
      fail-fast: false
      # `SHARDS` in `scripts/ci-required.ts`, less the group a change leaves out.
      matrix: ${{ fromJSON(needs.changes.outputs.rust-shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Nothing in the workspace is built for the Rust server.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-contract-server
          path: ${{ runner.temp }}/rust-contract-server
      - name: Name the server under test
        run: |
          chmod +x "$RUNNER_TEMP/rust-contract-server/marfa-server"
          echo "MARFA_SERVER_BIN=$RUNNER_TEMP/rust-contract-server/marfa-server" >> "$GITHUB_ENV"

      # The CLI and device fixtures drive the `marfa` binary, and the device
      # fixtures the Node module. The keys leave out `core/marfa-server/`,
      # which neither is built from, so a change to the server alone reuses
      # what `main` built. A stale binary is a silent pass, so the keys hash
      # every file of `core/` the programs embed.
      - name: Key the device under test
        id: device-key
        if: ${{ matrix.binary }}
        run: echo "key=marfa-rust-contract-$RUNNER_OS-${{ hashFiles('core/**', '!core/marfa-server/**', '!core/bindings/**', '!core/scripts/**', '!core/.config/**', '!core/target/**', '!core/*/tests/**', '!core/**/*.md', '.github/workflows/ci.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the device under test
        id: device
        if: ${{ matrix.binary && github.event_name == 'pull_request' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/target/debug/marfa
          key: ${{ steps.device-key.outputs.key }}
      # Restored with the time it was built, which the device suite reads as
      # older than this checkout's sources; the key vouches that they match.
      - if: ${{ matrix.binary && steps.device.outputs.cache-hit == 'true' }}
        run: touch core/target/debug/marfa
      - name: Key the Node module under test
        id: module-key
        if: ${{ matrix.module }}
        run: echo "key=marfa-rust-contract-module-$RUNNER_OS-${{ hashFiles('core/**', '!core/marfa-server/**', '!core/bindings/swift/**', '!core/bindings/node/test/**', '!core/bindings/node/scripts/**', '!core/bindings/node/node_modules/**', '!core/bindings/node/*.node', '!core/bindings/node/index.js', '!core/bindings/node/index.d.ts', '!core/marfa-cli/**', '!core/scripts/**', '!core/.config/**', '!core/target/**', '!core/*/tests/**', '!core/**/*.md', '.github/workflows/ci.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the Node module under test
        id: module
        if: ${{ matrix.module && github.event_name == 'pull_request' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/bindings/node/*.node
          key: ${{ steps.module-key.outputs.key }}
      - if: ${{ matrix.module && steps.module.outputs.cache-hit == 'true' }}
        run: touch core/bindings/node/*.node
      - if: ${{ (matrix.binary && steps.device.outputs.cache-hit != 'true') || (matrix.module && steps.module.outputs.cache-hit != 'true') }}
        uses: ./.github/actions/rust-toolchain
      - if: ${{ (matrix.binary && steps.device.outputs.cache-hit != 'true') || (matrix.module && steps.module.outputs.cache-hit != 'true') }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the device under test
        if: ${{ matrix.binary && steps.device.outputs.cache-hit != 'true' }}
        working-directory: core
        run: cargo build --locked -p marfa-cli
      - if: ${{ matrix.binary && steps.device.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/target/debug/marfa
          key: ${{ steps.device-key.outputs.key }}
      # Outside the pnpm workspace, so every call carries the flag.
      - name: Build the Node module under test
        if: ${{ matrix.module && steps.module.outputs.cache-hit != 'true' }}
        working-directory: core/bindings/node
        run: |
          pnpm --ignore-workspace install --frozen-lockfile
          pnpm --ignore-workspace run build:debug
      - if: ${{ matrix.module && steps.module.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/bindings/node/*.node
          key: ${{ steps.module-key.outputs.key }}
      - if: ${{ matrix.binary }}
        run: echo "MARFA_DEVICE_BIN=$PWD/core/target/debug/marfa" >> "$GITHUB_ENV"
      # The one module `napi build --platform` wrote for this machine.
      - if: ${{ matrix.module }}
        run: echo "MARFA_DEVICE_MODULE=$(ls "$PWD"/core/bindings/node/*.node)" >> "$GITHUB_ENV"

      # `garage:up` writes S3 settings to GITHUB_ENV for the server.
      - name: Put an object store beside the server
        working-directory: conformance
        run: |
          curl --fail --location --retry 3 --retry-all-errors https://garagehq.deuxfleurs.fr/_releases/v2.4.1/x86_64-unknown-linux-musl/garage -o "$RUNNER_TEMP/garage-bin"
          sudo install -m 755 "$RUNNER_TEMP/garage-bin" /usr/local/bin/garage
          pnpm garage:up --state "$RUNNER_TEMP/garage"

      - name: Boot the Rust server
        working-directory: conformance
        # A shard's fixtures can keep it busy on servers of their own for
        # longer than the harness's idle limit; the job's limit bounds it.
        env:
          CONFORMANCE_SERVER_IDLE_MS: "0"
        run: |
          pnpm marfa:up --state "$RUNNER_TEMP/marfa"
          cat "$RUNNER_TEMP/marfa/env" >> "$GITHUB_ENV"

      # A failed test does not fail the step: the score job counts it. A run
      # that wrote no report does. A failed test is retried once; the score
      # counts a pass on the retry as passing and lists it as flaky, because
      # this step's reporters replace the one that would.
      - name: Run the shard
        working-directory: conformance
        env:
          ARGS: ${{ matrix.args }}
          MARFA_SHARD_TIMES: ${{ runner.temp }}/shard-times.json
        run: |
          report="$RUNNER_TEMP/rust-contract-report/vitest.json"
          mkdir -p "$(dirname "$report")"
          read -r -a args <<< "$ARGS"
          # The last reporter writes each file's time for the drift check below.
          args+=(--retry=1 --reporter=default --reporter=json "--outputFile.json=$report" --reporter=./src/utils/shard-times-reporter.ts)
          status=0
          pnpm exec vitest run "${args[@]}" || status=$?
          echo "Vitest exited with status $status."
          test -s "$report"

      # Reads the log of the server the shard just drove, so it runs before
      # the stop, which clears the state directory the log is in, and holds
      # every status observed to its declaration in the document. Only the
      # shards that `SHARDS` marks with `statuses` run it: the server group
      # and the command line. The device shards do not yet.
      - name: Hold every status observed to its declaration
        if: ${{ !cancelled() && matrix.statuses }}
        working-directory: conformance
        run: pnpm check:statuses --state "$RUNNER_TEMP/marfa"

      # Warns, and never fails, when a file takes much longer or shorter than
      # the weight `shard-weights.ts` gives it, and lists the slow files in the
      # job summary. Only a split project has weights to compare.
      - name: Compare each file's time with its weight
        if: ${{ !cancelled() && contains(matrix.args, '--shard') }}
        working-directory: conformance
        run: pnpm check:shard-drift "$RUNNER_TEMP/shard-times.json"

      # Kept whether or not the shard passed: the score job reads every one.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-contract-report-${{ matrix.slug }}
          overwrite: true
          path: ${{ runner.temp }}/rust-contract-report/vitest.json
          if-no-files-found: error
          retention-days: 3

      # Before the stop, because `marfa:down` clears the state directory and
      # the log is in it.
      - name: Stage the server log without its setup proof
        if: always()
        working-directory: conformance
        run: pnpm marfa:stage-logs --state "$RUNNER_TEMP/marfa" --to "$RUNNER_TEMP/server-logs"

      - name: Keep the server log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-contract-server-log-${{ matrix.slug }}
          overwrite: true
          retention-days: 3
          path: |
            ${{ runner.temp }}/server-logs/
          if-no-files-found: ignore

      # The detached server must be reaped even when the selection fails.
      - name: Stop the server
        if: always()
        working-directory: conformance
        run: pnpm marfa:down --state "$RUNNER_TEMP/marfa"

      - name: Stop the object store
        if: always()
        working-directory: conformance
        run: pnpm garage:down --state "$RUNNER_TEMP/garage"

  # The compliance fixture that runs the program a release ships, which needs
  # the build without test hooks and, for its witnesses, the one with them
  # and a server booted from it. No other fixture needs the first, so it runs
  # here and the shards never wait for that build.
  rust-contract-release-check:
    needs: [changes, rust-contract, rust-contract-release]
    if: ${{ !cancelled() && needs.rust-contract.result == 'success' && needs.rust-contract-release.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.rust-contract-release != 'false' }}
    name: Rust contract (server without test hooks)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Nothing in the workspace is built for the Rust server.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-contract-server
          path: ${{ runner.temp }}/rust-contract-server
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-contract-release-server
          path: ${{ runner.temp }}/rust-contract-release-server
      - name: Name the servers
        run: |
          chmod +x "$RUNNER_TEMP/rust-contract-server/marfa-server" "$RUNNER_TEMP/rust-contract-release-server/marfa-server"
          echo "MARFA_SERVER_BIN=$RUNNER_TEMP/rust-contract-server/marfa-server" >> "$GITHUB_ENV"
          echo "MARFA_SERVER_RELEASE_BIN=$RUNNER_TEMP/rust-contract-release-server/marfa-server" >> "$GITHUB_ENV"
      - name: Boot the Rust server
        working-directory: conformance
        env:
          CONFORMANCE_SERVER_IDLE_MS: "0"
        run: |
          pnpm marfa:up --state "$RUNNER_TEMP/marfa"
          cat "$RUNNER_TEMP/marfa/env" >> "$GITHUB_ENV"
      # Like a shard: a failed test is retried once and does not fail the step,
      # the score counts it and lists a pass on the retry.
      - name: Run the fixture
        working-directory: conformance
        run: |
          report="$RUNNER_TEMP/rust-contract-report/vitest.json"
          mkdir -p "$(dirname "$report")"
          status=0
          pnpm exec vitest run --project compliance src/suites/compliance/hook-free-server.test.ts --retry=1 --reporter=default --reporter=json "--outputFile.json=$report" || status=$?
          echo "Vitest exited with status $status."
          test -s "$report"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-contract-report-release
          overwrite: true
          path: ${{ runner.temp }}/rust-contract-report/vitest.json
          if-no-files-found: error
          retention-days: 3
      - name: Stage the server log without its setup proof
        if: always()
        working-directory: conformance
        run: pnpm marfa:stage-logs --state "$RUNNER_TEMP/marfa" --to "$RUNNER_TEMP/server-logs"

      - name: Keep the server log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-contract-server-log-release
          overwrite: true
          retention-days: 3
          path: |
            ${{ runner.temp }}/server-logs/
          if-no-files-found: ignore
      - name: Stop the server
        if: always()
        working-directory: conformance
        run: pnpm marfa:down --state "$RUNNER_TEMP/marfa"

  # The score of the Rust server against the contract: tests passing out of
  # all, by file, in the job summary (`conformance/TARGET-INTERFACE.md` says how it is
  # counted). It fails when a fixture file did not pass whole,
  # when a shard wrote no report, and when the build or a shard failed. It
  # lists every test that passed only on a retry, in the summary and as a
  # warning, and counts it as passing. A
  # skipped job passes only when the classifier skipped it; this job runs
  # exactly when the classifier owes a run, so a build or shard skipped while
  # a run is owed fails here.
  rust-contract-score:
    needs:
      [
        changes,
        rust-contract,
        rust-contract-release,
        rust-contract-shards,
        rust-contract-release-check,
      ]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust-contract-server != 'false' || needs.changes.outputs.rust-contract-device != 'false') }}
    name: Rust contract score
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Require the builds and every shard to have run
        env:
          BUILD: ${{ needs.rust-contract.result }}
          SHARDS: ${{ needs.rust-contract-shards.result }}
          # A change to what the server is built from, or to the fixture that
          # runs the build without test hooks and what it loads, owes that
          # build and the fixture; a change to other fixtures does not.
          RELEASE_OWED: ${{ needs.changes.result != 'success' || needs.changes.outputs.rust-contract-release != 'false' }}
          RELEASE: ${{ needs.rust-contract-release.result }}
          RELEASE_CHECK: ${{ needs.rust-contract-release-check.result }}
        run: |
          echo "Build: $BUILD. Shards: $SHARDS. Without test hooks: $RELEASE, run: $RELEASE_CHECK."
          if [ "$BUILD" != success ] || [ "$SHARDS" != success ]; then
            echo "::error::The Rust server was owed a build and every shard, and one did not pass."
            exit 1
          fi
          if [ "$RELEASE_OWED" = true ] && { [ "$RELEASE" != success ] || [ "$RELEASE_CHECK" != success ]; }; then
            echo "::error::The server a release ships was owed a build and its fixture, and one did not pass."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-contract-report-*
          path: ${{ runner.temp }}/rust-contract-reports
      - name: Score the run
        working-directory: conformance
        # The projects of the shards that ran, from the list that made the
        # matrix. A project left out is not judged; one named and not run fails.
        # The fixture that runs apart from the shards is judged only when the
        # classifier ran it, and a file it owes that no report names fails.
        env:
          PROJECTS: ${{ needs.changes.outputs.rust-projects }}
          RUN_APART: ${{ needs.changes.result != 'success' || needs.changes.outputs.rust-contract-release != 'false' }}
        run: pnpm rust:score --reports "$RUNNER_TEMP/rust-contract-reports" --projects "$PROJECTS" --run-apart "$RUN_APART" --markdown "$GITHUB_STEP_SUMMARY"

  # The restore drill: a Rust server with an object store takes a backup,
  # its data directory is deleted, and a fresh server on the same bucket
  # restores the backup from the bucket alone; then the same with a backup
  # folder in place of the bucket. Every instance, item, edge and row line and
  # every file is compared; `conformance/scripts/restore-drill.ts` says what it
  # proves and prints its report, which is kept when it failed.
  restore-drill:
    needs: [changes, rust-contract]
    if: ${{ !cancelled() && needs.rust-contract.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.restore-drill != 'false') }}
    name: Restore drill
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Nothing in the workspace is built for the Rust server.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-contract-server
          path: ${{ runner.temp }}/rust-contract-server
      - name: Name the server under test
        run: |
          chmod +x "$RUNNER_TEMP/rust-contract-server/marfa-server"
          echo "MARFA_SERVER_BIN=$RUNNER_TEMP/rust-contract-server/marfa-server" >> "$GITHUB_ENV"

      - name: Boot the object store
        working-directory: conformance
        run: |
          curl --fail --location --retry 3 --retry-all-errors https://garagehq.deuxfleurs.fr/_releases/v2.4.1/x86_64-unknown-linux-musl/garage -o "$RUNNER_TEMP/garage-bin"
          sudo install -m 755 "$RUNNER_TEMP/garage-bin" /usr/local/bin/garage
          pnpm garage:up --state "$RUNNER_TEMP/garage"

      - name: Run the drill
        working-directory: conformance
        run: pnpm drill:restore --state "$RUNNER_TEMP/drill/state"

      - name: Run the drill on a backup folder
        working-directory: conformance
        run: pnpm drill:restore --folder --state "$RUNNER_TEMP/drill/folder-state"

      - name: Stop the object store
        if: always()
        working-directory: conformance
        run: pnpm garage:down --state "$RUNNER_TEMP/garage"

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-drill-report
          path: ${{ runner.temp }}/drill/reports/
          if-no-files-found: ignore

  # The device and CLI fixtures against the Rust server on macOS, for what
  # only a Mac has: FSEvents, name case, Finder packages and the login
  # keychain, which the run must leave as it found it. The nightly and a
  # dispatch with `macos` run it; every pull request runs the same files on
  # Linux in the Rust contract shards, where a test that runs only on macOS
  # is left out of the score. The server is built here once, natively and
  # with its test hooks, without the native file readers, which the fixtures
  # turn off, with the device and the Node module, and every shard downloads
  # them.
  rust-contract-macos:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.macos) && (needs.changes.result != 'success' || needs.changes.outputs.rust-contract-macos != 'false') }}
    name: Rust server on macOS (build)
    timeout-minutes: 40
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          save-if: false
      - name: Build the server, the device and the Node module under test
        working-directory: core
        run: |
          cargo build --locked --release -p marfa-server --features test-hooks
          cargo build --locked -p marfa-cli
          cd bindings/node
          pnpm --ignore-workspace install --frozen-lockfile
          pnpm --ignore-workspace run build:debug
      # Every shard downloads them, so they are inputs and kept on success.
      - name: Keep what is under test
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-contract-macos-build
          path: |
            core/target/release/marfa-server
            core/target/debug/marfa
            core/bindings/node/*.node
          if-no-files-found: error
          retention-days: 3

  rust-contract-macos-shards:
    needs: [changes, rust-contract-macos]
    if: ${{ !cancelled() && needs.rust-contract-macos.result == 'success' }}
    name: Rust contract on macOS (${{ matrix.name }})
    timeout-minutes: 50
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "cli", slug: cli, args: "--project cli" }
          - {
              name: "device 1/3",
              slug: device-1,
              args: "--project device --shard=1/3",
            }
          - {
              name: "device 2/3",
              slug: device-2,
              args: "--project device --shard=2/3",
            }
          - {
              name: "device 3/3",
              slug: device-3,
              args: "--project device --shard=3/3",
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Into the checkout where they were built, so each path is the one the
      # build left.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-contract-macos-build
          path: core
      # An artifact keeps no file mode, and its time is the download's, which
      # the device suite reads as newer than this checkout's sources.
      - name: Name what is under test
        run: |
          chmod +x core/target/release/marfa-server core/target/debug/marfa
          echo "MARFA_SERVER_BIN=$PWD/core/target/release/marfa-server" >> "$GITHUB_ENV"
          echo "MARFA_DEVICE_BIN=$PWD/core/target/debug/marfa" >> "$GITHUB_ENV"
          echo "MARFA_DEVICE_MODULE=$(ls "$PWD"/core/bindings/node/*.node)" >> "$GITHUB_ENV"

      # `garage:up` writes S3 settings to GITHUB_ENV for the server.
      - name: Put an object store beside the server
        working-directory: conformance
        run: |
          brew install garage
          pnpm garage:up --state "$RUNNER_TEMP/garage"

      - name: Boot the Rust server
        working-directory: conformance
        env:
          CONFORMANCE_SERVER_IDLE_MS: "0"
        run: |
          pnpm marfa:up --state "$RUNNER_TEMP/marfa"
          cat "$RUNNER_TEMP/marfa/env" >> "$GITHUB_ENV"

      # A failed test is retried once and fails the shard if it fails again.
      # The score job judges the report, where a skip fails too unless the
      # test says this machine cannot run it, and lists a pass on a retry.
      - name: Run the shard
        working-directory: conformance
        env:
          ARGS: ${{ matrix.args }}
        run: |
          report="$RUNNER_TEMP/rust-contract-report/vitest.json"
          mkdir -p "$(dirname "$report")"
          read -r -a args <<< "$ARGS"
          ../core/scripts/login-keychain-unchanged.sh pnpm exec vitest run --retry=1 "${args[@]}" --reporter=default --reporter=json "--outputFile.json=$report"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-contract-macos-report-${{ matrix.slug }}
          overwrite: true
          path: ${{ runner.temp }}/rust-contract-report/vitest.json
          if-no-files-found: error
          retention-days: 3

      # Before the stop, because `marfa:down` clears the state directory and
      # the log is in it.
      - name: Stage the server log without its setup proof
        if: failure()
        working-directory: conformance
        run: pnpm marfa:stage-logs --state "$RUNNER_TEMP/marfa" --to "$RUNNER_TEMP/server-logs"

      - name: Keep the server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-contract-macos-server-log-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/server-logs/
          if-no-files-found: ignore

      - name: Stop the server
        if: always()
        working-directory: conformance
        run: pnpm marfa:down --state "$RUNNER_TEMP/marfa"

      - name: Stop the object store
        if: always()
        working-directory: conformance
        run: pnpm garage:down --state "$RUNNER_TEMP/garage"

  # The score of the macOS shards, judged as the Linux score is but for the
  # CLI and device projects, on macOS: every test there must pass, and a
  # test that runs only on macOS counts. It fails when the build did not
  # pass or a shard wrote no report.
  rust-contract-macos-score:
    needs: [changes, rust-contract-macos, rust-contract-macos-shards]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.macos) && (needs.changes.result != 'success' || needs.changes.outputs.rust-contract-macos != 'false') }}
    name: Rust contract score on macOS
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require the build to have passed and every shard to have run
        env:
          BUILD: ${{ needs.rust-contract-macos.result }}
          SHARDS: ${{ needs.rust-contract-macos-shards.result }}
        run: |
          echo "Build: $BUILD. Shards: $SHARDS."
          if [ "$BUILD" != success ] || { [ "$SHARDS" != success ] && [ "$SHARDS" != failure ]; }; then
            echo "::error::The macOS build or its shards did not run."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-contract-macos-report-*
          path: ${{ runner.temp }}/rust-contract-reports
      - name: Score the run
        working-directory: conformance
        run: pnpm rust:score --reports "$RUNNER_TEMP/rust-contract-reports" --platform darwin --projects cli,device --markdown "$GITHUB_STEP_SUMMARY"

  # The shipped image, made as a release makes it: the static Linux programs
  # from `scripts/release/build-programs.sh`, then `deploy/Dockerfile` around
  # them, then `scripts/check-image.sh`, which boots it on a read-only root
  # with a volume and holds it to what an owner is told. The native downloads
  # and PDFium library are the ones `core-native` saves from `main`.
  image:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.image != 'false') }}
    name: Server image
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Choose the folder for downloads and results
        run: echo "MARFA_NATIVE_ROOT=$RUNNER_TEMP/marfa-native" >> "$GITHUB_ENV"
      - name: Key the cache on the pins, the patches and the build scripts
        id: key
        run: echo "key=marfa-native-$RUNNER_OS-${{ hashFiles('core/marfa-enrichment/native/manifest.txt', 'core/marfa-enrichment/native/patches/**', 'core/marfa-enrichment/native/build.sh', 'core/marfa-enrichment/native/pdfium.sh', 'core/marfa-enrichment/native/tesseract.sh', 'core/marfa-enrichment/native/models.sh', 'core/marfa-enrichment/native/lib.sh', 'core/marfa-enrichment/native/linux/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the downloads and the PDFium library
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/marfa-native/downloads
            ${{ runner.temp }}/marfa-native/archives
          key: ${{ steps.key.outputs.key }}
      # The image is restored from the cache, never built from the package
      # archive when the cache holds it; `main` saves it.
      - name: Make the build image
        uses: ./.github/actions/native-build-image
      - name: Build and check the programs
        run: scripts/release/build-programs.sh "$TARGET"
      - name: Build the image
        run: |
          version=$(awk '/^\[/ { own = ($0 == "[workspace.package]") } own && /^version = / { gsub(/"/, "", $3); print $3; exit }' core/Cargo.toml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          context="$RUNNER_TEMP/image-context/amd64"
          mkdir -p "$context"
          cp "$MARFA_NATIVE_ROOT/out/$TARGET"/{marfa,marfa-server,cloudflared,NOTICES.txt} "$context/"
          docker buildx build --load --platform linux/amd64 -f deploy/Dockerfile \
            --build-arg "VERSION=$version" --build-arg "REVISION=$GITHUB_SHA" \
            -t marfa-server "$RUNNER_TEMP/image-context"
      - name: Boot it, ask it, stop it
        run: scripts/check-image.sh marfa-server "$VERSION"

  types-freshness:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.types-freshness != 'false') }}
    name: Types codegen freshness
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The rules crate writes the shapes' digest from the shipped definitions
      # and the icon sets from the pinned Iconify releases. It embeds the icon
      # sets, so they stay in the tree while it builds, and the writer's own
      # folder is compared with them after.
      - uses: ./.github/actions/rust-toolchain
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest@0.9
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The icon sets' writer refuses what it should
        run: scripts/icon-sets.test.sh
      - name: Write the digest with Rust and check for drift
        run: |
          rm core/marfa-rules/types/shipped-shapes.sha256
          (cd core && MARFA_WRITE_CATALOG=1 cargo nextest run --locked -p marfa-rules the_committed_digest_is)
          if [ -n "$(git status --porcelain core/marfa-rules/types)" ]; then
            git status --porcelain core/marfa-rules/types
            echo "The shapes' digest differs from what the Rust writer produces. Run 'MARFA_WRITE_CATALOG=1 cargo nextest run -p marfa-rules builtin::catalog_file' in core and commit."
            exit 1
          fi
      - name: Write the icon sets with Rust and check for drift
        run: |
          # A fresh folder, so a set already in the tree cannot stand in for one the Rust writer did not write.
          sets="icon-set-lucide.json icon-set-simple-icons.json"
          fresh="${RUNNER_TEMP}/icon-sets"
          rm -rf "${fresh}"
          scripts/icon-sets.sh "${fresh}"
          if [ "$(ls -A "${fresh}")" != "$(printf '%s\n' ${sets})" ]; then
            echo "The Rust icon writer wrote: $(ls -A "${fresh}")"
            exit 1
          fi
          if [ "$(ls -A core/marfa-rules/icons)" != "$(printf '%s\n' ${sets})" ]; then
            echo "core/marfa-rules/icons holds: $(ls -A core/marfa-rules/icons)"
            exit 1
          fi
          for set in ${sets}; do
            git show "HEAD:core/marfa-rules/icons/${set}" | cmp - "${fresh}/${set}" || {
              echo "${set} differs from what the Rust icon writer produces. Run 'scripts/icon-sets.sh' and commit."
              exit 1
            }
          done

  version-fields:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version-fields != 'false') }}
    name: No file holds a version
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/rust-toolchain
      # No build step: the check reads manifests off the tree. A version
      # exists only when a tag is cut, and `release.yml` is the one writer;
      # a pull request that moves a manifest off the placeholder is refused
      # here, whatever else it does. cargo is on PATH because the check asks
      # cargo how it reads the manifests rather than parsing TOML itself.
      - name: Every manifest carries the placeholder
        run: pnpm vitest run ci/version-fields.test.ts

  # What is generated from `openapi.json` is committed, so a consumer reads
  # the types the document declares without generating anything. This
  # regenerates it from the committed document and refuses a difference: a
  # change to the document that did not regenerate, a hand edit to a
  # generated file, or a file under a generated directory the generator did
  # not write.
  #
  # Each step empties its client's generated directory before regenerating
  # it, so the generator's own output is the whole of what may be there: a
  # committed file it did not write shows as deleted, and one it writes that
  # is not committed shows as untracked. `git status` rather than `git diff`,
  # which does not see an untracked file.
  clients-freshness:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.clients-freshness != 'false') }}
    name: Generated clients are fresh
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate the TypeScript client and check for drift
        run: |
          rm -rf packages/client/src/generated
          pnpm --filter @withmarfa/client run generate
          if [ -n "$(git status --porcelain packages/client/src/generated)" ]; then
            git status --porcelain packages/client/src/generated
            echo "@withmarfa/client's generated sources are out of date with openapi.json, or hold a file the generator did not write. Run 'pnpm generate' and commit."
            exit 1
          fi
      - name: Regenerate what the core is built from and check for drift
        run: |
          rm -f core/marfa-rules/src/contract.rs
          pnpm run generate:core
          if [ -n "$(git status --porcelain core/marfa-rules/src/contract.rs)" ]; then
            git status --porcelain core/marfa-rules/src/contract.rs
            echo "The core's contract is out of date with openapi.json, or was edited by hand. Run 'pnpm generate' and commit."
            exit 1
          fi
      - uses: ./.github/actions/rust-toolchain
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest@0.9
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Write the catalog with Rust and check for drift
        run: |
          (cd core && MARFA_WRITE_CATALOG=1 cargo nextest run --locked -p marfa-rules the_committed_catalog_is)
          if [ -n "$(git status --porcelain core/marfa-rules/src/builtin_catalog.json)" ]; then
            git status --porcelain core/marfa-rules/src/builtin_catalog.json
            echo "The core's catalog differs from what the rules crate writes from the shipped types. Run 'MARFA_WRITE_CATALOG=1 cargo nextest run -p marfa-rules builtin::catalog_file' in core and commit."
            exit 1
          fi

  # The core's live checks, `core-live.yml`, for a pull request that reaches
  # what they read, so that `Full CI` waits for them: a workflow of its own on
  # `pull_request` would run beside the gate, and a merge waits only on
  # required checks. `core.yml` runs the same workflow for a push to `main`,
  # the nightly and a dispatch, so this job leaves those to it. Marking a
  # draft ready for review starts a run that includes it.
  core:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.core != 'false') }}
    name: Core
    uses: ./.github/workflows/core-live.yml
    with:
      swift-built: ${{ needs.changes.outputs.core-checks != 'false' && needs.changes.outputs.swift-package != 'false' }}

  # The one required check. A skipped job passes a required check, and a draft
  # skips most jobs, so on a draft this job is named `Draft CI`: the required
  # `Full CI` stays expected, which blocks a merge, until the run that marking
  # the pull request ready starts has finished every job.
  # It runs after a failed job and fails then. It also runs after the run was
  # cancelled, when a job it waits for failed: the fail-fast jobs above cancel
  # the run once the format check, typecheck or lint fails, and a gate that
  # skipped would leave `Full CI` expected forever. A run cancelled with no
  # failed job (a newer push replaced it) skips it, as it always has. Cancelled
  # slow jobs and the failed quick one make it fail, so a cancel cannot leave
  # it green. It waits for every job but `report-failure`, which only reports.
  gate:
    name: ${{ github.event.pull_request.draft && 'Draft CI' || 'Full CI' }}
    needs:
      [
        changes,
        quick-checks,
        typecheck,
        lint,
        stop-after-format,
        stop-after-typecheck,
        stop-after-lint,
        workspace-tests,
        core-checks,
        core-checks-linux,
        core-deny,
        core-native,
        core-fault-injection,
        conformance-offline,
        mcp-conformance,
        conformance,
        rust-contract,
        rust-contract-release,
        rust-contract-release-check,
        rust-contract-shards,
        rust-contract-score,
        rust-contract-macos,
        rust-contract-macos-shards,
        rust-contract-macos-score,
        restore-drill,
        image,
        types-freshness,
        version-fields,
        clients-freshness,
        core,
      ]
    if: ${{ !cancelled() || contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A job ended as ${result}: ${RESULTS}"
                exit 1
                ;;
            esac
          done

  # A failed nightly run opens an issue, or comments on the one that is open.
  # Only a schedule reports, so no pull request run can open an issue.
  # A job that reaches its timeout ends as cancelled, not failed, so a cancelled
  # job reports too.
  report-failure:
    name: Report a failed scheduled run
    needs:
      [
        changes,
        quick-checks,
        typecheck,
        lint,
        stop-after-format,
        stop-after-typecheck,
        stop-after-lint,
        workspace-tests,
        core-checks,
        core-checks-linux,
        core-deny,
        core-native,
        core-fault-injection,
        conformance-offline,
        mcp-conformance,
        conformance,
        rust-contract,
        rust-contract-release,
        rust-contract-release-check,
        rust-contract-shards,
        rust-contract-score,
        rust-contract-macos,
        rust-contract-macos-shards,
        rust-contract-macos-score,
        restore-drill,
        image,
        types-freshness,
        version-fields,
        clients-freshness,
        core,
      ]
    if: ${{ github.event_name == 'schedule' && (failure() || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/report-nightly-failure.sh
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/report-nightly-failure.sh
