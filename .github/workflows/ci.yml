name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancels a superseded run on a branch, and deliberately does not on `main`.
#
# On a branch a second push means the first answer describes a tree nobody has
# any more, so canceling is free. `main` is not a branch in that sense: every
# commit on it is a release candidate, and `release.yml` refuses a tag unless
# a *successful* `ci.yml` run exists at that exact SHA. A canceled run is not
# a successful one, so a superseded main commit becomes permanently
# unreleasable, silently, because nothing errors and the commit looks fine.
#
# Before adding `cancel-in-progress` to any group, ask what consumes the run's
# result at a specific SHA. Cancellation is safe where only the latest answer
# is wanted and unsafe wherever a per-commit answer is a gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job runs on the self-hosted pool and nothing falls back to a hosted
# runner: a job waiting for a pool that is down is the correct behavior, and
# a hosted macOS minute costs ten times a Linux one.
#
# No `actions/setup-node` cache anywhere in this file. The pool keeps its
# pnpm store between jobs, so the cache restores nothing, and its post step
# would tar the whole store — about 12 GB — on every job.
jobs:
  ci-sqlite:
    name: CI (SQLite)
    timeout-minutes: 60
    runs-on: self-hosted
    # One suite at a time across every ref in this repository.
    #
    # The resource is the machine. This job runs vitest's `forks` pool at its
    # default `cpus - 1`, which is one job short of the whole box that hosts
    # the pool, so two of these at once manufactures timeouts in files the
    # branch never touched — which reads as a defect in the branch under
    # test rather than as contention.
    #
    # `queue: max` rather than the default. The default keeps at most one
    # pending entry per group and CANCELS the previous one when a new job
    # arrives, which would trade a false red for a silently canceled check —
    # strictly worse, because a canceled required check blocks a merge with
    # nothing to read. `max` queues up to a hundred, FIFO.
    concurrency:
      group: marfa-suite-shared-host
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # The suite reaches `ci/version-fields.test.ts`, which asks cargo how it
      # reads the Rust manifests; Homebrew's rustup is keg-only, so nothing
      # it installs is on the default PATH.
      - name: Put the Rust toolchain on PATH
        run: |
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # MARFA_TEST_OCR runs the real tesseract engine (ocr.real.test.ts).
      # `MARFA_ENRICHMENT_TESSDATA_DIR` is a cache path the engine may write
      # to; the test resolves its model from the installed package, so
      # nothing here is load bearing.
      - run: MARFA_TEST_OCR=1 MARFA_ENRICHMENT_TESSDATA_DIR="$HOME/.cache/marfa-tessdata" pnpm test

  # The core's three commands on every pull request, not only on those that
  # touch `core/`: a required check has to report on each one, and the
  # binary's own tests read the root `openapi.json`. `core.yml` keeps the
  # expensive half: the live tests, the Swift FFI crate built for every
  # system it ships to, and the Node binding and its proof.
  #
  # Every crate but the generated `marfa-client`, which is held to its
  # generator rather than to these: `--no-deps` keeps clippy off it where a
  # hand-written crate depends on it. Formatting takes the whole workspace,
  # since the generator formats what it writes.
  core-checks:
    name: Core checks
    timeout-minutes: 30
    runs-on: self-hosted
    # The suite's group, for its reason: cargo takes every core the machine
    # has.
    concurrency:
      group: marfa-suite-shared-host
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      # Homebrew's rustup is keg-only, so nothing it installs is on the
      # default PATH.
      - name: Put the Rust toolchain on PATH
        run: |
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # The keychain tests skip, saying so, where no keychain answers. Where
      # the probe finds one that does, they are required for the rest of the
      # job, so a keychain that stops answering between the probe and the
      # tests fails the job; one that answers no probe at all is named in the
      # log and its tests skip.
      - name: Say whether the keychain answers
        run: |
          if security add-generic-password -a probe -s marfa-keychain-probe -w probe -U; then
            echo "MARFA_KEYCHAIN_REQUIRED=1" >> "$GITHUB_ENV"
            echo "the keychain answers; its tests are required"
          else
            echo "the keychain does not answer; its tests will skip and say so"
          fi
          security delete-generic-password -a probe -s marfa-keychain-probe >/dev/null 2>&1 || true

      - name: Check the core workspace
        working-directory: core
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --exclude marfa-client --all-targets --no-deps -- -D warnings
          cargo test --locked --workspace --exclude marfa-client
      # Its own workspace, so its own three commands: cargo-swift refuses to
      # name a package inside a multi-crate workspace.
      - name: Check the Swift FFI crate
        working-directory: core/bindings/swift
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  # The contract, run against the server in this same checkout.
  #
  # No pinned server commit and no second checkout: a suite gating a SHA
  # somebody had to remember to move would make a server change and the
  # contract change that admits it two pull requests, with the gate
  # answering about neither tree. Here the tree under test is the tree the
  # suite runs against.
  #
  # A job in this workflow rather than one of its own, because `release.yml`
  # names `ci.yml` as the run a commit must be green on before it can be
  # released. A published package should not be able to come from a commit
  # the contract failed.
  conformance:
    name: Conformance
    timeout-minutes: 60
    runs-on: self-hosted
    # The same group as the suite above, for the same reason: the resource is
    # the machine. This job boots a server and drives it over HTTP, so a
    # second heavy job on the box manufactures timeouts in fixtures the branch
    # never touched. `queue: max` rather than the default, which cancels the
    # pending entry instead of queueing it.
    concurrency:
      group: marfa-suite-shared-host
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # `marfa:up` runs the server through tsx, which resolves
      # @withmarfa/shared through its dist, and the offline lane reads the
      # type registry from the same place.
      - run: pnpm --filter "@withmarfa/server..." build

      # The device half of the contract drives the `marfa` binary as the
      # device under test, so this job builds it. It stays in this job rather
      # than moving to core.yml because core.yml is path-gated on the core and
      # the server and would not run for a change to the fixtures alone, and
      # because `release.yml` names ci.yml as the run a commit must be green
      # on.
      # The two jobs share `marfa-suite-shared-host` above, so a cargo build
      # here never runs beside core.yml's on one machine.
      #
      # Homebrew's rustup is keg-only, so nothing it installs is on the
      # default PATH.
      - name: Put the Rust toolchain on PATH
        run: |
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build the device under test
        working-directory: core
        run: |
          cargo build -p marfa-cli
          echo "MARFA_DEVICE_BIN=$PWD/target/debug/marfa" >> "$GITHUB_ENV"

      # Typecheck, lint and format are not repeated here. The suite is a
      # workspace package, so the root's own checks reach it and they run in
      # the job above.
      - name: Offline lane
        working-directory: conformance
        run: pnpm test:generators

      # The object store the server attaches beside its disk, so the
      # object-store half of the blob chapters is asserted rather than
      # skipped. Garage is a Homebrew formula the runner host keeps once
      # installed; `garage:up` writes the `S3_*` values to `GITHUB_ENV`, and
      # `marfa:up` forwards its environment to the server it boots.
      - name: Put an object store beside the server
        working-directory: conformance
        run: |
          command -v garage || brew install garage
          pnpm garage:up --state "$RUNNER_TEMP/garage"

      - name: Boot the server from this checkout
        working-directory: conformance
        run: |
          pnpm marfa:up --state "$RUNNER_TEMP/marfa"
          cat "$RUNNER_TEMP/marfa/env" >> "$GITHUB_ENV"

      - name: Run the default selection
        working-directory: conformance
        run: pnpm test:conformance

      # Reads the log of the server the selection just drove, so it runs
      # here rather than as a job of its own and before the stop, which
      # clears the state directory the log is in. `--complete` because this
      # selection reaches every door: a declared status nothing drew fails
      # unless the checker lists why nothing can.
      - name: Hold every status observed to its declaration
        working-directory: conformance
        run: pnpm check:statuses --state "$RUNNER_TEMP/marfa" --complete

      # Before the stop, because `marfa:down` clears the state directory and
      # the log is in it. The server is still running here, which costs
      # nothing: the log is appended to and what a failure needs is already
      # written.
      - name: Keep the server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: marfa-server-log
          path: |
            ${{ runner.temp }}/marfa/server.log
            ${{ runner.temp }}/marfa/fresh-server-logs/
          if-no-files-found: ignore

      # Always, including when the selection failed: the server was spawned
      # detached, so nothing else reaps it and the next run on this runner
      # would find the state directory held by a live process.
      - name: Stop the server
        if: always()
        working-directory: conformance
        run: pnpm marfa:down --state "$RUNNER_TEMP/marfa"

      - name: Stop the object store
        if: always()
        working-directory: conformance
        run: pnpm garage:down --state "$RUNNER_TEMP/garage"

  # The scenario suite: the `marfa` binary driven as the reference client
  # against a server booted from this same checkout, end to end. A gate
  # beside the referee rather than a lane inside it, because the two answer
  # different questions: the referee asks whether the server keeps the
  # contract, this asks whether a person or an agent at a terminal can do
  # everything the server publishes.
  #
  # The same shared-host group as the jobs above, for the same reason: it
  # boots a server and builds the binary, and a second heavy job on the box
  # manufactures timeouts in scenarios the branch never touched.
  cli-scenarios:
    name: CLI scenarios
    timeout-minutes: 60
    runs-on: self-hosted
    concurrency:
      group: marfa-suite-shared-host
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@withmarfa/server..." build

      # Homebrew's rustup is keg-only, so nothing it installs is on the
      # default PATH.
      - name: Put the Rust toolchain on PATH
        run: |
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build the binary under test
        working-directory: core
        run: |
          cargo build -p marfa-cli
          echo "MARFA_DEVICE_BIN=$PWD/target/debug/marfa" >> "$GITHUB_ENV"

      - name: Boot the server from this checkout
        working-directory: conformance
        run: |
          pnpm marfa:up --state "$RUNNER_TEMP/marfa-cli"
          cat "$RUNNER_TEMP/marfa-cli/env" >> "$GITHUB_ENV"

      - name: Run the scenarios
        working-directory: conformance
        run: pnpm test:cli

      - name: Hold every status observed to its declaration
        working-directory: conformance
        run: pnpm check:statuses --state "$RUNNER_TEMP/marfa-cli"

      # Before the stop, because `marfa:down` clears the state directory and
      # the log is in it.
      - name: Keep the server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: marfa-cli-server-log
          path: |
            ${{ runner.temp }}/marfa-cli/server.log
            ${{ runner.temp }}/marfa-cli/fresh-server-logs/
          if-no-files-found: ignore

      # Always, including when a scenario failed: the server was spawned
      # detached, so nothing else reaps it.
      - name: Stop the server
        if: always()
        working-directory: conformance
        run: pnpm marfa:down --state "$RUNNER_TEMP/marfa-cli"

  # The restore drill: a fresh instance rebuilt from the bucket alone, to
  # the byte, against the same local object store the conformance job
  # attaches. Litestream streams the database and the server's own
  # replication carries the blobs; `conformance/scripts/restore-drill.ts`
  # says what it proves and prints its report, which is kept as an
  # artifact whether or not it passed.
  restore-drill:
    name: Restore drill
    timeout-minutes: 30
    runs-on: self-hosted
    # The same group as the suites above: this job boots two servers and a
    # Litestream process, and a second heavy job on the box would turn the
    # drill's sync waits into failures the branch never caused.
    concurrency:
      group: marfa-suite-shared-host
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@withmarfa/server..." build

      # Both are Homebrew formulae the runner host keeps once installed;
      # Litestream's is a tap. `garage:up` writes the `S3_*` values to
      # `GITHUB_ENV`, which is what the drill reads.
      - name: Put the object store and Litestream on the host
        working-directory: conformance
        run: |
          command -v garage || brew install garage
          command -v litestream || brew install benbjohnson/litestream/litestream
          pnpm garage:up --state "$RUNNER_TEMP/garage"

      - name: Run the drill
        working-directory: conformance
        run: pnpm drill:restore --state "$RUNNER_TEMP/drill/state"

      - name: Stop the object store
        if: always()
        working-directory: conformance
        run: pnpm garage:down --state "$RUNNER_TEMP/garage"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: restore-drill-report
          path: ${{ runner.temp }}/drill/reports/restore-drill.md
          if-no-files-found: ignore

  # Freshness jobs catch generated-artifact drift, on every event rather
  # than behind a path filter: on the pool the work costs seconds, and a
  # gate that skips is a gate that can be wrong.
  types-freshness:
    name: Types codegen freshness
    timeout-minutes: 15
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @withmarfa/types validate
      - name: Regenerate and check for drift
        run: |
          rm -rf packages/types/generated
          pnpm --filter @withmarfa/types generate
          if [ -n "$(git status --porcelain packages/types/generated)" ]; then
            git status --porcelain packages/types/generated
            echo "Generated type registry is out of date, or holds a file the generator did not write. Run 'pnpm --filter @withmarfa/types generate' and commit."
            exit 1
          fi

  openapi-freshness:
    name: OpenAPI spec freshness
    timeout-minutes: 15
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # Build first — the generator script imports through @withmarfa/shared,
      # which needs its dist/ before tsx can resolve it.
      - run: pnpm build
      - name: Regenerate and check for drift
        run: |
          pnpm --filter @withmarfa/server run generate:openapi
          if ! git diff --exit-code openapi.json; then
            echo "openapi.json is out of date. Run 'pnpm generate' and commit."
            exit 1
          fi

  version-fields:
    name: No file holds a version
    timeout-minutes: 10
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Put the Rust toolchain on PATH
        run: |
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # No build step: the check reads manifests off the tree. A version
      # exists only when a tag is cut, and `release.yml` is the one writer;
      # a pull request that moves a manifest off the placeholder is refused
      # here, whatever else it does. cargo is on PATH because the check asks
      # cargo how it reads the manifests rather than parsing TOML itself.
      - name: Every manifest carries the placeholder
        run: pnpm vitest run ci/version-fields.test.ts

  # What is generated from `openapi.json` is committed, so a consumer reads
  # the types the document declares without generating anything. This
  # regenerates it from the committed document and refuses a difference: a
  # change to the document that did not regenerate, a hand edit to a
  # generated file, or a file under a generated directory the generator did
  # not write.
  #
  # Each step empties its client's generated directory before regenerating
  # it, so the generator's own output is the whole of what may be there: a
  # committed file it did not write shows as deleted, and one it writes that
  # is not committed shows as untracked. `git status` rather than `git diff`,
  # which does not see an untracked file.
  clients-freshness:
    name: Generated clients are fresh
    timeout-minutes: 15
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Regenerate the TypeScript client and check for drift
        run: |
          rm -rf packages/client/src/generated
          pnpm --filter @withmarfa/client run generate
          if [ -n "$(git status --porcelain packages/client/src/generated)" ]; then
            git status --porcelain packages/client/src/generated
            echo "@withmarfa/client's generated sources are out of date with openapi.json, or hold a file the generator did not write. Run 'pnpm generate' and commit."
            exit 1
          fi
      # OpenAPI Generator is a Java program. The JDK comes from the action
      # rather than from the machine, so any runner in the pool can take the
      # job whether or not its host has one installed.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # `generate:rust` formats what it writes with cargo; Homebrew's rustup
      # is keg-only, so nothing it installs is on the default PATH.
      - name: Put the Rust toolchain on PATH
        run: |
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # The whole crate directory is checked, so the generator's manifest,
      # `.openapi-generator/FILES`, is held to what it wrote as well. Outside
      # `src/` the crate holds only its generator's configuration, named
      # here, so a file beside them would ship in the crate unwritten by
      # anything.
      - name: Regenerate the Rust client and check for drift
        run: |
          rm -rf core/marfa-client/src
          pnpm run generate:rust
          if [ -n "$(git status --porcelain core/marfa-client)" ]; then
            git status --porcelain core/marfa-client
            echo "marfa-client is out of date with openapi.json, or holds a file the generator did not write. Run 'pnpm generate' and commit."
            exit 1
          fi
          configuration=$(printf '%s\n' \
            core/marfa-client/.openapi-generator-ignore \
            core/marfa-client/.openapi-generator/FILES \
            core/marfa-client/.openapi-generator/VERSION \
            core/marfa-client/Cargo.toml \
            core/marfa-client/openapitools.json \
            core/marfa-client/templates/lib.mustache \
            core/marfa-client/templates/model_mod.mustache)
          beside=$(git ls-files core/marfa-client | grep -v '^core/marfa-client/src/' || true)
          if [ "$beside" != "$configuration" ]; then
            echo "marfa-client holds files outside src/ other than its generator's configuration:"
            diff <(echo "$configuration") <(echo "$beside") || true
            exit 1
          fi
      - name: Regenerate the core's contract and check for drift
        run: |
          rm -f core/marfa-core/src/contract.rs
          pnpm run generate:core
          if [ -n "$(git status --porcelain core/marfa-core/src/contract.rs)" ]; then
            git status --porcelain core/marfa-core/src/contract.rs
            echo "The core's contract is out of date with openapi.json, or was edited by hand. Run 'pnpm generate' and commit."
            exit 1
          fi
