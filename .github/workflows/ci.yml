name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  # Freshness jobs are also triggerable manually so agents can verify
  # generated-artefact drift (types registry, openapi.json) before merging
  # a PR that touches schema or shared-type sources. See myme/CLAUDE.md for
  # when to fire this.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Freshness jobs — catch generated-artefact drift. Run on main pushes and
  # on manual dispatch, but NOT on every PR push. Agents are expected to
  # fire these via `gh workflow run ci.yml --ref <branch>` before merging
  # a PR that modifies type or schema source files.
  types-freshness:
    name: Types codegen freshness
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mymehq/types validate
      - name: Regenerate and check for drift
        run: |
          pnpm --filter @mymehq/types generate
          if ! git diff --exit-code packages/types/generated/; then
            echo "Generated type registry is out of date. Run 'pnpm --filter @mymehq/types generate' and commit."
            exit 1
          fi

  openapi-freshness:
    name: OpenAPI spec freshness
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      # Build first — the generator script imports through @mymehq/shared,
      # which needs its dist/ before tsx can resolve it.
      - run: pnpm build
      - name: Regenerate and check for drift
        run: |
          pnpm --silent --filter @mymehq/server generate:openapi > openapi.json
          if ! git diff --exit-code openapi.json; then
            echo "openapi.json is out of date. Run 'pnpm --silent --filter @mymehq/server generate:openapi > openapi.json' and commit."
            exit 1
          fi

  # Sync-client integration — opt-in like the freshness jobs. Runs on
  # main pushes and on manual dispatch, NOT on every PR. Self-skips
  # when Atlas Postgres + Atlas Electric are unreachable from the
  # runner so an Atlas outage doesn't go red. Real coverage runs
  # locally on the developer MBP via:
  #   pnpm --filter @mymehq/sync-client test:integration
  sync-client-integration:
    name: Sync-client integration (Atlas)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MYME_INTEGRATION_DATABASE_URL: ${{ secrets.MYME_INTEGRATION_DATABASE_URL }}
      MYME_INTEGRATION_ELECTRIC_URL: ${{ secrets.MYME_INTEGRATION_ELECTRIC_URL }}
      MYME_INTEGRATION_SALT: ${{ secrets.MYME_INTEGRATION_SALT }}
      MYME_INTEGRATION_API_KEY: ${{ secrets.MYME_INTEGRATION_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run integration suite
        run: pnpm --filter @mymehq/sync-client test:integration

  # Test jobs — run on every PR and on main pushes. These are the fast
  # pre-merge signal and are considered load-bearing for merge decisions.
  ci-sqlite:
    name: CI (SQLite)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  ci-pg:
    name: CI (Postgres)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STORAGE_DIALECT: pg
      DATABASE_URL: postgresql://myme:myme@localhost:5432/myme_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: myme
          POSTGRES_PASSWORD: myme
          POSTGRES_DB: myme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U myme"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Exercises the full drizzle migration chain end-to-end against a fresh,
  # empty database — no SCHEMA_SQL bootstrap. The existing ci-sqlite / ci-pg
  # jobs run the app test suite, which can mask migration breakage when tests
  # bootstrap via SCHEMA_SQL. This job exists to catch future migration-chain
  # breakage on PR before it lands.
  ci-fresh-migrate-sqlite:
    name: CI (Fresh migrate, SQLite)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STORAGE_DIALECT: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Prepare fresh empty sqlite DB path
        run: |
          mkdir -p "${RUNNER_TEMP}/myme-migrate"
          echo "SQLITE_PATH=${RUNNER_TEMP}/myme-migrate/fresh.db" >> "$GITHUB_ENV"

      - name: Run migrations against fresh DB
        run: pnpm --filter @mymehq/server migrate

  ci-fresh-migrate-pg:
    name: CI (Fresh migrate, Postgres)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STORAGE_DIALECT: pg
      DATABASE_URL: postgresql://myme:myme@localhost:5432/myme_migrate_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: myme
          POSTGRES_PASSWORD: myme
          POSTGRES_DB: myme_migrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U myme"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run migrations against fresh DB
        run: pnpm --filter @mymehq/server migrate
