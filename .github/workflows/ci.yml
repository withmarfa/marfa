name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  pull_request:
    # No paths-ignore here: a required status check must report on every PR,
    # including documentation-only ones, or branch protection blocks the
    # merge waiting for a check that will never arrive. Skipping the work
    # rather than the trigger is the `changes` job's job.
    branches: [main]
  # Freshness jobs are also triggerable manually so agents can verify
  # generated-artifact drift (types registry, openapi.json) before merging
  # a PR that touches schema or shared-type sources. See marfa/CLAUDE.md for
  # when to fire this.
  #
  # Three jobs need a `postgres:17` service container, which the self-hosted
  # runners cannot provide, so they are the only ones billed to the hosted
  # allowance. They are gated on the `RUN_HOSTED_CI` repository variable and
  # are off by default: `pnpm test:pg` covers the same ground locally against
  # a throwaway container, so the marginal signal per pull request did not
  # justify the spend. Set the variable to `true` to turn them back on, which
  # is what the release pass does before shipping.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the diff so the expensive jobs below can skip work they cannot
  # be affected by. Gating happens at STEP level, not job level: `CI (SQLite)`
  # is a required status check, and a job skipped by an `if:` never reports,
  # which leaves branch protection waiting forever on a check that will never
  # arrive. Keeping the job and emptying it is the only shape that both skips
  # the work and satisfies the gate.
  #
  # Fails open by design. Anything this cannot classify counts as code, so an
  # unrecognized path runs the full suite rather than silently skipping it.
  # A missed run is a bad merge; a redundant run is a few minutes on a runner
  # the project already owns.
  changes:
    name: Detect changed paths
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      code: ${{ steps.filter.outputs.code }}
      sqlite_migrations: ${{ steps.filter.outputs.sqlite_migrations }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # A first push to a branch reports an all-zero `before`, and a shallow
          # or grafted history can leave the base unreachable. Either way the
          # diff is unknowable, so run everything.
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit unavailable — treating as a code change."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "sqlite_migrations=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}")"
          echo "Changed files:"; echo "${changed}" | sed 's/^/  /'

          # Paths that cannot alter runtime behavior. Everything else is code.
          docs_only='^(docs/|\.github/ISSUE_TEMPLATE/|LICENSE$|[^/]*\.md$|.*/[^/]*\.md$)'
          if [ -z "${changed}" ] || [ -z "$(echo "${changed}" | grep -Ev "${docs_only}" || true)" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

          if echo "${changed}" | grep -qE '^packages/server/drizzle/sqlite/'; then
            echo "sqlite_migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "sqlite_migrations=false" >> "$GITHUB_OUTPUT"
          fi

  # Freshness jobs — catch generated-artifact drift. Run on main pushes and
  # on manual dispatch, but NOT on every PR push. Agents are expected to
  # fire these via `gh workflow run ci.yml --ref <branch>` before merging
  # a PR that modifies type or schema source files.
  types-freshness:
    name: Types codegen freshness
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No `cache: pnpm`. On the self-hosted pool the store at
          # ~/Library/pnpm/store already persists between jobs, so the cache
          # restores nothing — but its post step still tars the whole store,
          # and that store is 12 GB. Several jobs finishing together put
          # concurrent multi-gigabyte tars on one machine, which is what made
          # runs take about an hour with every visible step green. Restore
          # this if the repository moves back to hosted runners, where the
          # store does not survive between jobs and the cache does pay.

      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @withmarfa/types validate
      - name: Regenerate and check for drift
        run: |
          pnpm --filter @withmarfa/types generate
          if ! git diff --exit-code packages/types/generated/; then
            echo "Generated type registry is out of date. Run 'pnpm --filter @withmarfa/types generate' and commit."
            exit 1
          fi

  openapi-freshness:
    name: OpenAPI spec freshness
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No `cache: pnpm`. On the self-hosted pool the store at
          # ~/Library/pnpm/store already persists between jobs, so the cache
          # restores nothing — but its post step still tars the whole store,
          # and that store is 12 GB. Several jobs finishing together put
          # concurrent multi-gigabyte tars on one machine, which is what made
          # runs take about an hour with every visible step green. Restore
          # this if the repository moves back to hosted runners, where the
          # store does not survive between jobs and the cache does pay.

      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      # Build first — the generator script imports through @withmarfa/shared,
      # which needs its dist/ before tsx can resolve it.
      - run: pnpm build
      - name: Regenerate and check for drift
        run: |
          pnpm --silent --filter @withmarfa/server generate:openapi > openapi.json
          if ! git diff --exit-code openapi.json; then
            echo "openapi.json is out of date. Run 'pnpm --silent --filter @withmarfa/server generate:openapi > openapi.json' and commit."
            exit 1
          fi

  # T-145: detect drift between Drizzle migrations and the auto-generated
  # SCHEMA_SQL bootstrap. Same trigger pattern as the other freshness jobs:
  # main + manual dispatch. Hardcoded ubuntu-latest because the PG generator
  # needs a services: container (Linux-only — same constraint as ci-pg).
  schema-sql-freshness:
    name: SCHEMA_SQL generator freshness
    if: github.event_name != 'pull_request' && vars.RUN_HOSTED_CI == 'true'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DATABASE_URL: postgresql://marfa:marfa@localhost:5432/marfa_schema_dump
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marfa
          POSTGRES_PASSWORD: marfa
          POSTGRES_DB: marfa_schema_dump
        ports:
          - 5432:5432
        # `pg_isready` alone returns OK before the cluster actually serves
        # queries (well-known false positive — fast first pass that succeeds
        # while the database is still initializing). Chaining a real
        # `psql … SELECT 1` against the `postgres` system DB is the only
        # fully reliable readiness signal. Mirrors the local `test-pg.sh`
        # fix; symmetric across all three PG service containers in this
        # workflow.
        options: >-
          --health-cmd="pg_isready -U marfa && psql -U marfa -d postgres -c 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No `cache: pnpm`. On the self-hosted pool the store at
          # ~/Library/pnpm/store already persists between jobs, so the cache
          # restores nothing — but its post step still tars the whole store,
          # and that store is 12 GB. Several jobs finishing together put
          # concurrent multi-gigabyte tars on one machine, which is what made
          # runs take about an hour with every visible step green. Restore
          # this if the repository moves back to hosted runners, where the
          # store does not survive between jobs and the cache does pay.

      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Install pg_dump 17 — the runner's preinstalled client tools are older
      # than the postgres:17 service container, and pg_dump refuses to dump a
      # newer-version server. The postgresql-client-17 package lands a real
      # binary at /usr/lib/postgresql/17/bin/pg_dump, but /usr/bin/pg_dump
      # is `pg_wrapper` (from postgresql-common) which defaults to PG 16
      # when both clients are present. Prepend /usr/lib/postgresql/17/bin
      # to PATH so the generator picks the matching version.
      - name: Install postgresql-client-17
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Regenerate SQLite SCHEMA_SQL
        run: pnpm --filter @withmarfa/server run schema-sql:generate:sqlite
      - name: Regenerate Postgres SCHEMA_SQL
        # Bypass the with-temp-pg.sh wrapper — runner reaches services
        # container directly on localhost:5432, and uses the host pg_dump 17
        # installed above (PG_CONTAINER_NAME stays unset so the generator
        # falls back to the host binary path). Sanity-check pg_dump version
        # before the run so a wrapper-resolution regression fails loudly
        # instead of producing diff churn.
        run: |
          pg_dump --version
          pnpm --filter @withmarfa/server exec tsx scripts/generate-schema-sql.ts --dialect=pg
      - name: Check for drift
        run: |
          if ! git diff --exit-code packages/server/src/storage/{pg,sqlite}/schema-sql.generated.ts; then
            echo "SCHEMA_SQL is out of date. Run 'pnpm --filter @withmarfa/server schema-sql:generate' and commit."
            exit 1
          fi

  # Lints SQLite migrations for the `--> statement-breakpoint` marker
  # between `;`-terminated statements. Drizzle's libsql migrator splits
  # each `.sql` file on the literal marker and runs each chunk through
  # libsql's single-statement `execute()` — multiple statements in one
  # chunk silently drop all but the first. T-145 surfaced three pre-
  # existing instances of this class of bug (0043 / 0044 / 0046); this
  # gate prevents the next one from landing.
  sqlite-migrations-lint:
    name: SQLite migrations — statement-breakpoint lint
    needs: changes
    if: needs.changes.outputs.sqlite_migrations == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No `cache: pnpm`. On the self-hosted pool the store at
          # ~/Library/pnpm/store already persists between jobs, so the cache
          # restores nothing — but its post step still tars the whole store,
          # and that store is 12 GB. Several jobs finishing together put
          # concurrent multi-gigabyte tars on one machine, which is what made
          # runs take about an hour with every visible step green. Restore
          # this if the repository moves back to hosted runners, where the
          # store does not survive between jobs and the cache does pay.

      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @withmarfa/server run lint:sqlite-migrations

  # Test jobs — run on every PR and on main pushes. These are the fast
  # pre-merge signal and are considered load-bearing for merge decisions.
  ci-sqlite:
    name: CI (SQLite)
    needs: changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # This job always runs so the required check reports. When the diff is
      # documentation only it reports green without doing the work.
      - name: Nothing to test
        if: needs.changes.outputs.code != 'true'
        run: echo "Documentation-only change — the suite cannot be affected by it."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.code == 'true'
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22
          # No `cache: pnpm`. On the self-hosted pool the store at
          # ~/Library/pnpm/store already persists between jobs, so the cache
          # restores nothing — but its post step still tars the whole store,
          # and that store is 12 GB. Several jobs finishing together put
          # concurrent multi-gigabyte tars on one machine, which is what made
          # runs take about an hour with every visible step green. Restore
          # this if the repository moves back to hosted runners, where the
          # store does not survive between jobs and the cache does pay.

      - name: Configure registry auth
        if: needs.changes.outputs.code == 'true'
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.code == 'true'
        run: pnpm build
      - if: needs.changes.outputs.code == 'true'
        run: pnpm typecheck
      - if: needs.changes.outputs.code == 'true'
        run: pnpm lint
      - if: needs.changes.outputs.code == 'true'
        run: pnpm format:check
      - if: needs.changes.outputs.code == 'true'
        run: pnpm test
      - if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @withmarfa/server run smoke:worker-entry

  ci-pg:
    name: CI (Postgres)
    needs: changes
    # Also gated on the diff: this is the one job billed to the hosted
    # allowance, so a documentation-only pull request must never reach it even
    # in a release window with `RUN_HOSTED_CI` switched on.
    if: github.event_name != 'workflow_dispatch' && vars.RUN_HOSTED_CI == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DB_DIALECT: pg
      DATABASE_URL: postgresql://marfa:marfa@localhost:5432/marfa_test
      # The vitest globalSetup uses MARFA_TEST_PG_ADMIN_URL to CREATE / DROP
      # the test template + per-file clones on the cluster. Points at the
      # default `postgres` system DB so it's always reachable. See
      # packages/server/src/storage/pg/test-template.ts.
      MARFA_TEST_PG_ADMIN_URL: postgresql://marfa:marfa@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marfa
          POSTGRES_PASSWORD: marfa
          POSTGRES_DB: marfa_test
        ports:
          - 5432:5432
        # `pg_isready` alone returns OK before the cluster actually serves
        # queries (well-known false positive — fast first pass that succeeds
        # while the database is still initializing). Chaining a real
        # `psql … SELECT 1` against the `postgres` system DB is the only
        # fully reliable readiness signal. Mirrors the local `test-pg.sh`
        # fix; symmetric across all three PG service containers in this
        # workflow.
        options: >-
          --health-cmd="pg_isready -U marfa && psql -U marfa -d postgres -c 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No `cache: pnpm`. On the self-hosted pool the store at
          # ~/Library/pnpm/store already persists between jobs, so the cache
          # restores nothing — but its post step still tars the whole store,
          # and that store is 12 GB. Several jobs finishing together put
          # concurrent multi-gigabyte tars on one machine, which is what made
          # runs take about an hour with every visible step green. Restore
          # this if the repository moves back to hosted runners, where the
          # store does not survive between jobs and the cache does pay.

      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Exercises the full drizzle migration chain end-to-end against a fresh,
  # empty database — no SCHEMA_SQL bootstrap. The existing ci-sqlite / ci-pg
  # jobs run the app test suite, which can mask migration breakage when tests
  # bootstrap via SCHEMA_SQL. This job exists to catch future migration-chain
  # breakage on PR before it lands.
  ci-fresh-migrate-sqlite:
    name: CI (Fresh migrate, SQLite)
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DB_DIALECT: sqlite
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No `cache: pnpm`. On the self-hosted pool the store at
          # ~/Library/pnpm/store already persists between jobs, so the cache
          # restores nothing — but its post step still tars the whole store,
          # and that store is 12 GB. Several jobs finishing together put
          # concurrent multi-gigabyte tars on one machine, which is what made
          # runs take about an hour with every visible step green. Restore
          # this if the repository moves back to hosted runners, where the
          # store does not survive between jobs and the cache does pay.

      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Prepare fresh empty sqlite DB path
        run: |
          mkdir -p "${RUNNER_TEMP}/marfa-migrate"
          echo "SQLITE_PATH=${RUNNER_TEMP}/marfa-migrate/fresh.db" >> "$GITHUB_ENV"

      - name: Run migrations against fresh DB
        run: pnpm --filter @withmarfa/server migrate

  ci-fresh-migrate-pg:
    name: CI (Fresh migrate, Postgres)
    needs: changes
    if: github.event_name != 'workflow_dispatch' && vars.RUN_HOSTED_CI == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DB_DIALECT: pg
      DATABASE_URL: postgresql://marfa:marfa@localhost:5432/marfa_migrate_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marfa
          POSTGRES_PASSWORD: marfa
          POSTGRES_DB: marfa_migrate_test
        ports:
          - 5432:5432
        # `pg_isready` alone returns OK before the cluster actually serves
        # queries (well-known false positive — fast first pass that succeeds
        # while the database is still initializing). Chaining a real
        # `psql … SELECT 1` against the `postgres` system DB is the only
        # fully reliable readiness signal. Mirrors the local `test-pg.sh`
        # fix; symmetric across all three PG service containers in this
        # workflow.
        options: >-
          --health-cmd="pg_isready -U marfa && psql -U marfa -d postgres -c 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No `cache: pnpm`. On the self-hosted pool the store at
          # ~/Library/pnpm/store already persists between jobs, so the cache
          # restores nothing — but its post step still tars the whole store,
          # and that store is 12 GB. Several jobs finishing together put
          # concurrent multi-gigabyte tars on one machine, which is what made
          # runs take about an hour with every visible step green. Restore
          # this if the repository moves back to hosted runners, where the
          # store does not survive between jobs and the cache does pay.

      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run migrations against fresh DB
        run: pnpm --filter @withmarfa/server migrate
