name: Private control socket
on:
  pull_request:
    branches: [main]
    paths:
      - packages/server/src/control/**
      - .github/workflows/control-socket.yml
      - pnpm-lock.yaml
  push:
    branches: [main]
    paths:
      - packages/server/src/control/**
      - .github/workflows/control-socket.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y acl
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@withmarfa/server^...' build
      - run: pnpm exec vitest run packages/server/src/control/socket.test.ts
  macos:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@withmarfa/server^...' build
      - run: pnpm exec vitest run packages/server/src/control/socket.test.ts
