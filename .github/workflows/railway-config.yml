name: Railway config

# Plans `.railway/railway.ts` against the live project and comments the diff on
# the pull request. Plan only, never apply: the authoring file pins the server
# image tags, the deploy workflow moves them on every release, and an apply from
# a checkout made before the last deploy would roll production back to whichever
# build the file recorded. Applying stays deliberate and local, after
# `railway config pull` has refreshed the tags.
#
# Gated on a variable rather than the secret because `secrets` is not available
# in an `if` condition at any level while `vars` is, so a job cannot ask whether
# a secret exists. Set `RAILWAY_IAC_PLAN` to any non-empty value and add a
# `RAILWAY_TOKEN` secret holding a project token scoped to production; until
# both are present this workflow does nothing, which is the intended resting
# state rather than a failure.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".railway/**"

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

jobs:
  plan:
    # Hosted rather than the self-hosted pool: this reaches a third-party API
    # and has no reason to occupy a runner every other pull request shares.
    runs-on: ubuntu-latest
    if: >-
      vars.RAILWAY_IAC_PLAN != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      # pnpm before setup-node, or `cache: pnpm` has no pnpm to ask about its
      # store. The cache key is declared rather than left to the runner, which
      # `ci/cache-rule.test.ts` enforces: this job is hosted, so it is allowed.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # The CLI evaluates the authoring file with the workspace's own copy of
      # the `railway` package, so the install is not optional.
      - run: pnpm install --frozen-lockfile
      - uses: railwayapp/config@v1
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
