# Build + deploy the Marfa server to Railway.
#
# Two jobs, both hosted:
#   build-push  builds the linux/amd64 image NATIVELY on a GitHub-hosted
#               amd64 runner (no QEMU) and pushes it to GHCR under the
#               immutable per-build tag prod-<short-sha>.
#   deploy      points both services at that tag and gates on /health
#               reporting the SHA this run built.
#
# Nothing here needs a private network any more, so nothing runs on the
# self-hosted pool. Every Railway operation is an authenticated public API
# call, and the health probe is a public HTTPS request.
#
# Migrate-then-deploy is Railway's pre-deploy command on `web`, set to
# `node dist/migrate.js --dialect pg`. It runs between build and release in
# a separate container from the same image, with the service's variables,
# and a non-zero exit blocks the release without retrying. The server never
# migrates on boot.
#
# --dialect is explicit and load-bearing. The migrator falls back to
# SQLITE when DB_DIALECT is absent or misspelled, so a pre-deploy without
# the flag would run sqlite migrations against nothing, print "Migrations
# complete." and exit 0 — the gate passing while applying nothing.
#
# Manual trigger only. Merges to main change nothing until dispatched.
#
# Required GitHub config:
#   secrets.RAILWAY_API_TOKEN       workspace API token for the CLI
#   vars.RAILWAY_PROJECT_ID         the Railway project
#   vars.RAILWAY_ENVIRONMENT        the environment name, e.g. production
#   vars.RAILWAY_SERVICE_WEB        web service name or id
#   vars.RAILWAY_SERVICE_WORKER     worker service name or id
#   vars.RAILWAY_HEALTH_URL         origin to probe /health on
#   vars.GHCR_IMAGE                 image path, ghcr.io/<owner>/<name>
#   secrets.INTEGRATIONS_DEPLOY_KEY read-only deploy key for
#                                   withmarfa/integrations, which the image
#                                   stages its integrations from
#
# Railway pulls the image with a classic personal access token carrying
# read:packages, configured per service. A token with an expiry breaks
# every future pull with no warning, and it presents as a 401 that reads
# like a bad image reference.

name: Deploy server
run-name: Deploy server (${{ github.sha }})

on:
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  build-push:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # GITHUB_TOKEN pushes the image. Without this block the push fails with
    # a 403 that reads like a bad credential rather than a missing grant.
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      # The integrations the image installs. They live in
      # withmarfa/integrations, and the commit is the one
      # packages/server/integrations-ref.txt pins. The deploy key is
      # read-only and is consumed here rather than inside the build, so no
      # credential reaches a Docker layer.
      - id: integrations
        # The parser refuses anything that is not one full commit SHA.
        # Checkout given an empty ref for another repository takes that
        # repository's default branch and still succeeds, so a reader that
        # returned nothing would build green from an unpinned tree.
        #
        # Captured into a variable rather than expanded inside the `echo`,
        # for the reason the Dockerfile's staging loop gives about the same
        # parser family: a command substitution that fails while expanding
        # an argument does not fail the command it was expanding, so the
        # inline form writes an empty `ref` and exits 0 — the parser
        # correct, and unreachable.
        run: |
          set -euo pipefail
          ref="$(node packages/server/scripts/read-integrations-ref.mjs packages/server/integrations-ref.txt)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: withmarfa/integrations
          ref: ${{ steps.integrations.outputs.ref }}
          ssh-key: ${{ secrets.INTEGRATIONS_DEPLOY_KEY }}
          persist-credentials: false
          path: integrations-src
      - id: meta
        env:
          GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
        run: echo "image=${GHCR_IMAGE}:prod-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
      - name: Build and push linux/amd64 image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        # The Dockerfile's own build steps verify the image installs the
        # integrations it declares and can run them (see
        # packages/server/Dockerfile), so an image whose staged tree cannot
        # load fails here, before anything is pushed. What it cannot judge
        # is whether the declaration names the right set: nothing outside
        # withmarfa/integrations knows what that repository holds. A ref
        # that never passed CI can also be built and pushed.
        run: |
          docker buildx build --platform linux/amd64 \
            -f packages/server/Dockerfile \
            --build-arg VERSION_SHA="${GITHUB_SHA::7}" \
            -t "$IMAGE" \
            --push .

  deploy:
    needs: build-push
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # The services have to exist before anything can deploy to them, and
    # they cannot be created until an image exists to point them at. The
    # gate breaks that circle: the first run of this workflow builds and
    # pushes with the deploy skipped, and every run after it deploys.
    if: vars.RAILWAY_SERVICE_WEB != ''
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PROJECT: ${{ vars.RAILWAY_PROJECT_ID }}
      ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
      WEB: ${{ vars.RAILWAY_SERVICE_WEB }}
      WORKER: ${{ vars.RAILWAY_SERVICE_WORKER }}
      IMAGE: ${{ needs.build-push.outputs.image }}
    steps:
      - name: Install the Railway CLI
        run: |
          set -euo pipefail
          curl -fsSL https://railway.com/install.sh | sh
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      # web first, deliberately. Both services run the same image and every
      # boot stamps the migrations journal under an advisory lock, so a
      # worker that reached an empty database first would leave web's
      # pre-deploy migrate with nothing to do and the schema's provenance a
      # race. web carries the pre-deploy command; worker does not.
      - name: Point web at the new image
        run: |
          set -euo pipefail
          railway service source connect --image "$IMAGE" \
            --project "$PROJECT" --environment "$ENVIRONMENT" --service "$WEB"

      - name: Point worker at the new image
        run: |
          set -euo pipefail
          railway service source connect --image "$IMAGE" \
            --project "$PROJECT" --environment "$ENVIRONMENT" --service "$WORKER"

      # A source change is a staged change until something applies it. A
      # redeploy that is never issued leaves every step above green and the
      # old build serving, which arrives as a SHA-gate timeout reading like
      # a broken build.
      - name: Release both services
        run: |
          set -euo pipefail
          railway redeploy --yes --from-source \
            --project "$PROJECT" --environment "$ENVIRONMENT" --service "$WEB"
          railway redeploy --yes --from-source \
            --project "$PROJECT" --environment "$ENVIRONMENT" --service "$WORKER"

      # Railway's healthcheck proves a 2xx, not which build answered it.
      # /health reports the SHA, so poll until it matches the one this run
      # built and every deploy proves itself. Probed on the Railway-provided
      # domain rather than the public hostname, so the gate reads the same
      # before and after DNS points here.
      - name: Gate on the new build serving
        env:
          HEALTH_URL: ${{ vars.RAILWAY_HEALTH_URL }}
        run: |
          EXPECTED="${GITHUB_SHA::7}"
          for i in $(seq 1 90); do
            GOT=$(curl -fsS --max-time 5 "${HEALTH_URL}/health" 2>/dev/null \
              | grep -o '"sha":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
            if [ "$GOT" = "$EXPECTED" ]; then
              echo "healthy on $EXPECTED after ${i} polls"
              exit 0
            fi
            sleep 5
          done
          echo "health never reported $EXPECTED (last saw: ${GOT:-nothing})" >&2
          exit 1

      # The web poll proves nothing about the worker: it serves no public
      # domain, and a worker that crash-loops leaves the deploy green while
      # every scheduled run silently stops. Railway holds a deployment at
      # DEPLOYING until its healthcheck passes, so the deployment's own
      # status is the signal.
      - name: Gate on the worker deployment succeeding
        run: |
          set -uo pipefail
          for i in $(seq 1 60); do
            STATUS=$(railway deployment list --json \
              --project "$PROJECT" --environment "$ENVIRONMENT" --service "$WORKER" 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);console.log((Array.isArray(a)?a[0]:(a.deployments??[])[0])?.status??"")}catch{console.log("")}})' || true)
            case "$STATUS" in
              SUCCESS) echo "worker deployment succeeded after ${i} polls"; exit 0 ;;
              FAILED|CRASHED) echo "worker deployment reported $STATUS" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo "worker deployment never succeeded (last status: ${STATUS:-unknown})" >&2
          exit 1
