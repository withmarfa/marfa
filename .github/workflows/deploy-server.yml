# Build + deploy the Marfa server to its droplet.
#
# Two jobs:
#   build-push  builds the linux/amd64 image NATIVELY on a GitHub-hosted
#               amd64 runner (no QEMU) and pushes it to the container
#               registry under the immutable per-build tag <env>-<short-sha>.
#   deploy      runs on the SELF-HOSTED pool, which shares the private
#               network the droplets' SSH binds to. It syncs the compose
#               shape from infra/digitalocean/, points the box's .env at
#               the new tag, runs the one-shot migrate, rolls the stack,
#               and gates on /health reporting the deployed SHA.
#
# The runner split is deliberate. The image build needs an amd64 host and
# no private access, so it stays hosted. The deploy step needs the private
# network (the droplets expose 80/443 to the internet and nothing else),
# which only the self-hosted pool is on. Health is probed over the same
# SSH hop against localhost, so the gate works identically before and
# after the public DNS points at the box.
#
# Migrate-then-deploy: migrations run on the droplet via the compose
# one-shot BEFORE the stack rolls — the managed database accepts
# connections only from inside its private network, so the box is the only
# place they can run. A failed migration aborts the deploy with the old
# build still serving. The server never migrates on boot.
#
# Manual trigger only. Merges to main change nothing until dispatched.
#
# Required GitHub config:
#   secrets.DIGITALOCEAN_ACCESS_TOKEN  registry push credential
#   vars.DO_REGISTRY                   registry prefix, e.g.
#                                      registry.digitalocean.com/<name>
#   vars.STAGING_DEPLOY_SSH            ssh target for the staging box,
#                                      user@host on the private network
#   vars.PROD_DEPLOY_SSH               same for production
#   secrets.INTEGRATIONS_DEPLOY_KEY    read-only deploy key for
#                                      withmarfa/integrations, which the image
#                                      stages its integrations from
#
# Required on the self-hosted pool: an SSH key at ~/.ssh/marfa-droplets
# authorized on the boxes. Required on each box: /opt/marfa with .env and
# server.env already populated (first-deploy steps in
# infra/digitalocean/README.md), and Docker logged into the registry.

name: Deploy server
run-name: Deploy server (${{ inputs.environment }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, prod]
        default: staging

concurrency:
  group: deploy-server-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  build-push:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      # The integrations the image installs. They live in
      # withmarfa/integrations, and the commit is the one
      # packages/server/integrations-ref.txt pins. The deploy key is
      # read-only and is consumed here rather than inside the build, so no
      # credential reaches a Docker layer.
      - id: integrations
        # The parser refuses anything that is not one full commit SHA.
        # Checkout given an empty ref for another repository takes that
        # repository's default branch and still succeeds, so a reader that
        # returned nothing would build green from an unpinned tree.
        #
        # Captured into a variable rather than expanded inside the `echo`,
        # for the reason the Dockerfile's staging loop gives about the same
        # parser family: a command substitution that fails while expanding
        # an argument does not fail the command it was expanding, so the
        # inline form writes an empty `ref` and exits 0 — the parser
        # correct, and unreachable.
        run: |
          set -euo pipefail
          ref="$(node packages/server/scripts/read-integrations-ref.mjs packages/server/integrations-ref.txt)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: withmarfa/integrations
          ref: ${{ steps.integrations.outputs.ref }}
          ssh-key: ${{ secrets.INTEGRATIONS_DEPLOY_KEY }}
          persist-credentials: false
          path: integrations-src
      - id: meta
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          DO_REGISTRY: ${{ vars.DO_REGISTRY }}
        run: echo "image=${DO_REGISTRY}/marfa-server:${ENVIRONMENT}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the registry
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        # The registry accepts the API token as both username and password.
        run: |
          echo "$DIGITALOCEAN_ACCESS_TOKEN" | docker login registry.digitalocean.com \
            --username "$DIGITALOCEAN_ACCESS_TOKEN" --password-stdin
      - name: Build and push linux/amd64 image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        # The Dockerfile's own build steps verify the image installs the
        # integrations it declares and can run them (see
        # packages/server/Dockerfile), so an image whose staged tree cannot
        # load fails here, before anything is pushed. What it cannot judge
        # is whether the declaration names the right set: nothing outside
        # withmarfa/integrations knows what that repository holds. A ref
        # that never passed CI can also be built and pushed.
        run: |
          docker buildx build --platform linux/amd64 \
            -f packages/server/Dockerfile \
            --build-arg VERSION_SHA="${GITHUB_SHA::7}" \
            -t "$IMAGE" \
            --push .

  deploy:
    needs: build-push
    timeout-minutes: 15
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - id: target
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          STAGING_DEPLOY_SSH: ${{ vars.STAGING_DEPLOY_SSH }}
          PROD_DEPLOY_SSH: ${{ vars.PROD_DEPLOY_SSH }}
        # `services` is the explicit list the roll touches. The one-shot
        # migrate is deliberately absent: the roll below runs with
        # --no-deps precisely so compose never re-evaluates migrate's
        # completion condition (which it judges against a container the
        # --rm run already deleted, re-running migrations after the old
        # server is torn down).
        run: |
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "ssh=$PROD_DEPLOY_SSH" >> "$GITHUB_OUTPUT"
            echo "compose=compose.production.yml" >> "$GITHUB_OUTPUT"
            echo "services=server worker caddy" >> "$GITHUB_OUTPUT"
          else
            echo "ssh=$STAGING_DEPLOY_SSH" >> "$GITHUB_OUTPUT"
            echo "compose=compose.staging.yml" >> "$GITHUB_OUTPUT"
            echo "services=postgres server worker caddy" >> "$GITHUB_OUTPUT"
          fi

      # The compose shape deploys from the repo on every roll so the box
      # can never drift from what is reviewed here. The env files are the
      # box's own and are never written by a deploy.
      - name: Sync deployment shape
        env:
          TARGET: ${{ steps.target.outputs.ssh }}
        run: |
          scp -i ~/.ssh/marfa-droplets -o StrictHostKeyChecking=accept-new \
            infra/digitalocean/compose.production.yml \
            infra/digitalocean/compose.staging.yml \
            infra/digitalocean/Caddyfile \
            "$TARGET":/opt/marfa/

      - name: Point the box at the new image
        env:
          TARGET: ${{ steps.target.outputs.ssh }}
          IMAGE: ${{ needs.build-push.outputs.image }}
        run: |
          ssh -i ~/.ssh/marfa-droplets -o StrictHostKeyChecking=accept-new "$TARGET" \
            "sed -i 's#^MARFA_SERVER_IMAGE=.*#MARFA_SERVER_IMAGE=${IMAGE}#' /opt/marfa/.env \
             && grep -q '^MARFA_SERVER_IMAGE=${IMAGE}\$' /opt/marfa/.env"

      - name: Pull, migrate, roll
        env:
          TARGET: ${{ steps.target.outputs.ssh }}
          COMPOSE: ${{ steps.target.outputs.compose }}
          SERVICES: ${{ steps.target.outputs.services }}
        # Migrations gate the roll: a non-zero exit from the one-shot
        # leaves the old build serving and fails the workflow here. The
        # roll itself is --no-deps over an explicit service list — a bare
        # `up -d` re-evaluates migrate's completed-successfully condition
        # against a container the --rm run deleted, re-running migrations
        # as a managed container after the old server has already been
        # torn down for its image change; a failure on that redundant
        # second pass would be an outage instead of a clean abort.
        run: |
          ssh -i ~/.ssh/marfa-droplets -o StrictHostKeyChecking=accept-new "$TARGET" bash -s <<EOF
          set -euo pipefail
          cd /opt/marfa
          docker compose -f $COMPOSE pull --quiet
          # </dev/null is load-bearing: `compose run` attaches the script's
          # own stdin to the one-shot, which swallows the rest of this heredoc
          # — the roll line below never executed and the step still exited 0.
          docker compose -f $COMPOSE run --rm migrate </dev/null
          docker compose -f $COMPOSE up -d --no-deps $SERVICES
          EOF

      # A zero from compose says containers started; it says nothing about
      # the build actually serving. Poll /health on the box until it
      # reports the SHA this run built, so every deploy proves itself.
      # Probed over SSH against localhost: independent of DNS, TLS, and
      # whether the public hostname points here yet.
      - name: Gate on the new build serving
        env:
          TARGET: ${{ steps.target.outputs.ssh }}
        run: |
          EXPECTED="${GITHUB_SHA::7}"
          for i in $(seq 1 60); do
            GOT=$(ssh -i ~/.ssh/marfa-droplets -o StrictHostKeyChecking=accept-new "$TARGET" \
              "curl -fsS --max-time 5 http://localhost:8600/health 2>/dev/null" \
              | grep -o '"sha":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
            if [ "$GOT" = "$EXPECTED" ]; then
              echo "healthy on $EXPECTED after ${i} polls"
              exit 0
            fi
            sleep 5
          done
          echo "health never reported $EXPECTED (last saw: ${GOT:-nothing})" >&2
          # Disambiguate a broken deploy from broken connectivity: the poll
          # swallows both alike, and five silent minutes deserve a cause.
          ssh -i ~/.ssh/marfa-droplets -o StrictHostKeyChecking=accept-new "$TARGET" \
            "echo 'ssh reachable; the build is not serving'" \
            || echo "ssh itself unreachable" >&2
          exit 1

      # The web poll above proves nothing about the worker: it publishes no
      # port, and a worker that crash-loops leaves the deploy green while
      # all scheduled work silently stops. The container's own HEALTHCHECK
      # (the worker role serves /health on its port inside the network) is
      # the signal; poll until Docker reports it healthy.
      - name: Gate on the worker healthy
        env:
          TARGET: ${{ steps.target.outputs.ssh }}
          COMPOSE: ${{ steps.target.outputs.compose }}
        run: |
          for i in $(seq 1 24); do
            STATE=$(ssh -i ~/.ssh/marfa-droplets -o StrictHostKeyChecking=accept-new "$TARGET" \
              "cd /opt/marfa && docker inspect --format '{{.State.Health.Status}}' \
                 \$(docker compose -f $COMPOSE ps -q worker) 2>/dev/null" || true)
            if [ "$STATE" = "healthy" ]; then
              echo "worker healthy after ${i} polls"
              exit 0
            fi
            sleep 5
          done
          echo "worker never reported healthy (last state: ${STATE:-unknown})" >&2
          exit 1

      # The box keeps every image it ever pulled unless something removes
      # them, and one server image per merge batch filled staging's disk in
      # weeks, so a pull failed with "no space left on device" and read as a
      # build fault. Prune only after both gates pass: a failed roll keeps
      # the previous image on the box for the next attempt. Stopped containers
      # go first: a migrate run that was not removed keeps its image
      # referenced, and an image prune then skips it for good. After both
      # gates every container that matters is running, so a stopped one here
      # is a leftover by definition.
      - name: Prune images the box no longer serves
        env:
          TARGET: ${{ steps.target.outputs.ssh }}
        run: |
          ssh -i ~/.ssh/marfa-droplets -o StrictHostKeyChecking=accept-new "$TARGET" \
            "docker container prune -f >/dev/null \
             && docker image prune -af >/dev/null && df -h / | tail -1"
