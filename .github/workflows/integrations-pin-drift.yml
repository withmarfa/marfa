# Says when the integrations pin has fallen behind something the image
# would ship.
#
# `packages/server/integrations-ref.txt` holds the withmarfa/integrations
# commit the server image builds its integrations from. It is deliberately a
# commit rather than a branch, so two builds of one server commit ship the
# same integrations and moving it is a reviewed change. Nothing reported
# that it had gone stale, and the only way to find out was to know the file
# was there and go and look, which is the shape of a thing nobody does.
#
# **Scheduled rather than on push, because the pin being behind is usually
# correct.** Most commits in that repository are documentation and the image
# stages only `dist/`, so chasing its `main` on every merge would be churn
# and would defeat the immutability the pin exists for. What is missing is
# the signal, not the automation.
#
# **It compares built output rather than changed paths, and that is the
# whole design.** esbuild discards ordinary comments unconditionally, so a
# JSDoc-only edit to a manifest and a comment-only edit to a handler both
# produce a byte-identical bundle. Those edits dominate: when this was
# scoped the pin was six commits behind and every one of the six was
# comment, description or lint configuration. Any path filter wide enough to
# catch a real source change also catches those, so the obvious version of
# this guard would have fired as noise on its very first run, which is
# precisely the failure it exists to avoid. Paths are used only to decide
# whether the comparison is worth doing.
#
# **Hosted, not the self-hosted pool.** It builds a fifteen-package
# workspace twice, on a timer, unattended. The pool is one shared machine
# that also serves every pull request in the estate, and several suites fail
# on fixed time budgets, so a scheduled pair of builds landing there would
# manufacture failures in whatever else happened to be running. Nothing
# about comparing two refs of another repository wants the local pool.
#
# **The notifier states the finding, not the exit code.** A scheduled guard
# has no audience: nobody is watching a 07:42 run, so its report is the only
# thing anybody reads, and a report carrying a job conclusion sends whoever
# reads it back to the log to learn what actually happened. The `drift` job
# publishes what it found as job outputs and `notify` puts it in the title.
name: Integrations pin drift

on:
  schedule:
    # Early UTC, so a failure is waiting at the start of the day rather than
    # landing in the middle of one. Offset from the OpenAPI guard's 07:17 so
    # the two are not competing for a runner or for attention.
    - cron: "42 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # The repository the comparison is mandatory on. A fork or a self-hoster's
  # copy holds no deploy key, so it skips rather than failing on something it
  # has no way to fix.
  PIN_CANONICAL_REPO: withmarfa/marfa

jobs:
  drift:
    name: The pin is level with what the image would ship
    # What the notifier reports. Four different conditions end this job
    # without the pin being level and only one of them is drift, so the
    # verdict is published rather than inferred from the job's result.
    outputs:
      verdict: ${{ steps.finding.outputs.verdict }}
      detail: ${{ steps.finding.outputs.detail }}
      fields: ${{ steps.finding.outputs.fields }}
    runs-on: ubuntu-latest
    # A budget rather than the six-hour default: two installs and two builds
    # is minutes, and anything an order of magnitude past that is wedged.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - id: pin
        name: Read the pin and the declared set
        # The parser refuses anything that is not one full commit SHA, and it
        # runs here before any install, which is why it imports nothing but
        # node builtins.
        #
        # The key arrives through `env` rather than through `${{ }}` inside
        # the script. The runner renders an expression into the script text
        # before running it and echoes that text into the log, so an inline
        # form puts a private key one masking rule away from the run log,
        # and makes the rendered script the step's title when it has no
        # name. The OpenAPI guard does the same thing the same way.
        env:
          DEPLOY_KEY: ${{ secrets.INTEGRATIONS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # Every branch that ends this job without a verdict writes one into
          # `finding/` before it exits. The `Publish the finding` step at the
          # end of the job is the only thing that writes $GITHUB_OUTPUT, and
          # it runs on `if: always()` — which is what carries a finding out of
          # a failed job. Written before the exit rather than after it, for
          # the same reason.
          mkdir -p finding
          if [ -z "${DEPLOY_KEY:-}" ]; then
            # Neither branch compared anything, so neither can say the pin is
            # level. A guard that reached no verdict reports inconclusive.
            echo inconclusive > finding/verdict
            if [ "${GITHUB_REPOSITORY}" = "${PIN_CANONICAL_REPO}" ]; then
              echo "::error title=Pin drift guard cannot run::INTEGRATIONS_DEPLOY_KEY is not set on ${GITHUB_REPOSITORY}, so the pin was never compared. Failing rather than passing: a guard that cannot run must not report green."
              exit 1
            fi
            echo "::warning title=Cross-repo check skipped::INTEGRATIONS_DEPLOY_KEY is not set on ${GITHUB_REPOSITORY}, which is not ${PIN_CANONICAL_REPO}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="$(node packages/server/scripts/read-integrations-ref.mjs packages/server/integrations-ref.txt)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$ref" > finding/pin
          node packages/server/scripts/read-installed-integrations.mjs \
            packages/server/installed-integrations.txt > declared.txt
          echo "Pin is $ref; the image installs $(wc -l < declared.txt | tr -d ' ') integrations."

      # The whole history, so the pinned commit and `main` are both reachable
      # from one clone and the diff between them is a local operation.
      - uses: actions/checkout@v7
        if: steps.pin.outputs.skip != 'true'
        with:
          repository: withmarfa/integrations
          fetch-depth: 0
          ssh-key: ${{ secrets.INTEGRATIONS_DEPLOY_KEY }}
          persist-credentials: false
          path: head

      # A new integration is the one case the comparison below cannot see,
      # and it is the case this guard most exists for. Its package is not in
      # the declared set, so the loop never looks at it, and its registry
      # entry is filtered out before the loop is even reached: the run would
      # pay two builds and report the pin behind and correctly so.
      #
      # The condition is caught eventually, by the image build, but only
      # when somebody moves the pin, which is the thing nobody was doing.
      # Both inputs are already here, so ask now. Against `main`'s registry
      # rather than the pinned one, because a merge there is what starts the
      # clock.
      - id: declared
        name: The declaration covers everything main's registry marks shipped
        if: steps.pin.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sort declared.txt > declared.sorted
          node -e '
            const { integrations } = require("./head/registry.json");
            for (const e of integrations) if (e.shippedByMarfa) console.log(e.name);
          ' | sort > shipped.txt
          missing="$(comm -13 declared.sorted shipped.txt)"
          if [ -n "$missing" ]; then
            count="$(printf '%s\n' "$missing" | wc -l | tr -d ' ')"
            printf '%s\n' "$missing" > finding/subjects
            echo undeclared > finding/verdict
            if [ "$count" = 1 ]; then
              printf '%s is shipped on main and not declared\n' "$missing" > finding/detail
            else
              printf '%s integrations shipped on main are not declared\n' \
                "$count" > finding/detail
            fi
            echo "::error::withmarfa/integrations marks these shippedByMarfa on main and packages/server/installed-integrations.txt does not declare them:"
            echo "$missing" | sed 's/^/  /'
            echo "The image would not carry them and the listing would offer them. Declare them, or set shippedByMarfa false."
            exit 1
          fi
          echo "All $(wc -l < shipped.txt | tr -d ' ') integrations main marks shipped are declared."

      - id: behind
        if: steps.pin.outputs.skip != 'true'
        name: Is there anything between the pin and main that could reach a bundle
        env:
          PIN: ${{ steps.pin.outputs.ref }}
        run: |
          set -euo pipefail
          head_sha="$(git -C head rev-parse HEAD)"
          printf '%s\n' "$head_sha" > finding/main
          if [ "$head_sha" = "$PIN" ]; then
            echo "The pin is main. Nothing to compare."
            echo current > finding/verdict
            echo "compare=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git -C head merge-base --is-ancestor "$PIN" HEAD; then
            echo orphaned > finding/verdict
            printf 'pinned to %s, which is not on main\n' "${PIN:0:7}" > finding/detail
            echo "::error title=Pin is not on main::$PIN is not an ancestor of withmarfa/integrations main. The image is built from a commit that repository's main does not contain."
            exit 1
          fi
          count="$(git -C head rev-list --count "$PIN"..HEAD)"

          # An exclude list rather than an include list, so a path nobody has
          # thought about yet sends the run on to the comparison and gets a
          # truthful answer rather than a quiet pass.
          #
          # Everything named here is something no package's `dist/` can
          # carry, which is not the same as saying the image never sees it:
          # the image does copy `registry.json`, and the step above is what
          # asks about that. What the comparison below answers is narrower,
          # and it is what a bundle contains.
          #
          # A package the declaration does not name is excluded too. The
          # comparison only walks declared names, so a commit touching the
          # scaffold alone would otherwise buy two builds and report
          # nothing.
          # Narrow to paths that could reach a bundle this image stages:
          # a declared package's own files, or anything outside `packages/`,
          # which is where the lockfile, the workspace file and the shared
          # tsconfig live and which therefore affects every build. A package
          # nobody declared cannot reach the image at all, and dropping it
          # here is what stops a commit touching only the scaffold buying
          # two builds to report nothing.
          git -C head diff --name-only "$PIN"..HEAD > changed.txt
          reaching="$(awk '
              NR == FNR { declared["packages/" $0 "/"] = 1; next }
              $0 !~ /^packages\// { print; next }
              { for (prefix in declared) if (index($0, prefix) == 1) { print; break } }
            ' declared.txt changed.txt \
            | grep -Ev '(^|/)[^/]*\.md$' \
            | grep -Ev '(^|/)[^/]*\.test\.ts$' \
            | grep -Ev '(^|/)vitest\.config\.ts$' \
            | grep -Ev '(^|/)eslint\.config\.(js|ts)$' \
            | grep -Ev '(^|/)\.prettier' \
            | grep -Ev '^\.github/' \
            | grep -Ev '^(registry|manifest-lock)\.json$' \
            | grep -Ev '^test/' \
            | grep -Ev '/email-worker/' \
            | grep -Ev '(^|/)(LICENSE|\.gitignore|\.editorconfig|CLAUDE\.md)$' \
            || true)"

          if [ -z "$reaching" ]; then
            echo "The pin is $count commits behind, and none of it is a path the image can carry."
            echo current > finding/verdict
            echo "compare=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "The pin is $count commits behind. These paths could reach a bundle:"
          echo "$reaching" | sed 's/^/  /'
          echo "compare=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.behind.outputs.compare == 'true'
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          # The version comes from the repository being installed, not from
          # this one. They agree today and they are released independently,
          # so a bump on either side would otherwise fail here against a
          # lockfile format the wrong pnpm cannot read, and say so about
          # the integrations repository rather than about this coupling.
          package_json_file: head/package.json
      - uses: actions/setup-node@v7
        if: steps.behind.outputs.compare == 'true'
        with:
          node-version: 22
          # Unlike every sibling here, this job is hosted, so the pnpm
          # store does not survive between runs and the cache does pay.
          # Those siblings turn it off because the self-hosted pool keeps a
          # store the cache would tar on every run, and they say to restore
          # it for exactly this case.
          cache: pnpm
          cache-dependency-path: head/pnpm-lock.yaml

      - id: compare
        name: Build both refs and compare what the image would stage
        if: steps.behind.outputs.compare == 'true'
        env:
          PIN: ${{ steps.pin.outputs.ref }}
        run: |
          set -euo pipefail
          # A second working tree at the pinned commit, from the clone already
          # here. Its own install, because the lockfile is one of the things
          # that can differ between the two and a shared store entry is not a
          # shared resolution.
          git -C head worktree add ../pinned "$PIN"

          # The heap ceiling is carried over from the image build rather
          # than rediscovered. Generating declarations for this workspace
          # went out of memory there under the container's default
          # old-space size, and a hosted runner having more headroom is not
          # a reason to find out again in a job nobody has a model for.
          for tree in pinned head; do
            (
              cd "$tree"
              pnpm install --frozen-lockfile
              NODE_OPTIONS=--max-old-space-size=6144 pnpm run build
            )
          done

          : > finding/subjects
          while read -r name; do
            if ! diff -r -q "pinned/packages/$name/dist" "head/packages/$name/dist" >/dev/null 2>&1; then
              printf '%s\n' "$name" >> finding/subjects
            fi
          done < declared.txt

          if [ ! -s finding/subjects ]; then
            echo "Every installed integration builds byte-identically at both refs. The pin is behind and correctly so."
            echo current > finding/verdict
            exit 0
          fi

          head_sha="$(cat finding/main)"
          count="$(wc -l < finding/subjects | tr -d ' ')"
          echo drifted > finding/verdict
          if [ "$count" = 1 ]; then
            printf 'pinned to %s, main is %s (%s differs)\n' \
              "${PIN:0:7}" "${head_sha:0:7}" "$(cat finding/subjects)" > finding/detail
          else
            printf 'pinned to %s, main is %s (%s integrations differ)\n' \
              "${PIN:0:7}" "${head_sha:0:7}" "$count" > finding/detail
          fi

          echo "::error title=The pin is behind something the image would ship::These integrations build differently at withmarfa/integrations main than at the pinned commit: $(tr '\n' ' ' < finding/subjects)"
          echo "Move packages/server/integrations-ref.txt to a newer commit, or decide deliberately not to."
          while read -r name; do
            echo "--- $name"
            diff -r -q "pinned/packages/$name/dist" "head/packages/$name/dist" || true
          done < finding/subjects
          exit 1

      # The only step in this job that writes $GITHUB_OUTPUT for the notifier,
      # and `if: always()` is what carries a finding out of a job that failed.
      #
      # **The default is `inconclusive`, and that is the load-bearing half.**
      # A `run:` block runs under `bash -e`, so any command that exits
      # non-zero kills its step where it stands — a failed `pnpm install`
      # above never reaches the line that would have recorded a verdict. If
      # the absence of a verdict meant "level", every such death would report
      # the pin current, which is a green alert for a guard that never ran.
      # So each branch that actually established something writes `current`
      # itself, and silence means nobody established anything.
      - id: finding
        if: always()
        name: Publish the finding
        env:
          SERVER_URL: ${{ github.server_url }}
          INTEGRATIONS_REPO: withmarfa/integrations
        run: |
          set -euo pipefail
          mkdir -p finding
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, pathlib

          finding = pathlib.Path("finding")

          def read(name: str) -> str:
              path = finding / name
              return path.read_text().strip() if path.exists() else ""

          server = os.environ["SERVER_URL"].rstrip("/")
          repo = os.environ["INTEGRATIONS_REPO"]

          def commit(sha: str) -> str:
              return f"[{sha[:7]}]({server}/{repo}/commit/{sha})"

          def package(name: str) -> str:
              return f"[{name}]({server}/{repo}/tree/main/packages/{name})"

          pin, main = read("pin"), read("main")
          subjects = [line for line in read("subjects").splitlines() if line]

          fields = {}
          if pin:
              fields["Pinned"] = commit(pin)
          if main:
              fields["Integrations main"] = commit(main)
          if subjects:
              fields["Integrations"] = ", ".join(package(n) for n in subjects)

          print("verdict=" + (read("verdict") or "inconclusive"))
          print("detail=" + " ".join(read("detail").split()))
          print("fields=" + json.dumps(fields, separators=(",", ":")))
          PY

  notify:
    # A scheduled guard has no audience, so this job is the finding. It runs
    # hosted, like the rest of this workflow.
    #
    # A dispatch of `main` reports as well as the schedule: when this fails it
    # prints what to do, and re-running it is how anybody establishes the
    # repair worked. Reporting only on the schedule leaves the alert open
    # until the next morning.
    needs: [drift]
    # Skipped when no alert destination is configured, so a fork sends nothing.
    if: >-
      always() && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'))
      && vars.ALERT_WEBHOOK_URL != ''
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Report the finding
        env:
          ALERT_URL: ${{ vars.ALERT_WEBHOOK_URL }}
          ALERT_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
          VERDICT: ${{ needs.drift.outputs.verdict }}
          DETAIL: ${{ needs.drift.outputs.detail }}
          EXTRA_FIELDS: ${{ needs.drift.outputs.fields }}
          RESULTS: ${{ join(needs.*.result, ',') }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The verdict comes from the job's outputs, not from its result.
          # Four conditions end that job without the pin being level and only
          # one of them is drift, so the result cannot say which happened.
          #
          # `needs.<job>.result` is still read, for the two cases that leave
          # no outputs at all: a cancelled job, and a skipped one. Both mean
          # nothing was established, which is what the empty verdict below
          # already resolves to — they are named here so a reader does not
          # have to work that out from a fall-through.
          case ",$RESULTS," in
            *,cancelled,*|*,skipped,*) VERDICT=inconclusive ;;
          esac

          # An open state without a finding to state would be reported as a
          # bare subject, so it is treated as no finding at all.
          if [ -z "${DETAIL:-}" ] && [ "${VERDICT:-}" != current ]; then
            VERDICT=inconclusive
          fi

          case "${VERDICT:-}" in
            current)
              STATE=resolved
              TITLE="Integrations: current"
              ;;
            drifted | undeclared | orphaned)
              STATE=open
              TITLE="Integrations: $DETAIL"
              ;;
            *)
              # `inconclusive`, and every way of reaching no verdict at all.
              # The subject deliberately changes to the check rather than the
              # thing checked: nothing here is a statement about the pin.
              STATE=open
              TITLE="Integrations pin check: inconclusive"
              ;;
          esac

          # The destination may or may not need a credential, so the header is
          # built rather than hardcoded: an empty token would otherwise be sent
          # as "Bearer " with nothing after it, which reads as a malformed
          # request rather than an unauthenticated one.
          AUTH=()
          if [ -n "${ALERT_TOKEN:-}" ]; then
            AUTH=(-H "Authorization: Bearer $ALERT_TOKEN")
          fi

          EXTRA="${EXTRA_FIELDS:-}"
          [ -n "$EXTRA" ] || EXTRA='{}'

          # `github.workflow` is the workflow's DISPLAY NAME, not its
          # filename, and it is half the alert key. Renaming `name:` at the
          # top of this file therefore re-keys every alert it sends: whatever
          # is open under the old key never resolves, and anything filtering
          # on the key silently stops matching. Rename it deliberately or not
          # at all.
          #
          # Links belong in fields, as Markdown; the title stays plain prose.
          jq -n --arg t "$TITLE" --arg s "$STATE" --arg k "github/$REPO/$WORKFLOW" \
                --arg u "$RUN_URL" --arg r "[$REPO]($REPO_URL)" --arg j "$RESULTS" \
                --argjson x "$EXTRA" \
            '{source:"github",severity:"warning",title:$t,state:$s,key:$k,link:$u,
              fields:({Repository:$r} + $x + {Jobs:$j})}' \
          | curl -sS --fail-with-body --max-time 20 -X POST "$ALERT_URL" \
              "${AUTH[@]}" \
              -H "Content-Type: application/json" --data @- \
          || echo "Alert POST did not succeed (see above); not failing the run over it."
