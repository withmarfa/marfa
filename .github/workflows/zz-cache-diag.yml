name: Cache diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/zz-cache-diag.yml

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  core-checks:
    name: Diag macOS core checks
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            core/bindings/swift
          save-if: false
      - run: |
          du -sh core/target core/bindings/swift/target || true
          du -h -d 3 core/target core/bindings/swift/target | sort -h | tail -40
          du -sh core/target/*/deps core/bindings/swift/target/*/*/deps 2>/dev/null | sort -h | tail
          ls core/target core/bindings/swift/target
          echo "--- biggest crates in debug/deps"
          ls -S -l core/target/debug/deps | head -15
  live:
    name: Diag macOS live
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            core/bindings/swift
          save-if: false
      - run: |
          du -sh core/target core/bindings/swift/target || true
          du -h -d 3 core/target core/bindings/swift/target | sort -h | tail -40
          ls core/target core/bindings/swift/target
  core-checks-linux:
    name: Diag Linux core checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            core/bindings/swift
          save-if: false
      - run: |
          du -sh core/target core/bindings/swift/target || true
          du -h -d 3 core/target core/bindings/swift/target | sort -h | tail -30
