name: Core

# A pull request runs it when `scripts/ci-required.ts` says the change can
# affect it. A push to `main` also runs it for the server the live tests
# boot, so a server pull request does not hold a macOS runner. The push is
# filtered here rather than by the classifier, because a run that started
# would cancel the one before it and then skip.
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "openapi.json"
      - "packages/server/**"
      - "packages/shared/**"
      - "packages/types/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/core.yml"
      - "!**/*.md"
  pull_request:
    branches: [main]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

# The event keeps the nightly and a dispatch out of a push's group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.classify.outputs.core }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: classify
        run: node scripts/ci-required.ts

  core:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.core != 'false') }}
    name: Core (Rust, bindings, live)
    timeout-minutes: 90
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Check Xcode
        run: xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            core/bindings/swift
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # tsx resolves @withmarfa/shared through its dist.
      - run: pnpm --filter "@withmarfa/server..." build

      - name: Verify local server keys survive a restart
        run: core/scripts/server-keys.test.sh

      - name: Live tests against a booted server
        working-directory: core
        run: |
          set -euo pipefail
          # Named and trapped before the boot, so a boot that fails partway is
          # still stopped. `|| true`: a failing EXIT trap command would become
          # the step's status.
          export MARFA_SERVER_ENV="${RUNNER_TEMP:-/tmp}/marfa-core-proof.env"
          trap 'scripts/server-down.sh "${MARFA_SERVER_ENV}" || true' EXIT
          # Assigned first: `eval "$(…)"` of a failed boot's empty output succeeds.
          server_env="$(scripts/server-up.sh)"
          eval "${server_env}"
          cargo nextest run --locked --workspace --exclude marfa-client --run-ignored only

      # marfa-swift builds the framework itself, at the commit it pins.
      - name: Build the Swift FFI crate
        working-directory: core/bindings/swift
        run: |
          cargo build --locked --release \
            --target aarch64-apple-darwin \
            --target aarch64-apple-ios \
            --target aarch64-apple-ios-sim

      # Outside the pnpm workspace, so every call carries the flag.
      - name: Build, check and test the Node module
        working-directory: core/bindings/node
        run: |
          pnpm --ignore-workspace install --frozen-lockfile
          pnpm --ignore-workspace run build
          pnpm --ignore-workspace run check
          pnpm --ignore-workspace run test

      - name: Prove the Node binding against a booted server
        working-directory: core
        run: |
          cargo build -p marfa-cli
          scripts/binding-proof.sh
