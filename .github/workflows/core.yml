name: Core

# Path-gated, which ci.yml deliberately is not. A pull request runs it when it
# changes the core, the root `openapi.json` the core is held to, or this
# workflow. A push to `main` runs it for anything the booted server is built
# from as well, and the nightly runs it whatever changed, so a server change
# that breaks the live tests is caught on `main` without holding a macOS
# runner for every server pull request. The core's own three commands run as
# `Core checks` in ci.yml.
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "openapi.json"
      - "packages/server/**"
      - "packages/shared/**"
      - "packages/types/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/core.yml"
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - "openapi.json"
      - ".github/workflows/core.yml"
  schedule:
    - cron: "47 3 * * *"
  # A path-gated workflow has no other way to be started by hand.
  workflow_dispatch:

# A newer push to a branch, `main` included, cancels the run before it, since
# the newer commit's run covers everything the older one would have. The
# event keeps the nightly and a dispatch out of the push's group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  core:
    name: Core (Rust, bindings, live)
    timeout-minutes: 90
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Check Xcode
        run: xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            core/bindings/swift
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # server-up.sh runs the server through tsx, which resolves
      # @withmarfa/shared through its dist.
      - run: pnpm --filter "@withmarfa/server..." build

      - name: Live tests against a booted server
        working-directory: core
        run: |
          set -euo pipefail
          # **The trap is installed before the boot, not after.** A boot that
          # fails partway has already started a server, and a trap armed
          # afterwards never runs for it: the step dies, the server keeps the
          # port, and every later run on this runner fails to bind against a
          # process nothing remembers starting.
          #
          # `|| true` because a command failing inside an EXIT trap becomes
          # the shell's status, so cleanup trouble would be reported as a
          # failing test. server-down.sh says what went wrong on stderr.
          #
          # It reads the env file by its path rather than the exported name,
          # because the export only exists once `eval` has run.
          # Named before the boot, so the trap can find it whether the boot
          # succeeded, failed partway, or never got as far as printing.
          export MARFA_SERVER_ENV="${RUNNER_TEMP:-/tmp}/marfa-core-proof.env"
          trap 'scripts/server-down.sh "${MARFA_SERVER_ENV}" || true' EXIT
          # Assigned before it is evaluated. `eval "$(scripts/server-up.sh)"`
          # swallows a failed boot, because evaluating an empty string
          # succeeds; an assignment carries the script's own status.
          server_env="$(scripts/server-up.sh)"
          eval "${server_env}"
          cargo nextest run --locked --workspace --exclude marfa-client --run-ignored only

      # The crate marfa-swift packages with `build.sh` at the commit it
      # pins, built here for each system that script targets, so a change
      # that compiles for the Mac and not for the phone is refused before it
      # merges. The framework, its glue and its consumer are built there.
      - name: Build the Swift FFI crate
        working-directory: core/bindings/swift
        run: |
          cargo build --locked --release \
            --target aarch64-apple-darwin \
            --target aarch64-apple-ios \
            --target aarch64-apple-ios-sim

      # Outside the pnpm workspace, so every call carries the flag. `check`
      # holds the Node proof and tests to the declarations the build
      # generates; `test` drives the held stream, the reading open, and a
      # drain whose create names a source its key does not claim, against a
      # server it scripts itself.
      - name: Build, check and test the Node module
        working-directory: core/bindings/node
        run: |
          pnpm --ignore-workspace install --frozen-lockfile
          pnpm --ignore-workspace run build
          pnpm --ignore-workspace run check
          pnpm --ignore-workspace run test

      # The Node binding's consumer, driven against a server stopped and
      # started again: queued writes answered once it is back, a blob
      # fetched, and a change the binary makes arriving through a held
      # stream.
      - name: Prove the Node binding against a booted server
        working-directory: core
        run: |
          cargo build -p marfa-cli
          scripts/binding-proof.sh
