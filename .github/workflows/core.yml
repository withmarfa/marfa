name: Core

# The core's live checks, `core-live.yml`, on a push to `main`, the nightly
# and a dispatch. A pull request runs them as the `core` job of `ci.yml`,
# which `Full CI` waits for, when `scripts/ci-required.ts` says the change can
# affect them; a draft runs none of them. A push to `main` also runs them for
# the server the live tests boot, so a server pull request does not hold a
# macOS runner. Push paths omit changes the live tests do not read.
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "openapi.json"
      - "packages/server/**"
      - "packages/shared/**"
      - "packages/types/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/core.yml"
      - ".github/workflows/core-live.yml"
      - "!**/*.md"
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

# Even with cancellation disabled, a shared group replaces older pending
# runs; non-PR runs need their own groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core:
    name: Core
    uses: ./.github/workflows/core-live.yml

  # A failed nightly run opens an issue, or comments on the one that is open.
  # Only a schedule reports, so no pull request run can open an issue.
  report-failure:
    name: Report a failed scheduled run
    needs: core
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/report-nightly-failure.sh
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/report-nightly-failure.sh
