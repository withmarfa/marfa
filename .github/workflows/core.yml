name: Core

# Path-gated, which ci.yml deliberately is not. The trade is the same one
# ci.yml weighs for its freshness jobs — a gate that skips is a gate that can
# be wrong — and it lands the other way here: two release builds for iOS
# targets, an XCFramework, a Swift example and a booted server, none of which
# anything outside core/ can change.
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/core.yml"
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/core.yml"
  # A path-gated workflow has no other way to be started by hand.
  workflow_dispatch:

# A superseded run on a branch describes a tree nobody has any more, so
# canceling it costs nothing. On `main` every commit keeps its own answer.
# Nothing reads a run of this workflow at a specific commit; `release.yml`
# asks for ci.yml's. If that ever changes, this is the line to change with it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Self-hosted with no hosted fallback, like every workflow here. No cache
# action anywhere in this file: the pool keeps its pnpm store and cargo
# registry between jobs, so a cache would restore nothing and its post step
# would tar both.
jobs:
  core:
    name: Core (Rust, bindings, live)
    timeout-minutes: 90
    runs-on: self-hosted
    # The same group as ci.yml's suite, and for the same reason: the resource
    # is the machine. cargo takes every core, and the live test boots the
    # server on a fixed port, so a second copy of either job manufactures
    # failures in a branch that caused none. `queue: max` rather than the
    # default, which cancels the pending entry instead of queueing it.
    concurrency:
      group: marfa-suite-shared-host
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7

      # Homebrew's rustup is keg-only, so nothing it installs is on the
      # default PATH, and cargo-swift is wherever `cargo install` put it.
      - name: Put the Rust toolchain on PATH
        run: |
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Declared rather than assumed. A runner missing these fails the iOS
      # step with "can't find crate for `core`", which reads as a defect in
      # the crate; the add is idempotent and free when they are present.
      - name: Add the iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      # The keychain tests skip, saying so, where no keychain answers. A
      # runner whose keychain does answer is told to require them, so a
      # keychain that stops answering later fails the job rather than
      # quietly narrowing it.
      - name: Say whether the keychain answers
        run: |
          if security add-generic-password -a probe -s marfa-keychain-probe -w probe -U \
            && security delete-generic-password -a probe -s marfa-keychain-probe >/dev/null; then
            echo "MARFA_KEYCHAIN_REQUIRED=1" >> "$GITHUB_ENV"
            echo "the keychain answers; its tests are required"
          else
            echo "the keychain does not answer; its tests will skip and say so"
          fi

      - name: Check the core workspace
        working-directory: core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Its own workspace, so its own three commands: cargo-swift refuses to
      # name a package inside a multi-crate workspace.
      - name: Check the Swift FFI crate
        working-directory: core/bindings/swift
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # server-up.sh runs the server through tsx, which resolves
      # @withmarfa/shared through its dist.
      - run: pnpm --filter "@withmarfa/server..." build

      - name: Live tests against a booted server
        working-directory: core
        run: |
          set -euo pipefail
          # **The trap is installed before the boot, not after.** A boot that
          # fails partway has already started a server, and a trap armed
          # afterwards never runs for it: the step dies, the server keeps the
          # port, and every later run on this runner fails to bind against a
          # process nothing remembers starting.
          #
          # `|| true` because a command failing inside an EXIT trap becomes
          # the shell's status, so cleanup trouble would be reported as a
          # failing test. server-down.sh says what went wrong on stderr.
          #
          # It reads the env file by its path rather than the exported name,
          # because the export only exists once `eval` has run.
          # Named before the boot, so the trap can find it whether the boot
          # succeeded, failed partway, or never got as far as printing.
          export MARFA_SERVER_ENV="${RUNNER_TEMP:-/tmp}/marfa-core-proof.env"
          trap 'scripts/server-down.sh "${MARFA_SERVER_ENV}" || true' EXIT
          # Assigned before it is evaluated. `eval "$(scripts/server-up.sh)"`
          # swallows a failed boot, because evaluating an empty string
          # succeeds; an assignment carries the script's own status.
          server_env="$(scripts/server-up.sh)"
          eval "${server_env}"
          cargo test -p marfa-core -- --include-ignored

      # Compiled, not packaged: the XCFramework carries arm64 macOS only, so
      # these two prove the FFI crate still builds for the phone.
      - name: Compile the FFI crate for iOS
        working-directory: core/bindings/swift
        run: |
          cargo build --release --lib --target aarch64-apple-ios
          cargo build --release --lib --target aarch64-apple-ios-sim

      - name: Package the Swift bindings
        run: core/bindings/swift/build.sh
      - name: Build the Swift example
        working-directory: core/bindings/swift/Example
        run: swift build

      # Outside the pnpm workspace, so every call carries the flag.
      - name: Build the Node module
        working-directory: core/bindings/node
        run: |
          pnpm --ignore-workspace install --frozen-lockfile
          pnpm --ignore-workspace run build
