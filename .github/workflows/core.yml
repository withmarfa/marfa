name: Core

# The core's live checks, `core-live.yml`, on a push to `main`, the nightly
# and a dispatch. A pull request runs them as the `core` job of `ci.yml`,
# which `Full CI` waits for, when `scripts/ci-required.ts` says the change can
# affect them; a draft runs none of them. A push to `main` also runs them for
# the Rust server the live tests boot, so a server pull request does not hold
# a macOS runner. Push paths omit changes the live tests do not read.
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "openapi.json"
      - "package.json"
      - ".github/workflows/core.yml"
      - ".github/workflows/core-live.yml"
      - "!**/*.md"
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

# Every push to `main` shares one group and none is cancelled while it runs:
# GitHub lets the running run finish, keeps only the newest waiting one and
# cancels the older waiting ones. The nightly and a dispatch each get their
# own group. A release that finds its commit's run cancelled tags the newest
# commit whose run passed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  core:
    name: Core
    uses: ./.github/workflows/core-live.yml

  # A failed nightly run opens an issue, or comments on the one that is open.
  # Only a schedule reports, so no pull request run can open an issue.
  # A job that reaches its timeout ends as cancelled, not failed, so a cancelled
  # job reports too.
  report-failure:
    name: Report a failed scheduled run
    needs: core
    if: ${{ github.event_name == 'schedule' && (failure() || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/report-nightly-failure.sh
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/report-nightly-failure.sh
