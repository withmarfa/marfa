name: Publish packages

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships with npm 10.x; OIDC trusted-publisher support
      # requires npm 11.5.1+.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # npm publish with OIDC trusted publishing. Provenance attaches
      # automatically; no --provenance flag needed.
      - name: Publish @mymehq/shared
        working-directory: packages/shared
        run: npm publish --access=public

      - name: Publish @mymehq/sdk
        working-directory: packages/sdk
        run: npm publish --access=public

      # @mymehq/electric is parked (see packages/electric/README.md);
      # excluded from publish until/unless it's revived.
