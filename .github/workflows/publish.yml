name: Publish packages

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # Publish shared first (sdk depends on it)
      - run: pnpm --filter @mymehq/shared publish --no-git-checks

      - run: pnpm --filter @mymehq/sdk publish --no-git-checks

      - run: pnpm --filter @mymehq/electric publish --no-git-checks
