name: Publish packages

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # Publish shared first (sdk depends on it). Auth is via OIDC trusted
      # publisher configured on npm — no NPM_TOKEN. --provenance attaches
      # the signed attestation proving the package was built from this
      # commit in this workflow.
      - run: pnpm --filter @mymehq/shared publish --no-git-checks --provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - run: pnpm --filter @mymehq/sdk publish --no-git-checks --provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # @mymehq/electric is parked (see packages/electric/README.md);
      # excluded from publish until/unless it's revived.
