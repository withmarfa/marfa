name: Publish packages

on:
  push:
    tags:
      - "v*"

# Publish is tag-triggered — never cancel an in-flight publish. The
# concurrency key is per-tag so parallel tag pushes queue rather than
# cancel. Added for parity with other workflows in the org.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Node 24 ships with npm 11+, which has OIDC trusted-publisher
      # support. Node 22 only has npm 10.x (no OIDC).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # Pack + publish pattern: pnpm pack resolves workspace:* specifiers
      # to actual versions in the resulting tarball; npm publish gives us
      # OIDC trusted-publisher auth. Neither tool alone does both.
      # Provenance attaches automatically via OIDC.
      #
      # Each package is gated by a pre-check against the npm registry: if
      # the local version is already published, the publish step is
      # skipped cleanly (instead of npm rejecting the republish and
      # turning the job red). Tag pushes often bump only one package's
      # version, so skipping unchanged packages is the common case.
      - name: Check @mymehq/shared publish status
        id: check_shared
        working-directory: packages/shared
        run: |
          local_version=$(node -p "require('./package.json').version")
          published_versions=$(npm view @mymehq/shared versions --json 2>/dev/null || echo '[]')
          if echo "$published_versions" | grep -q "\"$local_version\""; then
            echo "@mymehq/shared@$local_version is already published — skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "@mymehq/shared@$local_version is new — will publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @mymehq/shared
        if: steps.check_shared.outputs.should_publish == 'true'
        working-directory: packages/shared
        run: |
          pnpm pack
          npm publish mymehq-shared-*.tgz --access=public

      - name: Check @mymehq/sdk publish status
        id: check_sdk
        working-directory: packages/sdk
        run: |
          local_version=$(node -p "require('./package.json').version")
          published_versions=$(npm view @mymehq/sdk versions --json 2>/dev/null || echo '[]')
          if echo "$published_versions" | grep -q "\"$local_version\""; then
            echo "@mymehq/sdk@$local_version is already published — skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "@mymehq/sdk@$local_version is new — will publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @mymehq/sdk
        if: steps.check_sdk.outputs.should_publish == 'true'
        working-directory: packages/sdk
        run: |
          pnpm pack
          npm publish mymehq-sdk-*.tgz --access=public
