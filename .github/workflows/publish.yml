name: Publish packages

on:
  push:
    tags:
      - "v*"

# Publish is tag-triggered — never cancel an in-flight publish. The
# concurrency key is per-tag so parallel tag pushes queue rather than
# cancel. Added for parity with other workflows in the org.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  require-green-ci:
    name: Require green CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # A tag points at a commit that already went through `ci.yml` on main:
      # build, typecheck, lint, format, the SQLite and Postgres suites,
      # fresh-migrate and the smoke tests. Re-running any of that here
      # recomputes a known answer on the slowest runner in the estate, because
      # publishing is pinned to the hosted lane for OIDC. On v11.0.0 that cost
      # over 26 minutes for a suite the self-hosted pool finishes in about one.
      #
      # So verify the result instead of recomputing it. That is strictly
      # stronger than what it replaces: nothing previously stopped a tag being
      # cut on a commit CI had never seen, because the checks here ran against
      # the tag's own tree and would pass either way.
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" \
            --jq '.total_count')
          if [ "${runs:-0}" -lt 1 ]; then
            echo "::error::No successful ci.yml run for $GITHUB_SHA. Publish refuses a commit CI has not passed. Push the commit to main, let CI go green, then tag it."
            exit 1
          fi
          echo "ci.yml is green for $GITHUB_SHA"

  publish-dependency-chain:
    name: Publish dependency chain
    needs: require-green-ci
    # Hardcoded hosted — npm OIDC trusted-publisher provenance only works on a
    # GitHub-hosted runner; honoring CI_RUNNER (self-hosted) breaks the
    # provenance attestation on publish. This workflow must not pick up the
    # org/repo CI_RUNNER override the way the test workflows do.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      # Node 24 ships with npm 11+, which has OIDC trusted-publisher
      # support. Node 22 only has npm 10.x (no OIDC).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # Still needed: `pnpm pack` packs whatever is in each package's dist/.
      - run: pnpm build

      # Pack + publish pattern: pnpm pack resolves workspace:* specifiers
      # to actual versions in the resulting tarball; npm publish gives us
      # OIDC trusted-publisher auth. Neither tool alone does both.
      # Provenance attaches automatically via OIDC.
      #
      # Each package is gated by a pre-check against the npm registry: if
      # the local version is already published, the publish step is
      # skipped cleanly (instead of npm rejecting the republish and
      # turning the job red). Tag pushes often bump only one package's
      # version, so skipping unchanged packages is the common case.
      - name: Check @withmarfa/shared publish status
        id: check_shared
        working-directory: packages/shared
        run: |
          local_version=$(node -p "require('./package.json').version")
          published_versions=$(npm view @withmarfa/shared versions --json 2>/dev/null || echo '[]')
          if echo "$published_versions" | grep -q "\"$local_version\""; then
            echo "@withmarfa/shared@$local_version is already published — skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "@withmarfa/shared@$local_version is new — will publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @withmarfa/shared
        if: steps.check_shared.outputs.should_publish == 'true'
        working-directory: packages/shared
        run: |
          pnpm pack
          npm publish withmarfa-shared-*.tgz --access=public

      - name: Check @withmarfa/sdk publish status
        id: check_sdk
        working-directory: packages/sdk
        run: |
          local_version=$(node -p "require('./package.json').version")
          published_versions=$(npm view @withmarfa/sdk versions --json 2>/dev/null || echo '[]')
          if echo "$published_versions" | grep -q "\"$local_version\""; then
            echo "@withmarfa/sdk@$local_version is already published — skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "@withmarfa/sdk@$local_version is new — will publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @withmarfa/sdk
        if: steps.check_sdk.outputs.should_publish == 'true'
        working-directory: packages/sdk
        run: |
          pnpm pack
          npm publish withmarfa-sdk-*.tgz --access=public

      # The authoring contract for an integration. Published because an
      # integration lives in another repository and cannot depend on a
      # workspace reference.
      - name: Check @withmarfa/runtime-sdk publish status
        id: check_runtime_sdk
        working-directory: packages/runtime-sdk
        run: |
          local_version=$(node -p "require('./package.json').version")
          published_versions=$(npm view @withmarfa/runtime-sdk versions --json 2>/dev/null || echo '[]')
          if echo "$published_versions" | grep -q "\"$local_version\""; then
            echo "@withmarfa/runtime-sdk@$local_version is already published — skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "@withmarfa/runtime-sdk@$local_version is new — will publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @withmarfa/runtime-sdk
        if: steps.check_runtime_sdk.outputs.should_publish == 'true'
        working-directory: packages/runtime-sdk
        run: |
          pnpm pack
          npm publish withmarfa-runtime-sdk-*.tgz --access=public

      # The harness an integration tests its handlers against, in memory,
      # without booting a server. Published for the same reason as the kit
      # above and one step further: an integration outside this repository
      # cannot reach a workspace reference, and one that cannot run its own
      # tests is not something a third party can be asked to maintain.
      #
      # After the kit deliberately, because it depends on it and `pnpm pack`
      # resolves that workspace reference to a concrete version at pack time.
      # Packing it before the kit's version exists on the registry produces a
      # tarball nobody can install.
      - name: Check @withmarfa/runtime-test publish status
        id: check_runtime_test
        working-directory: packages/runtime-test
        run: |
          local_version=$(node -p "require('./package.json').version")
          published_versions=$(npm view @withmarfa/runtime-test versions --json 2>/dev/null || echo '[]')
          if echo "$published_versions" | grep -q "\"$local_version\""; then
            echo "@withmarfa/runtime-test@$local_version is already published — skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "@withmarfa/runtime-test@$local_version is new — will publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @withmarfa/runtime-test
        if: steps.check_runtime_test.outputs.should_publish == 'true'
        working-directory: packages/runtime-test
        run: |
          pnpm pack
          npm publish withmarfa-runtime-test-*.tgz --access=public

  publish-webhooks:
    name: Publish webhooks
    needs: require-green-ci
    # Webhooks has no dependency on the ordered package chain, so it publishes
    # independently once the tagged commit's CI result has been verified.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      # Node 24 ships with npm 11+, which has OIDC trusted-publisher support.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # `pnpm pack` publishes the built package output rather than the sources.
      - run: pnpm build

      - name: Check @withmarfa/webhooks publish status
        id: check_webhooks
        working-directory: packages/webhooks
        run: |
          local_version=$(node -p "require('./package.json').version")
          published_versions=$(npm view @withmarfa/webhooks versions --json 2>/dev/null || echo '[]')
          if echo "$published_versions" | grep -q "\"$local_version\""; then
            echo "@withmarfa/webhooks@$local_version is already published — skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "@withmarfa/webhooks@$local_version is new — will publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @withmarfa/webhooks
        if: steps.check_webhooks.outputs.should_publish == 'true'
        working-directory: packages/webhooks
        run: |
          pnpm pack
          npm publish withmarfa-webhooks-*.tgz --access=public
