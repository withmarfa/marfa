name: Docs companion check

# Merge gate: when a PR touches a documented surface (API routes, OpenAPI
# generator, shared wire types, the core type registry, the SDK, or a
# manifest) it must either ship with a companion PR on withmarfa/docs or
# declare that no docs change is needed. The repo convention in CLAUDE.md is
# "pair the docs PR with the code PR on documented-surface changes."
#
# The job posts a single sticky comment explaining how to clear it, and FAILS
# the check while a surface change has no companion link and no opt-out — so it
# blocks merge via the branch ruleset. It is scoped tightly (see
# SURFACE_PREFIXES / SURFACE_EXCLUDES below): a PR that touches no documented
# surface passes instantly, so routine changes are never gated. It also fails
# open — any error talking to the API logs a warning and passes, never a false
# block. Repository owners can override via the ruleset bypass.
#
# Clear it per-PR by referencing the companion (`withmarfa/docs#123` or the full
# PR URL) in the description, or by declaring no docs change is needed with a
# `Docs: n/a` line in the description or the `no-docs` label.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

# One run per PR; newer pushes/edits supersede in-flight runs.
concurrency:
  group: docs-companion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Flag documented-surface PRs without a docs companion
    timeout-minutes: 10
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Evaluate docs companion
        uses: actions/github-script@v9
        with:
          script: |
            try {
            const MARKER = '<!-- docs-companion-check -->';

            // Documented surfaces — mirrors the freshness trigger set in
            // the root CLAUDE.md plus the SDK and the shipped manifests.
            // No trailing slash on the openapi entry: the generator is a pair
            // of files (`openapi.ts`, `openapi-finalize.ts`), not a directory,
            // so a `openapi/` prefix could never match anything.
            const SURFACE_PREFIXES = [
              'packages/server/src/routes/',
              'packages/server/src/openapi',
              'packages/shared/src/',
              'packages/types/core/',
              'packages/sdk/src/',
            ];
            // Paths under a surface prefix that are NOT a documented contract:
            // the hosted sign-in pages' static assets (CSS/JS) render UI, not
            // API shape, so a change there owes no docs companion. Add future
            // false-positive subtrees here rather than loosening the prefixes.
            const SURFACE_EXCLUDES = [
              'packages/server/src/routes/auth-static/',
            ];
            // A manifest is a documented contract wherever it lives, and a
            // client's sits outside every prefix above. Matching the
            // filename rather than a directory is what keeps it in the
            // check.
            const isManifest = (f) => f.endsWith('/src/manifest.ts');
            // A test is never a documented contract. It sits under the same
            // prefixes as the thing it covers, so `packages/server/src/routes/`
            // catches every route test in the repository — and a change that
            // only adds or repairs tests then asks for a docs companion that
            // cannot exist. That fired on a test-only pull request touching four
            // files under `routes/`, and it will fire on everyone who adds tests
            // there. A suffix rather than an entry in SURFACE_EXCLUDES, because
            // this is not a subtree: the test lives beside the surface by
            // convention, in every package.
            // `.test.` only, deliberately, though `.spec.` is the other common
            // spelling. This repository has no `*.spec.*` file and its convention
            // is a sibling `*.test.ts`, so the alternative would exempt nothing
            // that exists — while colliding with this codebase's own vocabulary
            // inside a tracked prefix: an `openapi.spec.ts` under
            // `packages/server/src/openapi` is a plausible name for something
            // that IS the surface, and it would be skipped silently. A `.spec.`
            // test added later is merely gated, which is the safe direction.
            const isTest = (f) => /\.test\.[cm]?[jt]sx?$/.test(f);
            const isDocSurface = (f) =>
              !isTest(f) &&
              !SURFACE_EXCLUDES.some((p) => f.startsWith(p)) &&
              (SURFACE_PREFIXES.some((p) => f.startsWith(p)) || isManifest(f));

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // 1. Did this PR touch a documented surface?
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const touched = files.map((f) => f.filename).filter(isDocSurface);
            const touchesSurface = touched.length > 0;

            // 2. Is a docs companion declared (link) or explicitly waived (opt-out)?
            const body = pr.body || '';
            const hasDocsRef =
              /withmarfa\/docs#\d+/i.test(body) ||
              /github\.com\/withmarfa\/docs\/pull\/\d+/i.test(body);
            // Anchored at both ends, so the opt-out has to be a line somebody
            // wrote as an opt-out rather than a line that happens to begin that
            // way. Unanchored, a pasted commit-log excerpt (`docs: skip
            // generated changelog entry`), a sentence opening `docs: none of
            // the below need review`, or a `docs: skip` inside a fenced code
            // block each disabled the gate on a pull request that genuinely
            // changed a surface — silently, which is the direction that costs
            // something. A false positive is noisy and self-correcting; a false
            // negative lets docs drift with nobody learning that they have.
            //
            // `[ \t]` rather than `\s` throughout, because `\s` matches a
            // newline and would let the keyword sit on the following line.
            //
            // No `\r?` before the anchor, and that is checked rather than
            // assumed: pull request bodies arrive CRLF-delimited, and it is
            // natural to think `$` needs help with that. It does not —
            // ECMAScript counts `\r` as a line terminator, so `$` under `m`
            // already matches before it. A `\r?` here would be inert, and an
            // inert guard reads as a necessary one.
            // Fenced blocks are removed before the opt-out is looked for. A
            // `docs: skip` inside one is a line in an example, not a waiver,
            // and anchoring alone cannot tell them apart because it genuinely
            // is on a line of its own. Two lines to close the last way the
            // gate could be opened by somebody who did not mean to open it.
            const prose = body.replace(/```[\s\S]*?```/g, "");
            const hasOptOutLine =
              /^[ \t]*docs:[ \t]*(n\/?a|none|not[ \t]+required|skip)[ \t]*$/im.test(
                prose,
              );
            const hasOptOutLabel = (pr.labels || []).some((l) => l.name === 'no-docs');
            const hasCompanion = hasDocsRef || hasOptOutLine || hasOptOutLabel;

            const shouldFlag = touchesSurface && !hasCompanion;

            // 3. Find any prior sticky reminder from this workflow.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find((c) => (c.body || '').includes(MARKER));

            if (shouldFlag) {
              const sample = touched.slice(0, 8).map((f) => `- \`${f}\``).join('\n');
              const more = touched.length > 8 ? `\n- …and ${touched.length - 8} more` : '';
              const reminder = [
                MARKER,
                '**Docs companion check**',
                '',
                'This PR changes a documented surface but does not reference a `withmarfa/docs` companion PR:',
                '',
                sample + more,
                '',
                'If the change affects public behavior, open a companion PR on ' +
                  '[`withmarfa/docs`](https://github.com/withmarfa/docs) and link it here ' +
                  '(for example `withmarfa/docs#123`).',
                '',
                'If no docs change is needed, add a `Docs: n/a` line to the description, ' +
                  'or apply the `no-docs` label, to clear this check.',
                '',
                '_This check blocks merge until a companion is linked or the change is ' +
                  'marked `Docs: n/a`. Repository owners can override via the branch ruleset._',
              ].join('\n');

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: reminder,
                });
                core.info(`Updated docs-companion reminder (${touched.length} surface file(s)).`);
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: reminder,
                });
                core.info(`Posted docs-companion reminder (${touched.length} surface file(s)).`);
              }

              // Block the merge: a documented surface changed with no companion
              // link and no opt-out. Cleared by editing the body / adding the
              // label, which re-runs this workflow.
              core.setFailed(
                `Documented surface changed without a docs companion or a 'Docs: n/a' opt-out ` +
                  `(${touched.length} file(s)). Link a withmarfa/docs PR or declare no docs change is needed.`,
              );
            } else {
              // Resolved (companion added, or no surface touched): clear the nag.
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                });
                core.info('Cleared prior docs-companion reminder.');
              } else {
                core.info(
                  touchesSurface
                    ? 'Documented surface touched but companion present; no reminder needed.'
                    : 'No documented surface touched; no reminder needed.',
                );
              }
            }
            } catch (err) {
              // Fail open: an API/transport error must never block a merge. The
              // gate fires only on the explicit surface-without-companion case.
              core.warning(`docs-companion check skipped: ${err.message}`);
            }
