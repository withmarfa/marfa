name: Core live

# The core's live checks: the Rust workspace and the Node module against a
# booted server, the Swift FFI crate, and the Node binding proof. Two
# workflows call it. `ci.yml` calls it for a pull request that reaches what it
# reads, so that `Full CI` waits for it, and `core.yml` calls it for a push to
# `main`, the nightly and a dispatch. It has no `concurrency` of its own: a
# called workflow's `github.workflow` is its caller's, so a group here would be
# the caller's own and cancel the run that called it.
on:
  workflow_call:

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  live:
    name: Rust, bindings, live
    timeout-minutes: 90
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Check Xcode
        run: xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            core/bindings/swift
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # tsx resolves @withmarfa/shared through its dist.
      - run: pnpm --filter "@withmarfa/server..." build

      - name: Verify local server keys survive a restart
        run: core/scripts/server-keys.test.sh

      - name: Live tests against a booted server
        working-directory: core
        run: |
          set -euo pipefail
          # Named and trapped before the boot, so a boot that fails partway is
          # still stopped. `|| true`: a failing EXIT trap command would become
          # the step's status.
          export MARFA_SERVER_ENV="${RUNNER_TEMP:-/tmp}/marfa-core-proof.env"
          trap 'scripts/server-down.sh "${MARFA_SERVER_ENV}" || true' EXIT
          # Assigned first: `eval "$(…)"` of a failed boot's empty output succeeds.
          server_env="$(scripts/server-up.sh)"
          eval "${server_env}"
          cargo nextest run --locked --workspace --run-ignored only
          (cd bindings/swift && cargo nextest run --locked --run-ignored only)

      # marfa-swift builds the framework itself, at the commit it pins. The
      # systems come from `build.sh`, as `check-targets.sh` reads them, so the
      # C this build compiles targets the same oldest systems the shipped
      # framework does.
      - name: Build the Swift FFI crate
        working-directory: core/bindings/swift
        run: |
          macos="$(sed -n 's/^macos=//p' build.sh)"
          ios="$(sed -n 's/^ios=//p' build.sh)"
          if [[ -z "${macos}" || -z "${ios}" ]]; then
            echo "build.sh names no macos= or ios= target" >&2
            exit 1
          fi
          export MACOSX_DEPLOYMENT_TARGET="${macos}.0"
          export IPHONEOS_DEPLOYMENT_TARGET="${ios}.0"
          cargo build --locked --release \
            --target aarch64-apple-darwin \
            --target aarch64-apple-ios \
            --target aarch64-apple-ios-sim

      # Outside the pnpm workspace, so every call carries the flag.
      - name: Build, check and test the Node module
        working-directory: core/bindings/node
        run: |
          pnpm --ignore-workspace install --frozen-lockfile
          pnpm --ignore-workspace run build
          pnpm --ignore-workspace run check
          pnpm --ignore-workspace run test

      - name: Prove the Node binding against a booted server
        working-directory: core
        run: |
          cargo build -p marfa-cli
          scripts/binding-proof.sh
