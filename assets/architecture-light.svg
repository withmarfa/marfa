<svg xmlns="http://www.w3.org/2000/svg" width="960" height="516" viewBox="0 0 960 516" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How Marfa fits together</title>
  <desc id="desc">Native clients embed the Rust core, which sends their requests and keeps a local working copy and a queue of writes for apps built on the Swift SDK and for folders on a Mac. The marfa CLI embeds it too: it keeps folders in step, and AI agents and the terminal use it to send requests. Connectors and TypeScript scripts call the API through the TypeScript SDK. Everything reaches one Marfa server over its HTTP API. The server is one owner's instance and keeps the data in a SQLite database and the files on disk.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker>
  </defs>
  <!-- Native clients -->
  <rect x="16" y="16" width="520" height="296" rx="12" fill="#f6f1ff" stroke="#c297ff" stroke-width="1.5"/>
  <text x="36" y="46" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">Native clients</text>
  <text x="36" y="68" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">Embed the Rust core; apps and folders work offline</text>
  <rect x="36" y="88" width="152" height="56" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="112.0" y="112" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Apps</text>
  <text x="112.0" y="132" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">for iPhone and Mac</text>
  <rect x="200" y="88" width="152" height="56" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="276.0" y="112" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Folders</text>
  <text x="276.0" y="132" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">kept in step on a Mac</text>
  <rect x="364" y="88" width="152" height="56" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="440.0" y="112" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">AI agents</text>
  <text x="440.0" y="132" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">and the terminal</text>
  <rect x="36" y="162" width="152" height="56" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="112.0" y="186" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Swift SDK</text>
  <text x="112.0" y="206" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">withmarfa/marfa-swift</text>
  <rect x="200" y="162" width="316" height="56" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="358.0" y="186" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">marfa CLI</text>
  <text x="358.0" y="206" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">the command-line tool</text>
  <rect x="36" y="236" width="480" height="56" rx="8" fill="#e9ddff" stroke="#a475f9" stroke-width="1.5"/>
  <text x="276.0" y="260" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Rust core</text>
  <text x="276.0" y="280" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">an HTTP client, a local working copy and a queue of writes</text>
  <line x1="112.0" y1="144" x2="112.0" y2="162" stroke="#59636e" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="276.0" y1="144" x2="276.0" y2="162" stroke="#59636e" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="440.0" y1="144" x2="440.0" y2="162" stroke="#59636e" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="112.0" y1="218" x2="112.0" y2="236" stroke="#59636e" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="358.0" y1="218" x2="358.0" y2="236" stroke="#59636e" stroke-width="1.5" marker-end="url(#head)"/>
  <!-- Online clients -->
  <rect x="556" y="16" width="388" height="296" rx="12" fill="#eefbf1" stroke="#6fdd8b" stroke-width="1.5"/>
  <text x="576" y="46" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">Online clients</text>
  <text x="576" y="68" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">Send each request straight to the API</text>
  <rect x="576" y="88" width="168.0" height="56" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="660.0" y="112" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Connectors</text>
  <text x="660.0" y="132" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">Todoist, RSS, GitHub</text>
  <rect x="756.0" y="88" width="168.0" height="56" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="840.0" y="112" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Scripts and apps</text>
  <text x="840.0" y="132" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">in TypeScript</text>
  <rect x="576" y="162" width="348" height="56" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="750.0" y="186" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">TypeScript SDK</text>
  <text x="750.0" y="206" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@withmarfa/client</text>
  <line x1="660.0" y1="144" x2="660.0" y2="162" stroke="#59636e" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="840.0" y1="144" x2="840.0" y2="162" stroke="#59636e" stroke-width="1.5" marker-end="url(#head)"/>
  <!-- Server -->
  <rect x="16" y="344" width="928" height="156" rx="12" fill="#f0f7ff" stroke="#54aeff" stroke-width="1.5"/>
  <path d="M16 356 a12 12 0 0 1 12 -12 h904 a12 12 0 0 1 12 12 v32 h-928 z" fill="#0969da"/>
  <text x="480.0" y="372" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">HTTP API</text>
  <text x="36" y="426" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">Marfa server</text>
  <text x="36" y="450" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">One owner's instance: the source of truth</text>
  <text x="36" y="470" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">that every copy follows</text>
  <rect x="576" y="408" width="168.0" height="76" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="660.0" y="432" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">SQLite database</text>
  <text x="660.0" y="452" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">one file</text>
  <rect x="756.0" y="408" width="168.0" height="76" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="840.0" y="432" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Files</text>
  <text x="840.0" y="452" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">the bytes, on disk</text>
  <!-- Every client reaches the server only through its API -->
  <line x1="276.0" y1="294" x2="276.0" y2="342" stroke="#59636e" stroke-width="1.5" marker-start="url(#head)" marker-end="url(#head)"/>
  <line x1="750.0" y1="220" x2="750.0" y2="342" stroke="#59636e" stroke-width="1.5" marker-start="url(#head)" marker-end="url(#head)"/>
</svg>
